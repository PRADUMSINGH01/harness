<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0d10; }
      #root { position: relative; width: 100%; height: 100%; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .bg { position: absolute; inset: 0; background: #0b0d10; }
      .stat { position: absolute; left: 160px; top: 330px; color: #f4f4f5; font-size: 220px; font-weight: 700; letter-spacing: -0.04em; }
      .label { position: absolute; left: 168px; top: 600px; color: #c8ccd2; font-size: 56px; font-weight: 500; }
      .bar { position: absolute; left: 168px; top: 700px; width: 1200px; height: 16px; background: #2a2f36; }
      .fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #5ef17c; transform-origin: left center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="bg" class="clip bg" data-start="0" data-duration="6" data-track-index="0"></div>
      <div id="stat" class="clip stat" data-start="0" data-duration="6" data-track-index="1">3.2x</div>
      <div id="label" class="clip label" data-start="0" data-duration="6" data-track-index="2">faster first render</div>
      <div id="bar" class="clip bar" data-start="0" data-duration="6" data-track-index="3"><div id="fill" class="fill"></div></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#stat", { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.2)
        .fromTo("#label", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.45)
        .fromTo("#bar", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.7)
        .fromTo("#fill", { scaleX: 0 }, { scaleX: 1, duration: 2.4, ease: "power3.inOut" }, 1.0)
        .to("#stat", { x: -40, duration: 1.6, ease: "power2.inOut" }, 3.9)
        .to("#label", { x: -40, duration: 1.6, ease: "power2.inOut" }, 3.9);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
