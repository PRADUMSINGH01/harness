      <stop offset="0%" stop-color="#1A2033"/>
      <stop offset="100%" stop-color="#121726"/>
    </linearGradient>
  </defs>
  <!-- Window Chrome Surface -->
  <path d="M0 20 C0 8.95 8.95 0 20 0 L940 0 C951.05 0 960 8.95 960 20 L960 76 L0 76 Z" fill="url(#chrome-grad)" stroke="#26314D" stroke-width="1.5"/>

  <!-- macOS Window Controls -->
