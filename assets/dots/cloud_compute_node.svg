<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" fill="none">
  <defs>
    <linearGradient id="node-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151A29"/>
      <stop offset="100%" stop-color="#0E1320"/>
    </linearGradient>
    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="740" height="240" rx="22" fill="url(#node-surface)" stroke="#222B42" stroke-width="2"/>
  
  <!-- Server Rack Accent & Grid lines -->
  <line x1="0" y1="64" x2="740" y2="64" stroke="#1D2438" stroke-width="1.5"/>
  
  <!-- Top Bar -->
  <circle cx="36" cy="32" r="6" fill="#10B981" filter="url(#node-glow)"/>
  <text x="56" y="38" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing="0.1em">DEDICATED CLOUD PC · INSTANCE #DOT-A9</text>
  <rect x="580" y="18" width="130" height="28" rx="8" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.35)" stroke-width="1"/>
  <text x="645" y="37" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#10B981" text-anchor="middle">ACTIVE 24/7</text>

  <!-- Metrics Grid: 4 Columns -->
  <!-- Col 1: CPU Load -->
  <g transform="translate(40, 96)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#64748B" letter-spacing="0.12em">CPU LOAD</text>
    <text x="0" y="38" font-family="'Sora', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">12<small style="font-size:20px; color:#10B981;">%</small></text>
    <rect x="0" y="56" width="120" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
    <rect x="0" y="56" width="24" height="8" rx="4" fill="#10B981"/>
  </g>

  <!-- Col 2: Memory -->
  <g transform="translate(220, 96)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#64748B" letter-spacing="0.12em">MEMORY ALLOC</text>
    <text x="0" y="38" font-family="'Sora', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">48<small style="font-size:20px; color:#94A3B8;"> GB</small></text>
    <rect x="0" y="56" width="120" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
    <rect x="0" y="56" width="76" height="8" rx="4" fill="#3B82F6"/>
  </g>

  <!-- Col 3: Latency -->
  <g transform="translate(400, 96)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#64748B" letter-spacing="0.12em">RTT LATENCY</text>
    <text x="0" y="38" font-family="'Sora', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">14<small style="font-size:20px; color:#10B981;"> ms</small></text>
    <rect x="0" y="56" width="120" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
    <rect x="0" y="56" width="16" height="8" rx="4" fill="#10B981"/>
  </g>

  <!-- Col 4: Connected Apps -->
  <g transform="translate(570, 96)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#64748B" letter-spacing="0.12em">SAAS WORKFLOWS</text>
    <text x="0" y="38" font-family="'Sora', sans-serif" font-size="34" font-weight="800" fill="#8B5CF6">4,000<small style="font-size:20px; color:#8B5CF6;">+</small></text>
    <rect x="0" y="56" width="130" height="8" rx="4" fill="rgba(255,255,255,0.08)"/>
    <rect x="0" y="56" width="130" height="8" rx="4" fill="linear-gradient(90deg,#8B5CF6,#10B981)"/>
  </g>
</svg>
