<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 84" width="100%" height="100%">
  <defs>
    <pattern id="hazard-stripes" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="20" fill="#F59E0B" fill-opacity="0.9"/>
      <rect x="10" width="10" height="20" fill="#000000" fill-opacity="0.9"/>
    </pattern>
  </defs>

  <!-- Container Base with Amber Border -->
  <rect x="2" y="2" width="536" height="80" rx="14" fill="#0B0C10" stroke="#F59E0B" stroke-width="2"/>

  <!-- Left Hazard Stripe Block -->
  <rect x="8" y="8" width="28" height="68" rx="8" fill="url(#hazard-stripes)"/>

  <!-- Warning Triangle -->
  <g transform="translate(52, 22)">
    <path d="M20 0 L40 38 H0 Z" fill="#F59E0B"/>
    <text x="20" y="32" text-anchor="middle" fill="#000000" font-family="sans-serif" font-weight="900" font-size="24">!</text>
  </g>

  <!-- Alert Title & Subtitle -->
  <text x="108" y="38" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="17" letter-spacing="2">CRITICAL ALERT</text>
  <text x="108" y="60" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" opacity="0.9">Automated Protocol Triggered</text>

  <!-- Right Hazard Stripe Block -->
  <rect x="504" y="8" width="28" height="68" rx="8" fill="url(#hazard-stripes)"/>
</svg>
