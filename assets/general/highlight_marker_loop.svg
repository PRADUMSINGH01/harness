<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="high-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="loop-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing Under-Loop -->
  <path d="M 25 60 C 20 25, 380 20, 375 60 C 370 100, 30 105, 35 65 C 38 40, 180 35, 260 40" 
        fill="none" stroke="url(#high-grad)" stroke-width="7" stroke-linecap="round" opacity="0.3" filter="url(#loop-glow)"/>

  <!-- Core Sharp Hand-drawn Highlighter Loop -->
  <path d="M 25 60 C 20 25, 380 20, 375 60 C 370 100, 30 105, 35 65 C 38 40, 180 35, 260 40" 
        fill="none" stroke="url(#high-grad)" stroke-width="5" stroke-linecap="round"/>
</svg>
