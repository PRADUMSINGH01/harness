<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="arr-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing Shadow Trace -->
  <path d="M 30 170 C 40 80, 100 40, 160 50" fill="none" stroke="url(#arr-grad)" stroke-width="8" stroke-linecap="round" opacity="0.4" filter="url(#neon-glow)"/>

  <!-- Main Sweeping Curve -->
  <path d="M 30 170 C 40 80, 100 40, 160 50" fill="none" stroke="url(#arr-grad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Arrow Head -->
  <path d="M 135 30 L 175 48 L 152 86" fill="none" stroke="url(#arr-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
