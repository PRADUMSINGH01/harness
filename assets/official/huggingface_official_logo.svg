<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="faceGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFE45C"/>
      <stop offset="70%" stop-color="#FFD21E"/>
      <stop offset="100%" stop-color="#F5C400"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Face -->
  <circle cx="100" cy="100" r="76" fill="url(#faceGlow)" stroke="#E8B70A" stroke-width="3" filter="url(#softGlow)"/>

  <!-- Eyes -->
  <ellipse cx="72" cy="82" rx="6.5" ry="7.5" fill="#1F1F1F"/>
  <ellipse cx="128" cy="82" rx="6.5" ry="7.5" fill="#1F1F1F"/>

  <!-- Wide open smiling mouth -->
  <path d="M62 106
           C 66 136, 84 148, 100 148
           C 116 148, 134 136, 138 106
           C 125 112, 112 114, 100 114
           C 88 114, 75 112, 62 106 Z"
        fill="#1F1F1F"/>
  <!-- Tongue -->
  <path d="M84 132
           C 86 144, 92 148, 100 148
           C 108 148, 114 144, 116 132
           C 112 138, 106 140, 100 140
           C 94 140, 88 138, 84 132 Z"
        fill="#E5484D"/>

  <!-- Left hand -->
  <g transform="translate(26,140) rotate(-22)">
    <rect x="-9" y="-16" width="18" height="34" rx="9" fill="#FF9D0B"/>
    <circle cx="0" cy="-16" r="4.5" fill="#FF9D0B"/>
  </g>
  <!-- Right hand -->
  <g transform="translate(174,140) rotate(22)">
    <rect x="-9" y="-16" width="18" height="34" rx="9" fill="#FF9D0B"/>
    <circle cx="0" cy="-16" r="4.5" fill="#FF9D0B"/>
  </g>
</svg>