<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#12233a"/>
      <stop offset="55%" stop-color="#0d1118"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="streakBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="55%" stop-color="#0A84FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="streakWhite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="streakGrey" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8E8E93" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8E8E93" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="orb" cx="38%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#1c2a3d"/>
      <stop offset="60%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="24" fill="url(#bgGlow)"/>
  <rect x="0.5" y="0.5" width="199" height="199" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- motion streaks -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M20 96 C60 60, 130 48, 178 70" stroke="url(#streakBlue)" stroke-width="4.5"/>
    <path d="M14 112 C58 82, 128 70, 184 88" stroke="url(#streakWhite)" stroke-width="2.6" opacity="0.85"/>
    <path d="M26 78 C66 46, 128 38, 168 54" stroke="url(#streakGrey)" stroke-width="2" opacity="0.6"/>
    <path d="M24 128 C64 108, 132 100, 182 110" stroke="url(#streakBlue)" stroke-width="3" opacity="0.9"/>
    <path d="M18 142 C58 126, 126 120, 176 128" stroke="url(#streakGrey)" stroke-width="1.6" opacity="0.5"/>
    <path d="M30 62 C70 36, 122 30, 156 42" stroke="url(#streakWhite)" stroke-width="1.4" opacity="0.45"/>
  </g>

  <!-- orbiting particle heads -->
  <g filter="url(#glow)">
    <circle cx="178" cy="70" r="3.2" fill="#FFFFFF"/>
    <circle cx="184" cy="88" r="2.2" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="168" cy="54" r="1.8" fill="#8E8E93"/>
    <circle cx="182" cy="110" r="2.6" fill="#0A84FF"/>
    <circle cx="176" cy="128" r="1.6" fill="#8E8E93"/>
    <circle cx="156" cy="42" r="1.4" fill="#FFFFFF" opacity="0.7"/>
  </g>
  <circle cx="182" cy="110" r="8" fill="#0A84FF" opacity="0.25" filter="url(#softGlow)"/>
  <circle cx="178" cy="70" r="7" fill="#FFFFFF" opacity="0.2" filter="url(#softGlow)"/>

  <!-- trailing sparks -->
  <g fill="#FFFFFF">
    <circle cx="88" cy="55" r="1" opacity="0.6"/>
    <circle cx="116" cy="63" r="0.8" opacity="0.5"/>
    <circle cx="70" cy="118" r="1" opacity="0.45"/>
    <circle cx="140" cy="105" r="0.9" opacity="0.55"/>
    <circle cx="100" cy="133" r="0.7" opacity="0.4"/>
  </g>

  <!-- central dark glass orb -->
  <g>
    <circle cx="100" cy="100" r="34" fill="url(#orb)" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="100" cy="100" r="34" fill="none" stroke="#0A84FF" stroke-opacity="0.35" stroke-width="0.8"/>
    <ellipse cx="88" cy="86" rx="14" ry="8" fill="#FFFFFF" opacity="0.1" transform="rotate(-24 88 86)"/>
    <circle cx="100" cy="100" r="44" fill="none" stroke="#8E8E93" stroke-opacity="0.15" stroke-dasharray="2 6"/>
  </g>

  <!-- technical details -->
  <g stroke="#8E8E93" stroke-opacity="0.4" stroke-width="1" fill="none">
    <path d="M14 14 h10 M14 14 v10"/>
    <path d="M186 186 h-10 M186 186 v-10"/>
    <path d="M186 14 h-10 M186 14 v10"/>
    <path d="M14 186 h10 M14 186 v-10"/>
  </g>
  <g font-family="monospace" font-size="6" fill="#8E8E93" fill-opacity="0.55">
    <text x="22" y="17">V-MBLUR</text>
    <text x="22" y="190">0.84kHz</text>
  </g>
</svg>