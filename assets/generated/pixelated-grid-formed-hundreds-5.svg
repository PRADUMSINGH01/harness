<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101318"/>
      <stop offset="0.5" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#0A84FF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="topF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9CDD4"/>
    </linearGradient>
    <linearGradient id="leftF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E8E93"/>
      <stop offset="1" stop-color="#4A4A4F"/>
    </linearGradient>
    <linearGradient id="rightF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E6E74"/>
      <stop offset="1" stop-color="#2E2E33"/>
    </linearGradient>
    <linearGradient id="topA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FC0FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="leftA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#063E85"/>
    </linearGradient>
    <linearGradient id="rightA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A6BD6"/>
      <stop offset="1" stop-color="#04294F"/>
    </linearGradient>
    <g id="cube">
      <path d="M4 0 L8 2 L4 4 L0 2 Z" fill="url(#topF)"/>
      <path d="M0 2 L4 4 L4 8 L0 6 Z" fill="url(#leftF)"/>
      <path d="M4 4 L8 2 L8 6 L4 8 Z" fill="url(#rightF)"/>
    </g>
    <g id="cubeA">
      <path d="M4 0 L8 2 L4 4 L0 2 Z" fill="url(#topA)"/>
      <path d="M0 2 L4 4 L4 8 L0 6 Z" fill="url(#leftA)"/>
      <path d="M4 4 L8 2 L8 6 L4 8 Z" fill="url(#rightA)"/>
    </g>
    <pattern id="pixGrid" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <use href="#cube"/>
    </pattern>
    <pattern id="pixGridHalf" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <use href="#cube" transform="translate(4,4)"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- dark glass panel -->
  <rect x="6" y="6" width="188" height="188" rx="10" fill="#0A0A0A" opacity="0.55"/>
  <rect x="6" y="6" width="188" height="188" rx="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- hundreds of cubes: two offset pattern layers -->
  <g opacity="0.92">
    <rect x="14" y="14" width="172" height="172" fill="url(#pixGrid)"/>
    <rect x="14" y="14" width="172" height="172" fill="url(#pixGridHalf)" opacity="0.55"/>
  </g>

  <!-- accent cubes -->
  <g filter="url(#glow)">
    <use href="#cubeA" transform="translate(24,40)"/>
    <use href="#cubeA" transform="translate(56,24)"/>
    <use href="#cubeA" transform="translate(88,56)"/>
    <use href="#cubeA" transform="translate(120,32)"/>
    <use href="#cubeA" transform="translate(152,64)"/>
    <use href="#cubeA" transform="translate(40,88)"/>
    <use href="#cubeA" transform="translate(72,120)"/>
    <use href="#cubeA" transform="translate(104,88)"/>
    <use href="#cubeA" transform="translate(136,112)"/>
    <use href="#cubeA" transform="translate(168,96)"/>
    <use href="#cubeA" transform="translate(32,152)"/>
    <use href="#cubeA" transform="translate(64,160)"/>
    <use href="#cubeA" transform="translate(96,144)"/>
    <use href="#cubeA" transform="translate(128,168)"/>
    <use href="#cubeA" transform="translate(160,144)"/>
  </g>

  <!-- vignette glow -->
  <rect width="200" height="200" fill="url(#vignette)"/>

  <!-- technical ticks -->
  <g stroke="#8E8E93" stroke-opacity="0.45" stroke-width="0.8">
    <path d="M14 11 H34 M42 11 H62 M70 11 H90 M98 11 H118 M126 11 H146 M154 11 H174 M182 11 H186"/>
    <path d="M11 14 V34 M11 42 V62 M11 70 V90 M11 98 V118 M11 126 V146 M11 154 V174 M11 182 V186"/>
    <path d="M14 189 H34 M42 189 H62 M70 189 H90 M98 189 H118 M126 189 H146 M154 189 H174 M182 189 H186"/>
    <path d="M189 14 V34 M189 42 V62 M189 70 V90 M189 98 V118 M189 126 V146 M189 154 V174 M189 182 V186"/>
  </g>

  <!-- corner brackets -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.4">
    <path d="M6 16 V10 Q6 6 10 6 H16"/>
    <path d="M184 6 H190 Q194 6 194 10 V16"/>
    <path d="M194 184 V190 Q194 194 190 194 H184"/>
    <path d="M16 194 H10 Q6 194 6 190 V184"/>
  </g>
</svg>