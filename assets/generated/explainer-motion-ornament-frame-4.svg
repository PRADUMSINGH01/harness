<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="glassGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#0A84FF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="60%" stop-color="#8E8E93" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="strokeFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- base glass glow -->
  <rect x="0" y="0" width="200" height="200" rx="18" fill="#0A0A0A"/>
  <rect x="0" y="0" width="200" height="200" rx="18" fill="url(#glassGlow)"/>

  <!-- ambient concentric orbit rings -->
  <g fill="none">
    <circle cx="100" cy="96" r="76" stroke="#8E8E93" stroke-opacity="0.16" stroke-width="0.8" stroke-dasharray="2 5"/>
    <circle cx="100" cy="96" r="62" stroke="url(#ringGrad)" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="100" cy="96" r="48" stroke="#0A84FF" stroke-opacity="0.28" stroke-width="0.8" stroke-dasharray="14 8"/>
  </g>

  <!-- orbital accent arcs -->
  <g fill="none" stroke-linecap="round">
    <path d="M 100 34 A 62 62 0 0 1 154 65" stroke="#0A84FF" stroke-width="2" opacity="0.9" filter="url(#glow)"/>
    <path d="M 46 127 A 62 62 0 0 1 100 158" stroke="#FFFFFF" stroke-width="1.4" opacity="0.4"/>
    <path d="M 100 82 A 14 14 0 1 0 114 96" stroke="url(#ringGrad)" stroke-width="2.4" filter="url(#glow)"/>
  </g>

  <!-- center reticle -->
  <g stroke="#FFFFFF" stroke-opacity="0.75">
    <circle cx="100" cy="96" r="5.5" fill="none" stroke-width="1"/>
    <circle cx="100" cy="96" r="1.6" fill="#0A84FF" stroke="none" filter="url(#glow)"/>
    <line x1="100" y1="84" x2="100" y2="88.5" stroke-width="0.8"/>
    <line x1="100" y1="103.5" x2="100" y2="108" stroke-width="0.8"/>
    <line x1="88" y1="96" x2="92.5" y2="96" stroke-width="0.8"/>
    <line x1="107.5" y1="96" x2="112" y2="96" stroke-width="0.8"/>
  </g>

  <!-- satellite nodes on rings -->
  <g filter="url(#glow)">
    <circle cx="154" cy="65" r="2.6" fill="#0A84FF"/>
    <circle cx="46" cy="127" r="2.2" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="100" cy="158" r="1.8" fill="#8E8E93"/>
    <circle cx="138" cy="96" r="1.8" fill="#8E8E93" opacity="0.8"/>
  </g>

  <!-- corner brackets -->
  <g stroke="url(#strokeFade)" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 20 34 V 24 Q 20 20 24 20 H 34"/>
    <path d="M 166 20 H 176 Q 180 20 180 24 V 34"/>
    <path d="M 180 158 V 168 Q 180 172 176 172 H 166"/>
    <path d="M 34 172 H 24 Q 20 172 20 168 V 158"/>
  </g>

  <!-- coordinate ticks -->
  <g stroke="#8E8E93" stroke-opacity="0.4" stroke-width="1">
    <line x1="98" y1="10" x2="102" y2="10"/>
    <line x1="98" y1="190" x2="102" y2="190"/>
    <line x1="10" y1="94" x2="10" y2="98"/>
    <line x1="190" y1="94" x2="190" y2="98"/>
  </g>

  <!-- glass card sheen -->
  <rect x="24" y="24" width="152" height="152" rx="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" filter="url(#softShadow)"/>
  <path d="M 28 60 Q 100 44 172 60" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="10" fill="none" stroke-linecap="round"/>
</svg>