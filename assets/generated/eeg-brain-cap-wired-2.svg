<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#C7C9CE" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ambient glow -->
  <circle cx="100" cy="100" r="82" fill="url(#glow)"/>

  <!-- dark glass disc -->
  <circle cx="100" cy="100" r="88" fill="#0A0A0A" opacity="0.55"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>
  <circle cx="100" cy="100" r="83" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="0.6"/>

  <!-- head profile -->
  <g filter="url(#shadow)">
    <path d="M118 34
             C 88 34 66 52 62 78
             C 60 88 61 94 56 100
             C 52 105 54 108 58 109
             L 62 110 C 61 120 60 128 66 133
             C 72 138 82 137 84 141
             C 85 146 84 152 88 156
             C 93 161 104 161 112 158
             L 112 166
             C 112 166 150 168 152 146
             L 152 122
             C 152 122 160 116 160 108
             C 160 100 154 96 154 96
             L 154 70
             C 154 48 140 34 118 34 Z"
          fill="url(#glass)"/>
    <!-- subtle facial shading -->
    <path d="M118 34 C 88 34 66 52 62 78 C 60 88 61 94 56 100 C 52 105 54 108 58 109 L 62 110 C 61 120 60 128 66 133 C 72 138 82 137 84 141 C 85 146 84 152 88 156 C 93 161 104 161 112 158"
          fill="none" stroke="#8E8E93" stroke-opacity="0.5" stroke-width="1.2"/>
  </g>

  <!-- EEG cap over skull -->
  <path d="M112 36 C 90 38 72 54 68 76 C 66 86 67 90 68 94 C 76 78 96 70 116 70 C 134 70 148 78 152 90 L 152 70 C 152 48 136 36 112 36 Z"
        fill="url(#cap)" stroke="#0A84FF" stroke-width="1.6" stroke-opacity="0.9"/>
  <!-- cap stitching lines -->
  <path d="M112 37 C 112 52 112 60 112 68 M 88 44 C 96 58 102 64 108 69 M 138 46 C 130 58 124 64 118 69"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.9"/>

  <!-- electrodes on cap -->
  <g>
    <g filter="url(#shadow)">
      <circle cx="86" cy="60" r="4.6" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.4"/>
      <circle cx="112" cy="54" r="4.6" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.4"/>
      <circle cx="138" cy="62" r="4.6" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.4"/>
      <circle cx="74" cy="80" r="4.6" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.4"/>
      <circle cx="146" cy="84" r="4.6" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.4"/>
    </g>
    <circle cx="86" cy="60" r="1.6" fill="#0A84FF"/>
    <circle cx="112" cy="54" r="1.6" fill="#0A84FF"/>
    <circle cx="138" cy="62" r="1.6" fill="#0A84FF"/>
    <circle cx="74" cy="80" r="1.6" fill="#0A84FF"/>
    <circle cx="146" cy="84" r="1.6" fill="#0A84FF"/>
  </g>

  <!-- wires running down to jaw/neck -->
  <g fill="none" stroke="#0A84FF" stroke-width="1.4" stroke-linecap="round">
    <path d="M74 80 C 66 100 68 118 78 132" stroke-opacity="0.85"/>
    <path d="M86 60 C 74 92 76 124 90 148" stroke-opacity="0.7"/>
    <path d="M146 84 C 148 106 142 128 128 142" stroke-opacity="0.85"/>
  </g>
  <!-- wire connector clip -->
  <g>
    <rect x="84" y="146" width="14" height="8" rx="2.4" fill="#0A0A0A" stroke="#8E8E93" stroke-width="1.2"/>
    <rect x="124" y="140" width="14" height="8" rx="2.4" fill="#0A0A0A" stroke="#8E8E93" stroke-width="1.2" transform="rotate(-14 131 144)"/>
  </g>

  <!-- EEG waveform accent -->
  <g stroke="#0A84FF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <path d="M30 128 L42 128 L47 118 L53 138 L59 108 L65 144 L71 124 L80 128"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M12 26 L12 12 L26 12"/>
    <path d="M174 12 L188 12 L188 26"/>
    <path d="M188 174 L188 188 L174 188"/>
    <path d="M26 188 L12 188 L12 174"/>
  </g>
</svg>