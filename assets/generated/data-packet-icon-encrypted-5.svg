<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glassShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1F26" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="edgeBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="packetLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0A84FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ambient glow -->
  <circle cx="100" cy="96" r="86" fill="url(#glow)"/>

  <!-- radiating packet lines -->
  <g stroke="url(#packetLine)" stroke-width="2.5" stroke-linecap="round">
    <line x1="24" y1="60" x2="58" y2="72"/>
    <line x1="20" y1="100" x2="56" y2="100"/>
    <line x1="24" y1="140" x2="58" y2="128"/>
    <line x1="142" y1="72" x2="176" y2="60"/>
    <line x1="144" y1="100" x2="180" y2="100"/>
    <line x1="142" y1="128" x2="176" y2="140"/>
  </g>

  <!-- packet dots -->
  <g fill="#0A84FF" filter="url(#blueGlow)">
    <circle cx="20" cy="60" r="4"/>
    <circle cx="16" cy="100" r="5"/>
    <circle cx="20" cy="140" r="4"/>
    <circle cx="180" cy="60" r="4"/>
    <circle cx="184" cy="100" r="5"/>
    <circle cx="180" cy="140" r="4"/>
  </g>

  <!-- shield body -->
  <g filter="url(#softShadow)">
    <path d="M100 26 L156 46 V96 C156 134 132 158 100 172 C68 158 44 134 44 96 V46 Z"
          fill="url(#glassShield)" stroke="url(#edgeBlue)" stroke-width="3"/>
    <path d="M100 26 L156 46 V96 C156 134 132 158 100 172 C68 158 44 134 44 96 V46 Z"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="8"/>
  </g>

  <!-- glass highlight -->
  <path d="M100 34 L146 51 V78 L100 60 Z" fill="#FFFFFF" opacity="0.06"/>
  <path d="M56 58 V94" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" stroke-linecap="round"/>

  <!-- padlock -->
  <g>
    <rect x="80" y="92" width="40" height="32" rx="6" fill="#0A84FF" fill-opacity="0.16" stroke="#0A84FF" stroke-width="2.5"/>
    <path d="M88 92 V82 a12 12 0 0 1 24 0 V92" fill="none" stroke="#8E8E93" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="100" cy="106" r="4" fill="#FFFFFF"/>
    <rect x="98.2" y="106" width="3.6" height="9" rx="1.8" fill="#FFFFFF"/>
  </g>

  <!-- encrypted bits inside shield -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="7" fill="#8E8E93" opacity="0.85">
    <text x="66" y="140">1 0 1</text>
    <text x="116" y="140">0 1 1</text>
  </g>
  <g fill="#8E8E93" opacity="0.7">
    <circle cx="70" cy="150" r="1.6"/><circle cx="78" cy="150" r="1.6"/><circle cx="86" cy="150" r="1.6"/>
    <circle cx="114" cy="150" r="1.6"/><circle cx="122" cy="150" r="1.6"/><circle cx="130" cy="150" r="1.6"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M8 20 V10 H18"/>
    <path d="M182 10 H192 V20"/>
    <path d="M192 180 V190 H182"/>
    <path d="M18 190 H8 V180"/>
  </g>

  <!-- technical ticks -->
  <g stroke="#8E8E93" stroke-width="1.5" opacity="0.6">
    <line x1="96" y1="6" x2="96" y2="12"/>
    <line x1="100" y1="6" x2="100" y2="12"/>
    <line x1="104" y1="6" x2="104" y2="12"/>
    <line x1="96" y1="188" x2="96" y2="194"/>
    <line x1="100" y1="188" x2="100" y2="194"/>
    <line x1="104" y1="188" x2="104" y2="194"/>
  </g>
</svg>