<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111318"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="120" r="78" fill="url(#screenGlow)" opacity="0.5"/>

  <!-- floor line -->
  <line x1="8" y1="168" x2="192" y2="168" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>

  <!-- LEFT WORKER -->
  <g>
    <!-- desk -->
    <rect x="14" y="128" width="80" height="5" rx="2" fill="#8E8E93" opacity="0.85"/>
    <rect x="20" y="133" width="4" height="35" fill="#8E8E93" opacity="0.5"/>
    <rect x="82" y="133" width="4" height="35" fill="#8E8E93" opacity="0.5"/>
    <!-- monitor -->
    <g filter="url(#glow)">
      <rect x="32" y="92" width="44" height="30" rx="3" fill="url(#screen)" stroke="#FFFFFF" stroke-opacity="0.25"/>
    </g>
    <rect x="50" y="122" width="6" height="4" fill="#8E8E93"/>
    <rect x="42" y="126" width="22" height="3" rx="1.5" fill="#8E8E93" opacity="0.8"/>
    <!-- code lines: white accepted + gray ghost suggestion -->
    <rect x="37" y="98" width="22" height="2.5" rx="1.2" fill="#FFFFFF" opacity="0.9"/>
    <rect x="37" y="103.5" width="16" height="2.5" rx="1.2" fill="#FFFFFF" opacity="0.6"/>
    <rect x="55" y="103.5" width="16" height="2.5" rx="1.2" fill="#8E8E93" opacity="0.55"/>
    <rect x="37" y="109" width="30" height="2.5" rx="1.2" fill="#0A84FF" opacity="0.9"/>
    <rect x="37" y="114.5" width="12" height="2.5" rx="1.2" fill="#FFFFFF" opacity="0.7"/>
    <rect x="51" y="114.5" width="18" height="2.5" rx="1.2" fill="#8E8E93" opacity="0.55"/>
    <!-- person: slouched, half-watching, one hand on key -->
    <circle cx="84" cy="98" r="8" fill="#FFFFFF" opacity="0.92"/>
    <path d="M68 128 C68 110 76 105 84 106 C92 105 100 112 100 128 Z" fill="#FFFFFF" opacity="0.75"/>
    <path d="M96 116 Q102 120 100 128 L94 128 Q94 120 96 116 Z" fill="#FFFFFF" opacity="0.9"/>
    <!-- face hint: half-lidded -->
    <circle cx="81" cy="97" r="1.1" fill="#0A0A0A"/>
    <circle cx="87" cy="97" r="1.1" fill="#0A0A0A"/>
    <!-- coffee cup -->
    <rect x="24" y="120" width="7" height="8" rx="1.5" fill="#8E8E93"/>
    <path d="M31 122 q3 0 3 2 q0 2 -3 2" fill="none" stroke="#8E8E93" stroke-width="1.2"/>
  </g>

  <!-- RIGHT WORKER -->
  <g>
    <rect x="106" y="132" width="80" height="5" rx="2" fill="#8E8E93" opacity="0.85"/>
    <rect x="112" y="137" width="4" height="31" fill="#8E8E93" opacity="0.5"/>
    <rect x="174" y="137" width="4" height="31" fill="#8E8E93" opacity="0.5"/>
    <g filter="url(#glow)">
      <rect x="124" y="98" width="44" height="30" rx="3" fill="url(#screen)" stroke="#FFFFFF" stroke-opacity="0.25"/>
    </g>
    <rect x="142" y="128" width="6" height="4" fill="#8E8E93"/>
    <rect x="134" y="132" width="22" height="3" rx="1.5" fill="#8E8E93" opacity="0.8"/>
    <!-- lines with large ghost suggestion block -->
    <rect x="129" y="104" width="26" height="2.5" rx="1.2" fill="#FFFFFF" opacity="0.8"/>
    <rect x="129" y="109.5" width="14" height="2.5" rx="1.2" fill="#FFFFFF" opacity="0.6"/>
    <rect x="145" y="109.5" width="20" height="2.5" rx="1.2" fill="#8E8E93" opacity="0.55"/>
    <rect x="129" y="115" width="34" height="2.5" rx="1.2" fill="#0A84FF" opacity="0.9"/>
    <rect x="129" y="120.5" width="20" height="2.5" rx="1.2" fill="#8E8E93" opacity="0.55"/>
    <!-- person turned toward coworker -->
    <circle cx="112" cy="104" r="8" fill="#FFFFFF" opacity="0.92"/>
    <path d="M96 132 C96 116 104 110 112 112 C120 110 128 118 128 132 Z" fill="#FFFFFF" opacity="0.75"/>
    <path d="M100 118 Q94 122 96 132 L102 132 Q102 122 100 118 Z" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="109" cy="103" r="1.1" fill="#0A0A0A"/>
    <circle cx="115" cy="103" r="1.1" fill="#0A0A0A"/>
    <!-- plant -->
    <rect x="182" y="123" width="6" height="9" rx="1" fill="#8E8E93"/>
    <path d="M185 123 q-5 -6 -3 -10 q4 2 3 10 M185 123 q5 -6 3 -10 q-4 2 -3 10" stroke="#0A84FF" stroke-width="1.4" fill="none" opacity="0.8"/>
  </g>

  <!-- AI sparkle badge centered -->
  <g filter="url(#glow)">
    <rect x="86" y="52" width="28" height="28" rx="8" fill="url(#glass)" stroke="#0A84FF" stroke-opacity="0.8" stroke-width="1.2"/>
  </g>
  <path d="M100 58 l1.8 5 5 1.8 -5 1.8 -1.8 5 -1.8 -5 -5 -1.8 5 -1.8 Z" fill="#0A84FF"/>
  <path d="M107 56 l0.9 2.4 2.4 0.9 -2.4 0.9 -0.9 2.4 -0.9 -2.4 -2.4 -0.9 2.4 -0.9 Z" fill="#FFFFFF" opacity="0.9"/>
  <!-- TAB key hint -->
  <rect x="84" y="40" width="32" height="10" rx="3" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.25"/>
  <text x="100" y="47.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle" letter-spacing="1">TAB</text>

  <!-- corner brackets -->
  <g stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" fill="none">
    <path d="M10 18 h8 M10 18 v8"/>
    <path d="M190 18 h-8 M190 18 v8"/>
    <path d="M10 182 h8 M10 182 v-8"/>
    <path d="M190 182 h-8 M190 182 v-8"/>
  </g>
</svg>