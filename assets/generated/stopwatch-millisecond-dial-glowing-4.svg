<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#8E8E93" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3A3A3E" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="faceGrad" cx="40%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1C1C20"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3B30" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#FF3B30" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF3B30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="handGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#7CC4FF"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="200" height="200" rx="28" fill="url(#bgGlow)"/>

  <!-- crown / stem -->
  <g fill="url(#rimGrad)">
    <rect x="95" y="16" width="10" height="12" rx="2.5"/>
    <rect x="88" y="26" width="24" height="8" rx="4"/>
    <rect x="44" y="34" width="16" height="6" rx="3" transform="rotate(-40 52 37)"/>
    <circle cx="46" cy="37" r="7"/>
  </g>

  <!-- outer rim -->
  <circle cx="100" cy="112" r="74" fill="none" stroke="url(#rimGrad)" stroke-width="5" filter="url(#softShadow)"/>
  <circle cx="100" cy="112" r="68" fill="url(#faceGrad)"/>
  <!-- glass highlight -->
  <path d="M52 88 A62 62 0 0 1 140 62 A80 80 0 0 0 60 122 Z" fill="#FFFFFF" opacity="0.06"/>

  <!-- main dial ticks -->
  <g stroke="#8E8E93" stroke-width="2" stroke-linecap="round">
    <g>
      <line x1="100" y1="46" x2="100" y2="54"/>
      <line x1="100" y1="170" x2="100" y2="178" transform="rotate(0 100 112)"/>
      <line x1="34" y1="112" x2="42" y2="112"/>
      <line x1="158" y1="112" x2="166" y2="112"/>
      <line x1="55" y1="67" x2="60" y2="72"/>
      <line x1="145" y1="67" x2="140" y2="72"/>
      <line x1="55" y1="157" x2="60" y2="152"/>
      <line x1="145" y1="157" x2="140" y2="152"/>
    </g>
    <g stroke-width="1" opacity="0.55">
      <line x1="73" y1="52" x2="76" y2="58"/><line x1="127" y1="52" x2="124" y2="58"/>
      <line x1="73" y1="172" x2="76" y2="166"/><line x1="127" y1="172" x2="124" y2="166"/>
      <line x1="40" y1="85" x2="46" y2="88"/><line x1="160" y1="85" x2="154" y2="88"/>
      <line x1="40" y1="139" x2="46" y2="136"/><line x1="160" y1="139" x2="154" y2="136"/>
    </g>
  </g>

  <!-- millisecond subdial with red glow -->
  <g>
    <circle cx="76" cy="132" r="24" fill="url(#redGlow)" filter="url(#glow)"/>
    <circle cx="76" cy="132" r="17" fill="#0A0A0A" stroke="#FF3B30" stroke-width="1.6" opacity="0.95"/>
    <g stroke="#FF3B30" stroke-width="1" stroke-linecap="round" opacity="0.8">
      <line x1="76" y1="117" x2="76" y2="120"/>
      <line x1="76" y1="147" x2="76" y2="144"/>
      <line x1="61" y1="132" x2="64" y2="132"/>
      <line x1="91" y1="132" x2="88" y2="132"/>
    </g>
    <line x1="76" y1="132" x2="85" y2="123" stroke="#FF3B30" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="76" cy="132" r="2.4" fill="#FF3B30"/>
  </g>

  <!-- main sweep hand -->
  <g filter="url(#softShadow)">
    <line x1="100" y1="118" x2="132" y2="72" stroke="url(#handGrad)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="112" r="6" fill="#0A84FF"/>
    <circle cx="100" cy="112" r="2.2" fill="#0A0A0A"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#8E8E93" stroke-width="1.5" opacity="0.6" fill="none" stroke-linecap="round">
    <path d="M12 26 v-10 h10"/>
    <path d="M188 26 v-10 h-10"/>
    <path d="M12 174 v10 h10"/>
    <path d="M188 174 v10 h-10"/>
  </g>
</svg>