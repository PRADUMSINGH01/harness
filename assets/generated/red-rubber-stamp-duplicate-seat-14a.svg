<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="glassBg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#2A2F3A" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0A0A0A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="redInk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="55%" stop-color="#E0342A"/>
      <stop offset="100%" stop-color="#B72A22"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#0A84FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="inkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#FF3B30" flood-opacity="0.45"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <mask id="grunge">
      <rect width="200" height="200" fill="#FFFFFF"/>
      <g fill="#000000">
        <circle cx="38" cy="52" r="2.4" opacity="0.9"/>
        <circle cx="160" cy="70" r="1.8" opacity="0.7"/>
        <circle cx="120" cy="30" r="2.8" opacity="0.8"/>
        <circle cx="55" cy="150" r="2.2" opacity="0.8"/>
        <circle cx="150" cy="145" r="3.0" opacity="0.7"/>
        <circle cx="100" cy="178" r="2.0" opacity="0.75"/>
        <circle cx="24" cy="108" r="1.6" opacity="0.65"/>
        <circle cx="178" cy="112" r="2.2" opacity="0.7"/>
        <circle cx="85" cy="22" r="1.5" opacity="0.6"/>
        <circle cx="70" cy="120" r="1.4" opacity="0.5"/>
        <circle cx="130" cy="100" r="1.7" opacity="0.55"/>
        <circle cx="48" cy="88" r="1.3" opacity="0.5"/>
      </g>
    </mask>
  </defs>

  <!-- Dark glass card -->
  <g filter="url(#softShadow)">
    <rect x="6" y="6" width="188" height="188" rx="42" fill="url(#glassBg)"/>
    <rect x="6.75" y="6.75" width="186.5" height="186.5" rx="41.5" fill="none" stroke="url(#glassEdge)" stroke-width="1.5"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#8E8E93" stroke-width="1.4" opacity="0.55" stroke-linecap="round">
    <path d="M20 36 V26 Q20 20 26 20 H36"/>
    <path d="M164 20 H174 Q180 20 180 26 V36"/>
    <path d="M180 164 V174 Q180 180 174 180 H164"/>
    <path d="M36 180 H26 Q20 180 20 174 V164"/>
  </g>

  <!-- Stamp -->
  <g mask="url(#grunge)" filter="url(#inkGlow)">
    <!-- outer ring -->
    <circle cx="100" cy="100" r="74" fill="none" stroke="url(#redInk)" stroke-width="7"/>
    <circle cx="100" cy="100" r="64" fill="none" stroke="url(#redInk)" stroke-width="2.5"/>
    <circle cx="100" cy="100" r="46" fill="none" stroke="url(#redInk)" stroke-width="2.5"/>

    <!-- rotational text: DUPLICATE • SEAT 14A top arc, stars bottom arc -->
    <g fill="#E0342A" font-family="'Arial Black', -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900">
      <path id="topArc" d="M100 100 m -56 0 a 56 56 0 1 1 112 0" fill="none"/>
      <text font-size="15.5" letter-spacing="4">
        <textPath href="#topArc" startOffset="50%" text-anchor="middle">DUPLICATE</textPath>
      </text>
      <path id="botArc" d="M100 100 m 56 0 a 56 56 0 1 1 -112 0" fill="none"/>
      <text font-size="10" letter-spacing="3">
        <textPath href="#botArc" startOffset="50%" text-anchor="middle">★ ★ ★</textPath>
      </text>
    </g>

    <!-- center text -->
    <text x="100" y="96" text-anchor="middle" fill="#E0342A"
          font-family="'Arial Black', -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-weight="900" font-size="20" letter-spacing="1.5">SEAT</text>
    <text x="100" y="122" text-anchor="middle" fill="#E0342A"
          font-family="'Arial Black', -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-weight="900" font-size="24" letter-spacing="1">14A</text>

    <!-- ticks -->
    <g stroke="#E0342A" stroke-width="1.6" opacity="0.85">
      <line x1="100" y1="30" x2="100" y2="38"/>
      <line x1="170" y1="100" x2="162" y2="100"/>
      <line x1="100" y1="170" x2="100" y2="162"/>
      <line x1="30" y1="100" x2="38" y2="100"/>
    </g>
  </g>
</svg>