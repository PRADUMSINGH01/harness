<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0A84FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16181d" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cursorFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#c9ccd1"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blueGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- dark glass card -->
  <rect x="6" y="6" width="188" height="188" rx="28" fill="url(#cardGlass)" stroke="#2a2d33" stroke-width="1"/>
  <rect x="14" y="14" width="176" height="176" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- corner brackets -->
  <g stroke="#8E8E93" stroke-width="1.4" stroke-opacity="0.5" fill="none" stroke-linecap="round">
    <path d="M22 34 V24 Q22 22 24 22 H34"/>
    <path d="M166 22 H176 Q178 22 178 24 V34"/>
    <path d="M178 166 V176 Q178 178 176 178 H166"/>
    <path d="M34 178 H24 Q22 178 22 176 V166"/>
  </g>

  <!-- pulse rings -->
  <g>
    <circle cx="100" cy="100" r="26" fill="url(#pulseGlow)"/>
    <circle cx="100" cy="100" r="34" fill="none" stroke="#0A84FF" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="100" cy="100" r="50" fill="none" stroke="#0A84FF" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="66" fill="none" stroke="#0A84FF" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="3 6"/>
  </g>

  <!-- glowing cursor arrow -->
  <g transform="translate(96,86) rotate(8)" filter="url(#blueGlow)">
    <path d="M0 0 L0 44 Q0 48 3.5 45.5 L13 38 L20 52 Q21.5 55 24.5 53.5 L30 51 Q33 49.5 31.5 46.5 L24.5 33 L37 31 Q41 30.5 38 27 Z"
          fill="url(#cursorFill)" stroke="#0A84FF" stroke-width="1.4" stroke-linejoin="round"/>
  </g>

  <!-- click spark accents -->
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" filter="url(#softGlow)">
    <line x1="56" y1="62" x2="64" y2="70"/>
    <line x1="144" y1="62" x2="136" y2="70"/>
    <line x1="50" y1="104" x2="60" y2="104"/>
    <line x1="150" y1="104" x2="140" y2="104"/>
  </g>

  <!-- subtle ticks -->
  <g stroke="#8E8E93" stroke-width="1" stroke-opacity="0.35">
    <line x1="100" y1="160" x2="100" y2="166"/>
    <line x1="34" y1="100" x2="40" y2="100"/>
    <line x1="160" y1="100" x2="166" y2="100"/>
    <line x1="100" y1="34" x2="100" y2="40"/>
  </g>
</svg>