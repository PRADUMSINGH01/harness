<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1F26" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#0A0D14" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#141821" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4D4D"/>
      <stop offset="0.55" stop-color="#E11D2E"/>
      <stop offset="1" stop-color="#B3121F"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="inkShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <mask id="grunge">
      <rect x="0" y="0" width="200" height="200" fill="#fff"/>
      <g fill="#0A0A0A">
        <circle cx="30" cy="70" r="3.2"/>
        <circle cx="170" cy="120" r="4"/>
        <circle cx="58" cy="150" r="2.6"/>
        <circle cx="140" cy="55" r="3"/>
        <circle cx="100" cy="40" r="2.4"/>
        <circle cx="100" cy="162" r="3.4"/>
        <circle cx="45" cy="105" r="2"/>
        <circle cx="158" cy="90" r="2.4"/>
        <ellipse cx="72" cy="62" rx="6" ry="2.4" transform="rotate(-20 72 62)"/>
        <ellipse cx="128" cy="140" rx="7" ry="2.6" transform="rotate(15 128 140)"/>
        <ellipse cx="160" cy="145" rx="5" ry="2" transform="rotate(-30 160 145)"/>
        <ellipse cx="38" cy="130" rx="5.5" ry="2" transform="rotate(40 38 130)"/>
        <rect x="90" y="118" width="14" height="2" transform="rotate(-8 97 119)"/>
        <rect x="55" y="88" width="10" height="1.8" transform="rotate(12 60 89)"/>
        <rect x="130" y="78" width="12" height="1.8" transform="rotate(-15 136 79)"/>
        <rect x="70" cy="140" y="140" width="9" height="1.6" transform="rotate(25 74 141)"/>
        <path d="M20 95 q6 4 12 1 q-5 5 -12 1 z" opacity="0.9"/>
        <path d="M176 60 q-6 4 -11 1 q5 -5 11 -1 z" opacity="0.9"/>
        <path d="M110 168 q6 -3 11 0 q-6 3 -11 0 z" opacity="0.9"/>
      </g>
    </mask>
  </defs>

  <!-- dark glass container -->
  <g>
    <circle cx="100" cy="100" r="92" fill="url(#glass)"/>
    <circle cx="100" cy="100" r="92" fill="none" stroke="#0A84FF" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="100" cy="100" r="86" fill="none" stroke="#8E8E93" stroke-opacity="0.18" stroke-width="0.8"/>
    <circle cx="100" cy="100" r="92" fill="url(#sheen)"/>
    <!-- corner ticks -->
    <g stroke="#8E8E93" stroke-opacity="0.45" stroke-width="1.4" stroke-linecap="round">
      <path d="M18 32 v-8 h8"/>
      <path d="M182 32 v-8 h-8"/>
      <path d="M18 168 v8 h8"/>
      <path d="M182 168 v8 h-8"/>
    </g>
  </g>

  <!-- stamp -->
  <g transform="rotate(-12 100 100)" mask="url(#grunge)" filter="url(#softGlow)">
    <g filter="url(#inkShadow)">
      <rect x="38" y="72" width="124" height="56" rx="7" fill="none" stroke="url(#ink)" stroke-width="7"/>
      <rect x="46" y="80" width="108" height="40" rx="4" fill="none" stroke="url(#ink)" stroke-width="2" opacity="0.85"/>
      <text x="100" y="110" text-anchor="middle" font-family="'Arial Black', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="30" letter-spacing="6" fill="url(#ink)">SOLD</text>
    </g>
  </g>

  <!-- ink spatter outside stamp, same rotation feel -->
  <g fill="#E11D2E" opacity="0.75">
    <circle cx="34" cy="128" r="1.6"/>
    <circle cx="168" cy="66" r="1.8"/>
    <circle cx="146" cy="152" r="1.4"/>
    <circle cx="52" cy="52" r="1.3"/>
  </g>
</svg>