<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#2a2118"/>
      <stop offset="60%" stop-color="#1a140e"/>
      <stop offset="100%" stop-color="#14100c"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2e8d5" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f2e8d5" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="bunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2e8d5"/>
      <stop offset="100%" stop-color="#d8c49c"/>
    </linearGradient>
    <linearGradient id="dogGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f06252"/>
      <stop offset="55%" stop-color="#e63b2e"/>
      <stop offset="100%" stop-color="#b0271d"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2e8d5"/>
      <stop offset="100%" stop-color="#cbb890"/>
    </linearGradient>
    <linearGradient id="tagGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5a4a"/>
      <stop offset="100%" stop-color="#c9281c"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="200" height="200" fill="url(#bgGlow)"/>
  <circle cx="100" cy="88" r="62" fill="#e63b2e" opacity="0.08" filter="url(#softGlow)"/>

  <!-- glass card -->
  <g>
    <rect x="16" y="16" width="168" height="168" rx="18" fill="url(#glass)" stroke="#f2e8d5" stroke-opacity="0.18" stroke-width="1"/>
    <!-- corner brackets -->
    <g stroke="#f2e8d5" stroke-opacity="0.55" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M22 30 v-8 h8"/>
      <path d="M170 22 h8 v8"/>
      <path d="M178 170 v8 h-8"/>
      <path d="M30 178 h-8 v-8"/>
    </g>
  </g>

  <!-- hot dog -->
  <g filter="url(#drop)">
    <!-- bun back -->
    <path d="M38 92 Q36 78 52 74 Q78 66 118 74 Q136 78 136 90 L136 100 Q136 110 120 114 Q80 122 52 114 Q38 110 38 100 Z" fill="url(#bunGrad)"/>
    <!-- sausage -->
    <path d="M46 92 Q48 80 66 78 Q98 74 124 80 Q136 83 136 92 Q136 101 122 103 Q92 108 64 104 Q47 101 46 92 Z" fill="url(#dogGrad)"/>
    <!-- mustard squiggle -->
    <path d="M50 91 Q56 84 62 91 T74 91 T86 91 T98 91 T110 91 T122 91 T132 90" fill="none" stroke="#f2b23a" stroke-width="3.2" stroke-linecap="round"/>
    <!-- bun highlights / seeds -->
    <g fill="#fff8ea" opacity="0.85">
      <ellipse cx="58" cy="79" rx="1.6" ry="0.9" transform="rotate(-14 58 79)"/>
      <ellipse cx="76" cy="76" rx="1.6" ry="0.9" transform="rotate(-10 76 76)"/>
      <ellipse cx="96" cy="76" rx="1.6" ry="0.9"/>
      <ellipse cx="116" cy="78" rx="1.6" ry="0.9" transform="rotate(10 116 78)"/>
      <ellipse cx="128" cy="83" rx="1.5" ry="0.85" transform="rotate(18 128 83)"/>
    </g>
  </g>

  <!-- soda cup -->
  <g filter="url(#drop)">
    <path d="M138 96 L154 96 L150.5 148 Q150 152 146 152 L126 152 Q122 152 121.5 148 Z" fill="url(#cupGrad)"/>
    <path d="M138 96 L154 96 L150.5 148 Q150 152 146 152 L136 152 L140 96 Z" fill="#b0271d" opacity="0.12"/>
    <!-- lid -->
    <rect x="134" y="88" width="24" height="7" rx="3.5" fill="#e63b2e"/>
    <rect x="143" y="78" width="3" height="12" rx="1.5" fill="#f2e8d5"/>
    <!-- cup stripe -->
    <path d="M131.5 112 L144.5 112 L143.8 124 L132.3 124 Z" fill="#e63b2e" opacity="0.9"/>
  </g>

  <!-- steam / sparkle accents -->
  <g stroke="#f2e8d5" stroke-opacity="0.5" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M56 66 q3 -5 0 -10 q-3 -5 0 -10"/>
    <path d="M68 62 q3 -5 0 -9"/>
  </g>
  <g fill="#f2e8d5">
    <circle cx="170" cy="60" r="1.4" opacity="0.7"/>
    <circle cx="40" cy="52" r="1.1" opacity="0.55"/>
    <circle cx="128" cy="44" r="1.6" opacity="0.65"/>
  </g>

  <!-- price tag -->
  <g filter="url(#drop)">
    <rect x="52" y="128" width="96" height="34" rx="8" fill="url(#tagGrad)"/>
    <rect x="54.5" y="130.5" width="91" height="29" rx="6" fill="none" stroke="#f2e8d5" stroke-opacity="0.6" stroke-width="1"/>
    <text x="100" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#f2e8d5" letter-spacing="1">$1.50</text>
  </g>
  <text x="100" y="172" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8" font-weight="600" fill="#f2e8d5" fill-opacity="0.75" letter-spacing="3">SINCE 1985</text>

  <!-- baseline ticks -->
  <g stroke="#f2e8d5" stroke-opacity="0.3" stroke-width="1">
    <path d="M86 182 h6"/><path d="M97 182 h6"/><path d="M108 182 h6"/>
  </g>
</svg>