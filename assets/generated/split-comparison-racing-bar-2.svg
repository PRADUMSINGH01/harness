<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glassBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16181D" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="blueBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="grayBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E8E93" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#C7C7CC" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="blueGlow" x="-60%" y="-120%" width="220%" height="340%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-60%" width="180%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- glass card -->
  <rect x="6" y="6" width="188" height="188" rx="14" fill="url(#glassBg)" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <rect x="6" y="6" width="188" height="188" rx="14" fill="none" stroke="#0A84FF" stroke-opacity="0.18" stroke-width="0.6"/>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-opacity="0.7" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M12 24 V14 H22"/><path d="M178 14 H188 V24"/>
    <path d="M188 176 V186 H178"/><path d="M22 186 H12 V176"/>
  </g>

  <!-- title -->
  <text x="100" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="2.4" fill="#FFFFFF" fill-opacity="0.85">FUNDING GAP</text>
  <line x1="30" y1="37" x2="170" y2="37" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.7"/>

  <!-- Row 1: $5.6M (5.6% of scale) -->
  <g filter="url(#softShadow)">
    <text x="16" y="60" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8" fill="#8E8E93" letter-spacing="1.2">STARTUP</text>
    <text x="184" y="60" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#38BDF8" filter="url(#blueGlow)">$5.6M</text>
    <rect x="16" y="66" width="168" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <rect x="16" y="66" width="9.4" height="14" rx="7" fill="url(#blueBar)" filter="url(#blueGlow)"/>
    <text x="30" y="76" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="6.5" fill="#8E8E93">5.6%</text>
  </g>

  <!-- Row 2: $100M (full scale) -->
  <g filter="url(#softShadow)">
    <text x="16" y="102" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8" fill="#8E8E93" letter-spacing="1.2">GIANT</text>
    <text x="184" y="102" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#FFFFFF">$100M</text>
    <rect x="16" y="108" width="168" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <rect x="16" y="108" width="168" height="14" rx="7" fill="url(#grayBar)"/>
  </g>

  <!-- axis ticks -->
  <g stroke="#8E8E93" stroke-opacity="0.5" stroke-width="0.7">
    <line x1="16" y1="132" x2="16" y2="136"/><line x1="58" y1="132" x2="58" y2="136"/>
    <line x1="100" y1="132" x2="100" y2="136"/><line x1="142" y1="132" x2="142" y2="136"/>
    <line x1="184" y1="132" x2="184" y2="136"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="5.5" fill="#8E8E93" text-anchor="middle">
    <text x="16" y="144">$0</text><text x="58" y="144">$25M</text>
    <text x="100" y="144">$50M</text><text x="142" y="144">$75M</text><text x="184" y="144">$100M</text>
  </g>

  <!-- callout: 18x -->
  <g>
    <line x1="30" y1="152" x2="30" y2="158" stroke="#0A84FF" stroke-opacity="0.8" stroke-width="0.8" stroke-dasharray="2 1.6"/>
    <rect x="55" y="154" width="90" height="22" rx="11" fill="#0A84FF" fill-opacity="0.12" stroke="#0A84FF" stroke-opacity="0.5" stroke-width="0.8"/>
    <text x="100" y="168" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" font-weight="700" fill="#38BDF8">~18× smaller</text>
  </g>

  <!-- baseline sparkline accent -->
  <polyline points="150,182 156,180 162,183 168,178 174,181 180,177 186,179" fill="none" stroke="#0A84FF" stroke-opacity="0.6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>