<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glassBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1D24" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B9C0C7"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#075FB8"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DA6FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- glass circle -->
  <circle cx="100" cy="100" r="90" fill="url(#glassBg)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#0A84FF" stroke-opacity="0.25" stroke-width="0.8"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="6"/>

  <!-- corner brackets -->
  <g stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M26 44 V30 Q26 26 30 26 H44"/>
    <path d="M156 26 H170 Q174 26 174 30 V44"/>
    <path d="M174 156 V170 Q174 174 170 174 H156"/>
    <path d="M44 174 H30 Q26 174 26 170 V156"/>
  </g>

  <!-- isometric cube -->
  <g transform="translate(100,101)" filter="url(#softShadow)">
    <!-- top face: diamond -->
    <polygon points="0,-46 40,-23 0,0 -40,-23" fill="url(#topFace)"/>
    <!-- left face -->
    <polygon points="-40,-23 0,0 0,46 -40,23" fill="url(#leftFace)"/>
    <!-- right face -->
    <polygon points="40,-23 0,0 0,46 40,23" fill="url(#rightFace)"/>

    <!-- top grid lines -->
    <g stroke="#0A0A0A" stroke-opacity="0.65" stroke-width="2.2">
      <line x1="-26.6" y1="-15.3" x2="13.4" y2="-38.3"/>
      <line x1="26.6" y1="-15.3" x2="-13.4" y2="-38.3"/>
      <line x1="-13.3" y1="-7.7" x2="26.7" y2="-30.7"/>
      <line x1="13.3" y1="-7.7" x2="-26.7" y2="-30.7"/>
      <line x1="0" y1="0" x2="0" y2="-46"/>
    </g>
    <!-- left grid lines -->
    <g stroke="#0A0A0A" stroke-opacity="0.65" stroke-width="2.2">
      <line x1="0" y1="0" x2="-40" y2="23"/>
      <line x1="0" y1="15.3" x2="-26.6" y2="7.7"/>
      <line x1="0" y1="30.7" x2="-26.6" y2="38.3"/>
      <line x1="-13.3" y1="7.7" x2="-13.3" y2="38.4"/>
      <line x1="-26.6" y1="15.3" x2="-26.6" y2="46"/>
    </g>
    <!-- right grid lines -->
    <g stroke="#0A0A0A" stroke-opacity="0.65" stroke-width="2.2">
      <line x1="0" y1="0" x2="40" y2="23"/>
      <line x1="0" y1="15.3" x2="26.6" y2="7.7"/>
      <line x1="0" y1="30.7" x2="26.6" y2="38.3"/>
      <line x1="13.3" y1="7.7" x2="13.3" y2="38.4"/>
      <line x1="26.6" y1="15.3" x2="26.6" y2="46"/>
    </g>

    <!-- glossy highlight on top -->
    <polygon points="0,-46 40,-23 0,0" fill="#FFFFFF" opacity="0.28"/>
  </g>

  <!-- luminous accent ticks -->
  <g filter="url(#glow)">
    <circle cx="100" cy="24" r="2.4" fill="#0A84FF"/>
    <circle cx="176" cy="100" r="1.8" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="24" cy="100" r="1.8" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- caption text -->
  <text x="100" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#8E8E93">SINCE 1974</text>
</svg>