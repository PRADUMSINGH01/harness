<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3A3E"/>
      <stop offset="0.5" stop-color="#8E8E93"/>
      <stop offset="1" stop-color="#2C2C2E"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#0A84FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- technical micro-details -->
  <g stroke="#8E8E93" stroke-width="1" opacity="0.45" fill="none">
    <path d="M14 30 v-14 h14"/>
    <path d="M172 30 v-14 h-14"/>
    <path d="M14 170 v14 h14"/>
    <path d="M172 170 v14 h-14"/>
  </g>
  <g stroke="#8E8E93" stroke-width="1" opacity="0.35">
    <line x1="100" y1="8" x2="100" y2="14"/>
    <line x1="100" y1="186" x2="100" y2="192"/>
    <line x1="8" y1="100" x2="14" y2="100"/>
    <line x1="186" y1="100" x2="192" y2="100"/>
  </g>
  <g opacity="0.35" fill="#8E8E93">
    <circle cx="20" cy="20" r="1.4"/>
    <circle cx="180" cy="20" r="1.4"/>
    <circle cx="20" cy="180" r="1.4"/>
    <circle cx="180" cy="180" r="1.4"/>
  </g>

  <!-- glasses group -->
  <g filter="url(#softShadow)">
    <!-- left lens -->
    <g>
      <circle cx="62" cy="102" r="40" fill="#0A0A0A" fill-opacity="0.55"/>
      <circle cx="62" cy="102" r="40" fill="url(#lensGrad)"/>
      <circle cx="62" cy="102" r="40" fill="url(#sheen)"/>
      <circle cx="62" cy="102" r="40" fill="none" stroke="url(#frameGrad)" stroke-width="7"/>
      <circle cx="62" cy="102" r="44.5" fill="none" stroke="#0A0A0A" stroke-width="2" opacity="0.8"/>
      <circle cx="62" cy="102" r="36.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>
    </g>
    <!-- right lens -->
    <g>
      <circle cx="138" cy="102" r="40" fill="#0A0A0A" fill-opacity="0.55"/>
      <circle cx="138" cy="102" r="40" fill="url(#lensGrad)"/>
      <circle cx="138" cy="102" r="40" fill="url(#sheen)"/>
      <circle cx="138" cy="102" r="40" fill="none" stroke="url(#frameGrad)" stroke-width="7"/>
      <circle cx="138" cy="102" r="44.5" fill="none" stroke="#0A0A0A" stroke-width="2" opacity="0.8"/>
      <circle cx="138" cy="102" r="36.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>
    </g>
    <!-- bridge -->
    <path d="M100 96 q0 -10 -0.5 -12" stroke="#0A0A0A" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M100 95 q0 -10 -0.5 -12" stroke="url(#frameGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- temples -->
    <path d="M22 96 q-12 -2 -16 -8" stroke="#0A0A0A" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M22 96 q-11 -1.5 -15 -7" stroke="url(#frameGrad)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M178 96 q12 -2 16 -8" stroke="#0A0A0A" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M178 96 q11 -1.5 15 -7" stroke="url(#frameGrad)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <!-- hinge screws -->
    <circle cx="27" cy="96" r="2.4" fill="#0A84FF" filter="url(#glow)"/>
    <circle cx="173" cy="96" r="2.4" fill="#0A84FF" filter="url(#glow)"/>
    <!-- nose pads -->
    <path d="M96 112 q-4 4 -4 9" stroke="#8E8E93" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M104 112 q4 4 4 9" stroke="#8E8E93" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- luminous accent line under lenses -->
  <line x1="30" y1="158" x2="170" y2="158" stroke="#0A84FF" stroke-width="1.5" opacity="0.6" filter="url(#glow)" stroke-linecap="round"/>
</svg>