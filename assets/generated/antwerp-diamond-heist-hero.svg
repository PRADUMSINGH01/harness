<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#0A0A0A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="diamond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#BFE0FF"/>
      <stop offset="70%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#063E7A"/>
    </linearGradient>
    <linearGradient id="facetL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="facetR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F2FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="vault" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1F2A"/>
      <stop offset="80%" stop-color="#0E1118"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="#0A0A0A"/>
  <rect width="200" height="200" fill="url(#bgGlow)"/>

  <!-- Subtle grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="0.4">
    <path d="M0 50H200M0 100H200M0 150H200M50 0V200M100 0V200M150 0V200"/>
  </g>

  <!-- Security rings: ten layers -->
  <g fill="none" stroke-linecap="round">
    <circle cx="100" cy="104" r="88" stroke="#8E8E93" stroke-opacity="0.12" stroke-width="0.6" stroke-dasharray="1 3"/>
    <circle cx="100" cy="104" r="80" stroke="#0A84FF" stroke-opacity="0.15" stroke-width="0.7"/>
    <circle cx="100" cy="104" r="73" stroke="#0A84FF" stroke-opacity="0.10" stroke-width="0.6" stroke-dasharray="14 8"/>
    <circle cx="100" cy="104" r="66" stroke="#8E8E93" stroke-opacity="0.15" stroke-width="0.5" stroke-dasharray="2 4"/>
    <!-- Doppler radar sweep -->
    <g opacity="0.85">
      <path d="M100 104 L100 36 A68 68 0 0 1 148 56 Z" fill="#0A84FF" fill-opacity="0.10"/>
      <path d="M100 104 L112 37" stroke="#0A84FF" stroke-opacity="0.5" stroke-width="0.8"/>
      <circle cx="100" cy="104" r="68" stroke="#0A84FF" stroke-opacity="0.25" stroke-width="0.7"/>
      <circle cx="140" cy="62" r="1.6" fill="#0A84FF" filter="url(#glow)"/>
      <circle cx="44" cy="130" r="1.4" fill="#0A84FF" opacity="0.8"/>
      <circle cx="158" cy="122" r="1.3" fill="#8E8E93"/>
    </g>
    <!-- Infrared heat arcs -->
    <g stroke="#0A84FF" stroke-opacity="0.35" stroke-width="0.8" stroke-dasharray="4 6">
      <circle cx="100" cy="104" r="58"/>
      <circle cx="100" cy="104" r="52" stroke-opacity="0.22"/>
    </g>
    <!-- tick marks -->
    <g stroke="#8E8E93" stroke-opacity="0.4" stroke-width="0.8">
      <path d="M100 20v6M100 182v6M16 104h6M178 104h6"/>
    </g>
  </g>

  <!-- Vault door disc -->
  <g>
    <circle cx="100" cy="108" r="42" fill="url(#vault)" stroke="#8E8E93" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle cx="100" cy="108" r="36" fill="none" stroke="#8E8E93" stroke-opacity="0.25" stroke-width="0.6"/>
    <!-- vault bolts -->
    <g fill="#8E8E93">
      <circle cx="100" cy="70.5" r="2"/><circle cx="100" cy="145.5" r="2"/>
      <circle cx="62.5" cy="108" r="2"/><circle cx="137.5" cy="108" r="2"/>
      <circle cx="73.2" cy="81.2" r="1.7"/><circle cx="126.8" cy="81.2" r="1.7"/>
      <circle cx="73.2" cy="134.8" r="1.7"/><circle cx="126.8" cy="134.8" r="1.7"/>
    </g>
    <!-- spokes -->
    <g stroke="#8E8E93" stroke-opacity="0.35" stroke-width="1">
      <path d="M100 72v72M64 108h72"/>
    </g>
    <!-- dial -->
    <circle cx="100" cy="108" r="12" fill="#0A0A0A" stroke="#0A84FF" stroke-opacity="0.7" stroke-width="1"/>
    <path d="M100 108 L107 101" stroke="#0A84FF" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="100" cy="108" r="2" fill="#0A84FF"/>
  </g>

  <!-- Blue glow beneath diamond -->
  <ellipse cx="100" cy="82" rx="34" ry="16" fill="#0A84FF" opacity="0.35" filter="url(#softGlow)"/>

  <!-- Diamond -->
  <g filter="url(#glow)">
    <path d="M70 62 L86 44 H114 L130 62 L100 108 Z" fill="url(#diamond)" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="0.8"/>
    <!-- crown facets -->
    <path d="M70 62 L100 44 L86 62 Z" fill="url(#facetL)" opacity="0.85"/>
    <path d="M130 62 L100 44 L114 62 Z" fill="url(#facetR)" opacity="0.85"/>
    <path d="M70 62 H130 L100 108 Z" fill="#0A84FF" opacity="0.25"/>
    <path d="M86 62 L100 108 L114 62 Z" fill="#FFFFFF" opacity="0.15"/>
    <path d="M70 62 L86 62 L100 44" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="0.5"/>
    <path d="M86 62 H114 M100 44 V108" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.4"/>
    <!-- sparkle -->
    <path d="M122 40 l1.4 3.6 3.6 1.4 -3.6 1.4 -1.4 3.6 -1.4 -3.6 -3.6 -1.4 3.6 -1.4 Z" fill="#FFFFFF"/>
    <path d="M64 34 l0.9 2.3 2.3 0.9 -2.3 0.9 -0.9 2.3 -0.9 -2.3 -2.3 -0.9 2.3 -0.9 Z" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Zero alarms chip -->
  <g>
    <rect x="18" y="150" width="72" height="22" rx="6" fill="url(#glass)" stroke="#0A84FF" stroke-opacity="0.6" stroke-width="0.8"/>
    <circle cx="30" cy="161" r="4" fill="none" stroke="#0A84FF" stroke-width="1.2"/>
    <path d="M27.8 161 l1.6 1.7 3 -3.4" stroke="#0A84FF" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#FFFFFF" letter-spacing="0.5">ZERO ALARMS</text>
    <text x="40" y="168" font-family="Menlo, 'Courier New', monospace" font-size="5" fill="#8E8E93" letter-spacing="0.8">10 LAYERS · 2 FLOORS DOWN</text>
  </g>

  <!-- Value chip -->
  <g>
    <rect x="110" y="150" width="72" height="22" rx="6" fill="url(#glass)" stroke="#8E8E93" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="146" y="159" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#FFFFFF" font-weight="600" letter-spacing="0.5">$100,000,000</text>
    <text x="146" y="168" text-anchor="middle" font-family="Menlo, 'Courier New', monospace" font-size="5" fill="#8E8E93" letter-spacing="1">ANTWERP · 2003</text>
  </g>

  <!-- Corner brackets -->
  <g stroke="#0A84FF" stroke-opacity="0.7" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M8 20 V10 H18"/>
    <path d="M192 20 V10 H182"/>
    <path d="M8 180 V190 H18"/>
    <path d="M192 180 V190 H182"/>
  </g>
  <!-- crosshair accents -->
  <g stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="0.6">
    <path d="M30 40 h6 M33 37 v6"/>
    <path d="M170 40 h6 M173 37 v6"/>
  </g>
</svg>