    <line x1="114" y1="36" x2="114" y2="40"/>
    <line x1="126" y1="34" x2="126" y2="40"/>
    <line x1="138" y1="36" x2="138" y2="40"/>
    <line x1="150" y1="34" x2="150" y2="40"/>
    <line x1="162" y1="36" x2="162" y2="40"/>
    <line x1="174" y1="34" x2="174" y2="40"/>
  </g>

  <!-- track left labels -->
  <g fill="#8E8E93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6">
    <text x="22" y="55">V1</text>
    <text x="22" y="75">V2</text>
    <text x="22" y="95">V3</text>
    <text x="22" y="115">V4</text>
    <text x="22" y="135">A1</text>
