<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="clipB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0A5CCF"/>
    </linearGradient>
    <linearGradient id="clipW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9CDD4"/>
    </linearGradient>
    <linearGradient id="clipG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3D44"/>
      <stop offset="1" stop-color="#23262B"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="200" height="200" fill="#0A0A0A"/>

  <!-- glass panel -->
  <rect x="14" y="26" width="172" height="148" rx="12" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.15"/>
  <g stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M14 38 v-6 a6 6 0 0 1 6-6 h6"/>
    <path d="M180 26 h6 a0 0 0 0 0 0 0 v6"/>
    <path d="M186 162 v6 a6 6 0 0 1-6 6 h-6"/>
    <path d="M20 174 h-6 a0 0 0 0 0 0 0 v-6"/>
  </g>

  <!-- header row: ruler ticks -->
  <g stroke="#8E8E93" stroke-width="1" opacity="0.6">
    <line x1="30" y1="34" x2="30" y2="40"/>
    <line x1="42" y1="36" x2="42" y2="40"/>
    <line x1="54" y1="34" x2="54" y2="40"/>
    <line x1="66" y1="36" x2="66" y2="40"/>
    <line x1="78" y1="34" x2="78" y2="40"/>
