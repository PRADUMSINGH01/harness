<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="glass" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1A1D24"/>
      <stop offset="60%" stop-color="#0A0D14"/>
      <stop offset="100%" stop-color="#05060A"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <clipPath id="plateClip">
      <circle cx="100" cy="100" r="78"/>
    </clipPath>
  </defs>

  <!-- dark glass plate -->
  <circle cx="100" cy="100" r="86" fill="#0A0A0A" opacity="0.55"/>
  <circle cx="100" cy="100" r="84" fill="url(#glass)" stroke="#8E8E93" stroke-opacity="0.45" stroke-width="1"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="0.8"/>

  <g clip-path="url(#plateClip)">
    <rect x="22" y="22" width="156" height="156" fill="url(#sheen)"/>

    <!-- etched background hatch field -->
    <g stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="0.55">
      <path d="M22 40 H178 M22 48 H178 M22 56 H178 M22 64 H178 M22 72 H178 M22 80 H178 M22 88 H178 M22 96 H178 M22 104 H178 M22 112 H178 M22 120 H178 M22 128 H178 M22 136 H178 M22 144 H178 M22 152 H178 M22 160 H178"/>
    </g>

    <!-- ============ PORTRAIT: hatch-line etching of Franklin ============ -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <!-- hair mass: dense etched hatching -->
      <g stroke-width="0.7" stroke-opacity="0.85">
        <path d="M64 92 C58 76 66 58 84 50 C102 42 126 46 136 58 C146 70 146 88 141 100"/>
        <path d="M60 98 C52 82 58 60 76 49 C98 36 128 40 140 56"/>
        <path d="M66 86 C62 72 70 58 84 52"/>
        <path d="M136 62 C144 74 144 90 140 100"/>
        <!-- flowing side curls -->
        <path d="M64 92 C56 100 52 112 54 124 C56 134 62 140 70 142 C76 143 80 138 78 132 C76 127 70 127 68 132"/>
        <path d="M141 100 C148 110 150 122 146 132 C143 139 136 143 130 141 C125 139 124 132 128 128"/>
        <path d="M60 106 C54 116 54 128 60 136"/>
        <path d="M144 108 C149 118 148 128 143 134"/>
      </g>
      <!-- hair interior hatching -->
      <g stroke-width="0.45" stroke-opacity="0.4">
        <path d="M70 88 C66 74 74 60 88 55 M76 84 C74 70 82 58 94 54 M84 80 C84 66 92 56 102 54 M94 78 C96 66 104 58 112 58 M106 76 C110 66 118 62 126 62 M116 74 C122 66 130 64 134 68 M68 96 C60 92 56 84 58 76 M138 82 C144 86 146 94 144 100 M58 104 C52 112 52 122 56 130 M146 112 C150 120 149 128 145 133 M62 118 C58 126 60 134 66 139 M142 122 C144 129 140 136 134 139"/>
      </g>

      <!-- forehead + face contour -->
      <g stroke-width="0.9" stroke-opacity="0.95">
        <path d="M74 74 C74 66 82 60 96 59 C112 58 126 64 129 76 C131 84 130 92 129 98"/>
        <path d="M72 92 C70 106 72 120 80 130 C88 140 104 144 116 138 C126 133 131 122 131 106"/>
        <path d="M74 74 C71 82 71 90 72 96"/>
      </g>
      <!-- face shading hatch (right side) -->
      <g stroke-width="0.4" stroke-opacity="0.35">
        <path d="M124 80 C127 88 127 98 126 106 M120 78 C124 88 125 100 124 110 M116 76 C121 88 122 102 121 114 M112 74 C118 88 119 104 118 118"/>
      </g>

      <!-- brow ridges -->
      <g stroke-width="1.2" stroke-opacity="0.95">
        <path d="M78 82 C82 78 90 77 96 79"/>
        <path d="M106 79 C112 77 120 78 126 82"/>
      </g>

      <!-- eyes -->
      <g stroke-width="0.9" stroke-opacity="1">
        <path d="M80 87 C84 84 92 84 95 87 C92 90 84 90 80 87 Z"/>
        <path d="M104 87 C107 84 115 84 119 87 C115 90 107 90 104 87 Z"/>
        <circle cx="87.5" cy="87" r="2.1" fill="#FFFFFF" stroke="none"/>
        <circle cx="111.5" cy="87" r="2.1" fill="#FFFFFF" stroke="none"/>
      </g>
      <!-- eye shading -->
      <g stroke-width="0.35" stroke-opacity="0.4">
        <path d="M81 92 L94 92 M82 94 L93 94 M105 92 L118 92 M106 94 L117 94"/>
      </g>

      <!-- nose -->
      <g stroke-width="0.8" stroke-opacity="0.9">
        <path d="M98 90 C97 98 96 104 92 109 C94 112 100 113 104 111"/>
        <path d="M99 95 C102 100 105 104 108 107" stroke-opacity="0.45" stroke-width="0.45"/>
      </g>

      <!-- cheek lines -->
      <g stroke-width="0.5" stroke-opacity="0.5">
        <path d="M80 104 C78 110 79 116 82 121 M84 100 C82 106 83 112 86 117"/>
      </g>

      <!-- mouth -->
      <g stroke-width="0.9" stroke-opacity="0.95">
        <path d="M90 120 C95 118 106 118 112 120 C106 124 95 124 90 120 Z"/>
      </g>
      <path d="M91 122 C96 126 107 126 111 121" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.5" fill="none"/>

      <!-- chin + jaw shading -->
      <g stroke-width="0.4" stroke-opacity="0.35">
        <path d="M92 130 C96 133 104 133 108 130 M88 126 C86 130 86 134 88 137 M112 126 C114 130 114 134 112 137"/>
      </g>

      <!-- cravat / collar: horizontal etch bands -->
      <g stroke-width="0.8" stroke-opacity="0.9">
        <path d="M62 142 C78 136 90 138 100 142 C110 138 124 136 142 143"/>
        <path d="M58 150 C76 143 90 145 100 150 C110 145 126 143 146 151"/>
        <path d="M54 160 C74 152 90 154 100 159 C110 154 128 152 150 161"/>
      </g>
      <g stroke-width="0.45" stroke-opacity="0.45">
        <path d="M66 155 C80 149 92 151 100 155 C108 151 122 149 138 156 M70 148 C82 143 92 145 100 148 C108 145 120 143 134 149 M74 143 C84 139 93 140 100 143 C107 140 117 139 128 143 M60 165 C78 157 91 159 100 164 C109 159 124 157 142 166"/>
      </g>
      <!-- neck shading hatch -->
      <g stroke-width="0.4" stroke-opacity="0.35">
        <path d="M90 130 C90 136 90 140 91 144 M96 132 C96 137 96 141 96 144 M104 131 C105 136 105 140 105 143"/>
      </g>
    </g>

    <!-- blue luminous accent: engraved signature line -->
    <g filter="url(#glow)">
      <path d="M68 168 C84 163 116 163 132 168" stroke="#0A84FF" stroke-width="1.1" fill="none" stroke-opacity="0.9"/>
      <circle cx="100" cy="166" r="1.4" fill="#0A84FF"/>
    </g>

    <!-- inner engraved ring ticks -->
    <g stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="0.7">
      <path d="M100 23.5 V28 M100 172 V176.5 M23.5 100 H28 M172 100 H176.5"/>
    </g>
  </g>

  <!-- outer engraved frame detail -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="0.7" stroke-dasharray="1 3"/>

  <!-- corner brackets -->
  <g stroke="#8E8E93" stroke-width="1.4" fill="none" stroke-opacity="0.9" stroke-linecap="round">
    <path d="M12 22 V12 H22"/>
    <path d="M178 12 H188 V22"/>
    <path d="M188 178 V188 H178"/>
    <path d="M22 188 H12 V178"/>
  </g>
  <g fill="#0A84FF" opacity="0.85">
    <circle cx="12" cy="12" r="1.3"/>
    <circle cx="188" cy="12" r="1.3"/>
    <circle cx="188" cy="188" r="1.3"/>
    <circle cx="12" cy="188" r="1.3"/>
  </g>
</svg>