<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16181D"/>
      <stop offset="0.5" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7CBD1"/>
    </linearGradient>
    <linearGradient id="blueSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="16" y="16" width="168" height="168" rx="20"/>
    </clipPath>
  </defs>

  <!-- ambient glow -->
  <circle cx="100" cy="100" r="92" fill="url(#blueGlow)"/>

  <!-- glass card -->
  <g filter="url(#softGlow)">
    <rect x="16" y="16" width="168" height="168" rx="20" fill="url(#glassGrad)"/>
    <rect x="16.75" y="16.75" width="166.5" height="166.5" rx="19.25" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>
  </g>

  <!-- inner grid detail -->
  <g clip-path="url(#cardClip)" opacity="0.12">
    <g stroke="#FFFFFF" stroke-width="0.5">
      <line x1="40" y1="16" x2="40" y2="184"/>
      <line x1="80" y1="16" x2="80" y2="184"/>
      <line x1="120" y1="16" x2="120" y2="184"/>
      <line x1="160" y1="16" x2="160" y2="184"/>
      <line x1="16" y1="40" x2="184" y2="40"/>
      <line x1="16" y1="80" x2="184" y2="80"/>
      <line x1="16" y1="120" x2="184" y2="120"/>
      <line x1="16" y1="160" x2="184" y2="160"/>
    </g>
    <rect x="72" y="28" width="112" height="80" fill="url(#blueSheen)"/>
  </g>

  <!-- crosshair accent -->
  <g stroke="#8E8E93" stroke-width="1" opacity="0.6">
    <line x1="30" y1="30" x2="42" y2="30"/>
    <line x1="30" y1="30" x2="30" y2="42"/>
    <line x1="170" y1="170" x2="158" y2="170"/>
    <line x1="170" y1="170" x2="170" y2="158"/>
  </g>
  <circle cx="170" cy="30" r="3" fill="none" stroke="#0A84FF" stroke-width="1.2" opacity="0.9"/>

  <!-- bold typography: 20 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" text-anchor="middle">
    <text x="100" y="130" font-size="84" fill="#0A84FF" opacity="0.9" transform="translate(3,3)" filter="url(#softGlow)">20</text>
    <text x="100" y="130" font-size="84" fill="url(#textGrad)" letter-spacing="-2">20</text>
  </g>

  <!-- label -->
  <text x="100" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#8E8E93" text-anchor="middle" letter-spacing="4">BOLD 20</text>
  <line x1="66" y1="164" x2="134" y2="164" stroke="#0A84FF" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
</svg>