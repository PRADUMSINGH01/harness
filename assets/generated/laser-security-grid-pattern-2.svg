<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <linearGradient id="laser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#0A84FF"/>
      <stop offset="0.8" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="laserV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- subtle glass card -->
  <rect x="14" y="14" width="172" height="172" rx="14" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.12"/>

  <!-- horizontal laser beams -->
  <g filter="url(#glow)">
    <line x1="22" y1="45" x2="178" y2="45" stroke="url(#laser)" stroke-width="0.9"/>
    <line x1="22" y1="75" x2="178" y2="75" stroke="url(#laser)" stroke-width="0.9"/>
    <line x1="22" y1="105" x2="178" y2="105" stroke="url(#laser)" stroke-width="0.9"/>
    <line x1="22" y1="135" x2="178" y2="135" stroke="url(#laser)" stroke-width="0.9"/>
    <line x1="22" y1="165" x2="178" y2="165" stroke="url(#laser)" stroke-width="0.9"/>
  </g>

  <!-- vertical laser beams -->
  <g filter="url(#glow)" opacity="0.75">
    <line x1="45" y1="22" x2="45" y2="178" stroke="url(#laserV)" stroke-width="0.8"/>
    <line x1="80" y1="22" x2="80" y2="178" stroke="url(#laserV)" stroke-width="0.8"/>
    <line x1="120" y1="22" x2="120" y2="178" stroke="url(#laserV)" stroke-width="0.8"/>
    <line x1="155" y1="22" x2="155" y2="178" stroke="url(#laserV)" stroke-width="0.8"/>
  </g>

  <!-- emitters along left edge -->
  <g fill="#0A84FF" filter="url(#glow)">
    <circle cx="22" cy="45" r="2.4"/>
    <circle cx="22" cy="75" r="2.4"/>
    <circle cx="22" cy="105" r="2.4"/>
    <circle cx="22" cy="135" r="2.4"/>
    <circle cx="22" cy="165" r="2.4"/>
  </g>
  <g fill="#8E8E93">
    <circle cx="178" cy="45" r="1.6"/>
    <circle cx="178" cy="75" r="1.6"/>
    <circle cx="178" cy="105" r="1.6"/>
    <circle cx="178" cy="135" r="1.6"/>
    <circle cx="178" cy="165" r="1.6"/>
  </g>

  <!-- intersection hotspots -->
  <g fill="#FFFFFF" filter="url(#softglow)" opacity="0.9">
    <circle cx="80" cy="105" r="1.4"/>
    <circle cx="120" cy="75" r="1.4"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M18 30 V18 H30"/>
    <path d="M170 18 H182 V30"/>
    <path d="M182 170 V182 H170"/>
    <path d="M30 182 H18 V170"/>
  </g>

  <!-- micro ticks -->
  <g stroke="#8E8E93" stroke-width="0.6" opacity="0.5">
    <line x1="45" y1="186" x2="45" y2="189"/>
    <line x1="80" y1="186" x2="80" y2="189"/>
    <line x1="120" y1="186" x2="120" y2="189"/>
    <line x1="155" y1="186" x2="155" y2="189"/>
    <line x1="9" y1="45" x2="12" y2="45"/>
    <line x1="9" y1="105" x2="12" y2="105"/>
    <line x1="9" y1="165" x2="12" y2="165"/>
  </g>
</svg>