<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141821"/>
      <stop offset="0.5" stop-color="#0A0D14"/>
      <stop offset="1" stop-color="#05070C"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="url(#glass)"/>
  <rect width="200" height="200" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="0.4">
    <path d="M0 40H200 M0 80H200 M0 120H200 M0 160H200"/>
    <path d="M40 0V200 M80 0V200 M120 0V200 M160 0V200"/>
  </g>

  <!-- document card -->
  <g filter="url(#shadow)">
    <rect x="42" y="20" width="116" height="160" rx="4" fill="url(#paper)" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="0.8"/>
  </g>

  <!-- header -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <rect x="42" y="20" width="116" height="18" rx="4" fill="#0A84FF" fill-opacity="0.85"/>
    <rect x="42" y="32" width="116" height="6" fill="#0A84FF" fill-opacity="0.85"/>
    <text x="100" y="32.5" text-anchor="middle" font-size="8" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">MIT MEDIA LAB</text>
  </g>

  <!-- document text lines -->
  <g fill="#FFFFFF" fill-opacity="0.35">
    <rect x="50" y="48" width="44" height="3" rx="1.5"/>
    <rect x="50" y="56" width="70" height="2.4" rx="1.2" fill-opacity="0.22"/>
    <rect x="50" y="62" width="58" height="2.4" rx="1.2" fill-opacity="0.22"/>
  </g>

  <!-- redaction bars -->
  <g fill="#050505">
    <rect x="50" y="72" width="100" height="9" rx="1.5"/>
    <rect x="50" y="86" width="72" height="9" rx="1.5"/>
    <rect x="126" y="86" width="24" height="9" rx="1.5"/>
    <rect x="50" y="100" width="100" height="9" rx="1.5"/>
    <rect x="50" y="114" width="54" height="9" rx="1.5"/>
  </g>
  <g fill="#050505" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="0.4">
    <rect x="50" y="72" width="100" height="9" rx="1.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  </g>

  <!-- lower text + redactions -->
  <g fill="#FFFFFF" fill-opacity="0.28">
    <rect x="50" y="130" width="88" height="2.4" rx="1.2"/>
    <rect x="50" y="136" width="62" height="2.4" rx="1.2"/>
  </g>
  <rect x="50" y="144" width="100" height="8" rx="1.5" fill="#050505"/>
  <rect x="50" y="156" width="40" height="2.4" rx="1.2" fill="#FFFFFF" fill-opacity="0.28"/>

  <!-- 54 SUBJECTS stamp -->
  <g transform="translate(126 132) rotate(-10)">
    <rect x="-22" y="-11" width="44" height="22" rx="2" fill="none" stroke="#0A84FF" stroke-width="1.6"/>
    <rect x="-22" y="-11" width="44" height="22" rx="2" fill="#0A84FF" fill-opacity="0.12" filter="url(#blur)"/>
    <text x="0" y="-1.5" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" font-weight="800" fill="#0A84FF">54</text>
    <text x="0" y="8" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="4.6" font-weight="700" letter-spacing="0.8" fill="#0A84FF">SUBJECTS</text>
  </g>

  <!-- corner brackets & ticks -->
  <g stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1" fill="none">
    <path d="M10 16V8H18 M182 8h-8 M182 8v8 M10 184v8h8 M190 184v8h-8 M190 192h-8"/>
  </g>
  <g fill="#8E8E93" font-family="ui-monospace, Menlo, monospace" font-size="4" letter-spacing="1">
    <text x="12" y="196">FILE: ML-0054 // CLASSIFIED</text>
    <text x="188" y="196" text-anchor="end">REV 3</text>
  </g>
  <circle cx="24" cy="12" r="1.5" fill="#0A84FF"/>
  <circle cx="24" cy="12" r="3" fill="none" stroke="#0A84FF" stroke-opacity="0.4" stroke-width="0.6"/>
</svg>