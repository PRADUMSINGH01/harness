<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="200" height="200" fill="#0A0A0A"/>
  <rect width="200" height="200" fill="url(#bgGlow)"/>
  <rect width="200" height="200" fill="url(#grid)"/>

  <!-- glass card -->
  <g filter="url(#softShadow)">
    <rect x="30" y="30" width="140" height="140" rx="24" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
  </g>
  <rect x="30.5" y="30.5" width="140" height="139" rx="24" fill="none" stroke="#8E8E93" stroke-opacity="0.25" stroke-width="0.5"/>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-opacity="0.7" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M38 48V40a2 2 0 0 1 2-2h8"/>
    <path d="M152 38h8a2 2 0 0 1 2 2v8"/>
    <path d="M162 152v8a2 2 0 0 1-2 2h-8"/>
    <path d="M48 162h-8a2 2 0 0 1-2-2v-8"/>
  </g>

  <!-- infinity lemniscate -->
  <path d="M100 100 C 118 76, 148 76, 156 100 C 148 124, 118 124, 100 100 C 82 76, 52 76, 44 100 C 52 124, 82 124, 100 100 Z"
        fill="none" stroke="#0A84FF" stroke-opacity="0.25" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M100 100 C 118 76, 148 76, 156 100 C 148 124, 118 124, 100 100 C 82 76, 52 76, 44 100 C 52 124, 82 124, 100 100 Z"
        fill="none" stroke="url(#strokeGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M100 100 C 118 76, 148 76, 156 100 C 148 124, 118 124, 100 100 C 82 76, 52 76, 44 100 C 52 124, 82 124, 100 100 Z"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.4" stroke-linecap="round"/>

  <!-- node accents -->
  <circle cx="44" cy="100" r="2.5" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="156" cy="100" r="2.5" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="1.6" fill="#0A84FF"/>

  <!-- ticks -->
  <g stroke="#8E8E93" stroke-opacity="0.5" stroke-width="0.8" stroke-linecap="round">
    <line x1="100" y1="34" x2="100" y2="38"/>
    <line x1="100" y1="162" x2="100" y2="166"/>
    <line x1="34" y1="100" x2="38" y2="100"/>
    <line x1="162" y1="100" x2="166" y2="100"/>
  </g>

  <text x="100" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" letter-spacing="3" fill="#8E8E93" fill-opacity="0.8">∞ INFINITY</text>
</svg>