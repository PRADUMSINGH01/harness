<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glassBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1C22"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0055CC"/>
    </linearGradient>
    <linearGradient id="slashGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#8E8E93"/>
    </linearGradient>
    <linearGradient id="edgeSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="bodyClip">
      <rect x="34" y="42" width="132" height="122" rx="18"/>
    </clipPath>
  </defs>

  <!-- calendar body -->
  <g filter="url(#softShadow)">
    <rect x="34" y="42" width="132" height="122" rx="18" fill="url(#glassBody)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
  </g>

  <g clip-path="url(#bodyClip)">
    <!-- header band -->
    <rect x="34" y="42" width="132" height="38" fill="url(#headerGrad)"/>
    <rect x="34" y="42" width="132" height="38" fill="url(#edgeSheen)"/>
    <!-- subtle glass sheen -->
    <rect x="34" y="42" width="132" height="122" fill="url(#edgeSheen)" opacity="0.5"/>
  </g>

  <!-- binding rings -->
  <g stroke="#8E8E93" stroke-width="6" stroke-linecap="round">
    <line x1="66" y1="30" x2="66" y2="52"/>
    <line x1="100" y1="30" x2="100" y2="52"/>
    <line x1="134" y1="30" x2="134" y2="52"/>
  </g>
  <g stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
    <line x1="64.5" y1="31" x2="64.5" y2="40"/>
    <line x1="98.5" y1="31" x2="98.5" y2="40"/>
    <line x1="132.5" y1="31" x2="132.5" y2="40"/>
  </g>

  <!-- header year text -->
  <text x="100" y="68" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="2">2025</text>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M42 92 v-8 h8"/>
    <path d="M158 92 v-8 h-8"/>
    <path d="M42 152 v8 h8"/>
    <path d="M158 152 v8 h-8"/>
  </g>

  <!-- date dots grid -->
  <g fill="#FFFFFF" fill-opacity="0.55">
    <circle cx="60" cy="98" r="3.2"/><circle cx="77" cy="98" r="3.2"/><circle cx="94" cy="98" r="3.2"/><circle cx="111" cy="98" r="3.2"/><circle cx="128" cy="98" r="3.2"/><circle cx="145" cy="98" r="3.2"/>
    <circle cx="60" cy="115" r="3.2"/><circle cx="77" cy="115" r="3.2"/><circle cx="94" cy="115" r="3.2"/><circle cx="111" cy="115" r="3.2"/><circle cx="128" cy="115" r="3.2"/><circle cx="145" cy="115" r="3.2"/>
    <circle cx="60" cy="132" r="3.2"/><circle cx="77" cy="132" r="3.2"/><circle cx="94" cy="132" r="3.2"/><circle cx="111" cy="132" r="3.2"/><circle cx="128" cy="132" r="3.2"/><circle cx="145" cy="132" r="3.2"/>
    <circle cx="60" cy="149" r="3.2"/><circle cx="77" cy="149" r="3.2"/><circle cx="128" cy="149" r="3.2"/><circle cx="145" cy="149" r="3.2"/>
  </g>
  <!-- highlighted date -->
  <circle cx="128" cy="132" r="7" fill="none" stroke="#0A84FF" stroke-width="2" opacity="0.9"/>

  <!-- slash mark -->
  <g filter="url(#glow)">
    <line x1="150" y1="58" x2="50" y2="150" stroke="url(#slashGrad)" stroke-width="12" stroke-linecap="round"/>
  </g>
  <line x1="150" y1="58" x2="50" y2="150" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

  <!-- tick details -->
  <g stroke="#8E8E93" stroke-width="1.5" opacity="0.5">
    <line x1="100" y1="170" x2="112" y2="170"/>
    <line x1="116" y1="170" x2="120" y2="170"/>
  </g>
</svg>