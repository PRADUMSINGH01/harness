<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16181D" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="barDim" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3A3D44" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8E8E93"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="plotClip"><rect x="30" y="34" width="150" height="130"/></clipPath>
  </defs>

  <!-- glass panel -->
  <rect x="8" y="8" width="184" height="184" rx="14" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.12"/>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M16 26 v-8 h8"/>
    <path d="M184 18 h-8 M176 18" opacity="0"/>
    <path d="M184 26 v-8 h-8"/>
    <path d="M16 174 v8 h8"/>
    <path d="M184 174 v8 h-8"/>
  </g>

  <!-- title ticks -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#8E8E93" font-size="7" letter-spacing="1.5">
    <text x="24" y="24">GEOMETRY</text>
    <text x="176" y="24" text-anchor="end" fill="#0A84FF">DATA ▸</text>
  </g>

  <!-- gridlines -->
  <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1">
    <line x1="30" y1="54" x2="180" y2="54"/>
    <line x1="30" y1="79" x2="180" y2="79"/>
    <line x1="30" y1="104" x2="180" y2="104"/>
    <line x1="30" y1="129" x2="180" y2="129"/>
    <line x1="30" y1="164" x2="180" y2="164" stroke-opacity="0.25"/>
  </g>
  <g fill="#8E8E93" font-family="ui-monospace, Menlo, monospace" font-size="6" text-anchor="end">
    <text x="27" y="56.5">4</text>
    <text x="27" y="81.5">3</text>
    <text x="27" y="106.5">2</text>
    <text x="27" y="131.5">1</text>
    <text x="27" y="166.5">0</text>
  </g>

  <!-- bars -->
  <g clip-path="url(#plotClip)">
    <g>
      <rect x="38" y="96" width="16" height="68" rx="3" fill="url(#bar)" filter="url(#glow)">
        <animate attributeName="height" values="68;52;68" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="96;112;96" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g>
      <rect x="66" y="64" width="16" height="100" rx="3" fill="url(#bar)" filter="url(#glow)">
        <animate attributeName="height" values="100;116;100" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="64;48;64" dur="3.6s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g>
      <rect x="94" y="84" width="16" height="80" rx="3" fill="url(#barDim)">
        <animate attributeName="height" values="80;64;80" dur="2.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="84;100;84" dur="2.7s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g>
      <rect x="122" y="46" width="16" height="118" rx="3" fill="url(#bar)" filter="url(#glow)">
        <animate attributeName="height" values="118;98;118" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="46;66;46" dur="4.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g>
      <rect x="150" y="74" width="16" height="90" rx="3" fill="url(#bar)" filter="url(#glow)">
        <animate attributeName="height" values="90;108;90" dur="3.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="74;56;74" dur="3.3s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- baseline -->
  <line x1="30" y1="164" x2="180" y2="164" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2"/>

  <!-- value tick on peak bar -->
  <g>
    <circle cx="130" cy="46" r="2.5" fill="#0A84FF" filter="url(#glow)">
      <animate attributeName="cy" values="46;66;46" dur="4.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- x labels -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="6" fill="#8E8E93" text-anchor="middle">
    <text x="46" y="178">A</text>
    <text x="74" y="178">B</text>
    <text x="102" y="178">C</text>
    <text x="130" y="178">D</text>
    <text x="158" y="178">E</text>
  </g>

  <!-- sparkline accent -->
  <polyline points="160,36 166,41 172,38 178,44" fill="none" stroke="#0A84FF" stroke-width="1" opacity="0.6"/>
</svg>