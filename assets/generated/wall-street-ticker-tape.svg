<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151519"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="6" y="6" width="188" height="188" rx="42" fill="url(#bg)"/>
  <rect x="6" y="6" width="188" height="188" rx="42" fill="url(#glass)"/>
  <rect x="6.75" y="6.75" width="186.5" height="186.5" rx="41.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Corner ticks -->
  <g stroke="#8E8E93" stroke-opacity="0.6" stroke-width="1.6" stroke-linecap="round">
    <path d="M28 40 V30 H38"/>
    <path d="M162 30 H172 V40"/>
    <path d="M172 160 V170 H162"/>
    <path d="M38 170 H28 V160"/>
  </g>

  <!-- Upper tape (angled up) -->
  <g filter="url(#soft)">
    <g transform="rotate(-9 100 74)">
      <rect x="8" y="58" width="184" height="34" rx="8" fill="#101014" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <rect x="8" y="58" width="184" height="34" rx="8" fill="url(#glass)"/>
      <rect x="12" y="60" width="176" height="4" rx="2" fill="url(#sheen)"/>
      <g font-family="'SF Mono','Menlo','Consolas',monospace" font-size="12.5" font-weight="600">
        <text x="20" y="80" fill="#FFFFFF" letter-spacing="1">AAPL</text>
        <text x="58" y="80" fill="#0A84FF">226.4</text>
        <path d="M94 79 l4-6 4 6 z" fill="#30D158" filter="url(#glow)"/>
        <text x="110" y="80" fill="#FFFFFF" letter-spacing="1">TSLA</text>
        <text x="146" y="80" fill="#0A84FF">248.9</text>
      </g>
      <circle cx="186" cy="75" r="1.4" fill="#0A84FF"/>
    </g>
  </g>

  <!-- Lower tape (angled down) -->
  <g filter="url(#soft)">
    <g transform="rotate(-9 100 128)">
      <rect x="8" y="112" width="184" height="34" rx="8" fill="#101014" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <rect x="8" y="112" width="184" height="34" rx="8" fill="url(#glass)"/>
      <rect x="12" y="114" width="176" height="4" rx="2" fill="url(#sheen)"/>
      <g font-family="'SF Mono','Menlo','Consolas',monospace" font-size="12.5" font-weight="600">
        <text x="18" y="134" fill="#FFFFFF" letter-spacing="1">NVDA</text>
        <text x="54" y="134" fill="#0A84FF">138.2</text>
        <path d="M88 133 l4 6 4-6 z" fill="#FF453A" filter="url(#glow)"/>
        <text x="104" y="134" fill="#FFFFFF" letter-spacing="1">MSFT</text>
        <text x="141" y="134" fill="#0A84FF">429.7</text>
      </g>
      <circle cx="184" cy="129" r="1.4" fill="#8E8E93"/>
    </g>
  </g>

  <!-- Sparkline accent -->
  <g transform="rotate(-9 100 74)"></g>
  <g opacity="0.55">
    <path d="M28 176 h8 M164 176 h8" stroke="#8E8E93" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M44 176 l6 -5 l5 3 l6 -6 l6 4 l6 -3" fill="none" stroke="#0A84FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
</svg>