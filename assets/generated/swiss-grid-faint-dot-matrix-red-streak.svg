<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="glassGlow" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1A1F2B"/>
      <stop offset="55%" stop-color="#0E1118"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="redStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0"/>
      <stop offset="45%" stop-color="#F43F5E" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="redStreakSoft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F43F5E" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blueStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0A84FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dotMatrix" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="0.55" fill="#FFFFFF" opacity="0.16"/>
    </pattern>
    <pattern id="majorDotMatrix" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.9" fill="#FFFFFF" opacity="0.28"/>
    </pattern>
    <filter id="redGlow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- dark glass base -->
  <rect x="0" y="0" width="200" height="200" rx="10" fill="url(#glassGlow)"/>
  <rect x="0.5" y="0.5" width="199" height="199" rx="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- faint swiss grid lines -->
  <g stroke="#8E8E93" stroke-opacity="0.10" stroke-width="0.5">
    <line x1="50" y1="10" x2="50" y2="190"/>
    <line x1="100" y1="10" x2="100" y2="190"/>
    <line x1="150" y1="10" x2="150" y2="190"/>
    <line x1="10" y1="50" x2="190" y2="50"/>
    <line x1="10" y1="100" x2="190" y2="100"/>
    <line x1="10" y1="150" x2="190" y2="150"/>
  </g>
  <g stroke="#8E8E93" stroke-opacity="0.05" stroke-width="0.4">
    <line x1="25" y1="10" x2="25" y2="190"/>
    <line x1="75" y1="10" x2="75" y2="190"/>
    <line x1="125" y1="10" x2="125" y2="190"/>
    <line x1="175" y1="10" x2="175" y2="190"/>
    <line x1="10" y1="25" x2="190" y2="25"/>
    <line x1="10" y1="75" x2="190" y2="75"/>
    <line x1="10" y1="125" x2="190" y2="125"/>
    <line x1="10" y1="175" x2="190" y2="175"/>
  </g>

  <!-- dot matrices -->
  <rect x="10" y="10" width="180" height="180" fill="url(#dotMatrix)"/>
  <rect x="10" y="10" width="180" height="180" fill="url(#majorDotMatrix)"/>

  <!-- red ticker tape streaks -->
  <g filter="url(#redGlow)">
    <rect x="12" y="38" width="150" height="1.6" rx="0.8" fill="url(#redStreak)"/>
    <rect x="60" y="41.5" width="70" height="0.8" rx="0.4" fill="url(#redStreakSoft)"/>
    <rect x="30" y="92" width="168" height="2.2" rx="1.1" fill="url(#redStreak)"/>
    <rect x="80" y="96.5" width="60" height="0.8" rx="0.4" fill="url(#redStreakSoft)"/>
    <rect x="10" y="146" width="130" height="1.4" rx="0.7" fill="url(#redStreak)"/>
    <rect x="48" y="149.5" width="90" height="0.7" rx="0.35" fill="url(#redStreakSoft)"/>
  </g>

  <!-- blue accent streak + ticks -->
  <rect x="40" y="119" width="120" height="1.2" rx="0.6" fill="url(#blueStreak)"/>
  <g fill="#0A84FF" opacity="0.85">
    <rect x="88" y="90.4" width="1.6" height="5.4" rx="0.8"/>
    <rect x="92.5" y="91.4" width="1.6" height="3.4" rx="0.8"/>
  </g>

  <!-- coordinate ticks -->
  <g stroke="#8E8E93" stroke-opacity="0.45" stroke-width="0.6">
    <line x1="10" y1="10" x2="10" y2="14"/>
    <line x1="10" y1="10" x2="14" y2="10"/>
    <line x1="190" y1="10" x2="186" y2="10"/>
    <line x1="190" y1="10" x2="190" y2="14"/>
    <line x1="10" y1="190" x2="10" y2="186"/>
    <line x1="10" y1="190" x2="14" y2="190"/>
    <line x1="190" y1="190" x2="190" y2="186"/>
    <line x1="190" y1="190" x2="186" y2="190"/>
  </g>

  <!-- center crosshair -->
  <g stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="0.5">
    <line x1="97" y1="100" x2="103" y2="100"/>
    <line x1="100" y1="97" x2="100" y2="103"/>
  </g>
  <circle cx="100" cy="100" r="4.2" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="0.5"/>

  <!-- glass highlight -->
  <path d="M10 20 Q 100 6 190 20 L190 10 Q 100 -2 10 10 Z" fill="#FFFFFF" opacity="0.04"/>
</svg>