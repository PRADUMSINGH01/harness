<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glassCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1F26"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="quill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#8E8E93" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="inkLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- dark glass card -->
  <g filter="url(#soft)">
    <rect x="18" y="18" width="164" height="164" rx="34" fill="url(#glassCard)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.2"/>
  </g>
  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M30 44 V34 Q30 30 34 30 H44"/>
    <path d="M170 156 V166 Q170 170 166 170 H156"/>
  </g>

  <!-- parchment sheet -->
  <g>
    <path d="M52 158 L60 96 Q61 90 67 90 L136 96 Q142 97 142 103 L140 148 Q140 154 134 154 L58 164 Q52 165 52 158 Z"
          fill="url(#parchment)" stroke="#8E8E93" stroke-opacity="0.5" stroke-width="1.3"/>
    <!-- parchment lines -->
    <g stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.4" stroke-linecap="round">
      <path d="M68 108 L124 113"/>
      <path d="M66 122 L110 126"/>
    </g>
    <!-- ink line being scratched -->
    <path d="M60 142 L96 145 L104 138 L114 144 L134 146"
          fill="none" stroke="url(#inkLine)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="134" cy="146" r="2.6" fill="#0A84FF" filter="url(#glow)"/>
    <!-- ink droplet -->
    <path d="M148 118 q-3.4 5 0 7.4 a3.7 3.7 0 0 0 0 -7.4 Z" fill="#0A84FF" opacity="0.9"/>
  </g>

  <!-- quill -->
  <g transform="rotate(-8 100 100)">
    <!-- shaft -->
    <path d="M138 44 Q150 60 128 96 L112 126 L106 122 L120 90 Q132 62 138 44 Z"
          fill="url(#quill)" stroke="#8E8E93" stroke-opacity="0.35" stroke-width="0.8"/>
    <!-- feather vane -->
    <path d="M136 42 Q112 52 98 78 Q88 96 84 116 Q96 112 110 96 Q128 74 136 42 Z"
          fill="#FFFFFF" fill-opacity="0.85" stroke="#8E8E93" stroke-opacity="0.4" stroke-width="0.8"/>
    <!-- feather barb details -->
    <g stroke="#8E8E93" stroke-opacity="0.55" stroke-width="0.9" stroke-linecap="round" fill="none">
      <path d="M130 54 Q116 62 108 76"/>
      <path d="M124 68 Q112 76 106 88"/>
      <path d="M118 82 Q110 88 105 98"/>
    </g>
    <!-- nib -->
    <path d="M112 126 L106 122 L101 136 Z" fill="#0A84FF" filter="url(#glow)"/>
    <!-- nib slit -->
    <path d="M109 127 L104 134" stroke="#0A0A0A" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- motion sparkles -->
  <g fill="#0A84FF">
    <circle cx="86" cy="58" r="1.6" opacity="0.8"/>
    <circle cx="76" cy="70" r="1.1" opacity="0.55"/>
    <circle cx="154" cy="92" r="1.3" opacity="0.6"/>
  </g>
</svg>