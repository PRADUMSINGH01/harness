<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlass" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#16181D"/>
      <stop offset="60%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="whiteGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#8E8E93" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blurL" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- dark glass card -->
  <rect x="4" y="4" width="192" height="192" rx="20" fill="url(#bgGlass)"/>
  <rect x="4" y="4" width="192" height="192" rx="20" fill="none" stroke="url(#edge)" stroke-width="1.2"/>

  <!-- ambient glows -->
  <circle cx="128" cy="72" r="52" fill="url(#blueGlow)" opacity="0.5" filter="url(#blurL)"/>
  <circle cx="58" cy="140" r="40" fill="url(#blueGlow)" opacity="0.3" filter="url(#blurL)"/>

  <!-- large bokeh orbs -->
  <g opacity="0.6">
    <circle cx="140" cy="58" r="9" fill="#0A84FF" opacity="0.25"/>
    <circle cx="46" cy="58" r="6" fill="#8E8E93" opacity="0.18"/>
    <circle cx="164" cy="140" r="7" fill="#FFFFFF" opacity="0.12"/>
  </g>

  <!-- particle dust field -->
  <g filter="url(#softGlow)">
    <circle cx="112" cy="96" r="2.6" fill="#FFFFFF"/>
    <circle cx="96" cy="112" r="1.8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="128" cy="88" r="1.4" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="86" cy="86" r="2.0" fill="#0A84FF"/>
    <circle cx="140" cy="110" r="1.6" fill="#0A84FF" opacity="0.9"/>
    <circle cx="122" cy="126" r="1.2" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="72" cy="120" r="1.5" fill="#0A84FF" opacity="0.8"/>
    <circle cx="104" cy="70" r="1.1" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="64" cy="100" r="1.0" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="150" cy="86" r="1.0" fill="#8E8E93" opacity="0.7"/>
    <circle cx="58" cy="130" r="1.3" fill="#0A84FF" opacity="0.7"/>
    <circle cx="134" cy="142" r="1.1" fill="#FFFFFF" opacity="0.65"/>
    <circle cx="90" cy="140" r="0.9" fill="#8E8E93" opacity="0.6"/>
    <circle cx="118" cy="52" r="0.9" fill="#FFFFFF" opacity="0.55"/>
    <circle cx="76" cy="64" r="0.8" fill="#0A84FF" opacity="0.55"/>
    <circle cx="156" cy="122" r="0.8" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="44" cy="90" r="0.8" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="148" cy="156" r="0.9" fill="#0A84FF" opacity="0.5"/>
  </g>

  <!-- faint dust trails -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.28">
    <path d="M88 108 Q104 92 122 90" stroke-width="0.6"/>
    <path d="M70 126 Q92 118 112 124" stroke-width="0.5"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#8E8E93" stroke-width="1.2" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M14 24 v-8 a2 2 0 0 1 2 -2 h8"/>
    <path d="M176 14 h8 a2 2 0 0 1 2 2 v8"/>
    <path d="M186 176 v8 a2 2 0 0 1 -2 2 h-8"/>
    <path d="M24 186 h-8 a2 2 0 0 1 -2 -2 v-8"/>
  </g>

  <!-- micro ticks -->
  <g stroke="#0A84FF" stroke-width="0.8" opacity="0.5">
    <line x1="100" y1="14" x2="100" y2="18"/>
    <line x1="100" y1="182" x2="100" y2="186"/>
    <line x1="14" y1="100" x2="18" y2="100"/>
    <line x1="182" y1="100" x2="186" y2="100"/>
  </g>
</svg>