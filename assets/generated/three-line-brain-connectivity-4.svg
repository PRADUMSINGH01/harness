<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16181F" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="blueFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="redStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F43F5E"/>
      <stop offset="1" stop-color="#FF6B81"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="plotClip"><rect x="26" y="30" width="160" height="148"/></clipPath>
  </defs>

  <!-- glass card -->
  <rect x="4" y="4" width="192" height="192" rx="18" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.12" filter="url(#softShadow)"/>
  <rect x="4" y="4" width="192" height="192" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>

  <!-- header -->
  <text x="26" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#FFFFFF" fill-opacity="0.85" letter-spacing="0.6">BRAIN CONNECTIVITY</text>
  <text x="174" y="19" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="7" fill="#8E8E93" text-anchor="end">LIVE</text>
  <circle cx="180" cy="16.5" r="2" fill="#10B981" opacity="0.9"/>

  <!-- grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="0.7">
    <line x1="26" y1="54" x2="186" y2="54"/>
    <line x1="26" y1="78" x2="186" y2="78"/>
    <line x1="26" y1="102" x2="186" y2="102"/>
    <line x1="26" y1="126" x2="186" y2="126"/>
    <line x1="26" y1="150" x2="186" y2="150"/>
  </g>
  <line x1="26" y1="178" x2="186" y2="178" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
  <g stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="0.7">
    <line x1="66" y1="30" x2="66" y2="178"/>
    <line x1="106" y1="30" x2="106" y2="178"/>
    <line x1="146" y1="30" x2="146" y2="178"/>
  </g>

  <!-- y-axis ticks -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="6" fill="#8E8E93">
    <text x="22" y="56.5" text-anchor="end">80</text>
    <text x="22" y="80.5" text-anchor="end">60</text>
    <text x="22" y="104.5" text-anchor="end">40</text>
    <text x="22" y="128.5" text-anchor="end">20</text>
    <text x="22" y="152.5" text-anchor="end">10</text>
  </g>

  <g clip-path="url(#plotClip)">
    <!-- blue area -->
    <path d="M26,150 L46,140 L66,118 L86,96 L106,76 L126,58 L146,48 L166,42 L186,38 L186,178 L26,178 Z" fill="url(#blueFill)"/>
    <!-- blue line -->
    <path d="M26,150 L46,140 L66,118 L86,96 L106,76 L126,58 L146,48 L166,42 L186,38" fill="none" stroke="#0A84FF" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
    <!-- gray line -->
    <path d="M26,110 L46,112 L66,108 L86,111 L106,109 L126,112 L146,110 L166,113 L186,111" fill="none" stroke="#8E8E93" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>
    <!-- red line: dropping then flatline -->
    <path d="M26,54 L46,58 L66,64 L86,86 L106,126 L126,152 L146,164 L166,168 L186,169" fill="none" stroke="url(#redStroke)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
    <!-- flatline emphasis -->
    <line x1="146" y1="168.5" x2="186" y2="168.5" stroke="#F43F5E" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
    <!-- endpoints -->
    <circle cx="186" cy="38" r="3.2" fill="#0A84FF" filter="url(#glow)"/>
    <circle cx="186" cy="111" r="2.6" fill="#8E8E93"/>
    <circle cx="186" cy="169" r="3.2" fill="#F43F5E" filter="url(#glow)"/>
    <circle cx="146" cy="164" r="2.4" fill="#0A0A0A" stroke="#F43F5E" stroke-width="1.4"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" fill="none">
    <path d="M26,30 v-6 h6"/>
    <path d="M186,30 v-6 h-6"/>
    <path d="M26,178 v6 h6"/>
    <path d="M186,178 v6 h-6"/>
  </g>

  <!-- legend -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">
    <rect x="26" y="184" width="60" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.06"/>
    <line x1="32" y1="190" x2="40" y2="190" stroke="#0A84FF" stroke-width="2" stroke-linecap="round"/>
    <text x="44" y="192.5" fill="#FFFFFF" fill-opacity="0.8">Active</text>
    <rect x="92" y="184" width="82" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.06"/>
    <line x1="98" y1="190" x2="106" y2="190" stroke="#F43F5E" stroke-width="2" stroke-linecap="round"/>
    <text x="110" y="192.5" fill="#F43F5E">Flatline</text>
  </g>
</svg>