<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="glass" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#8E8E93" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="blueHand" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- top button -->
  <g>
    <rect x="90" y="16" width="20" height="14" rx="4" fill="#8E8E93"/>
    <rect x="94" y="28" width="12" height="10" rx="3" fill="#5A5A5E"/>
  </g>

  <!-- crown side lugs -->
  <g stroke="#8E8E93" stroke-width="6" stroke-linecap="round">
    <line x1="160" y1="52" x2="150" y2="62"/>
  </g>

  <!-- body -->
  <g filter="url(#softShadow)">
    <circle cx="100" cy="112" r="68" fill="#0A0A0A"/>
    <circle cx="100" cy="112" r="68" fill="url(#glass)"/>
    <circle cx="100" cy="112" r="68" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
  </g>

  <!-- tick marks -->
  <g stroke="#8E8E93" stroke-width="2" stroke-linecap="round">
    <line x1="100" y1="52" x2="100" y2="62"/>
    <line x1="100" y1="162" x2="100" y2="172"/>
    <line x1="40" y1="112" x2="50" y2="112"/>
    <line x1="150" y1="112" x2="160" y2="112"/>
  </g>
  <g stroke="#8E8E93" stroke-width="1.2" stroke-linecap="round" opacity="0.6">
    <line x1="66.7" y1="78.7" x2="72" y2="84"/>
    <line x1="133.3" y1="78.7" x2="128" y2="84"/>
    <line x1="66.7" y1="145.3" x2="72" y2="140"/>
    <line x1="133.3" y1="145.3" x2="128" y2="140"/>
  </g>

  <!-- center hub -->
  <circle cx="100" cy="112" r="5" fill="#0A0A0A" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.5"/>

  <!-- hand at ~40s -->
  <g transform="rotate(240 100 112)" filter="url(#glow)">
    <line x1="100" y1="112" x2="100" y2="60" stroke="url(#blueHand)" stroke-width="5" stroke-linecap="round"/>
  </g>
  <circle cx="100" cy="112" r="3" fill="#0A84FF"/>

  <!-- corner brackets -->
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M14 34 v-16 h16"/>
    <path d="M170 18 h16 v16"/>
    <path d="M186 166 v16 h-16"/>
    <path d="M30 182 h-16 v-16"/>
  </g>
</svg>