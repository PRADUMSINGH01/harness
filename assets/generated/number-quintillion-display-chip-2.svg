<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="chipBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1C22"/>
      <stop offset="0.55" stop-color="#0E1015"/>
      <stop offset="1" stop-color="#07080B"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blueEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="chipShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- ambient glow -->
  <ellipse cx="100" cy="96" rx="86" ry="80" fill="url(#blueGlow)"/>

  <!-- chip pins -->
  <g stroke="#8E8E93" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="86" y1="12" x2="86" y2="30"/><line x1="100" y1="12" x2="100" y2="30"/><line x1="114" y1="12" x2="114" y2="30"/>
    <line x1="86" y1="170" x2="86" y2="188"/><line x1="100" y1="170" x2="100" y2="188"/><line x1="114" y1="170" x2="114" y2="188"/>
    <line x1="12" y1="86" x2="30" y2="86"/><line x1="12" y1="100" x2="30" y2="100"/><line x1="12" y1="114" x2="30" y2="114"/>
    <line x1="170" y1="86" x2="188" y2="86"/><line x1="170" y1="100" x2="188" y2="100"/><line x1="170" y1="114" x2="188" y2="114"/>
  </g>

  <!-- chip body -->
  <g filter="url(#chipShadow)">
    <rect x="30" y="30" width="140" height="140" rx="22" fill="url(#chipBody)" stroke="#2A2D34" stroke-width="1.5"/>
    <rect x="30" y="30" width="140" height="140" rx="22" fill="url(#glassSheen)"/>
    <rect x="33.5" y="33.5" width="133" height="133" rx="19" fill="none" stroke="url(#blueEdge)" stroke-width="1.2" opacity="0.55"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M44 54 V44 H54"/>
    <path d="M156 54 V44 H146"/>
    <path d="M44 146 V156 H54"/>
    <path d="M156 146 V156 H146"/>
  </g>

  <!-- inner display panel -->
  <rect x="48" y="52" width="104" height="62" rx="10" fill="#05070C" stroke="#23262D" stroke-width="1"/>
  <text x="100" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" filter="url(#softGlow)">43</text>

  <!-- label -->
  <text x="100" y="134" text-anchor="middle" font-family="'SF Mono', 'Cascadia Mono', Consolas, monospace" font-size="9" letter-spacing="3.5" fill="#8E8E93">QUINTILLION</text>

  <!-- accent line + status dot -->
  <line x1="56" y1="148" x2="144" y2="148" stroke="#23262D" stroke-width="1"/>
  <circle cx="126" cy="158" r="2.5" fill="#0A84FF" filter="url(#softGlow)"/>
  <g stroke="#3A3E46" stroke-width="1" opacity="0.8">
    <line x1="56" y1="155" x2="56" y2="161"/>
    <line x1="64" y1="155" x2="64" y2="161"/>
    <line x1="72" y1="155" x2="72" y2="161"/>
    <line x1="80" y1="155" x2="80" y2="161"/>
  </g>
  <g fill="#8E8E93" opacity="0.9">
    <circle cx="40" cy="40" r="1"/>
    <circle cx="160" cy="40" r="1"/>
    <circle cx="40" cy="160" r="1"/>
    <circle cx="160" cy="160" r="1"/>
  </g>
</svg>