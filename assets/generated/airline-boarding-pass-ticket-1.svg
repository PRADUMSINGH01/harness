<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1F26"/>
      <stop offset="0.55" stop-color="#12151C"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="stampShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- ambient glow -->
  <ellipse cx="100" cy="105" rx="90" ry="70" fill="url(#glow)"/>

  <!-- ticket body -->
  <g filter="url(#soft)">
    <rect x="18" y="42" width="164" height="116" rx="10" fill="url(#glass)" stroke="url(#edge)" stroke-width="1"/>
    <rect x="18" y="42" width="164" height="116" rx="10" fill="url(#grid)"/>
    <!-- header strip -->
    <rect x="18" y="42" width="164" height="22" rx="10" fill="#0A84FF" fill-opacity="0.14"/>
    <text x="28" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="2" fill="#FFFFFF" fill-opacity="0.95">BOARDING PASS</text>
    <text x="172" y="57" font-family="'SF Mono', Menlo, monospace" font-size="7" text-anchor="end" fill="#0A84FF">SKY-2025</text>

    <!-- main section divider (perforation) -->
    <line x1="126" y1="64" x2="126" y2="158" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="0.8" stroke-dasharray="2.5 2.5"/>

    <!-- route -->
    <text x="30" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">SFO</text>
    <text x="30" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6" fill="#8E8E93">SAN FRANCISCO</text>
    <path d="M78 88 L104 88" stroke="#0A84FF" stroke-width="1.2" stroke-dasharray="3 2"/>
    <path d="M104 88 L98 84.5 L98 91.5 Z" fill="#0A84FF"/>
    <circle cx="78" cy="88" r="1.6" fill="#0A84FF"/>
    <text x="91" y="82" font-family="'SF Mono', Menlo, monospace" font-size="5.5" text-anchor="middle" fill="#8E8E93">5h 48m</text>
    <text x="126" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">NRT</text>

    <!-- flight / date / gate row -->
    <g font-family="'SF Mono', Menlo, monospace" font-size="5.5" fill="#8E8E93">
      <text x="30" y="118">FLIGHT</text>
      <text x="30" y="126" fill="#FFFFFF" font-size="7">SA 114</text>
      <text x="66" y="118">DATE</text>
      <text x="66" y="126" fill="#FFFFFF" font-size="7">09 JUN</text>
      <text x="98" y="118">GATE</text>
      <text x="98" y="126" fill="#FFFFFF" font-size="7">B7</text>
    </g>

    <!-- seat 14A emphasis -->
    <rect x="30" y="132" width="34" height="18" rx="4" fill="#0A84FF" fill-opacity="0.16" stroke="#0A84FF" stroke-width="0.8"/>
    <text x="35" y="141" font-family="'SF Mono', Menlo, monospace" font-size="5" fill="#8E8E93">SEAT</text>
    <text x="62" y="147" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#0A84FF" text-anchor="end">14A</text>

    <!-- gate stamp -->
    <g transform="translate(76,144) rotate(-8)" filter="url(#stampShadow)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#0A84FF" stroke-opacity="0.85" stroke-width="1.3"/>
      <circle cx="0" cy="0" r="9" fill="none" stroke="#0A84FF" stroke-opacity="0.6" stroke-width="0.6"/>
      <text x="0" y="-1" font-family="'SF Mono', Menlo, monospace" font-size="4.5" font-weight="700" text-anchor="middle" fill="#0A84FF">GATE</text>
      <text x="0" y="5" font-family="'SF Mono', Menlo, monospace" font-size="5" font-weight="700" text-anchor="middle" fill="#0A84FF">B7 ✓</text>
    </g>

    <!-- barcode -->
    <g fill="#FFFFFF">
      <rect x="138" y="104" width="1.6" height="42"/>
      <rect x="141" y="104" width="0.8" height="42"/>
      <rect x="143.5" y="104" width="2" height="42"/>
      <rect x="147" y="104" width="1" height="42"/>
      <rect x="149.5" y="104" width="0.8" height="42"/>
      <rect x="152" y="104" width="1.8" height="42"/>
      <rect x="155.5" y="104" width="1" height="42"/>
      <rect x="158" y="104" width="0.8" height="42"/>
      <rect x="160.5" y="104" width="2" height="42"/>
      <rect x="164" y="104" width="1.2" height="42"/>
      <rect x="166.5" y="104" width="0.8" height="42"/>
      <rect x="169" y="104" width="1.6" height="42"/>
      <rect x="172.5" y="104" width="1" height="42"/>
      <rect x="175" y="104" width="1.8" height="42"/>
    </g>
    <text x="157" y="153" font-family="'SF Mono', Menlo, monospace" font-size="4.5" text-anchor="middle" fill="#8E8E93">SA114·14A·NRT</text>
  </g>

  <!-- punch hole at perforation -->
  <circle cx="126" cy="42" r="3" fill="#0A0A0A" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.6"/>
  <circle cx="126" cy="158" r="3" fill="#0A0A0A" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.6"/>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M10 34 v-8 h8"/>
    <path d="M190 34 v-8 h-8"/>
    <path d="M10 166 v8 h8"/>
    <path d="M190 166 v8 h-8"/>
  </g>
</svg>