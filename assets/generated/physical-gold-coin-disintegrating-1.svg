<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="glassBg" cx="45%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#141821"/>
      <stop offset="60%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="goldFace" cx="38%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="45%" stop-color="#F5C242"/>
      <stop offset="80%" stop-color="#B07D1E"/>
      <stop offset="100%" stop-color="#7A5310"/>
    </radialGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="50%" stop-color="#C8922A"/>
      <stop offset="100%" stop-color="#6B4A0E"/>
    </linearGradient>
    <linearGradient id="bluePix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6FB8FF"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="104" height="200"/>
    </clipPath>
    <mask id="crumble">
      <rect x="0" y="0" width="200" height="200" fill="white"/>
      <g fill="black">
        <rect x="100" y="46" width="12" height="12"/>
        <rect x="114" y="58" width="10" height="10"/>
        <rect x="122" y="44" width="8" height="8"/>
        <rect x="108" y="72" width="14" height="14"/>
        <rect x="124" y="66" width="12" height="12"/>
        <rect x="138" y="56" width="9" height="9"/>
        <rect x="118" y="88" width="16" height="16"/>
        <rect x="136" y="80" width="13" height="13"/>
        <rect x="150" y="70" width="10" height="10"/>
        <rect x="126" y="106" width="14" height="14"/>
        <rect x="142" y="98" width="16" height="16"/>
        <rect x="134" y="118" width="11" height="11"/>
        <rect x="112" y="120" width="13" height="13"/>
        <rect x="100" y="104" width="10" height="10"/>
        <rect x="98" y="80" width="8" height="8"/>
        <rect x="150" y="90" width="8" height="8"/>
        <rect x="146" y="122" width="9" height="9"/>
        <rect x="158" y="80" width="6" height="6"/>
      </g>
    </mask>
  </defs>

  <!-- dark glass background -->
  <rect width="200" height="200" fill="url(#glassBg)"/>
  <rect x="0.5" y="0.5" width="199" height="199" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- corner brackets -->
  <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.4" fill="none">
    <path d="M8 18 V8 H18"/>
    <path d="M182 8 H192 V18"/>
    <path d="M192 182 V192 H182"/>
    <path d="M18 192 H8 V182"/>
  </g>

  <!-- coin shadow -->
  <ellipse cx="92" cy="158" rx="52" ry="9" fill="#000000" opacity="0.55" filter="url(#glow)"/>

  <!-- gold edge (rim) -->
  <g filter="url(#softShadow)">
    <circle cx="92" cy="100" r="56" fill="url(#goldEdge)"/>
    <!-- coin face with crumble mask -->
    <g mask="url(#crumble)">
      <circle cx="92" cy="100" r="49" fill="url(#goldFace)"/>
      <circle cx="92" cy="100" r="42" fill="none" stroke="#8A6212" stroke-opacity="0.55" stroke-width="1.6" stroke-dasharray="3 3"/>
      <!-- currency mark -->
      <text x="92" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="48" fill="#6B4A0E" opacity="0.85">$</text>
      <!-- sheen -->
      <ellipse cx="74" cy="76" rx="26" ry="14" fill="#FFFFFF" opacity="0.28" transform="rotate(-24 74 76)"/>
    </g>
  </g>

  <!-- gold pixel fragments breaking away -->
  <g>
    <rect x="104" y="48" width="10" height="10" fill="#F5C242" transform="rotate(12 109 53)"/>
    <rect x="118" y="62" width="8" height="8" fill="#E0AE32" transform="rotate(-15 122 66)"/>
    <rect x="112" y="78" width="11" height="11" fill="#F5C242" transform="rotate(8 117.5 83.5)"/>
    <rect x="128" y="70" width="9" height="9" fill="#C8922A" transform="rotate(20 132.5 74.5)"/>
    <rect x="122" y="94" width="12" height="12" fill="#F0BC3B" transform="rotate(-10 128 100)"/>
    <rect x="140" y="84" width="10" height="10" fill="#E0AE32" transform="rotate(16 145 89)"/>
    <rect x="130" y="110" width="10" height="10" fill="#F5C242" transform="rotate(-18 135 115)"/>
    <rect x="116" y="124" width="9" height="9" fill="#C8922A" transform="rotate(14 120.5 128.5)"/>
    <rect x="146" y="102" width="8" height="8" fill="#E0AE32" transform="rotate(24 150 106)"/>
    <rect x="104" y="108" width="7" height="7" fill="#D8A52F" transform="rotate(-8 107.5 111.5)"/>
  </g>

  <!-- sapphire blue digital pixels drifting -->
  <g filter="url(#glow)">
    <rect x="152" y="66" width="9" height="9" fill="url(#bluePix)"/>
    <rect x="164" y="82" width="7" height="7" fill="#0A84FF"/>
    <rect x="158" y="96" width="10" height="10" fill="url(#bluePix)"/>
    <rect x="150" y="116" width="7" height="7" fill="#0A84FF"/>
    <rect x="168" y="108" width="8" height="8" fill="#6FB8FF"/>
    <rect x="176" y="92" width="5" height="5" fill="#0A84FF" opacity="0.85"/>
    <rect x="172" y="122" width="6" height="6" fill="#6FB8FF" opacity="0.8"/>
    <rect x="184" y="102" width="4" height="4" fill="#0A84FF" opacity="0.7"/>
    <rect x="180" y="74" width="4" height="4" fill="#6FB8FF" opacity="0.6"/>
    <rect x="156" y="130" width="5" height="5" fill="#0A84FF" opacity="0.75"/>
  </g>

  <!-- faint motion streaks -->
  <g stroke="#0A84FF" stroke-width="1" stroke-opacity="0.35" stroke-linecap="round">
    <line x1="164" y1="70" x2="172" y2="66"/>
    <line x1="168" y1="88" x2="178" y2="84"/>
    <line x1="160" y1="112" x2="170" y2="108"/>
    <line x1="176" y1="118" x2="184" y2="114"/>
  </g>

  <!-- gray neutral pixels -->
  <g fill="#8E8E93">
    <rect x="146" y="50" width="5" height="5" opacity="0.8"/>
    <rect x="168" y="58" width="4" height="4" opacity="0.6"/>
    <rect x="138" y="126" width="5" height="5" opacity="0.7"/>
    <rect x="162" y="134" width="4" height="4" opacity="0.55"/>
    <rect x="110" y="40" width="4" height="4" opacity="0.6"/>
  </g>

  <!-- technical ticks -->
  <g stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1">
    <line x1="20" y1="192" x2="60" y2="192"/>
    <line x1="20" y1="188" x2="20" y2="196"/>
    <line x1="40" y1="189" x2="40" y2="195"/>
    <line x1="60" y1="189" x2="60" y2="195"/>
  </g>
  <text x="182" y="194" text-anchor="end" font-family="Menlo, 'Courier New', monospace" font-size="7" fill="#8E8E93" opacity="0.7">DIGITIZE</text>
</svg>