<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15161A" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="dia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#8E8E93"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="rclip"><rect x="0" y="0" width="200" height="200" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#rclip)">
    <rect width="200" height="200" fill="#0A0A0A"/>
    <rect width="200" height="200" fill="url(#glass)"/>

    <!-- faint grid -->
    <g stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="0.5">
      <path d="M0 50H200M0 100H200M0 150H200M50 0V200M100 0V200M150 0V200"/>
    </g>

    <!-- header -->
    <g filter="url(#soft)">
      <path d="M100 12 L106 18 L112 12 L118 20 L100 34 L82 20 L88 12 L94 18 Z" fill="url(#dia)" filter="url(#glow)"/>
      <text x="100" y="46" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF" letter-spacing="2.5">ANTWERP DIAMOND HEIST</text>
      <text x="100" y="55" text-anchor="middle" font-size="5.5" fill="#8E8E93" letter-spacing="1.8">FORENSIC CASE FILE · FEBRUARY 2003</text>
    </g>

    <!-- hero metric -->
    <g filter="url(#soft)">
      <rect x="12" y="62" width="88" height="44" rx="8" fill="#0A84FF" fill-opacity="0.10" stroke="#0A84FF" stroke-opacity="0.55" stroke-width="0.8"/>
      <text x="56" y="84" text-anchor="middle" font-size="17" font-weight="800" fill="#0A84FF" filter="url(#glow)">$100,000,000+</text>
      <text x="56" y="98" text-anchor="middle" font-size="5.8" fill="#8E8E93" letter-spacing="1.4">LOOT STOLEN — LARGEST IN HISTORY</text>
    </g>

    <!-- donut gauge: security layers compromised -->
    <g transform="translate(140,84)" filter="url(#soft)">
      <circle r="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="7"/>
      <circle r="26" fill="none" stroke="url(#blue)" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="163.36 163.36" stroke-dashoffset="16.34" transform="rotate(-90)"
        filter="url(#glow)"/>
      <text y="-1" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">9/10</text>
      <text y="8" text-anchor="middle" font-size="4.6" fill="#8E8E93" letter-spacing="0.8">LAYERS BYPASSED</text>
      <g font-size="3.6" fill="#8E8E93" text-anchor="end">
        <text x="-32" y="-14">◦ INFRARED HEAT</text>
        <text x="-32" y="-7">◦ DOPPLER RADAR</text>
        <text x="-32" y="0">◦ MAGNETIC SEALS</text>
        <text x="-32" y="7">◦ SEISMIC GRID</text>
        <text x="-32" y="14">◦ OLFACTIVE SENSOR</text>
      </g>
    </g>

    <!-- bottom stat cards -->
    <g filter="url(#soft)" font-weight="800" fill="#FFFFFF">
      <rect x="12" y="116" width="55" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="0.7"/>
      <text x="39.5" y="134" text-anchor="middle" font-size="12">2</text>
      <text x="39.5" y="144" text-anchor="middle" font-size="4.8" font-weight="500" fill="#8E8E93" letter-spacing="0.6">FLOORS BELOW GROUND</text>

      <rect x="72.5" y="116" width="55" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="0.7"/>
      <text x="100" y="134" text-anchor="middle" font-size="12">10</text>
      <text x="100" y="144" text-anchor="middle" font-size="4.8" font-weight="500" fill="#8E8E93" letter-spacing="0.6">SECURITY LAYERS</text>

      <rect x="133" y="116" width="55" height="34" rx="8" fill="#F43F5E" fill-opacity="0.08" stroke="#F43F5E" stroke-opacity="0.5" stroke-width="0.7"/>
      <text x="160.5" y="134" text-anchor="middle" font-size="12" fill="#F43F5E" filter="url(#glow)">0</text>
      <text x="160.5" y="144" text-anchor="middle" font-size="4.8" font-weight="500" fill="#8E8E93" letter-spacing="0.6">ALARMS TRIGGERED</text>
    </g>

    <!-- timeline bar 24s -->
    <g>
      <rect x="12" y="160" width="176" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="12" y="160" width="132" height="5" rx="2.5" fill="url(#blue)"/>
      <circle cx="144" cy="162.5" r="3.2" fill="#FFFFFF" filter="url(#glow)"/>
      <text x="12" y="174" font-size="4.6" fill="#8E8E93" letter-spacing="1">00:00</text>
      <text x="188" y="174" text-anchor="end" font-size="4.6" fill="#8E8E93" letter-spacing="1">00:24</text>
      <text x="144" y="174" text-anchor="middle" font-size="4.6" fill="#0A84FF" letter-spacing="1">VAULT BREACH</text>
    </g>

    <!-- corner brackets -->
    <g stroke="#0A84FF" stroke-opacity="0.6" stroke-width="1.2" fill="none">
      <path d="M8 20V9H19M192 20V9H181M8 180v11h11M192 180v11h-11"/>
    </g>
  </g>
</svg>