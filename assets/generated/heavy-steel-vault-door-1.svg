<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="glassBg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#16181d"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4d55"/>
      <stop offset="35%" stop-color="#8E8E93"/>
      <stop offset="55%" stop-color="#5a5d66"/>
      <stop offset="100%" stop-color="#33363e"/>
    </linearGradient>
    <linearGradient id="steelRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9a9da5"/>
      <stop offset="50%" stop-color="#3d4048"/>
      <stop offset="100%" stop-color="#7f828a"/>
    </linearGradient>
    <linearGradient id="doorFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3d45"/>
      <stop offset="50%" stop-color="#5b5e67"/>
      <stop offset="100%" stop-color="#2c2e35"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e9ec"/>
      <stop offset="50%" stop-color="#9a9da5"/>
      <stop offset="100%" stop-color="#55585f"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="18" fill="url(#glassBg)"/>
  <rect x="1" y="1" width="198" height="198" rx="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- vault frame -->
  <g filter="url(#drop)">
    <rect x="18" y="16" width="164" height="168" rx="10" fill="url(#steelRing)" stroke="#0A0A0A" stroke-width="2"/>
    <rect x="24" y="22" width="152" height="156" rx="7" fill="#0A0A0A"/>
    <!-- frame bolts -->
    <g fill="url(#chrome)" stroke="#0A0A0A" stroke-width="0.6">
      <circle cx="31" cy="29" r="2.4"/><circle cx="100" cy="29" r="2.4"/><circle cx="169" cy="29" r="2.4"/>
      <circle cx="31" cy="171" r="2.4"/><circle cx="100" cy="171" r="2.4"/><circle cx="169" cy="171" r="2.4"/>
      <circle cx="31" cy="100" r="2.4"/><circle cx="169" cy="100" r="2.4"/>
    </g>
  </g>

  <!-- door face -->
  <g filter="url(#drop)">
    <circle cx="100" cy="100" r="70" fill="url(#doorFace)" stroke="#0A0A0A" stroke-width="3"/>
    <circle cx="100" cy="100" r="63" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
    <circle cx="100" cy="100" r="70" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.2"/>
  </g>

  <!-- brushed steel arc detail -->
  <path d="M 48 70 A 62 62 0 0 1 152 70" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="10" stroke-linecap="round" filter="url(#soft)"/>

  <!-- outer bolt ring: 8 bolts -->
  <g fill="url(#chrome)" stroke="#0A0A0A" stroke-width="0.7">
    <circle cx="100" cy="41" r="4"/><circle cx="145.3" cy="54.7" r="4"/><circle cx="159" cy="100" r="4"/><circle cx="145.3" cy="145.3" r="4"/>
    <circle cx="100" cy="159" r="4"/><circle cx="54.7" cy="145.3" r="4"/><circle cx="41" cy="100" r="4"/><circle cx="54.7" cy="54.7" r="4"/>
  </g>
  <g stroke="#0A0A0A" stroke-opacity="0.8" stroke-width="0.8">
    <line x1="97.5" y1="38.5" x2="102.5" y2="43.5"/><line x1="102.5" y1="38.5" x2="97.5" y2="43.5"/>
    <line x1="97.5" y1="156.5" x2="102.5" y2="161.5"/><line x1="102.5" y1="156.5" x2="97.5" y2="161.5"/>
    <line x1="38.5" y1="97.5" x2="43.5" y2="102.5"/><line x1="38.5" y1="102.5" x2="43.5" y2="97.5"/>
    <line x1="156.5" y1="97.5" x2="161.5" y2="102.5"/><line x1="156.5" y1="102.5" x2="161.5" y2="97.5"/>
  </g>

  <!-- spoke ring -->
  <circle cx="100" cy="100" r="36" fill="none" stroke="url(#steelRing)" stroke-width="6"/>
  <circle cx="100" cy="100" r="39" fill="none" stroke="#0A0A0A" stroke-opacity="0.7" stroke-width="1"/>
  <circle cx="100" cy="100" r="33" fill="none" stroke="#0A0A0A" stroke-opacity="0.7" stroke-width="1"/>

  <!-- spokes -->
  <g stroke="url(#chrome)" stroke-width="5.5" stroke-linecap="round">
    <line x1="100" y1="100" x2="100" y2="58"/>
    <line x1="100" y1="100" x2="134.7" y2="79"/>
    <line x1="100" y1="100" x2="134.7" y2="121"/>
    <line x1="100" y1="100" x2="100" y2="142"/>
    <line x1="100" y1="100" x2="65.3" y2="121"/>
    <line x1="100" y1="100" x2="65.3" y2="79"/>
  </g>
  <!-- spoke end knobs -->
  <g fill="url(#chrome)" stroke="#0A0A0A" stroke-width="0.7">
    <circle cx="100" cy="58" r="4.4"/><circle cx="134.7" cy="79" r="4.4"/><circle cx="134.7" cy="121" r="4.4"/>
    <circle cx="100" cy="142" r="4.4"/><circle cx="65.3" cy="121" r="4.4"/><circle cx="65.3" cy="79" r="4.4"/>
  </g>

  <!-- blue glow behind hub -->
  <circle cx="100" cy="100" r="20" fill="url(#blueGlow)" opacity="0.75"/>

  <!-- central hub -->
  <circle cx="100" cy="100" r="14" fill="url(#steel)" stroke="#0A0A0A" stroke-width="2"/>
  <circle cx="100" cy="100" r="14" fill="none" stroke="#0A84FF" stroke-opacity="0.5" stroke-width="1.2"/>
  <circle cx="100" cy="100" r="7" fill="#0A0A0A" stroke="#0A84FF" stroke-opacity="0.8" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="2.4" fill="#0A84FF"/>

  <!-- dial accents -->
  <g>
    <circle cx="100" cy="100" r="26" fill="none" stroke="#0A84FF" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 4"/>
    <line x1="100" y1="72" x2="100" y2="78" stroke="#0A84FF" stroke-width="2"/>
    <line x1="128" y1="100" x2="122" y2="100" stroke="#0A84FF" stroke-opacity="0.6" stroke-width="1.5"/>
    <line x1="100" y1="128" x2="100" y2="122" stroke="#0A84FF" stroke-opacity="0.6" stroke-width="1.5"/>
    <line x1="72" y1="100" x2="78" y2="100" stroke="#0A84FF" stroke-opacity="0.6" stroke-width="1.5"/>
  </g>

  <!-- hinges -->
  <g fill="url(#steel)" stroke="#0A0A0A" stroke-width="1.5">
    <rect x="10" y="58" width="16" height="22" rx="4"/>
    <rect x="10" y="120" width="16" height="22" rx="4"/>
  </g>
  <g stroke="#8E8E93" stroke-width="1.4">
    <line x1="13" y1="62" x2="13" y2="76"/><line x1="13" y1="124" x2="13" y2="138"/>
  </g>

  <!-- glass sheen -->
  <path d="M 60 44 A 66 66 0 0 1 140 44" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M 46 128 A 62 62 0 0 0 92 158" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="5" stroke-linecap="round" filter="url(#soft)"/>

  <!-- corner brackets -->
  <g stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <path d="M 12 24 v-8 h8"/><path d="M 180 24 v-8 h-8"/>
    <path d="M 12 176 v8 h8"/><path d="M 180 176 v8 h-8"/>
  </g>
</svg>