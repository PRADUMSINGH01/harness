<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.53  0 0 0 0 0.5  0 0 0 0.28 0" result="grain"/>
      <feComposite in="grain" in2="SourceGraphic" operator="over"/>
    </filter>
    <filter id="smudgeBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="paperTone" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#26292F"/>
      <stop offset="60%" stop-color="#16181D"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </radialGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="inkFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8E8E93" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="fiberHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
      <line x1="0" y1="1" x2="6" y2="1" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="0.4"/>
    </pattern>
  </defs>

  <!-- Dark glass paper base -->
  <rect x="0" y="0" width="200" height="200" fill="url(#paperTone)"/>
  <rect x="0" y="0" width="200" height="200" fill="url(#fiberHatch)"/>

  <!-- Faint archival ink smudges -->
  <g filter="url(#smudgeBlur)">
    <ellipse cx="58" cy="46" rx="24" ry="14" fill="#FFFFFF" opacity="0.05" transform="rotate(-18 58 46)"/>
    <ellipse cx="148" cy="72" rx="18" ry="26" fill="#8E8E93" opacity="0.06" transform="rotate(24 148 72)"/>
    <ellipse cx="92" cy="150" rx="34" ry="12" fill="#FFFFFF" opacity="0.04" transform="rotate(-8 92 150)"/>
    <path d="M120 110 C 130 96, 152 100, 156 116 C 158 128, 142 134, 132 126 C 124 120, 122 116, 120 110 Z" fill="#8E8E93" opacity="0.05"/>
  </g>

  <!-- Faint handwritten-style ink strokes -->
  <g stroke="url(#inkFade)" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M28 34 C 40 28, 52 40, 66 32 C 74 27, 82 34, 90 30" stroke-width="1.1"/>
    <path d="M120 32 C 132 28, 140 40, 154 34 C 162 31, 168 36, 174 32" stroke-width="0.9"/>
    <path d="M26 168 C 42 162, 54 174, 72 166 C 84 161, 96 172, 112 164" stroke-width="1.0"/>
    <circle cx="156" cy="152" r="9" stroke-width="0.8"/>
  </g>

  <!-- Ink blot accent -->
  <g filter="url(#softGlow)" opacity="0.55">
    <circle cx="44" cy="108" r="2.4" fill="#0A84FF"/>
    <circle cx="49.5" cy="112" r="1.2" fill="#0A84FF"/>
    <circle cx="40" cy="113" r="0.9" fill="#0A84FF"/>
  </g>

  <!-- Dark glass panel overlay -->
  <rect x="8" y="8" width="184" height="184" rx="10" fill="url(#glassSheen)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Corner brackets -->
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M14 24 V15 A1 1 0 0 1 15 14 H24"/>
    <path d="M176 14 H185 A1 1 0 0 1 186 15 V24"/>
    <path d="M186 176 V185 A1 1 0 0 1 185 186 H176"/>
    <path d="M24 186 H15 A1 1 0 0 1 14 185 V176"/>
  </g>

  <!-- Technical micro-details -->
  <g fill="#8E8E93" opacity="0.5">
    <rect x="14" y="192" width="30" height="1.6" rx="0.8"/>
    <rect x="48" y="192" width="10" height="1.6" rx="0.8"/>
    <rect x="62" y="192" width="18" height="1.6" rx="0.8"/>
  </g>
  <circle cx="186" cy="14" r="1.6" fill="#0A84FF" opacity="0.8"/>
  <g stroke="#0A84FF" stroke-opacity="0.45" stroke-width="0.6">
    <line x1="100" y1="8" x2="100" y2="12"/>
    <line x1="8" y1="100" x2="12" y2="100"/>
    <line x1="188" y1="100" x2="192" y2="100"/>
    <line x1="100" y1="188" x2="100" y2="192"/>
  </g>

  <!-- Paper grain layer -->
  <rect x="0" y="0" width="200" height="200" filter="url(#paperGrain)" fill="#0A0A0A" opacity="0.9"/>
  <rect x="0" y="0" width="200" height="200" fill="#0A0A0A" opacity="0.0"/>
</svg>