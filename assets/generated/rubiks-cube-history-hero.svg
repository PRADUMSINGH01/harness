<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1D26" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="blueFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EB2FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="grayFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9BCC1"/>
      <stop offset="1" stop-color="#8E8E93"/>
    </linearGradient>
    <linearGradient id="whiteFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDE2E8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- glass card -->
  <rect x="12" y="12" width="176" height="176" rx="24" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <rect x="12.5" y="12.5" width="175" height="175" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M22 34 V26 a4 4 0 0 1 4 -4 H34"/>
    <path d="M166 22 H174 a4 4 0 0 1 4 4 V34"/>
    <path d="M178 166 V174 a4 4 0 0 1 -4 4 H166"/>
    <path d="M34 178 H26 a4 4 0 0 1 -4 -4 V166"/>
  </g>

  <!-- ambient glow -->
  <ellipse cx="100" cy="120" rx="55" ry="30" fill="#0A84FF" opacity="0.18" filter="url(#glow)"/>

  <!-- Rubik's cube: isometric 3x3 -->
  <g filter="url(#softShadow)">
    <!-- top face (white) : origin at cube apex (100,52) -->
    <g>
      <!-- rows along right axis (dx=+16,+8 up), left axis (dx=-16,+8 up) -->
      <!-- grid: tiles via parallelograms, side s=19 -->
      <!-- right unit r=(19,9.5), left unit l=(-19,9.5) -->
      <!-- top face tiles -->
      <g fill="url(#whiteFace)" stroke="#0A0A0A" stroke-width="1.6" stroke-linejoin="round">
        <!-- column i (right), row j (left) -->
        <!-- precomputed: tile(i,j) M = apex + i*r + j*l -->
        <path d="M100 52 l19 9.5 l-19 9.5 l-19 -9.5 Z"/>
        <path d="M81 61.5 l19 9.5 l-19 9.5 l-19 -9.5 Z"/>
        <path d="M62 71 l19 9.5 l-19 9.5 l-19 -9.5 Z"/>
        <path d="M119 61.5 l19 9.5 l-19 9.5 l-19 -9.5 Z"/>
        <path d="M100 71 l19 9.5 l-19 9.5 l-19 -9.5 Z"/>
        <path d="M81 80.5 l19 9.5 l-19 9.5 l-19 -9.5 Z"/>
        <path d="M138 71 l19 9.5 l-19 9.5 l-19 -9.5 Z"/>
        <path d="M119 80.5 l19 9.5 l-19 9.5 l-19 -9.5 Z"/>
        <path d="M100 90 l19 9.5 l-19 9.5 l-19 -9.5 Z"/>
      </g>
    </g>

    <!-- left face (blue) : below-left, unit down d=(0,19) -->
    <g fill="url(#blueFace)" stroke="#0A0A0A" stroke-width="1.6" stroke-linejoin="round">
      <!-- left face origin corner: (62,80.5) top-left -->
      <path d="M62 80.5 l19 9.5 v19 l-19 -9.5 Z"/>
      <path d="M81 90 l19 9.5 v19 l-19 -9.5 Z"/>
      <path d="M100 99.5 l19 9.5 v19 l-19 -9.5 Z"/>
      <path d="M62 99.5 l19 9.5 v19 l-19 -9.5 Z"/>
      <path d="M81 109 l19 9.5 v19 l-19 -9.5 Z"/>
      <path d="M100 118.5 l19 9.5 v19 l-19 -9.5 Z"/>
      <path d="M62 118.5 l19 9.5 v19 l-19 -9.5 Z"/>
      <path d="M81 128 l19 9.5 v19 l-19 -9.5 Z"/>
      <path d="M100 137.5 l19 9.5 v19 l-19 -9.5 Z"/>
    </g>

    <!-- right face (gray) -->
    <g fill="url(#grayFace)" stroke="#0A0A0A" stroke-width="1.6" stroke-linejoin="round">
      <path d="M138 80.5 l-19 9.5 v19 l19 -9.5 Z"/>
      <path d="M119 90 l-19 9.5 v19 l19 -9.5 Z"/>
      <path d="M100 99.5 l-19 9.5 v19 l19 -9.5 Z"/>
      <path d="M138 99.5 l-19 9.5 v19 l19 -9.5 Z"/>
      <path d="M119 109 l-19 9.5 v19 l19 -9.5 Z"/>
      <path d="M100 118.5 l-19 9.5 v19 l19 -9.5 Z"/>
      <path d="M138 118.5 l-19 9.5 v19 l19 -9.5 Z"/>
      <path d="M119 128 l-19 9.5 v19 l19 -9.5 Z"/>
      <path d="M100 137.5 l-19 9.5 v19 l19 -9.5 Z"/>
    </g>
  </g>

  <!-- accent edge highlight -->
  <path d="M100 52 L157 80.5 L100 109 L43 80.5 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
  <path d="M62 80.5 V156.5 M138 80.5 V156.5" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>

  <!-- micro details: crosshair + ticks -->
  <g stroke="#8E8E93" stroke-width="1" opacity="0.7">
    <circle cx="32" cy="160" r="5" fill="none"/>
    <path d="M32 152 V168 M24 160 H40"/>
  </g>
  <g stroke="#8E8E93" stroke-width="1" opacity="0.5">
    <path d="M160 158 h8 M160 162 h5 M160 166 h8"/>
  </g>
  <circle cx="100" cy="40" r="2" fill="#0A84FF" filter="url(#glow)"/>
</svg>