<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1F26"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="leverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#D6D9DE"/>
      <stop offset="1" stop-color="#8E8E93"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blueGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- base plate -->
  <rect x="40" y="46" width="120" height="112" rx="16" fill="url(#panelGrad)" stroke="#8E8E93" stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="40" y="46" width="120" height="112" rx="16" fill="url(#sheen)"/>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-opacity="0.6" stroke-width="1.5" fill="none">
    <path d="M46 60 v-8 a6 6 0 0 1 6-6 h8"/>
    <path d="M154 60 v-8 a6 6 0 0 0 -6-6 h-8"/>
    <path d="M46 144 v8 a6 6 0 0 0 6 6 h8"/>
    <path d="M154 144 v8 a6 6 0 0 1 -6 6 h-8"/>
  </g>

  <!-- screw details -->
  <g fill="#8E8E93" fill-opacity="0.5">
    <circle cx="52" cy="58" r="2.5"/><circle cx="148" cy="58" r="2.5"/>
    <circle cx="52" cy="146" r="2.5"/><circle cx="148" cy="146" r="2.5"/>
  </g>

  <!-- labels -->
  <text x="100" y="76" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" letter-spacing="2.5" fill="#0A84FF" filter="url(#blueGlow)">MEMORY WRITE ON</text>
  <text x="100" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" letter-spacing="2.5" fill="#8E8E93" fill-opacity="0.5">OFF</text>

  <!-- toggle slot -->
  <rect x="76" y="84" width="48" height="34" rx="17" fill="#050505" stroke="#8E8E93" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- illuminated half (ON side, top) -->
  <path d="M93 84 a17 17 0 0 0 -17 17 v0 a17 17 0 0 0 17 17 h14 a17 17 0 0 0 17 -17 v0 a17 17 0 0 0 -17 -17 z" fill="url(#glowGrad)" opacity="0.85"/>

  <!-- lever knob (up/ON position) -->
  <g filter="url(#softShadow)">
    <line x1="100" y1="101" x2="100" y2="86" stroke="#C7CBD1" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="86" r="11" fill="url(#leverGrad)" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="100" cy="86" r="11" fill="url(#sheen)"/>
    <ellipse cx="97" cy="82.5" rx="4.5" ry="2.5" fill="#FFFFFF" fill-opacity="0.7"/>
  </g>

  <!-- micro ticks beside slot -->
  <g stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="68" y1="88" x2="71" y2="88"/>
    <line x1="68" y1="114" x2="71" y2="114"/>
    <line x1="129" y1="88" x2="132" y2="88"/>
    <line x1="129" y1="114" x2="132" y2="114"/>
  </g>
</svg>