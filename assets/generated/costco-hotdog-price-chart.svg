<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14100c"/>
      <stop offset="1" stop-color="#1e1811"/>
    </linearGradient>
    <linearGradient id="inflFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e8d5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f2e8d5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="redLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e63b2e"/>
      <stop offset="1" stop-color="#ff6a5e"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="200" height="200" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="198" height="198" rx="15" fill="none" stroke="#f2e8d5" stroke-opacity="0.12"/>

  <!-- corner brackets -->
  <g stroke="#f2e8d5" stroke-opacity="0.35" stroke-width="1.2" fill="none">
    <path d="M8 16 V8 H16"/><path d="M184 8 H192 V16"/>
    <path d="M192 184 V192 H184"/><path d="M16 192 H8 V184"/>
  </g>

  <!-- title -->
  <text x="100" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f2e8d5" letter-spacing="0.5">THE $1.50 HOT DOG</text>
  <text x="100" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" fill="#f2e8d5" fill-opacity="0.55" letter-spacing="1.5">COSTCO PRICE VS. INFLATION · 1985–2025</text>

  <!-- chart frame -->
  <g transform="translate(28,48)">
    <!-- gridlines -->
    <g stroke="#f2e8d5" stroke-opacity="0.08" stroke-width="0.7">
      <line x1="0" y1="0" x2="150" y2="0"/>
      <line x1="0" y1="24" x2="150" y2="24"/>
      <line x1="0" y1="48" x2="150" y2="48"/>
      <line x1="0" y1="72" x2="150" y2="72"/>
      <line x1="0" y1="96" x2="150" y2="96"/>
    </g>
    <!-- y labels -->
    <g font-family="'SF Mono','Cascadia Code',monospace" font-size="5" fill="#f2e8d5" fill-opacity="0.4" text-anchor="end">
      <text x="-4" y="2">$5</text>
      <text x="-4" y="50">$2.5</text>
      <text x="-4" y="98">$0</text>
    </g>

    <!-- inflation area -->
    <path d="M0,79 C30,76 55,68 80,52 C105,36 130,20 150,10 L150,96 L0,96 Z" fill="url(#inflFill)"/>
    <path d="M0,79 C30,76 55,68 80,52 C105,36 130,20 150,10" fill="none" stroke="#f2e8d5" stroke-opacity="0.75" stroke-width="1.6" stroke-dasharray="4 3" stroke-linecap="round"/>

    <!-- costco flat line -->
    <line x1="0" y1="77" x2="150" y2="77" stroke="url(#redLine)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

    <!-- markers -->
    <circle cx="0" cy="77" r="3" fill="#e63b2e" stroke="#14100c" stroke-width="1" filter="url(#shadow)"/>
    <circle cx="150" cy="77" r="3.4" fill="#e63b2e" stroke="#f2e8d5" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="150" cy="10" r="3" fill="#f2e8d5" stroke="#14100c" stroke-width="1"/>

    <!-- delta callout -->
    <line x1="150" y1="77" x2="150" y2="10" stroke="#e63b2e" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="2 2"/>
    <rect x="96" y="24" width="50" height="16" rx="4" fill="#14100c" fill-opacity="0.85" stroke="#e63b2e" stroke-opacity="0.6" stroke-width="0.8"/>
    <text x="121" y="32.5" text-anchor="middle" font-family="'SF Mono',monospace" font-size="6" font-weight="700" fill="#f2e8d5">+$2.90</text>
    <text x="121" y="38.2" text-anchor="middle" font-family="'SF Mono',monospace" font-size="4.4" fill="#f2e8d5" fill-opacity="0.6">IF INFLATION-ADJUSTED</text>

    <!-- x labels -->
    <g font-family="'SF Mono',monospace" font-size="5.5" fill="#f2e8d5" fill-opacity="0.5">
      <text x="0" y="106">1985</text>
      <text x="150" y="106" text-anchor="end">TODAY</text>
    </g>

    <!-- line labels -->
    <text x="4" y="72" font-family="'SF Mono',monospace" font-size="5.5" font-weight="700" fill="#ff6a5e">$1.50 — NEVER MOVED</text>
    <text x="60" y="60" font-family="'SF Mono',monospace" font-size="5.5" fill="#f2e8d5" fill-opacity="0.65">~$4.40 EXPECTED</text>
  </g>

  <!-- footer badge -->
  <rect x="44" y="172" width="112" height="15" rx="7.5" fill="#e63b2e" fill-opacity="0.14" stroke="#e63b2e" stroke-opacity="0.45" stroke-width="0.8"/>
  <text x="100" y="182" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="700" fill="#f2e8d5" letter-spacing="1">40 YEARS. ONE PRICE.</text>
</svg>