<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="parch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A2E20"/>
      <stop offset="0.5" stop-color="#2A2118"/>
      <stop offset="1" stop-color="#1C1610"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#FFD9A0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFD9A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1A22"/>
      <stop offset="1" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="quillv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5F2E8"/>
      <stop offset="0.55" stop-color="#C9C4B2"/>
      <stop offset="1" stop-color="#8E8E93"/>
    </linearGradient>
    <filter id="glass" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="glowF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- backdrop vignette -->
  <rect width="200" height="200" fill="#0A0A0A"/>
  <rect width="200" height="200" fill="url(#glow)"/>

  <!-- parchment panel -->
  <g filter="url(#glass)">
    <rect x="22" y="20" width="156" height="150" rx="6" fill="url(#parch)" stroke="#8E8E93" stroke-opacity="0.5" stroke-width="1"/>
    <rect x="27" y="25" width="146" height="140" rx="4" fill="none" stroke="#FFD9A0" stroke-opacity="0.25" stroke-width="0.6"/>
    <!-- engraved double-rule frame -->
    <rect x="34" y="32" width="132" height="126" rx="3" fill="none" stroke="#C9BFA6" stroke-opacity="0.55" stroke-width="0.8"/>
    <rect x="37" y="35" width="126" height="120" rx="2" fill="none" stroke="#C9BFA6" stroke-opacity="0.3" stroke-width="0.5"/>
    <!-- corner flourishes -->
    <g stroke="#E8DCC0" stroke-opacity="0.8" fill="none" stroke-width="0.9">
      <path d="M34 46 Q34 32 48 32 M34 40 Q40 32 48 32" transform="translate(0,0)"/>
      <path d="M152 32 Q166 32 166 46 M160 32 Q166 38 166 46"/>
      <path d="M34 148 Q34 158 44 158 M34 152 Q40 158 48 158"/>
      <path d="M152 158 Q166 158 166 148 M160 158 Q166 152 166 148"/>
    </g>
    <!-- parchment texture stipple -->
    <g fill="#FFFFFF" opacity="0.05">
      <circle cx="60" cy="55" r="0.7"/><circle cx="120" cy="48" r="0.5"/><circle cx="85" cy="70" r="0.6"/>
      <circle cx="140" cy="90" r="0.7"/><circle cx="52" cy="110" r="0.5"/><circle cx="110" cy="130" r="0.6"/>
      <circle cx="150" cy="120" r="0.5"/><circle cx="70" cy="145" r="0.6"/><circle cx="95" cy="42" r="0.5"/>
      <circle cx="132" cy="65" r="0.5"/>
    </g>
    <!-- engraved script lines -->
    <g stroke="#D8CBAE" stroke-opacity="0.35" stroke-width="0.8" stroke-linecap="round">
      <path d="M50 60 Q100 56 150 60" fill="none"/>
      <path d="M50 68 Q100 64 150 68" fill="none"/>
      <path d="M50 76 Q100 72 150 76" fill="none"/>
      <path d="M50 128 Q100 124 150 128" fill="none"/>
      <path d="M50 136 Q100 132 150 136" fill="none"/>
    </g>
    <!-- date cartouche -->
    <g filter="url(#glowF)">
      <rect x="76" y="88" width="48" height="14" rx="3" fill="none" stroke="#C9BFA6" stroke-opacity="0.7" stroke-width="0.7"/>
      <text x="100" y="98" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#E8DCC0" letter-spacing="1.5">1748</text>
    </g>
    <text x="100" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="5" fill="#C9BFA6" fill-opacity="0.7" font-style="italic" letter-spacing="2">EX LIBRIS · PHILOSOPHIA</text>
  </g>

  <!-- ink well -->
  <g filter="url(#glass)">
    <ellipse cx="70" cy="160" rx="16" ry="5" fill="#0A0A0A" opacity="0.6"/>
    <path d="M56 142 L56 156 Q56 162 70 162 Q84 162 84 156 L84 142 Z" fill="url(#ink)" stroke="#8E8E93" stroke-opacity="0.7" stroke-width="1"/>
    <ellipse cx="70" cy="142" rx="14" ry="4.5" fill="#14141C" stroke="#0A84FF" stroke-opacity="0.55" stroke-width="1"/>
    <path d="M60 141 Q70 137 80 141" fill="none" stroke="#0A84FF" stroke-opacity="0.8" stroke-width="0.8" filter="url(#glowF)"/>
    <path d="M59 148 Q59 155 66 157" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round"/>
    <!-- lid ring -->
    <ellipse cx="70" cy="139" rx="10" ry="3" fill="none" stroke="#8E8E93" stroke-opacity="0.6" stroke-width="0.7"/>
  </g>

  <!-- quill pen -->
  <g filter="url(#glass)">
    <g transform="rotate(-38 122 148)">
      <ellipse cx="122" cy="168" rx="14" ry="3" fill="#0A0A0A" opacity="0.6"/>
      <!-- barrel -->
      <path d="M122 162 L122 98 Q122 92 124 88 L126 88 Q128 92 128 98 L128 162 Z" fill="url(#quillv)" stroke="#0A0A0A" stroke-opacity="0.5" stroke-width="0.6"/>
      <!-- shaft rachis -->
      <path d="M125 88 L125 60" stroke="#F5F2E8" stroke-width="2.4" stroke-linecap="round"/>
      <!-- feather vane -->
      <path d="M125 60 Q104 52 100 30 Q112 34 120 46 Q122 52 125 60 Z" fill="url(#quillv)" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="0.6"/>
      <path d="M125 60 Q146 52 150 30 Q138 34 130 46 Q128 52 125 60 Z" fill="url(#quillv)" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="0.6"/>
      <!-- barbs -->
      <g stroke="#8E8E93" stroke-opacity="0.6" stroke-width="0.5">
        <path d="M124 54 L108 46"/><path d="M124 48 L106 38"/><path d="M124 42 L108 32"/>
        <path d="M126 54 L142 46"/><path d="M126 48 L144 38"/><path d="M126 42 L142 32"/>
      </g>
      <!-- nib -->
      <path d="M122 162 L124 170 L126 162 Z" fill="#1A1A22"/>
      <circle cx="124" cy="167" r="0.7" fill="#0A84FF" filter="url(#glowF)"/>
    </g>
  </g>

  <!-- base shadow glow line -->
  <ellipse cx="100" cy="172" rx="70" ry="5" fill="#0A84FF" opacity="0.06" filter="url(#glowF)"/>
</svg>