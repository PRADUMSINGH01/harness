<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#0A84FF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hippo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#8E8E93"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur6" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="24" fill="#0A0A0A"/>
  <rect x="1" y="1" width="198" height="198" rx="23" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-opacity="0.55" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M10 24 V12 H24"/>
    <path d="M176 12 H190 V24"/>
    <path d="M190 176 V190 H176"/>
    <path d="M24 190 H10 V176"/>
  </g>

  <!-- ambient glow -->
  <circle cx="100" cy="88" r="58" fill="url(#glow)"/>

  <!-- activation rings -->
  <g fill="none" stroke-linecap="round">
    <circle cx="100" cy="88" r="52" stroke="#0A84FF" stroke-opacity="0.18" stroke-width="1"/>
    <circle cx="100" cy="88" r="52" stroke="#0A84FF" stroke-width="2" stroke-dasharray="82 245" filter="url(#soft)">
      <animateTransform attributeName="transform" type="rotate" from="0 100 88" to="360 100 88" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="88" r="44" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.8" stroke-dasharray="2 5"/>
    <circle cx="100" cy="88" r="36" stroke="#0A84FF" stroke-opacity="0.9" stroke-width="2.5">
      <animate attributeName="r" values="34;40;34" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.9;0.25;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- neural connections -->
  <g stroke="#0A84FF" stroke-opacity="0.45" stroke-width="1" fill="none">
    <path d="M62 62 L40 48"/><path d="M138 62 L160 48"/>
    <path d="M62 114 L44 128"/><path d="M138 114 L156 128"/>
    <path d="M100 36 L100 22"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="40" cy="48" r="2"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="48" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="44" cy="128" r="2"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="156" cy="128" r="2"><animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="22" r="2"/>
  </g>

  <!-- hippocampus curve (seahorse-like region) -->
  <g filter="url(#soft)">
    <path d="M76 104 C70 88 78 66 96 60 C112 55 126 64 126 78 C126 92 112 96 104 92 C97 89 96 80 102 77"
          fill="none" stroke="url(#hippo)" stroke-width="7" stroke-linecap="round"/>
    <path d="M76 104 C80 112 90 114 98 111" fill="none" stroke="#0A84FF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.9"/>
    <circle cx="102" cy="77" r="3.4" fill="#0A84FF"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.7">
    <circle cx="84" cy="92" r="1.4"/><circle cx="90" cy="72" r="1.4"/><circle cx="114" cy="84" r="1.4"/>
  </g>

  <!-- label -->
  <text x="100" y="146" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="9" letter-spacing="3" fill="#8E8E93">HIPPOCAMPUS</text>

  <!-- timer chip -->
  <g filter="url(#soft)">
    <rect x="46" y="156" width="108" height="26" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#0A84FF" stroke-opacity="0.6"/>
    <circle cx="54" cy="169" r="2.2" fill="#0A84FF">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="106" y="173.5" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace"
          font-size="13" letter-spacing="1.5" fill="#FFFFFF">00:02:14</text>
  </g>
  <!-- chip blur echo -->
  <rect x="46" y="156" width="108" height="26" rx="8" fill="none" stroke="#0A84FF" stroke-opacity="0.35" filter="url(#blur6)"/>
</svg>