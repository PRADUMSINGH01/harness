<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="barTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DC2FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Glass card -->
  <g filter="url(#softShadow)">
    <rect x="8" y="8" width="184" height="184" rx="14" fill="#0A0A0A" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <rect x="8" y="8" width="184" height="184" rx="14" fill="url(#glass)"/>
  </g>

  <!-- Title -->
  <text x="100" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF" letter-spacing="1.5">EXPONENTIAL GROWTH</text>

  <!-- Plot area -->
  <g>
    <!-- gridlines -->
    <g stroke="#FFFFFF" stroke-opacity="0.07">
      <line x1="32" y1="46" x2="184" y2="46"/>
      <line x1="32" y1="70" x2="184" y2="70"/>
      <line x1="32" y1="94" x2="184" y2="94"/>
      <line x1="32" y1="118" x2="184" y2="118"/>
    </g>
    <line x1="32" y1="150" x2="184" y2="150" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <line x1="32" y1="46" x2="32" y2="150" stroke="#FFFFFF" stroke-opacity="0.25"/>

    <!-- y ticks -->
    <g font-family="ui-monospace, Menlo, monospace" font-size="6" fill="#8E8E93" text-anchor="end">
      <text x="29" y="152">0</text>
      <text x="29" y="120">6T</text>
      <text x="29" y="96">12T</text>
      <text x="29" y="72">18T</text>
    </g>
  </g>

  <!-- Bars: exponential rise to 18T -->
  <g>
    <rect x="38"  y="149" width="14" height="1"  rx="0.5" fill="url(#barGrad)"/>
    <rect x="58"  y="147.6" width="14" height="2.4" rx="0.5" fill="url(#barGrad)"/>
    <rect x="78"  y="144.8" width="14" height="5.2" rx="0.5" fill="url(#barGrad)"/>
    <rect x="98"  y="138.5" width="14" height="11.5" rx="0.5" fill="url(#barGrad)"/>
    <rect x="118" y="124.5" width="14" height="25.5" rx="0.5" fill="url(#barGrad)"/>
    <rect x="138" y="94"   width="14" height="56"  rx="0.5" fill="url(#barGrad)"/>
    <rect x="158" y="46"   width="14" height="104" rx="0.5" fill="url(#barTop)" filter="url(#glow)"/>
  </g>

  <!-- Peak marker -->
  <g filter="url(#glow)">
    <circle cx="165" cy="42" r="2.2" fill="#FFFFFF"/>
  </g>
  <line x1="165" y1="44" x2="165" y2="46" stroke="#FFFFFF" stroke-opacity="0.5"/>

  <!-- Value callout -->
  <g>
    <rect x="130" y="24" width="42" height="14" rx="7" fill="#0A84FF" fill-opacity="0.18" stroke="#0A84FF" stroke-opacity="0.6"/>
    <text x="151" y="33.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="8" font-weight="700" fill="#7DC2FF">$18T</text>
  </g>

  <!-- x labels -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="5.5" fill="#8E8E93" text-anchor="middle">
    <text x="45" y="160">'70</text>
    <text x="85" y="160">'90</text>
    <text x="125" y="160">'10</text>
    <text x="165" y="160">NOW</text>
  </g>

  <!-- x axis ticks -->
  <g stroke="#FFFFFF" stroke-opacity="0.25">
    <line x1="32" y1="150" x2="32" y2="153"/>
    <line x1="45" y1="150" x2="45" y2="153"/>
    <line x1="85" y1="150" x2="85" y2="153"/>
    <line x1="125" y1="150" x2="125" y2="153"/>
    <line x1="165" y1="150" x2="165" y2="153"/>
    <line x1="184" y1="150" x2="184" y2="153"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-opacity="0.7" fill="none" stroke-width="1.4" stroke-linecap="round">
    <path d="M14 18 v-5 h5"/>
    <path d="M181 18 v-5 h-5"/>
    <path d="M14 182 v5 h5"/>
    <path d="M181 182 v5 h-5"/>
  </g>
</svg>