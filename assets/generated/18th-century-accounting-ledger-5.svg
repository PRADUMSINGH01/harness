<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1F26" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="paperSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.01"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="quill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#8E8E93"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- glass card -->
  <g filter="url(#softShadow)">
    <rect x="18" y="12" width="164" height="176" rx="10" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <rect x="18" y="12" width="164" height="176" rx="10" fill="url(#paperSheen)"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M26 24 v-6 a4 4 0 0 1 4 -4 h6"/>
    <path d="M174 14 h6 a4 4 0 0 1 4 4 v6"/>
    <path d="M184 176 v6 a4 4 0 0 1 -4 4 h-6"/>
    <path d="M36 186 h-6 a4 4 0 0 1 -4 -4 v-6"/>
  </g>

  <!-- ledger header -->
  <text x="34" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#FFFFFF" letter-spacing="2">LEDGER</text>
  <text x="166" y="34" font-family="Georgia, serif" font-size="7" fill="#8E8E93" text-anchor="end" font-style="italic">Anno 1787</text>
  <line x1="30" y1="42" x2="170" y2="42" stroke="#0A84FF" stroke-width="1" opacity="0.8" filter="url(#glow)"/>

  <!-- column rules -->
  <g stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="0.7">
    <line x1="30" y1="48" x2="30" y2="156"/>
    <line x1="104" y1="48" x2="104" y2="156"/>
    <line x1="170" y1="48" x2="170" y2="156"/>
    <line x1="30" y1="52" x2="170" y2="52" stroke-opacity="0.28"/>
  </g>

  <!-- ruled lines + entries -->
  <g font-family="Georgia, serif" font-size="7">
    <g stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="0.6">
      <line x1="30" y1="66" x2="170" y2="66"/>
      <line x1="30" y1="80" x2="170" y2="80"/>
      <line x1="30" y1="94" x2="170" y2="94"/>
      <line x1="30" y1="108" x2="170" y2="108"/>
      <line x1="30" y1="122" x2="170" y2="122"/>
      <line x1="30" y1="136" x2="170" y2="136"/>
    </g>
    <!-- amounts, right column -->
    <g fill="#FFFFFF" fill-opacity="0.85">
      <text x="166" y="63" text-anchor="end">$412.50</text>
      <text x="166" y="77" text-anchor="end">$1,208.00</text>
      <text x="166" y="91" text-anchor="end">$96.25</text>
      <text x="166" y="105" text-anchor="end">$2,340.75</text>
      <text x="166" y="119" text-anchor="end">$517.10</text>
      <text x="166" y="133" text-anchor="end">$88.40</text>
    </g>
    <!-- item scribbles (middle column) -->
    <g stroke="#8E8E93" stroke-width="1" stroke-linecap="round" opacity="0.75">
      <path d="M34 60 q14 -1.5 26 0.5"/>
      <path d="M34 74 q17 1 30 -0.5"/>
      <path d="M110 60 q14 -1 24 0.5"/>
      <path d="M110 74 q11 1.2 22 -0.5"/>
      <path d="M34 88 q13 -1.4 25 0.6"/>
      <path d="M34 102 q15 1 28 -0.4"/>
      <path d="M34 116 q12 -1.2 24 0.5"/>
      <path d="M34 130 q16 1.1 29 -0.6"/>
    </g>
  </g>

  <!-- total rule -->
  <line x1="30" y1="142" x2="170" y2="142" stroke="#0A84FF" stroke-width="1" opacity="0.9" filter="url(#glow)"/>
  <text x="52" y="154" font-family="Georgia, serif" font-size="9" fill="#FFFFFF" font-weight="bold">TOTAL</text>
  <text x="166" y="154" font-family="Georgia, serif" font-size="9.5" fill="url(#ink)" text-anchor="end" font-weight="bold" filter="url(#glow)">$4,663.00</text>

  <!-- quill pen -->
  <g transform="translate(146 170) rotate(-28)">
    <path d="M0 0 L-6 -20 C-8 -30 -2 -38 8 -40 C10 -30 6 -20 2 -8 Z" fill="url(#quill)" opacity="0.95"/>
    <path d="M-4 -8 L6 -34" stroke="#0A0A0A" stroke-width="0.8" opacity="0.5"/>
    <path d="M0 0 L-2 6" stroke="#8E8E93" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <!-- quill ink flourish -->
  <path d="M30 168 q12 -8 24 -2 q14 6 28 -1 q10 -5 18 2" fill="none" stroke="url(#ink)" stroke-width="1.3" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
  <circle cx="104" cy="166" r="1.2" fill="#0A84FF" filter="url(#glow)"/>

  <!-- ticks -->
  <g stroke="#8E8E93" stroke-width="0.6" opacity="0.5">
    <line x1="30" y1="160" x2="34" y2="160"/>
    <line x1="38" y1="160" x2="42" y2="160"/>
    <line x1="46" y1="160" x2="50" y2="160"/>
  </g>
</svg>