<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glassBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1F26"/>
      <stop offset="1" stop-color="#0E1116"/>
    </linearGradient>
    <linearGradient id="shackle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3F49"/>
      <stop offset="0.5" stop-color="#8E8E93"/>
      <stop offset="1" stop-color="#2A2E36"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crackGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EB8FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="#0A0A0A"/>

  <!-- ambient glow -->
  <circle cx="100" cy="112" r="72" fill="url(#coreGlow)"/>

  <!-- shackle, broken top-right -->
  <g filter="url(#glow)">
    <path d="M70 78 V60 a30 30 0 0 1 60 0 v18" fill="none" stroke="url(#shackle)" stroke-width="12" stroke-linecap="round"/>
  </g>
  <!-- shackle break gap highlight -->
  <path d="M126 66 l8 14" stroke="#0A84FF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <!-- broken shackle fragment flying off -->
  <g transform="translate(146 48) rotate(28)">
    <path d="M-7 0 a14 14 0 0 1 14 -14 v8 a6 6 0 0 0 -6 6 z" fill="#5A606C" opacity="0.95"/>
  </g>

  <!-- lock body: two halves split by crack -->
  <g>
    <!-- left half -->
    <path d="M62 88 L98 84 L96 152 L64 150 Z" fill="url(#glassBody)" stroke="#8E8E93" stroke-width="1.6" stroke-opacity="0.6"/>
    <!-- right half, displaced -->
    <path d="M104 83 L138 88 L137 151 L101 153 Z" fill="url(#glassBody)" stroke="#8E8E93" stroke-width="1.6" stroke-opacity="0.6" transform="translate(5 -3) rotate(3 120 118)"/>
  </g>

  <!-- glowing crack between halves -->
  <g filter="url(#glow)">
    <path d="M100 82 l-3 20 l5 16 l-4 16 l3 20" fill="none" stroke="url(#crackGlow)" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <path d="M100 82 l-3 20 l5 16 l-4 16 l3 20" fill="none" stroke="#9BD4FF" stroke-width="0.8" stroke-linecap="round" opacity="0.9"/>

  <!-- keyhole on left half -->
  <g filter="url(#glow)">
    <circle cx="79" cy="112" r="6.5" fill="#0A84FF"/>
    <rect x="76.6" y="114" width="4.8" height="14" rx="2.4" fill="#0A84FF"/>
  </g>

  <!-- broken shard fragments -->
  <g fill="#1C222C" stroke="#8E8E93" stroke-width="0.9" stroke-opacity="0.5">
    <path d="M142 118 l9 -4 l3 8 l-8 3 z"/>
    <path d="M55 130 l-10 2 l2 8 l8 -2 z"/>
    <path d="M120 158 l8 5 l-5 6 l-7 -5 z"/>
  </g>

  <!-- glowing particles -->
  <g filter="url(#glow)">
    <circle cx="108" cy="60" r="2.2" fill="#5EB8FF"/>
    <circle cx="128" cy="40" r="1.6" fill="#0A84FF"/>
    <circle cx="88" cy="52" r="1.4" fill="#9BD4FF"/>
    <circle cx="150" cy="98" r="2" fill="#0A84FF"/>
    <circle cx="48" cy="98" r="1.7" fill="#5EB8FF"/>
    <circle cx="158" cy="72" r="1.3" fill="#9BD4FF"/>
    <circle cx="42" cy="66" r="1.5" fill="#0A84FF"/>
    <circle cx="120" cy="168" r="1.8" fill="#5EB8FF"/>
    <circle cx="76" cy="170" r="1.4" fill="#9BD4FF"/>
    <circle cx="140" cy="146" r="1.5" fill="#0A84FF"/>
  </g>
  <!-- particle halos -->
  <g filter="url(#softGlow)" opacity="0.8">
    <circle cx="128" cy="40" r="3" fill="#0A84FF"/>
    <circle cx="150" cy="98" r="3.2" fill="#0A84FF"/>
    <circle cx="120" cy="168" r="3" fill="#0A84FF"/>
  </g>

  <!-- tiny crosshair accents -->
  <g stroke="#8E8E93" stroke-width="0.8" opacity="0.55">
    <path d="M36 130 h8 M40 126 v8"/>
    <path d="M160 128 h8 M164 124 v8"/>
    <path d="M64 34 h8 M68 30 v8"/>
  </g>
</svg>