<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="brainGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#0A84FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassBrain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="linkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#0A84FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0A84FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background field -->
  <rect x="0" y="0" width="200" height="200" fill="#0A0A0A"/>
  <circle cx="100" cy="98" r="86" fill="url(#brainGlow)"/>

  <!-- faint grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="0.5">
    <path d="M20 40H180 M20 70H180 M20 100H180 M20 130H180 M20 160H180"/>
    <path d="M40 20V180 M70 20V180 M100 20V180 M130 20V180 M160 20V180"/>
  </g>

  <!-- glass brain silhouette -->
  <g filter="url(#drop)">
    <path d="M58 132 C36 128 26 108 32 90 C26 72 38 52 58 50 C64 32 88 24 104 32 C124 22 150 32 156 54 C172 62 176 84 166 96 C172 114 160 132 142 134 C136 148 116 154 104 146 C92 156 68 152 58 132 Z"
      fill="url(#glassBrain)" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.4"/>
    <!-- hemisphere divider -->
    <path d="M100 32 C104 58 96 88 100 146" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>
    <!-- depth contour -->
    <path d="M58 50 C82 42 118 42 156 54" fill="none" stroke="#0A84FF" stroke-opacity="0.45" stroke-width="0.8"/>
    <path d="M44 116 C80 132 128 132 152 118" fill="none" stroke="#0A84FF" stroke-opacity="0.35" stroke-width="0.8"/>
    <path d="M52 84 C86 70 126 70 168 86" fill="none" stroke="#8E8E93" stroke-opacity="0.4" stroke-width="0.7"/>
  </g>

  <!-- brain stem -->
  <path d="M104 146 C102 158 108 164 112 170" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>
  <path d="M104 146 C102 158 108 164 112 170" fill="none" stroke="#0A84FF" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>

  <!-- synapse links (depth: dim back, bright front) -->
  <g stroke="url(#linkGrad)" stroke-width="0.9" fill="none">
    <g stroke-opacity="0.3">
      <path d="M62 66 L84 54 L108 48"/>
      <path d="M84 54 L92 80"/>
      <path d="M62 66 L54 92"/>
      <path d="M108 48 L132 58"/>
      <path d="M54 92 L62 118 L84 126"/>
      <path d="M132 58 L146 80"/>
      <path d="M92 80 L118 96"/>
      <path d="M132 58 L124 82"/>
    </g>
    <g stroke-opacity="0.65" stroke-width="1.1">
      <path d="M92 80 L62 118"/>
      <path d="M118 96 L146 80"/>
      <path d="M124 82 L118 96 L84 126"/>
      <path d="M92 80 L124 82"/>
      <path d="M108 48 L92 80 L118 96"/>
    </g>
    <g stroke-opacity="0.95" stroke-width="1.3">
      <path d="M124 82 L148 106"/>
      <path d="M84 126 L106 140"/>
      <path d="M118 96 L106 140"/>
    </g>
  </g>

  <!-- link glow pulses -->
  <g fill="#FFFFFF" filter="url(#glow)">
    <circle cx="118" cy="96" r="1.3" opacity="0.9"/>
    <circle cx="92" cy="80" r="1.2" opacity="0.7"/>
  </g>

  <!-- neurons: back layer (small, dim) -->
  <g fill="#8E8E93" filter="url(#glow)">
    <circle cx="62" cy="66" r="2.4"/>
    <circle cx="108" cy="48" r="2.2"/>
    <circle cx="84" cy="54" r="2.2"/>
    <circle cx="54" cy="92" r="2.2"/>
    <circle cx="132" cy="58" r="2.2"/>
  </g>
  <!-- neurons: mid layer -->
  <g fill="#FFFFFF" opacity="0.85" filter="url(#glow)">
    <circle cx="92" cy="80" r="2.8"/>
    <circle cx="146" cy="80" r="2.6"/>
    <circle cx="124" cy="82" r="2.8"/>
    <circle cx="62" cy="118" r="2.6"/>
  </g>
  <!-- neurons: front layer (bright, large) -->
  <g fill="#FFFFFF" filter="url(#glow)">
    <circle cx="118" cy="96" r="3.4"/>
    <circle cx="148" cy="106" r="3"/>
    <circle cx="84" cy="126" r="3"/>
    <circle cx="106" cy="140" r="2.8"/>
  </g>
  <!-- halo rings on key nodes -->
  <g fill="none" stroke="#0A84FF" stroke-opacity="0.55" stroke-width="0.8">
    <circle cx="118" cy="96" r="6.5"/>
    <circle cx="124" cy="82" r="5.5"/>
    <circle cx="84" cy="126" r="5.5"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.6">
    <circle cx="118" cy="96" r="9"/>
    <circle cx="148" cy="106" r="8"/>
  </g>

  <!-- sparkles -->
  <g fill="#FFFFFF" filter="url(#softGlow)">
    <path d="M36 42 l1 3 3 1 -3 1 -1 3 -1 -3 -3 -1 3 -1 z" opacity="0.9"/>
    <path d="M170 140 l0.8 2.4 2.4 0.8 -2.4 0.8 -0.8 2.4 -0.8 -2.4 -2.4 -0.8 2.4 -0.8 z" opacity="0.7"/>
    <circle cx="28" cy="150" r="1" opacity="0.6"/>
    <circle cx="176" cy="60" r="0.9" opacity="0.5"/>
    <circle cx="160" cy="26" r="1.1" opacity="0.6"/>
  </g>

  <!-- technical corner brackets -->
  <g stroke="#8E8E93" stroke-opacity="0.7" stroke-width="1" fill="none" stroke-linecap="round">
    <path d="M12 24 V12 H24"/>
    <path d="M176 12 H188 V24"/>
    <path d="M188 176 V188 H176"/>
    <path d="M24 188 H12 V176"/>
  </g>
  <!-- coordinate ticks -->
  <g stroke="#8E8E93" stroke-opacity="0.5" stroke-width="0.8">
    <path d="M8 100 h4 M188 100 h4 M100 8 v4 M100 188 v4"/>
  </g>
  <!-- crosshair -->
  <g stroke="#0A84FF" stroke-opacity="0.5" stroke-width="0.7" fill="none">
    <circle cx="118" cy="96" r="12" stroke-dasharray="2 3"/>
    <path d="M118 82 v-4 M118 110 v4 M104 96 h-4 M132 96 h4"/>
  </g>
  <!-- label -->
  <text x="100" y="196" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" fill="#8E8E93" letter-spacing="3">NEURAL NETWORK · 3D GRAPH</text>
</svg>