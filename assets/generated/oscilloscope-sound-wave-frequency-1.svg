<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16181D" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="peakGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="14" y="26" width="172" height="148" rx="10"/></clipPath>
  </defs>

  <!-- glass card -->
  <rect x="4" y="4" width="192" height="192" rx="20" fill="url(#glass)" stroke="#8E8E93" stroke-opacity="0.25"/>
  <rect x="4" y="4" width="192" height="192" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="0.6" transform="translate(0.6 0.6)"/>

  <!-- header -->
  <text x="18" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#8E8E93" letter-spacing="1.5">SPECTRUM · FREQ PEAK</text>
  <circle cx="184" cy="15" r="2.6" fill="#0A84FF" filter="url(#glow)"/>

  <!-- screen -->
  <rect x="14" y="26" width="172" height="148" rx="10" fill="#0A0A0A" stroke="#8E8E93" stroke-opacity="0.3"/>

  <g clip-path="url(#screen)">
    <!-- graticule -->
    <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="0.5">
      <line x1="14" y1="63.5" x2="186" y2="63.5"/><line x1="14" y1="100" x2="186" y2="100"/><line x1="14" y1="136.5" x2="186" y2="136.5"/>
      <line x1="57" y1="26" x2="57" y2="174"/><line x1="100" y1="26" x2="100" y2="174"/><line x1="143" y1="26" x2="143" y2="174"/>
    </g>
    <line x1="14" y1="100" x2="186" y2="100" stroke="#8E8E93" stroke-opacity="0.25" stroke-width="0.6" stroke-dasharray="3 3"/>

    <!-- spectrum -->
    <g filter="url(#glow)">
      <path d="M14 100 L26 99.5 L32 96 L40 99 L50 97.5 L58 92 L66 99 L72 97 L80 99.5 L88 96 L96 99 L100 92 L104 99 L112 99.5 L118 97 L124 98 L130 95 L136 99 L142 97.5 L150 99.5 L158 98 L168 99.5 L178 99 L186 100 L186 150 L14 150 Z" fill="#0A84FF" fill-opacity="0.14"/>
      <path d="M14 100 L26 99.5 L32 96 L40 99 L50 97.5 L58 92 L66 99 L72 97 L80 99.5 L88 96 L96 99 L100 92 L104 99 L112 99.5 L118 97 L124 98 L130 95 L136 99 L142 97.5 L150 99.5 L158 98 L168 99.5 L178 99 L186 100" fill="none" stroke="#8E8E93" stroke-opacity="0.7" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M14 100 L24 99.5 L30 94 L36 99.2 L44 99 L52 96.5 L58 92 L62 99.4 L70 99 L78 99.6 L84 96 L90 99.4 L96 98.6 L100 40 L104 98.6 L110 99.4 L116 95.5 L122 99.2 L128 99.6 L134 96 L140 99 L146 99.4 L152 97 L158 99.2 L166 99.5 L172 98.5 L180 99.4 L186 100" fill="none" stroke="url(#wave)" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- resonant peak marker -->
    <circle cx="100" cy="26" r="34" fill="url(#peakGlow)"/>
    <line x1="100" y1="40" x2="100" y2="26" stroke="#0A84FF" stroke-width="1" stroke-opacity="0.8"/>
    <circle cx="100" cy="40" r="2" fill="#FFFFFF"/>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#FFFFFF">
      <rect x="110" y="34" width="34" height="12" rx="3" fill="#0A84FF" fill-opacity="0.18" stroke="#0A84FF" stroke-opacity="0.6" stroke-width="0.6"/>
      <text x="117" y="43" font-size="7.5" fill="#9ECAF7">440Hz</text>
      <rect x="56" y="34" width="34" height="12" rx="3" fill="#FFFFFF" fill-opacity="0.06" stroke="#8E8E93" stroke-opacity="0.4" stroke-width="0.6"/>
      <text x="63" y="43" font-size="7.5" fill="#8E8E93">PEAK</text>
    </g>

    <!-- scan cursor -->
    <line x1="118" y1="26" x2="118" y2="174" stroke="#0A84FF" stroke-opacity="0.45" stroke-width="0.8"/>
    <circle cx="118" cy="99.2" r="1.6" fill="#0A84FF"/>

    <!-- bottom reflection -->
    <path d="M14 100 L100 40 L186 100 L186 160 Q100 172 14 160 Z" fill="#0A84FF" fill-opacity="0.05"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2" fill="none">
    <path d="M20 32 v-4 h4"/><path d="M180 32 v-4 h-4"/><path d="M20 168 v4 h4"/><path d="M180 168 v4 h-4"/>
  </g>

  <!-- footer ticks -->
  <g stroke="#8E8E93" stroke-opacity="0.5" stroke-width="0.8">
    <line x1="32" y1="180" x2="32" y2="184"/><line x1="66" y1="180" x2="66" y2="184"/><line x1="100" y1="180" x2="100" y2="184"/><line x1="134" y1="180" x2="134" y2="184"/><line x1="168" y1="180" x2="168" y2="184"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="6" fill="#8E8E93">
    <text x="27" y="193">100</text><text x="61" y="193">250</text><text x="95" y="193">440</text><text x="129" y="193">1k</text><text x="163" y="193">2k</text>
  </g>
</svg>