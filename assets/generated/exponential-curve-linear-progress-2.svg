<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141418" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E8E93"/>
      <stop offset="1" stop-color="#E5E5EA"/>
    </linearGradient>
    <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="plotClip"><rect x="40" y="28" width="140" height="104"/></clipPath>
  </defs>

  <!-- glass card -->
  <rect x="6" y="6" width="188" height="188" rx="18" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <rect x="6.5" y="6.5" width="187" height="187" rx="17.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>

  <!-- title -->
  <text x="20" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF" letter-spacing="1.5">EXPONENTIAL VS LINEAR</text>

  <!-- grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.07">
    <line x1="40" y1="132" x2="180" y2="132"/>
    <line x1="40" y1="28" x2="40" y2="132"/>
    <line x1="65" y1="28" x2="65" y2="132"/>
    <line x1="90" y1="28" x2="90" y2="132"/>
    <line x1="115" y1="28" x2="115" y2="132"/>
    <line x1="140" y1="28" x2="140" y2="132"/>
    <line x1="165" y1="28" x2="165" y2="132"/>
    <line x1="40" y1="54" x2="180" y2="54"/>
    <line x1="40" y1="80" x2="180" y2="80"/>
    <line x1="40" y1="106" x2="180" y2="106"/>
  </g>

  <!-- area fill under exponential curve -->
  <g clip-path="url(#plotClip)">
    <path d="M40,128 C90,127 130,120 180,32 L180,132 L40,132 Z" fill="url(#fillGrad)"/>
    <!-- linear diagonal (baseline reference) -->
    <line x1="40" y1="128" x2="180" y2="36" stroke="#8E8E93" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.8"/>
    <!-- exponential curve -->
    <path d="M40,128 C90,127 130,120 180,32" fill="none" stroke="url(#curveGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <!-- curve endpoint -->
    <circle cx="180" cy="32" r="4" fill="#0A84FF" filter="url(#glow)"/>
    <circle cx="180" cy="32" r="7.5" fill="none" stroke="#0A84FF" stroke-opacity="0.4"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-opacity="0.6" stroke-width="1.5" fill="none">
    <path d="M36,24 h-4 v4"/>
    <path d="M36,136 h-4 v-4"/>
    <path d="M184,24 h4 v4"/>
    <path d="M184,136 h4 v-4"/>
  </g>

  <!-- linear progress bar -->
  <g filter="url(#soft)">
    <rect x="30" y="152" width="140" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <rect x="30" y="152" width="70" height="10" rx="5" fill="url(#barGrad)"/>
    <circle cx="100" cy="157" r="6" fill="#E5E5EA" stroke="#0A0A0A" stroke-width="1.5"/>
  </g>

  <!-- legend -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="500">
    <circle cx="36" cy="177" r="3" fill="#0A84FF"/>
    <text x="44" y="180" fill="#FFFFFF" fill-opacity="0.9">Exponential</text>
    <circle cx="102" cy="177" r="3" fill="#8E8E93"/>
    <text x="110" y="180" fill="#FFFFFF" fill-opacity="0.65">Linear</text>
  </g>
</svg>