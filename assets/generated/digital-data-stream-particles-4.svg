<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="flow2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8E8E93" stop-opacity="0"/>
      <stop offset="60%" stop-color="#8E8E93"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#0A84FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#8E8E93" stroke-opacity="0.08" stroke-width="0.5">
    <path d="M0 50H200M0 100H200M0 150H200M50 0V200M100 0V200M150 0V200"/>
  </g>

  <!-- main stream paths -->
  <g fill="none" stroke-linecap="round">
    <path d="M-5 128 C 45 120, 60 80, 100 80 S 160 110, 205 96" stroke="url(#flow)" stroke-width="2" opacity="0.95" filter="url(#glow)"/>
    <path d="M-5 140 C 50 132, 70 96, 105 94 S 165 124, 205 112" stroke="url(#flow)" stroke-width="1.2" opacity="0.6"/>
    <path d="M-5 66 C 55 72, 75 108, 110 104 S 165 76, 205 86" stroke="url(#flow2)" stroke-width="1" opacity="0.5"/>
    <path d="M-5 54 C 60 58, 85 88, 118 84" stroke="#8E8E93" stroke-width="0.6" opacity="0.35"/>
  </g>

  <!-- particle glow blobs -->
  <g filter="url(#softGlow)" opacity="0.7">
    <circle cx="52" cy="98" r="4" fill="#0A84FF"/>
    <circle cx="118" cy="98" r="3" fill="#FFFFFF"/>
    <circle cx="152" cy="112" r="3.5" fill="#0A84FF"/>
    <circle cx="140" cy="92" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- particles along streams -->
  <g filter="url(#glow)">
    <circle cx="30" cy="118" r="1.8" fill="#FFFFFF"/>
    <circle cx="66" cy="88" r="2.2" fill="#0A84FF"/>
    <circle cx="86" cy="81" r="1.6" fill="#FFFFFF"/>
    <circle cx="126" cy="92" r="2.4" fill="#0A84FF"/>
    <circle cx="148" cy="102" r="1.6" fill="#8E8E93"/>
    <circle cx="172" cy="106" r="2" fill="#FFFFFF"/>
    <circle cx="44" cy="60" r="1.6" fill="#8E8E93"/>
    <circle cx="98" cy="90" r="1.4" fill="#8E8E93"/>
    <circle cx="160" cy="60" r="1.4" fill="#0A84FF"/>
  </g>

  <!-- data bits (small squares) -->
  <g fill="#0A84FF" opacity="0.85">
    <rect x="58" y="124" width="3.6" height="3.6" transform="rotate(45 59.8 125.8)"/>
    <rect x="134" y="80" width="3" height="3" transform="rotate(45 135.5 81.5)" fill="#FFFFFF"/>
    <rect x="180" y="140" width="2.6" height="2.6" transform="rotate(45 181.3 141.3)"/>
  </g>

  <!-- central glass panel -->
  <g>
    <rect x="78" y="70" width="52" height="28" rx="7" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="0.8"/>
    <rect x="84" y="80" width="10" height="2" rx="1" fill="#0A84FF"/>
    <rect x="97" y="80" width="16" height="2" rx="1" fill="#FFFFFF" opacity="0.7"/>
    <rect x="116" y="80" width="7" height="2" rx="1" fill="#8E8E93"/>
    <rect x="84" y="86" width="6" height="2" rx="1" fill="#FFFFFF" opacity="0.5"/>
    <rect x="93" y="86" width="13" height="2" rx="1" fill="#8E8E93" opacity="0.7"/>
    <circle cx="121" cy="87" r="2.6" fill="#0A84FF" filter="url(#glow)"/>
  </g>

  <!-- core glow node -->
  <circle cx="100" cy="114" r="14" fill="url(#core)" opacity="0.9"/>
  <circle cx="100" cy="114" r="3" fill="#FFFFFF" filter="url(#glow)"/>

  <!-- corner brackets -->
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1" fill="none">
    <path d="M12 22V14H20M180 22V14H172M12 178V186H20M180 178V186H172"/>
  </g>
  <g fill="#8E8E93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5" letter-spacing="1">
    <text x="24" y="19" opacity="0.5">DATA.STREAM</text>
    <text x="146" y="191" opacity="0.5">0x84FF · 200x200</text>
  </g>

  <!-- ticks -->
  <g stroke="#8E8E93" stroke-opacity="0.4" stroke-width="0.8">
    <path d="M0 30h4M0 70h4M0 130h4M0 170h4M196 30h4M196 70h4M196 130h4M196 170h4"/>
  </g>
</svg>