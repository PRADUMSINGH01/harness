<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16181f" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="redBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F43F5E"/>
      <stop offset="1" stop-color="#B91C3C"/>
    </linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8E8E93" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- backdrop reticle -->
  <g opacity="0.25">
    <circle cx="100" cy="100" r="88" fill="none" stroke="#0A84FF" stroke-width="0.7" stroke-dasharray="2 6"/>
    <circle cx="100" cy="100" r="76" fill="none" stroke="#8E8E93" stroke-width="0.5" stroke-dasharray="1 4"/>
  </g>

  <!-- card -->
  <g filter="url(#softShadow)">
    <rect x="30" y="52" width="140" height="96" rx="10" fill="url(#glass)" stroke="#8E8E93" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="30" y="52" width="140" height="96" rx="10" fill="none" stroke="#0A84FF" stroke-opacity="0.25" stroke-width="0.6"/>
    <!-- top glass sheen -->
    <path d="M32 54 Q100 46 168 54 L168 72 Q100 64 32 72 Z" fill="#FFFFFF" opacity="0.05"/>
  </g>

  <!-- red classification bar -->
  <rect x="30" y="60" width="140" height="7" fill="url(#redBar)" filter="url(#glow)"/>

  <!-- headline -->
  <text x="100" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="22" font-weight="800" letter-spacing="3" fill="#FFFFFF">SUBJECT</text>
  <text x="100" y="128" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace"
        font-size="30" font-weight="700" letter-spacing="6" fill="#F43F5E" filter="url(#glow)">27</text>

  <!-- underline + meta row -->
  <line x1="55" y1="136" x2="145" y2="136" stroke="#8E8E93" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="100" y="142" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace"
        font-size="6.5" letter-spacing="2" fill="#8E8E93">CASE-FILE · INTERVIEW · RED</text>

  <!-- barcode strip -->
  <g transform="translate(60,150)" fill="#8E8E93">
    <rect width="2" height="6"/><rect x="3" width="1" height="6"/><rect x="6" width="3" height="6"/>
    <rect x="11" width="1" height="6"/><rect x="14" width="2" height="6"/><rect x="18" width="1" height="6"/>
    <rect x="21" width="3" height="6"/><rect x="26" width="2" height="6"/><rect x="30" width="1" height="6"/>
    <rect x="33" width="2" height="6"/><rect x="37" width="1" height="6"/><rect x="40" width="3" height="6"/>
    <rect x="45" width="2" height="6"/><rect x="49" width="1" height="6"/><rect x="52" width="2" height="6"/>
    <rect x="56" width="1" height="6"/><rect x="59" width="3" height="6"/><rect x="64" width="1" height="6"/>
    <rect x="67" width="2" height="6"/><rect x="71" width="1" height="6"/>
  </g>
  <text x="100" y="163.5" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace"
        font-size="5.5" letter-spacing="1" fill="#8E8E93" opacity="0.8">NO.027-INT</text>

  <!-- tape corners -->
  <g>
    <g transform="translate(30,52) rotate(-45)">
      <rect x="-18" y="-7" width="36" height="14" fill="url(#tape)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.5"/>
      <line x1="-12" y1="-7" x2="-12" y2="7" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="0.6"/>
      <line x1="8" y1="-7" x2="8" y2="7" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="0.6"/>
    </g>
    <g transform="translate(170,52) rotate(45)">
      <rect x="-18" y="-7" width="36" height="14" fill="url(#tape)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.5"/>
      <line x1="-12" y1="-7" x2="-12" y2="7" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="0.6"/>
      <line x1="8" y1="-7" x2="8" y2="7" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="0.6"/>
    </g>
    <g transform="translate(30,148) rotate(45)">
      <rect x="-18" y="-7" width="36" height="14" fill="url(#tape)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.5"/>
      <line x1="-12" y1="-7" x2="-12" y2="7" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="0.6"/>
      <line x1="8" y1="-7" x2="8" y2="7" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="0.6"/>
    </g>
    <g transform="translate(170,148) rotate(-45)">
      <rect x="-18" y="-7" width="36" height="14" fill="url(#tape)" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.5"/>
      <line x1="-12" y1="-7" x2="-12" y2="7" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="0.6"/>
      <line x1="8" y1="-7" x2="8" y2="7" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="0.6"/>
    </g>
  </g>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-width="1.4" fill="none" opacity="0.8">
    <path d="M14 24 v-10 h10"/>
    <path d="M186 24 v-10 h-10"/>
    <path d="M14 176 v10 h10"/>
    <path d="M186 176 v10 h-10"/>
  </g>
</svg>