<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="noteGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE97A"/>
      <stop offset="0.55" stop-color="#FFD84D"/>
      <stop offset="1" stop-color="#F5C418"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151926" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0A0D14" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- dark glass backdrop -->
  <rect x="4" y="4" width="192" height="192" rx="22" fill="url(#glassGrad)" stroke="#8E8E93" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="4" y="4" width="192" height="192" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="0.6"/>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M14 26 V16 Q14 14 16 14 H26"/>
    <path d="M186 26 V16 Q186 14 184 14 H174"/>
    <path d="M14 174 V184 Q14 186 16 186 H26"/>
    <path d="M186 174 V184 Q186 186 184 186 H174"/>
  </g>

  <!-- sticky note -->
  <g filter="url(#softShadow)">
    <path d="M42 38
             C 70 34, 130 34, 156 38
             C 160 66, 160 130, 156 160
             C 156 166, 152 170, 146 170
             L 58 170
             C 50 170, 42 162, 42 154
             Z"
          fill="url(#noteGrad)"/>
    <!-- subtle sheen -->
    <path d="M42 38 C 70 34, 130 34, 156 38 C 158 56, 158 70, 157 84 C 120 76, 80 76, 43 84 C 42 68, 42 52, 42 38 Z"
          fill="#FFFFFF" opacity="0.18"/>
    <!-- dog-eared fold -->
    <path d="M42 154 C 48 158, 54 164, 57 170 L 50 170 C 45 170, 42 166, 42 154 Z"
          fill="#D9A80F"/>
    <path d="M42 154 C 48 158, 53 163, 56 169 L 42 170 Z" fill="#C4920C"/>
    <!-- soft edge shading -->
    <path d="M156 38 C 160 66, 160 130, 156 160 C 156 166, 152 170, 146 170 L 60 170 C 130 168, 152 120, 150 40 Z"
          fill="#E8B400" opacity="0.35"/>
  </g>

  <!-- handwritten marker text -->
  <g fill="#1A1A1A" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" font-weight="700">
    <text x="99" y="86" font-size="24" text-anchor="middle" transform="rotate(-2 99 86)" letter-spacing="1">COGNITIVE</text>
    <text x="99" y="122" font-size="27" text-anchor="middle" transform="rotate(1.5 99 122)" letter-spacing="2">DEBT</text>
  </g>

  <!-- scribble underline -->
  <path d="M56 136 C 72 131, 88 140, 102 134 C 114 129, 128 139, 142 133"
        fill="none" stroke="#0A84FF" stroke-width="3.2" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>

  <!-- tape strip -->
  <rect x="86" y="28" width="28" height="16" rx="2" fill="#FFFFFF" opacity="0.5" transform="rotate(-3 100 36)"/>
</svg>