<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3F4A"/>
      <stop offset="1" stop-color="#16181E"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2F38"/>
      <stop offset="1" stop-color="#0D0F13"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22252C"/>
      <stop offset="1" stop-color="#08090C"/>
    </linearGradient>
    <linearGradient id="stickerBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FB5FF"/>
      <stop offset="0.5" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0554B0"/>
    </linearGradient>
    <linearGradient id="stickerWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.65" stop-color="#E9ECEF"/>
      <stop offset="1" stop-color="#B7BCC4"/>
    </linearGradient>
    <linearGradient id="stickerGray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B0B4BC"/>
      <stop offset="1" stop-color="#5B6068"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeHi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ECBFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#0A0D14" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- contact shadow + glow -->
  <ellipse cx="100" cy="181" rx="72" ry="13" fill="url(#contact)"/>

  <g filter="url(#soft)">
    <!-- TOP FACE -->
    <g transform="translate(40,70) matrix(1,0.5,1,-0.5,0,0)">
      <rect x="-1" y="-1" width="62" height="62" fill="url(#faceTop)"/>
      <g stroke="#05060A" stroke-width="1.2" stroke-linejoin="round">
        <rect x="2.5" y="2.5" width="16" height="16" rx="2.4" fill="url(#stickerBlue)"/>
        <rect x="22.5" y="2.5" width="16" height="16" rx="2.4" fill="url(#stickerWhite)"/>
        <rect x="42.5" y="2.5" width="16" height="16" rx="2.4" fill="url(#stickerGray)"/>
        <rect x="2.5" y="22.5" width="16" height="16" rx="2.4" fill="url(#stickerWhite)"/>
        <rect x="22.5" y="22.5" width="16" height="16" rx="2.4" fill="url(#stickerBlue)"/>
        <rect x="42.5" y="22.5" width="16" height="16" rx="2.4" fill="url(#stickerWhite)"/>
        <rect x="2.5" y="42.5" width="16" height="16" rx="2.4" fill="url(#stickerGray)"/>
        <rect x="22.5" y="42.5" width="16" height="16" rx="2.4" fill="url(#stickerWhite)"/>
        <rect x="42.5" y="42.5" width="16" height="16" rx="2.4" fill="url(#stickerBlue)"/>
      </g>
      <rect x="0" y="0" width="60" height="60" fill="url(#gloss)"/>
    </g>

    <!-- LEFT FACE -->
    <g transform="translate(40,70) matrix(1,0.5,0,1,0,0)">
      <rect x="-1" y="-1" width="62" height="92" fill="url(#faceLeft)"/>
      <g stroke="#05060A" stroke-width="1.2" stroke-linejoin="round">
        <rect x="2.5" y="2.5" width="16" height="26" rx="2.4" fill="url(#stickerBlue)"/>
        <rect x="22.5" y="2.5" width="16" height="26" rx="2.4" fill="url(#stickerWhite)"/>
        <rect x="42.5" y="2.5" width="16" height="26" rx="2.4" fill="url(#stickerGray)"/>
        <rect x="2.5" y="32.5" width="16" height="26" rx="2.4" fill="url(#stickerGray)"/>
        <rect x="22.5" y="32.5" width="16" height="26" rx="2.4" fill="url(#stickerBlue)"/>
        <rect x="42.5" y="32.5" width="16" height="26" rx="2.4" fill="url(#stickerWhite)"/>
        <rect x="2.5" y="62.5" width="16" height="26" rx="2.4" fill="url(#stickerWhite)"/>
        <rect x="22.5" y="62.5" width="16" height="26" rx="2.4" fill="url(#stickerGray)"/>
        <rect x="42.5" y="62.5" width="16" height="26" rx="2.4" fill="url(#stickerBlue)"/>
      </g>
      <rect x="0" y="0" width="60" height="90" fill="url(#gloss)" opacity="0.7"/>
    </g>

    <!-- RIGHT FACE -->
    <g transform="translate(100,100) matrix(1,-0.5,0,1,0,0)">
      <rect x="-1" y="-1" width="62" height="92" fill="url(#faceRight)"/>
      <g stroke="#05060A" stroke-width="1.2" stroke-linejoin="round">
        <rect x="2.5" y="2.5" width="16" height="26" rx="2.4" fill="url(#stickerWhite)"/>
        <rect x="22.5" y="2.5" width="16" height="26" rx="2.4" fill="url(#stickerGray)"/>
        <rect x="42.5" y="2.5" width="16" height="26" rx="2.4" fill="url(#stickerBlue)"/>
        <rect x="2.5" y="32.5" width="16" height="26" rx="2.4" fill="url(#stickerGray)"/>
        <rect x="22.5" y="32.5" width="16" height="26" rx="2.4" fill="url(#stickerWhite)"/>
        <rect x="42.5" y="32.5" width="16" height="26" rx="2.4" fill="url(#stickerBlue)"/>
        <rect x="2.5" y="62.5" width="16" height="26" rx="2.4" fill="url(#stickerBlue)"/>
        <rect x="22.5" y="62.5" width="16" height="26" rx="2.4" fill="url(#stickerWhite)"/>
        <rect x="42.5" y="62.5" width="16" height="26" rx="2.4" fill="url(#stickerGray)"/>
      </g>
      <rect x="0" y="0" width="60" height="90" fill="url(#gloss)" opacity="0.5"/>
    </g>
  </g>

  <!-- luminous edge highlights -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M40 70 L100 40 L160 70" stroke="url(#edgeHi)" stroke-width="1.4"/>
    <path d="M40 70 L100 100 L160 70" stroke="#8ECBFF" stroke-width="0.8" opacity="0.65"/>
    <path d="M40 70 L40 160" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>
    <path d="M160 70 L160 160" stroke="#38BDF8" stroke-width="0.8" opacity="0.3"/>
    <path d="M100 100 L100 190" stroke="#38BDF8" stroke-width="0.7" opacity="0.25"/>
  </g>

  <!-- specular spark -->
  <circle cx="72" cy="56" r="1.6" fill="#FFFFFF" opacity="0.9" filter="url(#glow)"/>
  <circle cx="122" cy="52" r="1.1" fill="#FFFFFF" opacity="0.7"/>
</svg>