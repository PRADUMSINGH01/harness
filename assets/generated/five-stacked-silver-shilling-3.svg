<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16181D"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="coinFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#C9CDD3"/>
      <stop offset="1" stop-color="#8E8E93"/>
    </linearGradient>
    <linearGradient id="coinEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9DA2A8"/>
      <stop offset="1" stop-color="#6E7278"/>
    </linearGradient>
    <radialGradient id="coinSheen" cx="0.35" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- dark glass card -->
  <rect x="4" y="4" width="192" height="192" rx="20" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <rect x="4" y="4" width="192" height="96" rx="20" fill="#FFFFFF" opacity="0.03"/>
  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M14 26 V16 H24"/>
    <path d="M186 26 V16 H176"/>
    <path d="M14 174 V184 H24"/>
    <path d="M186 174 V184 H176"/>
  </g>

  <g filter="url(#drop)">
    <!-- cascading falling column: 5 coins, slight offsets -->
    <!-- coin 1 (top) -->
    <g transform="translate(100,42)">
      <rect x="-26" y="0" width="52" height="7" rx="3.5" fill="url(#coinEdge)"/>
      <ellipse cx="0" cy="0" rx="26" ry="8" fill="url(#coinFace)"/>
      <ellipse cx="0" cy="0" rx="26" ry="8" fill="url(#coinSheen)"/>
      <ellipse cx="0" cy="0" rx="19" ry="5.6" fill="none" stroke="#8E8E93" stroke-opacity="0.7" stroke-width="0.8"/>
      <text x="0" y="2.6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="700" fill="#5A5E63">1/–</text>
    </g>
    <!-- coin 2 -->
    <g transform="translate(97,68)">
      <rect x="-26" y="0" width="52" height="7" rx="3.5" fill="url(#coinEdge)"/>
      <ellipse cx="0" cy="0" rx="26" ry="8" fill="url(#coinFace)"/>
      <ellipse cx="0" cy="0" rx="26" ry="8" fill="url(#coinSheen)"/>
      <ellipse cx="0" cy="0" rx="19" ry="5.6" fill="none" stroke="#8E8E93" stroke-opacity="0.7" stroke-width="0.8"/>
      <text x="0" y="2.6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="700" fill="#5A5E63">1/–</text>
    </g>
    <!-- coin 3 -->
    <g transform="translate(101,94)">
      <rect x="-26" y="0" width="52" height="7" rx="3.5" fill="url(#coinEdge)"/>
      <ellipse cx="0" cy="0" rx="26" ry="8" fill="url(#coinFace)"/>
      <ellipse cx="0" cy="0" rx="26" ry="8" fill="url(#coinSheen)"/>
      <ellipse cx="0" cy="0" rx="19" ry="5.6" fill="none" stroke="#8E8E93" stroke-opacity="0.7" stroke-width="0.8"/>
      <text x="0" y="2.6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="700" fill="#5A5E63">1/–</text>
    </g>
    <!-- coin 4 -->
    <g transform="translate(98,120)">
      <rect x="-26" y="0" width="52" height="7" rx="3.5" fill="url(#coinEdge)"/>
      <ellipse cx="0" cy="0" rx="26" ry="8" fill="url(#coinFace)"/>
      <ellipse cx="0" cy="0" rx="26" ry="8" fill="url(#coinSheen)"/>
      <ellipse cx="0" cy="0" rx="19" ry="5.6" fill="none" stroke="#8E8E93" stroke-opacity="0.7" stroke-width="0.8"/>
      <text x="0" y="2.6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="700" fill="#5A5E63">1/–</text>
    </g>
    <!-- coin 5 (bottom) -->
    <g transform="translate(100,146)">
      <rect x="-26" y="0" width="52" height="7" rx="3.5" fill="url(#coinEdge)"/>
      <ellipse cx="0" cy="0" rx="26" ry="8" fill="url(#coinFace)"/>
      <ellipse cx="0" cy="0" rx="26" ry="8" fill="url(#coinSheen)"/>
      <ellipse cx="0" cy="0" rx="19" ry="5.6" fill="none" stroke="#8E8E93" stroke-opacity="0.7" stroke-width="0.8"/>
      <text x="0" y="2.6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="700" fill="#5A5E63">1/–</text>
    </g>
  </g>

  <!-- cascade motion ticks -->
  <g stroke="#0A84FF" stroke-width="1" stroke-linecap="round" opacity="0.55" filter="url(#glow)">
    <line x1="66" y1="34" x2="60" y2="30"/>
    <line x1="136" y1="52" x2="142" y2="48"/>
    <line x1="64" y1="86" x2="58" y2="82"/>
    <line x1="138" y1="106" x2="144" y2="102"/>
    <line x1="66" y1="158" x2="60" y2="154"/>
  </g>
  <!-- baseline pulse -->
  <line x1="60" y1="170" x2="140" y2="170" stroke="#0A84FF" stroke-width="1.5" stroke-linecap="round" opacity="0.7" filter="url(#glow)"/>
  <circle cx="100" cy="170" r="2" fill="#0A84FF" opacity="0.9"/>
</svg>