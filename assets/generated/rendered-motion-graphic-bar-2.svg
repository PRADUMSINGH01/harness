<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="barFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="barSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A5BC4"/>
      <stop offset="1" stop-color="#072F63"/>
    </linearGradient>
    <linearGradient id="barTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BFE0FF"/>
      <stop offset="1" stop-color="#7FC0FF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="floorGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- glass card -->
  <g>
    <rect x="8" y="8" width="184" height="184" rx="16" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <rect x="8.5" y="8.5" width="183" height="183" rx="15.5" fill="none" stroke="#0A84FF" stroke-opacity="0.25"/>
  </g>

  <!-- HUD corner brackets -->
  <g stroke="#8E8E93" stroke-width="1.4" stroke-linecap="round" opacity="0.8">
    <path d="M18 30 V18 H30" fill="none"/>
    <path d="M182 30 V18 H170" fill="none"/>
    <path d="M18 170 V182 H30" fill="none"/>
    <path d="M182 170 V182 H170" fill="none"/>
  </g>

  <!-- floor glow + grid -->
  <ellipse cx="100" cy="158" rx="72" ry="18" fill="url(#floorGlow)"/>
  <g stroke="#8E8E93" stroke-opacity="0.25" stroke-width="0.7">
    <line x1="28" y1="158" x2="172" y2="158"/>
    <line x1="34" y1="165" x2="166" y2="165"/>
    <line x1="42" y1="171" x2="158" y2="171"/>
  </g>

  <!-- baseline -->
  <line x1="30" y1="158" x2="170" y2="158" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>

  <!-- bars: isometric extruded, depth dx=7 dy=-5 -->
  <!-- bar1 h=50 -->
  <g filter="url(#softShadow)">
    <path d="M38 108 L45 103 L45 153 L38 158 Z" fill="url(#barSide)"/>
    <rect x="38" y="108" width="26" height="50" fill="url(#barFront)"/>
    <path d="M38 108 L45 103 L71 103 L64 108 Z" fill="url(#barTop)"/>
  </g>
  <!-- bar2 h=78 -->
  <g filter="url(#softShadow)">
    <path d="M72 80 L79 75 L79 153 L72 158 Z" fill="url(#barSide)"/>
    <rect x="72" y="80" width="26" height="78" fill="url(#barFront)"/>
    <path d="M72 80 L79 75 L105 75 L98 80 Z" fill="url(#barTop)"/>
  </g>
  <!-- bar3 h=108 -->
  <g filter="url(#softShadow)">
    <path d="M106 50 L113 45 L113 153 L106 158 Z" fill="url(#barSide)"/>
    <rect x="106" y="50" width="26" height="108" fill="url(#barFront)"/>
    <path d="M106 50 L113 45 L139 45 L132 50 Z" fill="url(#barTop)"/>
  </g>
  <!-- bar4 (muted) h=64 -->
  <g filter="url(#softShadow)">
    <path d="M140 94 L147 89 L147 153 L140 158 Z" fill="#3A3F46"/>
    <rect x="140" y="94" width="26" height="64" fill="#575D66"/>
    <path d="M140 94 L147 89 L173 89 L166 94 Z" fill="#8E8E93"/>
  </g>

  <!-- glass reflections on bars -->
  <g fill="#FFFFFF" opacity="0.22">
    <rect x="42" y="108" width="4" height="50" rx="2"/>
    <rect x="76" y="80" width="4" height="78" rx="2"/>
    <rect x="110" y="50" width="4" height="108" rx="2"/>
    <rect x="144" y="94" width="4" height="64" rx="2"/>
  </g>

  <!-- glowing value markers -->
  <g filter="url(#glow)">
    <circle cx="64" cy="103" r="2" fill="#FFFFFF"/>
    <circle cx="98" cy="75" r="2" fill="#FFFFFF"/>
    <circle cx="132" cy="45" r="2" fill="#FFFFFF"/>
    <circle cx="166" cy="89" r="2" fill="#8E8E93"/>
  </g>

  <!-- trend line -->
  <path d="M51 100 L85 68 L119 40 L153 86" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- axis ticks -->
  <g stroke="#8E8E93" stroke-width="1" stroke-opacity="0.6">
    <line x1="30" y1="134" x2="27" y2="134"/>
    <line x1="30" y1="110" x2="27" y2="110"/>
    <line x1="30" y1="86" x2="27" y2="86"/>
    <line x1="30" y1="62" x2="27" y2="62"/>
  </g>

  <!-- title micro-label -->
  <text x="30" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="2.5" fill="#FFFFFF" opacity="0.85">METRICS</text>
  <rect x="30" y="41" width="24" height="2" rx="1" fill="#0A84FF"/>

  <!-- sparkle accents -->
  <g fill="#FFFFFF">
    <circle cx="168" cy="32" r="1.4" opacity="0.7"/>
    <circle cx="158" cy="44" r="0.9" opacity="0.5"/>
    <circle cx="46" cy="52" r="1.1" opacity="0.5"/>
  </g>
</svg>