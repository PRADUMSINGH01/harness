<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="face" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#23262e"/>
      <stop offset="55%" stop-color="#14161c"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="handGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#8E8E93"/>
    </linearGradient>
    <filter id="blurH" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="blurM" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="glowB" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- crosshair ticks outside face -->
  <g stroke="#8E8E93" stroke-opacity="0.25" stroke-width="1">
    <line x1="100" y1="4" x2="100" y2="14"/>
    <line x1="100" y1="186" x2="100" y2="196"/>
    <line x1="4" y1="100" x2="14" y2="100"/>
    <line x1="186" y1="100" x2="196" y2="100"/>
  </g>

  <!-- body -->
  <g filter="url(#drop)">
    <circle cx="100" cy="100" r="86" fill="url(#face)" stroke="url(#rim)" stroke-width="1.5"/>
  </g>

  <!-- minute ticks -->
  <g stroke="#8E8E93" stroke-width="1" stroke-opacity="0.5">
    <line x1="100" y1="20" x2="100" y2="26" transform="rotate(30 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="26" transform="rotate(60 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="26" transform="rotate(120 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="26" transform="rotate(150 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="26" transform="rotate(210 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="26" transform="rotate(240 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="26" transform="rotate(300 100 100)"/>
    <line x1="100" y1="20" x2="100" y2="26" transform="rotate(330 100 100)"/>
  </g>
  <!-- hour markers -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9">
    <line x1="100" y1="21" x2="100" y2="29"/>
    <line x1="100" y1="21" x2="100" y2="29" transform="rotate(90 100 100)"/>
    <line x1="100" y1="21" x2="100" y2="29" transform="rotate(180 100 100)"/>
    <line x1="100" y1="21" x2="100" y2="29" transform="rotate(270 100 100)"/>
  </g>

  <!-- hour hand (blurred) : 10 o'clock -->
  <g transform="rotate(-60 100 100)" filter="url(#blurH)">
    <line x1="100" y1="106" x2="100" y2="60" stroke="url(#handGrad)" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- minute hand (blurred) : ~37 min -->
  <g transform="rotate(132 100 100)" filter="url(#blurM)">
    <line x1="100" y1="110" x2="100" y2="38" stroke="url(#handGrad)" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- second hand : luminous blue -->
  <g transform="rotate(48 100 100)" filter="url(#glowB)">
    <line x1="100" y1="118" x2="100" y2="32" stroke="#0A84FF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="100" cy="42" r="3" fill="#0A84FF"/>
  </g>

  <!-- center cap -->
  <circle cx="100" cy="100" r="7" fill="#14161c" stroke="#8E8E93" stroke-width="1"/>
  <circle cx="100" cy="100" r="3" fill="#0A84FF"/>

  <!-- glass overlay -->
  <path d="M32 62 Q 100 14 168 62 Q 140 34 100 34 Q 60 34 32 62 Z" fill="#FFFFFF" opacity="0.08"/>
  <ellipse cx="78" cy="58" rx="52" ry="26" fill="url(#glass)" transform="rotate(-24 78 58)"/>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-opacity="0.55" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M26 14 h-10 v10"/>
    <path d="M174 14 h10 v10"/>
    <path d="M26 186 h-10 v-10"/>
    <path d="M174 186 h10 v-10"/>
  </g>
</svg>