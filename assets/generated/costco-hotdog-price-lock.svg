<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14100c"/>
      <stop offset="1" stop-color="#1d1710"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#e63b2e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e63b2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e63b2e"/>
      <stop offset="1" stop-color="#ff7a5c"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="16" fill="url(#bg)"/>
  <rect width="200" height="200" rx="16" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="198.5" height="198.5" rx="15.5" fill="none" stroke="#f2e8d5" stroke-opacity="0.14"/>

  <!-- corner brackets -->
  <g stroke="#f2e8d5" stroke-opacity="0.45" stroke-width="1.2" fill="none">
    <path d="M8 18 V8 H18"/><path d="M182 8 H192 V18"/>
    <path d="M192 182 V192 H182"/><path d="M18 192 H8 V182"/>
  </g>

  <!-- header -->
  <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" letter-spacing="2.5" fill="#f2e8d5" fill-opacity="0.55">COSTCO FOOD COURT</text>
  <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#f2e8d5">THE $1.50 PRICE LOCK</text>

  <!-- big metric -->
  <text x="14" y="70" font-family="Menlo, monospace" font-size="26" font-weight="700" fill="#f2e8d5" filter="url(#ds)">$1.50</text>
  <text x="100" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e63b2e" font-weight="600">UNCHANGED SINCE 1985</text>

  <!-- chart area -->
  <g transform="translate(14,80)">
    <!-- grid -->
    <g stroke="#f2e8d5" stroke-opacity="0.08">
      <line x1="0" y1="10" x2="172" y2="10"/>
      <line x1="0" y1="35" x2="172" y2="35"/>
      <line x1="0" y1="60" x2="172" y2="60"/>
    </g>

    <!-- inflation line -->
    <path d="M0 60 C 30 56, 60 44, 86 36 S 140 16, 172 8" fill="none" stroke="#f2e8d5" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="172" cy="8" r="2.2" fill="#f2e8d5" fill-opacity="0.8"/>
    <text x="150" y="4" font-family="Menlo, monospace" font-size="7" fill="#f2e8d5" fill-opacity="0.6">+184% INFLATION</text>

    <!-- flat price line -->
    <line x1="0" y1="52" x2="172" y2="52" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round" filter="url(#ds)"/>
    <line x1="0" y1="52" x2="172" y2="52" stroke="#e63b2e" stroke-width="6" stroke-opacity="0.25" filter="url(#soft)"/>
    <circle cx="172" cy="52" r="3" fill="#e63b2e"/>

    <!-- axis labels -->
    <text x="0" y="72" font-family="Menlo, monospace" font-size="7" fill="#f2e8d5" fill-opacity="0.5">1985</text>
    <text x="82" y="72" font-family="Menlo, monospace" font-size="7" fill="#f2e8d5" fill-opacity="0.5">2005</text>
    <text x="158" y="72" font-family="Menlo, monospace" font-size="7" fill="#f2e8d5" fill-opacity="0.5">2024</text>
  </g>

  <!-- footnote -->
  <g transform="translate(14,168)">
    <rect x="0" y="0" width="172" height="20" rx="5" fill="#f2e8d5" fill-opacity="0.06"/>
    <circle cx="10" cy="10" r="3" fill="none" stroke="#e63b2e" stroke-width="1.3"/>
    <text x="19" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#f2e8d5" fill-opacity="0.75">A loss leader — Costco profits on memberships, not dogs.</text>
  </g>
</svg>