<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#101418"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <radialGradient id="core" cx="35%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#8FC7FF"/>
      <stop offset="45%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#0A4FB0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- corner brackets -->
  <g stroke="#8E8E93" stroke-opacity="0.5" stroke-width="1" fill="none">
    <path d="M8 16 V8 H16 M184 8 H192 V16 M192 184 V192 H184 M16 192 H8 V184"/>
  </g>
  <g fill="#8E8E93" fill-opacity="0.35" font-family="monospace" font-size="4">
    <text x="8" y="24">CBDC.NET / LEDGER</text>
    <text x="192" y="194" text-anchor="end">v3.1</text>
  </g>

  <!-- faint grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="0.4">
    <path d="M40 0 V200 M80 0 V200 M120 0 V200 M160 0 V200 M0 40 H200 M0 80 H200 M0 120 H200 M0 160 H200"/>
  </g>

  <!-- links -->
  <g stroke="#0A84FF" stroke-opacity="0.45" stroke-width="1" filter="url(#glow)">
    <line x1="100" y1="100" x2="38" y2="52"/>
    <line x1="100" y1="100" x2="162" y2="46"/>
    <line x1="100" y1="100" x2="46" y2="156"/>
    <line x1="100" y1="100" x2="158" y2="150"/>
    <line x1="38" y1="52" x2="162" y2="46" stroke-opacity="0.18"/>
    <line x1="46" y1="156" x2="158" y2="150" stroke-opacity="0.18"/>
  </g>
  <!-- flowing pulses -->
  <g fill="#FFFFFF">
    <circle cx="69" cy="76" r="1.3" opacity="0.9"/>
    <circle cx="131" cy="73" r="1.3" opacity="0.9"/>
    <circle cx="73" cy="128" r="1.3" opacity="0.9"/>
    <circle cx="129" cy="125" r="1.3" opacity="0.9"/>
  </g>

  <!-- central bank node -->
  <g>
    <circle cx="100" cy="100" r="30" fill="#0A84FF" opacity="0.12" filter="url(#softGlow)"/>
    <circle cx="100" cy="100" r="22" fill="url(#glass)" stroke="#0A84FF" stroke-opacity="0.6"/>
    <circle cx="100" cy="100" r="30" fill="none" stroke="#0A84FF" stroke-opacity="0.15" stroke-dasharray="2 4"/>
    <circle cx="100" cy="100" r="14" fill="url(#core)" filter="url(#glow)"/>
    <!-- ¤ currency glyph -->
    <g stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round">
      <line x1="93" y1="92" x2="93" y2="108"/>
      <line x1="107" y1="92" x2="107" y2="108"/>
      <line x1="92" y1="96" x2="108" y2="96"/>
      <line x1="92" y1="104" x2="108" y2="104"/>
    </g>
  </g>

  <!-- satellite nodes -->
  <g stroke="#0A84FF" stroke-opacity="0.7" stroke-width="1" fill="url(#glass)">
    <circle cx="38" cy="52" r="8"/>
    <circle cx="162" cy="46" r="8"/>
    <circle cx="46" cy="156" r="8"/>
    <circle cx="158" cy="150" r="8"/>
  </g>
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="38" cy="52" r="2.2"/>
    <circle cx="162" cy="46" r="2.2"/>
    <circle cx="46" cy="156" r="2.2"/>
    <circle cx="158" cy="150" r="2.2"/>
  </g>

  <!-- crosshairs on satellites -->
  <g stroke="#8E8E93" stroke-opacity="0.6" stroke-width="0.5">
    <path d="M38 40 V46 M38 58 V64 M26 52 H32 M44 52 H50"/>
    <path d="M162 34 V40 M162 52 V58 M150 46 H156 M168 46 H174"/>
    <path d="M46 144 V150 M46 162 V168 M34 156 H40 M52 156 H58"/>
    <path d="M158 138 V144 M158 156 V162 M146 150 H152 M164 150 H170"/>
  </g>

  <!-- labels -->
  <g fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="100" y="143" text-anchor="middle" font-size="6" letter-spacing="1">CENTRAL BANK</text>
    <text x="38" y="36" text-anchor="middle" font-size="4.2" fill="#8E8E93">BANK A</text>
    <text x="162" y="30" text-anchor="middle" font-size="4.2" fill="#8E8E93">BANK B</text>
    <text x="46" y="176" text-anchor="middle" font-size="4.2" fill="#8E8E93">WALLET C</text>
    <text x="158" y="170" text-anchor="middle" font-size="4.2" fill="#8E8E93">WALLET D</text>
  </g>
</svg>