<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glassFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="sapphire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="barFade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="topGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- faint grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="0.4">
    <path d="M20 40H180M20 70H180M20 100H180M20 130H180M20 160H180"/>
    <path d="M40 35V165M80 35V165M120 35V165M160 35V165"/>
  </g>
  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M8 18V8H18"/><path d="M182 8H192V18"/>
    <path d="M192 182V192H182"/><path d="M18 192H8V182"/>
  </g>

  <!-- isometric glass cube -->
  <g transform="translate(100,62)" filter="url(#softShadow)">
    <g filter="url(#glow)">
      <path d="M0 -30 L28 -15 L28 15 L0 30 L-28 15 L-28 -15 Z" fill="url(#glassFace)" stroke="#0A84FF" stroke-opacity="0.55" stroke-width="0.8"/>
      <path d="M0 -30 L28 -15 L0 0 L-28 -15 Z" fill="url(#topGlow)" stroke="#0A84FF" stroke-opacity="0.5" stroke-width="0.8"/>
      <path d="M-28 -15 L0 0 L0 30" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.8"/>
      <!-- 3x3 grid on right face -->
      <g stroke="#0A84FF" stroke-opacity="0.45" stroke-width="0.5">
        <path d="M0 -20 L18.6 -10 M0 -10 L18.6 0 M0 0 L18.6 10 M0 10 L18.6 20"/>
        <path d="M9.3 -24.5 L9.3 5.5 M18.6 -19.5 L18.6 10.5" transform="translate(0,0)"/>
      </g>
      <!-- 3x3 grid on left face -->
      <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="0.5">
        <path d="M0 -20 L-18.6 -10 M0 -10 L-18.6 0 M0 0 L-18.6 10 M0 10 L-18.6 20"/>
        <path d="M-9.3 -24.5 L-9.3 5.5 M-18.6 -19.5 L-18.6 10.5"/>
      </g>
      <!-- colored studs -->
      <g>
        <circle cx="4.6" cy="-17.3" r="1.7" fill="#FFFFFF"/>
        <circle cx="13.9" cy="-12.4" r="1.7" fill="#0A84FF"/>
        <circle cx="23.3" cy="-7.5" r="1.7" fill="#8E8E93"/>
        <circle cx="4.6" cy="-7.7" r="1.7" fill="#0A84FF"/>
        <circle cx="13.9" cy="-2.8" r="1.7" fill="#FFFFFF" fill-opacity="0.8"/>
        <circle cx="23.3" cy="2.1" r="1.7" fill="#0A84FF" fill-opacity="0.7"/>
        <circle cx="4.6" cy="1.9" r="1.7" fill="#8E8E93"/>
        <circle cx="13.9" cy="6.8" r="1.7" fill="#0A84FF"/>
        <circle cx="23.3" cy="11.7" r="1.7" fill="#FFFFFF" fill-opacity="0.6"/>
        <circle cx="-4.6" cy="-17.3" r="1.7" fill="#0A84FF"/>
        <circle cx="-13.9" cy="-12.4" r="1.7" fill="#FFFFFF" fill-opacity="0.7"/>
        <circle cx="-23.3" cy="-7.5" r="1.7" fill="#8E8E93"/>
        <circle cx="-4.6" cy="-7.7" r="1.7" fill="#FFFFFF" fill-opacity="0.6"/>
        <circle cx="-13.9" cy="-2.8" r="1.7" fill="#0A84FF" fill-opacity="0.8"/>
        <circle cx="-23.3" cy="2.1" r="1.7" fill="#FFFFFF" fill-opacity="0.5"/>
        <circle cx="-4.6" cy="1.9" r="1.7" fill="#8E8E93"/>
        <circle cx="-13.9" cy="6.8" r="1.7" fill="#FFFFFF" fill-opacity="0.6"/>
        <circle cx="-23.3" cy="11.7" r="1.7" fill="#0A84FF" fill-opacity="0.6"/>
      </g>
    </g>
  </g>

  <!-- bar chart baseline -->
  <line x1="24" y1="166" x2="176" y2="166" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.8"/>

  <!-- bars -->
  <g>
    <rect x="34" y="142" width="14" height="24" rx="2" fill="url(#barFade)"/>
    <rect x="62" y="130" width="14" height="36" rx="2" fill="url(#barFade)"/>
    <rect x="90" y="116" width="14" height="50" rx="2" fill="url(#barFade)"/>
    <rect x="118" y="100" width="14" height="66" rx="2" fill="url(#barFade)"/>
    <rect x="146" y="80" width="14" height="86" rx="2" fill="url(#sapphire)" filter="url(#glow)"/>
    <!-- value ticks -->
    <g fill="#8E8E93" font-family="Menlo, 'SF Mono', monospace" font-size="5" text-anchor="middle">
      <text x="41" y="139">1974</text>
      <text x="69" y="127">'80</text>
      <text x="97" y="113">'03</text>
      <text x="125" y="97">'18</text>
      <text x="153" y="77" fill="#FFFFFF">2024</text>
    </g>
    <!-- highlight dot -->
    <circle cx="153" cy="80" r="2.4" fill="#0A84FF" filter="url(#glow)"/>
  </g>

  <!-- metric readout -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="100" y="182" text-anchor="middle" fill="#8E8E93" font-size="6" letter-spacing="2">HISTORY OF THE CUBE</text>
    <text x="100" y="193" text-anchor="middle" fill="#FFFFFF" font-size="7" font-weight="600" letter-spacing="1">450,000,000,000+ SOLVED COMBOS</text>
  </g>

  <!-- crosshair accent -->
  <g stroke="#0A84FF" stroke-opacity="0.5" stroke-width="0.5">
    <circle cx="176" cy="40" r="6" fill="none"/>
    <path d="M176 32V36M176 44V48M168 40H172M180 40H184"/>
  </g>
  <g fill="#8E8E93" font-family="Menlo, monospace" font-size="4">
    <text x="12" y="44">00:00</text>
    <text x="12" y="163">00:24</text>
  </g>
</svg>