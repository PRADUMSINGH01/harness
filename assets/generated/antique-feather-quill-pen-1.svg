<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1D26" stop-opacity="0.92"/>
      <stop offset="0.5" stop-color="#0A0A0A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#141821" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#E8EAF0"/>
      <stop offset="1" stop-color="#8E8E93"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- dark glass card -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
  <rect x="10" y="10" width="180" height="90" rx="40" fill="#FFFFFF" opacity="0.04"/>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M22 40 V28 Q22 22 28 22 H40"/>
    <path d="M160 22 H172 Q178 22 178 28 V40"/>
    <path d="M178 160 V172 Q178 178 172 178 H160"/>
    <path d="M40 178 H28 Q22 178 22 172 V160"/>
  </g>

  <!-- ink stroke -->
  <g filter="url(#glow)">
    <path d="M118 148 C 132 138, 152 120, 168 98" fill="none" stroke="url(#ink)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="118" cy="148" r="5.5" fill="#0A84FF"/>
    <circle cx="168" cy="98" r="2" fill="#0A84FF"/>
    <circle cx="156" cy="112" r="1.5" fill="#0A84FF" opacity="0.7"/>
  </g>

  <!-- quill -->
  <g filter="url(#soft)">
    <!-- shaft/nib -->
    <path d="M46 154 L96 104 L104 112 L54 162 Q48 164 44 160 Q42 156 46 154 Z" fill="#0A0A0A" stroke="#8E8E93" stroke-width="1.5"/>
    <!-- feather body -->
    <path d="M100 108 C 78 86, 76 48, 108 28 C 148 6, 172 22, 168 52 C 165 76, 144 92, 106 106 Z" fill="url(#feather)" stroke="#8E8E93" stroke-width="1"/>
    <!-- spine -->
    <path d="M48 156 L 118 84 C 136 66, 152 52, 162 40" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"/>
    <!-- barbs -->
    <g stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M118 84 C 108 78, 98 76, 88 80"/>
      <path d="M124 74 C 114 66, 102 62, 92 66"/>
      <path d="M130 64 C 122 54, 110 48, 100 52"/>
      <path d="M138 54 C 132 44, 122 36, 112 38"/>
      <path d="M146 46 C 142 36, 136 28, 126 28"/>
      <path d="M124 78 C 130 70, 138 64, 148 62"/>
      <path d="M130 66 C 136 58, 144 52, 154 52"/>
      <path d="M138 56 C 144 50, 152 46, 160 46"/>
    </g>
  </g>

  <!-- nib droplet accent -->
  <circle cx="104" cy="112" r="2.2" fill="#0A84FF" filter="url(#glow)"/>

  <!-- tick accents -->
  <g stroke="#8E8E93" stroke-width="1" opacity="0.4">
    <line x1="30" y1="150" x2="30" y2="158"/>
    <line x1="38" y1="146" x2="38" y2="154"/>
    <line x1="46" y1="142" x2="46" y2="150"/>
  </g>
</svg>