<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14161c"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redInk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF2D3A"/>
      <stop offset="1" stop-color="#C1121F"/>
    </linearGradient>
    <filter id="inkBleed" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="b" in2="SourceAlpha" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="grungeMask">
      <rect x="0" y="0" width="200" height="200" fill="#fff"/>
      <g fill="#000">
        <ellipse cx="52" cy="48" rx="30" ry="10" transform="rotate(20 52 48)" opacity="0.85"/>
        <ellipse cx="150" cy="150" rx="34" ry="12" transform="rotate(35 150 150)" opacity="0.8"/>
        <ellipse cx="160" cy="60" rx="16" ry="7" transform="rotate(-30 160 60)" opacity="0.7"/>
        <ellipse cx="40" cy="140" rx="14" ry="6" transform="rotate(15 40 140)" opacity="0.75"/>
        <circle cx="100" cy="20" r="6" opacity="0.6"/>
        <circle cx="188" cy="104" r="7" opacity="0.6"/>
        <circle cx="14" cy="96" r="5" opacity="0.55"/>
        <circle cx="120" cy="182" r="5" opacity="0.5"/>
        <ellipse cx="70" cy="120" rx="9" ry="4" transform="rotate(60 70 120)" opacity="0.6"/>
        <ellipse cx="130" cy="86" rx="8" ry="3.5" transform="rotate(-40 130 86)" opacity="0.55"/>
        <circle cx="30" cy="24" r="3" opacity="0.5"/>
        <circle cx="172" cy="30" r="3.5" opacity="0.45"/>
        <circle cx="182" cy="176" r="3" opacity="0.5"/>
        <circle cx="22" cy="176" r="3.5" opacity="0.45"/>
        <ellipse cx="96" cy="150" rx="12" ry="4" transform="rotate(10 96 150)" opacity="0.55"/>
        <ellipse cx="104" cy="56" rx="10" ry="3.5" transform="rotate(-15 104 56)" opacity="0.5"/>
      </g>
    </mask>
    <path id="arcTop" d="M 36 108 A 64 64 0 0 1 164 108" fill="none"/>
    <path id="arcBottom" d="M 46 122 A 58 58 0 0 0 154 122" fill="none"/>
  </defs>

  <!-- dark glass card -->
  <rect x="4" y="4" width="192" height="192" rx="26" fill="url(#glass)"/>
  <rect x="4" y="4" width="192" height="192" rx="26" fill="url(#sheen)"/>
  <rect x="4.75" y="4.75" width="190.5" height="190.5" rx="25.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
  <rect x="10" y="10" width="180" height="180" rx="22" fill="none" stroke="#0A84FF" stroke-opacity="0.18" stroke-width="0.75"/>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M14 26 V16 Q14 14 16 14 H26"/>
    <path d="M174 14 H184 Q186 14 186 16 V26"/>
    <path d="M186 174 V184 Q186 186 184 186 H174"/>
    <path d="M26 186 H16 Q14 186 14 184 V174"/>
  </g>

  <!-- stamp body, grunge-masked -->
  <g mask="url(#grungeMask)">
    <g filter="url(#inkBleed)">
      <!-- outer ring -->
      <circle cx="100" cy="100" r="76" fill="none" stroke="url(#redInk)" stroke-width="7"/>
      <circle cx="100" cy="100" r="66" fill="none" stroke="url(#redInk)" stroke-width="2.5"/>
      <circle cx="100" cy="100" r="46" fill="none" stroke="url(#redInk)" stroke-width="2.5"/>
      <!-- curved text -->
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15.5" letter-spacing="3.5" fill="url(#redInk)">
        <textPath href="#arcTop" startOffset="50%" text-anchor="middle">FAILED</textPath>
      </text>
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" letter-spacing="3" fill="url(#redInk)">
        <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">OWN TEST</textPath>
      </text>
      <!-- center figure -->
      <text x="100" y="114" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="40" fill="url(#redInk)" filter="url(#softGlow)">83%</text>
      <!-- separator ticks -->
      <g stroke="url(#redInk)" stroke-width="2.5" stroke-linecap="round">
        <line x1="34" y1="100" x2="42" y2="100"/>
        <line x1="158" y1="100" x2="166" y2="100"/>
      </g>
    </g>
  </g>

  <!-- forensic micro-details -->
  <g font-family="ui-monospace, Menlo, monospace" fill="#8E8E93" opacity="0.85">
    <text x="16" y="196" font-size="5" text-anchor="start">CASE NO. 083-F</text>
    <text x="184" y="196" font-size="5" text-anchor="end">VERDICT: FAIL</text>
  </g>
  <g stroke="#0A84FF" stroke-opacity="0.35" stroke-width="0.75">
    <line x1="100" y1="14" x2="100" y2="20"/>
    <line x1="100" y1="180" x2="100" y2="186"/>
    <line x1="14" y1="100" x2="20" y2="100"/>
    <line x1="180" y1="100" x2="186" y2="100"/>
  </g>
</svg>