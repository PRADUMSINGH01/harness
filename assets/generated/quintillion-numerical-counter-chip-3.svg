<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1D24" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#0A0A0A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#14171E" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#8E8E93" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="digits" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CC7FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- chip body -->
  <g filter="url(#softshadow)">
    <rect x="30" y="30" width="140" height="140" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
    <rect x="34.5" y="34.5" width="131" height="131" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M40 52 V44 Q40 40 44 40 H52"/>
    <path d="M160 52 V44 Q160 40 156 40 H148"/>
    <path d="M40 148 V156 Q40 160 44 160 H52"/>
    <path d="M160 148 V156 Q160 160 156 160 H148"/>
  </g>

  <!-- label -->
  <text x="100" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" letter-spacing="3" fill="#8E8E93">QUINTILLION</text>

  <!-- crosshair ticks on side -->
  <g stroke="#8E8E93" stroke-width="1" opacity="0.5">
    <line x1="36" y1="80" x2="40" y2="80"/>
    <line x1="36" y1="100" x2="40" y2="100"/>
    <line x1="36" y1="120" x2="40" y2="120"/>
    <line x1="160" y1="80" x2="164" y2="80"/>
    <line x1="160" y1="100" x2="164" y2="100"/>
    <line x1="160" y1="120" x2="164" y2="120"/>
  </g>

  <!-- main readout 4.3 × 10^19 -->
  <g filter="url(#glow)">
    <text x="100" y="106" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="34" font-weight="700" fill="url(#digits)">4.3×10</text>
    <text x="152" y="92" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" font-weight="700" fill="url(#digits)">19</text>
  </g>

  <!-- dot accents -->
  <circle cx="100" cy="76" r="2" fill="#0A84FF"/>
  <circle cx="100" cy="122" r="2" fill="#0A84FF" opacity="0.5"/>

  <!-- caption -->
  <text x="100" y="144" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" letter-spacing="2.5" fill="#8E8E93">43,000,000,000,000,000,000</text>
</svg>