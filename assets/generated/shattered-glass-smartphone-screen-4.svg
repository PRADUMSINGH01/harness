<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1A1E"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#0A84FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.04"/>
    </radialGradient>
    <linearGradient id="shardFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- phone body -->
  <g filter="url(#softShadow)">
    <rect x="58" y="22" width="84" height="156" rx="14" fill="url(#phoneBody)" stroke="#2A2A30" stroke-width="1.5"/>
    <rect x="63" y="27" width="74" height="146" rx="10" fill="#05070C"/>
    <!-- screen glow -->
    <rect x="63" y="27" width="74" height="146" rx="10" fill="url(#screenGlow)"/>
    <!-- notch + speaker details -->
    <rect x="88" y="30" width="24" height="4" rx="2" fill="#1C1C22"/>
    <circle cx="106" cy="32" r="1.2" fill="#0A84FF" opacity="0.9"/>
    <!-- home indicator -->
    <rect x="86" y="166" width="28" height="3" rx="1.5" fill="#3A3A42"/>
  </g>

  <!-- glass shards -->
  <g stroke="#FFFFFF" stroke-width="0.7" fill="url(#shardFill)" stroke-linejoin="round">
    <polygon points="100,86 84,70 96,58 106,74" fill-opacity="0.9"/>
    <polygon points="100,86 106,74 126,78 118,94" fill-opacity="0.6"/>
    <polygon points="100,86 118,94 110,114 92,106" fill-opacity="0.75"/>
    <polygon points="100,86 92,106 76,98 84,70" fill-opacity="0.55"/>
    <polygon points="84,70 66,64 70,50 96,58" fill-opacity="0.4"/>
    <polygon points="106,74 118,58 130,66 126,78" fill-opacity="0.45"/>
    <polygon points="118,94 136,92 140,108 110,114" fill-opacity="0.4"/>
    <polygon points="92,106 110,114 100,134 80,122" fill-opacity="0.5"/>
    <polygon points="76,98 92,106 80,122 66,110" fill-opacity="0.35"/>
    <polygon points="66,64 54,84 70,92 76,98" fill-opacity="0.3"/>
    <polygon points="126,78 142,70 148,88 136,92" fill-opacity="0.3"/>
    <polygon points="110,114 118,136 100,140 100,134" fill-opacity="0.35"/>
    <polygon points="100,140 104,158 88,150 92,106" fill-opacity="0.0" stroke-opacity="0.5"/>
    <polygon points="100,134 118,136 122,154 104,158" fill-opacity="0.0" stroke-opacity="0.4"/>
  </g>

  <!-- radiating crack lines -->
  <g stroke="#FFFFFF" fill="none" filter="url(#glow)">
    <g stroke-width="1.4">
      <path d="M100,86 L84,70 L70,50"/>
      <path d="M100,86 L106,74 L124,52"/>
      <path d="M100,86 L118,94 L140,88"/>
      <path d="M100,86 L110,114 L120,140"/>
      <path d="M100,86 L92,106 L84,132"/>
      <path d="M100,86 L76,98 L58,92"/>
      <path d="M100,86 L84,70 L66,64"/>
    </g>
    <g stroke-width="0.6" opacity="0.55">
      <path d="M84,70 L92,50"/>
      <path d="M106,74 L96,54"/>
      <path d="M118,94 L134,104"/>
      <path d="M110,114 L96,124"/>
      <path d="M92,106 L74,112"/>
      <path d="M76,98 L62,76"/>
      <path d="M118,94 L118,74"/>
      <path d="M110,114 L128,122"/>
      <path d="M84,70 L74,80"/>
      <path d="M100,134 L86,142"/>
    </g>
  </g>

  <!-- impact point -->
  <circle cx="100" cy="86" r="3.4" fill="#0A84FF" opacity="0.9" filter="url(#glow)"/>
  <circle cx="100" cy="86" r="6.5" fill="none" stroke="#0A84FF" stroke-width="0.8" opacity="0.6"/>
  <circle cx="100" cy="86" r="10" fill="none" stroke="#FFFFFF" stroke-width="0.4" opacity="0.35"/>

  <!-- technical corner brackets -->
  <g stroke="#8E8E93" stroke-width="1" fill="none" opacity="0.8">
    <path d="M12,20 L12,10 L22,10"/>
    <path d="M178,10 L188,10 L188,20"/>
    <path d="M188,180 L188,190 L178,190"/>
    <path d="M22,190 L12,190 L12,180"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#8E8E93" opacity="0.8">
    <text x="26" y="14" font-size="6">SHATTER.v2</text>
    <text x="152" y="193" font-size="6">100 kHz</text>
  </g>
  <g fill="#8E8E93" opacity="0.6">
    <circle cx="26" cy="190" r="1.2"/>
    <circle cx="32" cy="190" r="1.2"/>
    <circle cx="38" cy="190" r="1.2"/>
  </g>
</svg>