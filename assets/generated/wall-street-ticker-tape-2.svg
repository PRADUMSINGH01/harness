<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1F26" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#0A0A0A" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#15181F" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#4DA3FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="clip"><rect x="14" y="14" width="172" height="172" rx="38"/></clipPath>
  </defs>

  <!-- Glass container -->
  <g clip-path="url(#clip)">
    <rect x="14" y="14" width="172" height="172" rx="38" fill="url(#glass)"/>
    <rect x="14" y="14" width="172" height="172" rx="38" fill="url(#sheen)"/>
    <!-- subtle grid ticks -->
    <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
      <line x1="100" y1="14" x2="100" y2="186"/>
      <line x1="14" y1="100" x2="186" y2="100"/>
    </g>
  </g>
  <rect x="14" y="14" width="172" height="172" rx="38" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M30 44 v-10 a6 6 0 0 1 6 -6 h10"/>
    <path d="M170 44 v-10 a-6 6 0 0 0 -6 -6 h-10"/>
    <path d="M30 156 v10 a6 6 0 0 0 6 6 h10"/>
    <path d="M170 156 v10 a-6 6 0 0 1 -6 6 h-10"/>
  </g>

  <!-- Upper tape -->
  <g filter="url(#soft)" transform="rotate(-6 100 76)">
    <rect x="6" y="58" width="188" height="36" rx="8" fill="#0A0A0A" fill-opacity="0.9" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <rect x="6" y="58" width="188" height="36" rx="8" fill="url(#sheen)"/>
    <text x="18" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">AAPL</text>
    <text x="56" y="81" font-family="'SF Mono','Roboto Mono',monospace" font-size="11" fill="#8E8E93">228.68</text>
    <g filter="url(#glow)">
      <path d="M92 78 l5 -7 5 7 z" fill="#30D158"/>
      <text x="104" y="81" font-family="'SF Mono','Roboto Mono',monospace" font-size="11" fill="#30D158">+1.4%</text>
    </g>
    <text x="140" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">NVDA</text>
    <path d="M172 78 l5 7 5 -7 z" fill="#FF453A"/>
    <text x="172" y="70" font-family="'SF Mono','Roboto Mono',monospace" font-size="9" fill="#FF453A">-2.1%</text>
  </g>

  <!-- Lower tape -->
  <g filter="url(#soft)" transform="rotate(5 100 128)">
    <rect x="6" y="110" width="188" height="36" rx="8" fill="#0A0A0A" fill-opacity="0.9" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <rect x="6" y="110" width="188" height="36" rx="8" fill="url(#sheen)"/>
    <text x="16" y="133" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">TSLA</text>
    <text x="55" y="133" font-family="'SF Mono','Roboto Mono',monospace" font-size="11" fill="#8E8E93">412.30</text>
    <g filter="url(#glow)">
      <path d="M94 130 l5 -7 5 7 z" fill="#30D158"/>
      <text x="106" y="133" font-family="'SF Mono','Roboto Mono',monospace" font-size="11" fill="#30D158">+3.8%</text>
    </g>
    <text x="146" y="133" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="url(#blue)">MSFT</text>
    <text x="146" y="145" font-family="'SF Mono','Roboto Mono',monospace" font-size="8" fill="#8E8E93">447.12</text>
  </g>

  <!-- center sparkline accent -->
  <g stroke="#0A84FF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M62 101 l12 -8 10 6 12 -10 10 5 14 -9"/>
    <circle cx="132" cy="85" r="2.6" fill="#0A84FF" stroke="none"/>
  </g>
  <circle cx="168" cy="99" r="2" fill="#8E8E93"/>
  <circle cx="32" cy="101" r="2" fill="#8E8E93"/>
</svg>