<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#16202e"/>
      <stop offset="55%" stop-color="#0d1219"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="faceTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9EDF4"/>
      <stop offset="100%" stop-color="#B9C2D0"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#0a4fbf"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3f47"/>
      <stop offset="100%" stop-color="#14161b"/>
    </linearGradient>
    <linearGradient id="stickerTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#c8d2e0"/>
    </linearGradient>
    <linearGradient id="stickerBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4DA3FF"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="stickerGrey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8ADB4"/>
      <stop offset="100%" stop-color="#6c7178"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="innerBevel" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="blur"/>
      <feSpecular in="blur" surfaceScale="2.2" specularConstant="0.9" specularExponent="18" lighting-color="#ffffff" result="spec"/>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specClip"/>
      <feComposite in="SourceGraphic" in2="specClip" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glassSheen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- dark glass background -->
  <rect width="200" height="200" rx="24" fill="url(#bgGlow)"/>
  <rect x="0.5" y="0.5" width="199" height="199" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <rect x="6" y="6" width="188" height="188" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>

  <!-- ground glow -->
  <ellipse cx="100" cy="164" rx="58" ry="12" fill="#0A84FF" opacity="0.14" filter="url(#glassSheen)"/>

  <g transform="translate(100 104)">
    <!-- misaligned corner cubie: top, left, right faces, slightly rotated -->
    <g transform="rotate(-4)" filter="url(#softShadow)">
      <!-- TOP face (white) -->
      <path d="M0 -52 L54 -24 L0 4 L-54 -24 Z" fill="url(#faceTop)" filter="url(#innerBevel)"/>
      <!-- LEFT face (blue) -->
      <path d="M-54 -24 L0 4 L0 52 L-54 24 Z" fill="url(#faceLeft)" filter="url(#innerBevel)"/>
      <!-- RIGHT face (grey) -->
      <path d="M54 -24 L0 4 L0 52 L54 24 Z" fill="url(#faceRight)" filter="url(#innerBevel)"/>

      <!-- TOP stickers -->
      <g stroke="#1c2026" stroke-opacity="0.35" stroke-width="1.4" stroke-linejoin="round">
        <path d="M0 -46 L44 -23 L0 0 L-44 -23 Z" fill="url(#stickerTop)"/>
        <path d="M0 -46 L20 -36 L0 -26 L-20 -36 Z" fill="url(#stickerTop)"/>
        <path d="M20 -36 L44 -23 L22 -11.5 L0 -26 Z" fill="url(#stickerTop)"/>
        <path d="M-20 -36 L0 -26 L0 -6 L-42 -23 Z" fill="url(#stickerTop)"/>
        <path d="M0 -26 L22 -11.5 L0 0 L-42 -23 Z" fill="url(#stickerTop)" opacity="0" />
      </g>
      <!-- top sticker seams -->
      <g stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.1" fill="none" stroke-linecap="round">
        <path d="M0 -46 L44 -23 L0 0 L-44 -23 Z"/>
        <path d="M0 -46 L0 0"/>
        <path d="M-22 -34.5 L22 -34.5"/>
        <path d="M-44 -23 L0 0"/>
        <path d="M22 -11.5 L0 0"/>
      </g>

      <!-- LEFT stickers (blue) -->
      <g stroke="#020d1e" stroke-opacity="0.4" stroke-width="1.2" stroke-linejoin="round">
        <path d="M-48 -21 L-48 21 L-6 43 L-6 -1 Z" fill="url(#stickerBlue)"/>
      </g>
      <g stroke="#03142e" stroke-opacity="0.5" stroke-width="1.1" fill="none">
        <path d="M-48 -21 L-48 21 L-6 43 L-6 -1 Z"/>
        <path d="M-48 -1 L-6 -1"/>
        <path d="M-48 21 L-6 21"/>
      </g>

      <!-- RIGHT stickers (grey) -->
      <g stroke="#08090c" stroke-opacity="0.5" stroke-width="1.2" stroke-linejoin="round">
        <path d="M6 -1 L6 43 L48 21 L48 -21 Z" fill="url(#stickerGrey)"/>
      </g>
      <g stroke="#08090c" stroke-opacity="0.55" stroke-width="1.1" fill="none">
        <path d="M6 -1 L6 43 L48 21 L48 -21 Z"/>
        <path d="M6 21 L48 21"/>
        <path d="M6 -1 L48 -21"/>
      </g>

      <!-- edge highlights -->
      <path d="M0 -52 L54 -24" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M0 -52 L-54 -24" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M-54 -24 L-54 24" stroke="#7FBFFF" stroke-opacity="0.5" stroke-width="1"/>
      <path d="M54 -24 L54 24" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
      <path d="M0 4 L0 52" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>
    </g>

    <!-- glass sheen overlay -->
    <g opacity="0.16" filter="url(#glassSheen)" pointer-events="none">
      <path d="M-30 -50 L10 -66 L52 -30 L-4 -6 Z" fill="#FFFFFF"/>
    </g>

    <!-- misalignment glow accent -->
    <g filter="url(#glow)">
      <path d="M0 -58 L60 -28" stroke="#0A84FF" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8"/>
      <circle cx="60" cy="-28" r="2.4" fill="#0A84FF"/>
    </g>

    <!-- technical crosshair markers -->
    <g stroke="#8E8E93" stroke-opacity="0.5" stroke-width="1">
      <path d="M-76 -40 h8 M-72 -44 v8" />
      <path d="M68 30 h8 M72 26 v8" />
    </g>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="7" fill="#8E8E93" fill-opacity="0.6">
      <text x="-88" y="52" transform="rotate(-90 -88 52)">ROT -04.0°</text>
      <text x="58" y="72">AXIS X/Y</text>
    </g>
  </g>
</svg>