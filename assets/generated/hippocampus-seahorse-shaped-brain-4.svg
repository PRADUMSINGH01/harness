<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glassCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1D24" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="seahorseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#5AC8FA"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vaultGrad" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#3A3F47"/>
      <stop offset="1" stop-color="#1A1D24"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- dark glass card -->
  <rect x="6" y="6" width="188" height="188" rx="24" fill="url(#glassCard)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
  <rect x="6" y="6" width="188" height="188" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="3"/>
  <!-- corner brackets -->
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M14 30 V18 Q14 14 18 14 H30"/>
    <path d="M170 14 H182 Q186 14 186 18 V30"/>
    <path d="M186 170 V182 Q186 186 182 186 H170"/>
    <path d="M30 186 H18 Q14 186 14 182 V170"/>
  </g>

  <!-- hippocampus seahorse (left) -->
  <g transform="translate(0,0)">
    <circle cx="52" cy="104" r="34" fill="url(#nodeGlow)"/>
    <g filter="url(#glow)">
      <path d="M38 132 C30 132 24 124 24 116 C24 108 30 104 36 104 C40 104 42 101 42 96 C42 90 38 88 38 82 C38 74 44 68 52 68 C60 68 66 74 66 82 C66 88 62 92 62 98 C62 104 66 106 66 112 C66 120 60 126 54 126 C50 126 48 124 46 126 C44 128 46 132 50 133 C54 134 56 137 52 138 C48 139 42 132 38 132 Z"
            fill="none" stroke="url(#seahorseGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- snout -->
      <path d="M40 72 C34 70 30 68 26 70" fill="none" stroke="#5AC8FA" stroke-width="2.4" stroke-linecap="round"/>
      <!-- fin -->
      <path d="M64 96 C70 94 72 90 71 86 C68 90 66 92 63 93" fill="none" stroke="#5AC8FA" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- firing nucleus -->
    <circle cx="52" cy="100" r="7" fill="#FFFFFF" filter="url(#glow)"/>
    <circle cx="52" cy="100" r="13" fill="none" stroke="#0A84FF" stroke-opacity="0.6" stroke-width="1"/>
    <!-- neural tick marks -->
    <g stroke="#8E8E93" stroke-width="1" stroke-opacity="0.7" stroke-linecap="round">
      <line x1="30" y1="70" x2="34" y2="74"/>
      <line x1="74" y1="76" x2="70" y2="80"/>
      <line x1="26" y1="122" x2="31" y2="120"/>
    </g>
  </g>

  <!-- signal beam toward vault -->
  <g>
    <line x1="68" y1="100" x2="122" y2="100" stroke="#0A84FF" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round" filter="url(#softGlow)"/>
    <line x1="70" y1="100" x2="120" y2="100" stroke="#0A84FF" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 5"/>
    <!-- signal packets -->
    <circle cx="86" cy="100" r="2.6" fill="#FFFFFF" filter="url(#glow)"/>
    <circle cx="98" cy="100" r="2" fill="#5AC8FA"/>
    <circle cx="110" cy="100" r="2.6" fill="#FFFFFF" filter="url(#glow)"/>
  </g>

  <!-- vault (right) -->
  <g>
    <rect x="122" y="70" width="52" height="60" rx="8" fill="url(#vaultGrad)" stroke="#8E8E93" stroke-width="1.4"/>
    <rect x="122" y="70" width="52" height="60" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
    <!-- dial -->
    <circle cx="148" cy="96" r="16" fill="#0A0A0A" stroke="#8E8E93" stroke-width="2"/>
    <circle cx="148" cy="96" r="11" fill="none" stroke="#0A84FF" stroke-opacity="0.7" stroke-width="1.4"/>
    <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round">
      <line x1="148" y1="86" x2="148" y2="89"/>
      <line x1="158" y1="96" x2="155" y2="96"/>
      <line x1="148" y1="106" x2="148" y2="103"/>
      <line x1="138" y1="96" x2="141" y2="96"/>
    </g>
    <line x1="148" y1="96" x2="155" y2="89" stroke="#0A84FF" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="148" cy="96" r="2" fill="#FFFFFF"/>
    <!-- handle spokes -->
    <g stroke="#8E8E93" stroke-width="1.4" stroke-linecap="round">
      <line x1="148" y1="80" x2="148" y2="85"/>
      <line x1="148" y1="112" x2="148" y2="107"/>
      <line x1="132" y1="96" x2="137" y2="96"/>
      <line x1="164" y1="96" x2="159" y2="96"/>
    </g>
    <!-- label -->
    <text x="148" y="122" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.2" fill="#FFFFFF" fill-opacity="0.9">LONG-TERM</text>
    <text x="148" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.2" fill="#8E8E93">STORAGE</text>
  </g>

  <!-- micro ticks along baseline -->
  <g stroke="#8E8E93" stroke-opacity="0.4" stroke-width="1" stroke-linecap="round">
    <line x1="60" y1="172" x2="60" y2="176"/>
    <line x1="80" y1="172" x2="80" y2="176"/>
    <line x1="100" y1="172" x2="100" y2="176"/>
    <line x1="120" y1="172" x2="120" y2="176"/>
    <line x1="140" y1="172" x2="140" y2="176"/>
  </g>
</svg>