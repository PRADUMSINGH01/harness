<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="glassClip"><rect x="10" y="10" width="180" height="180" rx="24"/></clipPath>
  </defs>

  <!-- dark glass card -->
  <g filter="url(#softShadow)">
    <rect x="10" y="10" width="180" height="180" rx="24" fill="#0A0A0A"/>
    <rect x="10" y="10" width="180" height="180" rx="24" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
  </g>
  <g clip-path="url(#glassClip)">
    <rect x="10" y="10" width="180" height="180" fill="url(#bgGlow)"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-opacity="0.7" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M20 30 v-8 h8"/><path d="M180 30 v-8 h-8"/>
    <path d="M20 170 v8 h8"/><path d="M180 170 v8 h-8"/>
  </g>

  <!-- grid lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1">
    <line x1="42" y1="42" x2="172" y2="42"/>
    <line x1="42" y1="72" x2="172" y2="72"/>
    <line x1="42" y1="102" x2="172" y2="102"/>
    <line x1="42" y1="132" x2="172" y2="132"/>
  </g>

  <!-- axis -->
  <line x1="42" y1="34" x2="42" y2="160" stroke="#8E8E93" stroke-width="1.5"/>
  <line x1="42" y1="160" x2="172" y2="160" stroke="#8E8E93" stroke-width="1.5"/>

  <!-- bars: logarithmic heights -->
  <g>
    <rect x="50" y="138" width="16" height="22" rx="3" fill="url(#barGrad)"/>
    <rect x="74" y="120" width="16" height="40" rx="3" fill="url(#barGrad)"/>
    <rect x="98" y="100" width="16" height="60" rx="3" fill="url(#barGrad)"/>
    <rect x="122" y="76" width="16" height="84" rx="3" fill="url(#barGrad)" filter="url(#glow)"/>
    <rect x="146" y="50" width="16" height="110" rx="3" fill="url(#barGrad)"/>
  </g>
  <!-- value ticks on bars -->
  <g fill="#FFFFFF" fill-opacity="0.85">
    <circle cx="58" cy="132" r="1.6"/><circle cx="82" cy="114" r="1.6"/>
    <circle cx="106" cy="94" r="1.6"/><circle cx="130" cy="70" r="1.6"/>
    <circle cx="154" cy="44" r="1.6"/>
  </g>

  <!-- x labels (log scale) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#8E8E93" text-anchor="middle">
    <text x="58" y="171">1ms</text>
    <text x="82" y="171">10ms</text>
    <text x="106" y="171">100ms</text>
    <text x="130" y="171">1s</text>
    <text x="154" y="171">10s</text>
  </g>
  <text x="24" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#8E8E93" text-anchor="middle" transform="rotate(-90 24 120)">TIME</text>

  <!-- infinite icon -->
  <g filter="url(#glow)">
    <path d="M78 52 C70 44 58 44 54 52 C50 60 58 68 66 68 C70 68 74 66 78 60 C82 54 86 52 90 52 C98 52 106 52 110 52 C118 52 126 44 122 36 C118 28 106 28 102 36 C98 42 94 44 90 44 Z"
      transform="translate(4,16) scale(0.9)" fill="none" stroke="#0A84FF" stroke-width="3.2" stroke-linecap="round"/>
  </g>
  <!-- sparkline accent -->
  <polyline points="52,98 72,104 92,86 112,90 132,66 152,72 168,58" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 2"/>
</svg>