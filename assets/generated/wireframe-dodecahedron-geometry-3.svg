<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#12203a" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#0A0A0A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edgeFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="200" height="200" fill="#0A0A0A" opacity="0.35"/>
  <circle cx="100" cy="96" r="88" fill="url(#bgGlow)"/>

  <!-- HUD accents -->
  <g stroke="#8E8E93" opacity="0.45">
    <circle cx="100" cy="96" r="90" fill="none" stroke-width="0.5" stroke-dasharray="2 4"/>
    <line x1="100" y1="4" x2="100" y2="12" stroke-width="0.7"/>
    <line x1="100" y1="180" x2="100" y2="188" stroke-width="0.7"/>
    <line x1="8" y1="96" x2="16" y2="96" stroke-width="0.7"/>
    <line x1="184" y1="96" x2="192" y2="96" stroke-width="0.7"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" fill="#8E8E93">
    <text x="14" y="22" font-size="6" letter-spacing="1.5">DODECAHEDRON</text>
    <text x="14" y="30" font-size="5" opacity="0.7" letter-spacing="1">20F · 30E · 12V</text>
    <text x="152" y="190" font-size="5" opacity="0.7" letter-spacing="1">SCHLÄFLI {5,3}</text>
  </g>
  <g stroke="#0A84FF" stroke-width="1" fill="none" opacity="0.8">
    <path d="M20 168 h10 M20 168 v-10"/>
    <path d="M180 168 h-10 M180 168 v-10"/>
  </g>

  <!-- Dodecahedron (front-facing view) -->
  <!-- Back faces (dimmer) -->
  <g fill="none" stroke="#8E8E93" stroke-width="0.8" stroke-linejoin="round" opacity="0.4">
    <path d="M52 74 L66 44 L96 38 L96 60 L72 76 Z"/>
    <path d="M52 74 L72 76 L76 106 L54 108 Z"/>
    <path d="M96 38 L124 36 L142 50 L120 68 L96 60 Z"/>
    <path d="M142 50 L152 82 L134 112 L120 68"/>
    <path d="M76 106 L100 132 L100 156 L60 148 L54 108"/>
    <path d="M100 132 L128 124 L148 134 L100 156"/>
  </g>

  <!-- Front faces (glowing) -->
  <g fill="none" stroke="url(#edgeFront)" stroke-width="1.4" stroke-linejoin="round" filter="url(#glow)">
    <path d="M52 74 L96 60 L120 68 L112 100 L76 106 L72 76 Z"/>
    <path d="M96 60 L96 38 L124 36 L120 68"/>
    <path d="M112 100 L134 96 L146 120 L128 148 L100 132"/>
    <path d="M112 100 L100 132"/>
    <path d="M128 148 L100 156"/>
  </g>

  <!-- Glow echo -->
  <g fill="none" stroke="#0A84FF" stroke-width="3" opacity="0.25" filter="url(#softGlow)" stroke-linejoin="round">
    <path d="M52 74 L96 60 L120 68 L112 100 L76 106 Z"/>
    <path d="M112 100 L134 96 L146 120 L128 148 L100 132 Z"/>
  </g>

  <!-- Vertices -->
  <g fill="#FFFFFF">
    <circle cx="52" cy="74" r="2.1"/><circle cx="96" cy="60" r="2.4"/>
    <circle cx="120" cy="68" r="2.1"/><circle cx="112" cy="100" r="2.4"/>
    <circle cx="76" cy="106" r="2.1"/><circle cx="134" cy="96" r="2.1"/>
    <circle cx="146" cy="120" r="2.1"/><circle cx="128" cy="148" r="2.1"/>
    <circle cx="100" cy="132" r="2.1"/><circle cx="100" cy="156" r="2.1"/>
    <circle cx="124" cy="36" r="1.8"/><circle cx="96" cy="38" r="1.6"/>
    <circle cx="72" cy="76" r="1.6"/><circle cx="66" cy="44" r="1.3"/>
    <circle cx="142" cy="50" r="1.3"/><circle cx="152" cy="82" r="1.3"/>
    <circle cx="54" cy="108" r="1.3"/><circle cx="60" cy="148" r="1.3"/>
  </g>
  <circle cx="96" cy="60" r="5.5" fill="none" stroke="#0A84FF" stroke-width="0.6" opacity="0.8"/>
  <circle cx="112" cy="100" r="5.5" fill="none" stroke="#0A84FF" stroke-width="0.6" opacity="0.8"/>

  <!-- Corner brackets -->
  <g stroke="#8E8E93" stroke-width="1" fill="none" opacity="0.7">
    <path d="M6 6 h12 M6 6 v12"/>
    <path d="M194 6 h-12 M194 6 v12"/>
    <path d="M6 194 h12 M6 194 v-12"/>
    <path d="M194 194 h-12 M194 194 v-12"/>
  </g>
</svg>