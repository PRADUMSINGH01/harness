<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="dataFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="dbBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="20" y="20" width="160" height="160" rx="38"/>
    </clipPath>
  </defs>

  <!-- dark glass card -->
  <g filter="url(#softShadow)">
    <rect x="20" y="20" width="160" height="160" rx="38" fill="#0A0A0A"/>
    <rect x="20" y="20" width="160" height="160" rx="38" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>
  </g>
  <g clip-path="url(#cardClip)">
    <!-- subtle grid ticks -->
    <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1">
      <path d="M20 60 H180 M20 100 H180 M20 140 H180"/>
      <path d="M60 20 V180 M100 20 V180 M140 20 V180"/>
    </g>
    <!-- corner brackets -->
    <g stroke="#0A84FF" stroke-opacity="0.7" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M32 48 V36 a4 4 0 0 1 4 -4 H48"/>
      <path d="M168 48 V36 a4 4 0 0 0 -4 -4 H152"/>
      <path d="M32 152 V164 a4 4 0 0 0 4 4 H48"/>
      <path d="M168 152 V164 a4 4 0 0 1 -4 4 H152"/>
    </g>
    <!-- harvest streams (upward arrows to cloud-free abstract) -->
    <g stroke-linecap="round" filter="url(#glow)">
      <path d="M78 118 V70" stroke="url(#dataFlow)" stroke-width="3.5" opacity="0.9"/>
      <path d="M100 124 V60" stroke="url(#dataFlow)" stroke-width="3.5"/>
      <path d="M122 118 V70" stroke="url(#dataFlow)" stroke-width="3.5" opacity="0.9"/>
    </g>
    <g stroke="#0A84FF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M71 78 L78 70 L85 78"/>
      <path d="M93 68 L100 60 L107 68"/>
      <path d="M115 78 L122 70 L129 78"/>
    </g>
  </g>

  <!-- database stack -->
  <g filter="url(#softShadow)">
    <ellipse cx="100" cy="126" rx="34" ry="11" fill="#FFFFFF" fill-opacity="0.16" stroke="#8E8E93" stroke-width="1.5"/>
    <path d="M66 126 V104 A34 11 0 0 0 134 104 V126 A34 11 0 0 1 66 126 Z" fill="url(#dbBody)" stroke="#8E8E93" stroke-width="1.5"/>
    <ellipse cx="100" cy="104" rx="34" ry="11" fill="#0A0A0A" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <ellipse cx="100" cy="104" rx="20" ry="5.5" fill="none" stroke="#0A84FF" stroke-opacity="0.8" stroke-width="1.5"/>
  </g>

  <!-- alert badge -->
  <g filter="url(#glow)">
    <circle cx="142" cy="62" r="26" fill="url(#badge)" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="138.5" y="48" width="7" height="18" rx="3.5" fill="#FFFFFF"/>
    <circle cx="142" cy="73" r="4" fill="#FFFFFF"/>
  </g>

  <!-- status dot -->
  <circle cx="58" cy="140" r="4" fill="#0A84FF" opacity="0.9"/>
</svg>