<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="glassBg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1A1A1E"/>
      <stop offset="60%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#8E8E93" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- dark glass plate -->
  <rect x="0" y="0" width="200" height="200" rx="24" fill="url(#glassBg)"/>
  <rect x="0.5" y="0.5" width="199" height="199" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- outer faint halo ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#8E8E93" stroke-opacity="0.15" stroke-width="0.75"/>

  <!-- tick ring (60 ticks) -->
  <g stroke="#8E8E93" stroke-opacity="0.55" stroke-width="1">
    <g id="ticks">
      <line x1="100" y1="20" x2="100" y2="27" stroke="#FFFFFF" stroke-opacity="0.7"/>
      <line x1="100" y1="173" x2="100" y2="180" stroke="#FFFFFF" stroke-opacity="0.7"/>
      <line x1="20" y1="100" x2="27" y2="100" stroke="#FFFFFF" stroke-opacity="0.7"/>
      <line x1="173" y1="100" x2="180" y2="100" stroke="#FFFFFF" stroke-opacity="0.7"/>
    </g>
    <g transform="rotate(30 100 100)">
      <line x1="100" y1="21" x2="100" y2="26"/>
      <line x1="100" y1="174" x2="100" y2="179"/>
      <line x1="21" y1="100" x2="26" y2="100"/>
      <line x1="174" y1="100" x2="179" y2="100"/>
    </g>
    <g transform="rotate(60 100 100)">
      <line x1="100" y1="21" x2="100" y2="26"/>
      <line x1="100" y1="174" x2="100" y2="179"/>
      <line x1="21" y1="100" x2="26" y2="100"/>
      <line x1="174" y1="100" x2="179" y2="100"/>
    </g>
    <g transform="rotate(90 100 100)">
      <line x1="100" y1="21" x2="100" y2="26"/>
      <line x1="100" y1="174" x2="100" y2="179"/>
      <line x1="21" y1="100" x2="26" y2="100"/>
      <line x1="174" y1="100" x2="179" y2="100"/>
    </g>
    <g transform="rotate(120 100 100)">
      <line x1="100" y1="21" x2="100" y2="26"/>
      <line x1="100" y1="174" x2="100" y2="179"/>
      <line x1="21" y1="100" x2="26" y2="100"/>
      <line x1="174" y1="100" x2="179" y2="100"/>
    </g>
    <g transform="rotate(150 100 100)">
      <line x1="100" y1="21" x2="100" y2="26"/>
      <line x1="100" y1="174" x2="100" y2="179"/>
      <line x1="21" y1="100" x2="26" y2="100"/>
      <line x1="174" y1="100" x2="179" y2="100"/>
    </g>
  </g>

  <!-- main seal rings -->
  <g filter="url(#softShadow)">
    <circle cx="100" cy="100" r="76" fill="none" stroke="url(#ringGrad)" stroke-width="2.5"/>
    <circle cx="100" cy="100" r="68" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="100" cy="100" r="46" fill="none" stroke="#0A84FF" stroke-opacity="0.6" stroke-width="1.25" filter="url(#glow)"/>
    <circle cx="100" cy="100" r="42" fill="none" stroke="#8E8E93" stroke-opacity="0.4" stroke-width="0.75" stroke-dasharray="2 4"/>
  </g>

  <!-- five-pointed star (California seal star) -->
  <path filter="url(#glow)" fill="url(#starGrad)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.5"
        d="M100 62 L110.16 88.62 L139.02 90.20 L116.51 108.05 L124.14 135.92 L100 120.4 L75.86 135.92 L83.49 108.05 L60.98 90.20 L89.84 88.62 Z"/>

  <!-- inner crosshair accents -->
  <g stroke="#0A84FF" stroke-opacity="0.7" stroke-width="1" stroke-linecap="round">
    <line x1="100" y1="48" x2="100" y2="54"/>
    <line x1="100" y1="146" x2="100" y2="152"/>
    <line x1="48" y1="100" x2="54" y2="100"/>
    <line x1="146" y1="100" x2="152" y2="100"/>
  </g>
  <circle cx="100" cy="100" r="2" fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- corner brackets -->
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M16 30 V16 H30"/>
    <path d="M170 16 H184 V30"/>
    <path d="M184 170 V184 H170"/>
    <path d="M30 184 H16 V170"/>
  </g>

  <!-- spark accents -->
  <circle cx="146" cy="54" r="1.6" fill="#0A84FF" fill-opacity="0.9" filter="url(#glow)"/>
  <circle cx="55" cy="146" r="1.2" fill="#FFFFFF" fill-opacity="0.7"/>
  <circle cx="158" cy="120" r="1" fill="#8E8E93"/>
</svg>