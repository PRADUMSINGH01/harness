<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="url(#bgGlow)"/>

  <!-- grid ticks -->
  <g stroke="#8E8E93" stroke-opacity="0.18" stroke-width="0.5">
    <path d="M20 170h160M20 150h160M20 130h160M20 110h160"/>
    <path d="M40 165v10M80 165v10M120 165v10M160 165v10"/>
  </g>

  <!-- emanator bar -->
  <rect x="55" y="14" width="90" height="8" rx="4" fill="url(#glass)" stroke="#8E8E93" stroke-opacity="0.4" stroke-width="0.6"/>
  <rect x="60" y="16" width="80" height="4" rx="2" fill="#0A84FF" opacity="0.5"/>

  <!-- beam glow -->
  <g>
    <path d="M70 22 L95 178 L65 178 Z" fill="#0A84FF" opacity="0.25" filter="url(#soft)"/>
    <path d="M74 22 L100 178 L72 178 Z" fill="url(#beam)" filter="url(#glow)"/>
    <path d="M76 22 L94 178 L82 178 Z" fill="url(#beamCore)"/>
  </g>

  <!-- scan point / reflected spot -->
  <g filter="url(#glow)">
    <ellipse cx="88" cy="178" rx="16" ry="5" fill="#0A84FF" opacity="0.6"/>
    <ellipse cx="88" cy="178" rx="7" ry="2.4" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- glass panel corner brackets -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.2" stroke-linecap="round">
    <path d="M30 40v-12h12"/>
    <path d="M158 40v-12h-12"/>
    <path d="M30 190v-12h12" opacity="0.7"/>
    <path d="M158 190v-12h-12" opacity="0.7"/>
  </g>

  <!-- detector nodes -->
  <g fill="#8E8E93" opacity="0.8">
    <circle cx="30" cy="28" r="2"/>
    <circle cx="170" cy="28" r="2"/>
  </g>
  <g stroke="#0A84FF" stroke-width="1" opacity="0.7">
    <circle cx="30" cy="28" r="5" fill="none"/>
    <circle cx="170" cy="28" r="5" fill="none"/>
  </g>
</svg>