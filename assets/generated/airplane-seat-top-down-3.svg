<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cabin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161c"/>
      <stop offset="0.5" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#101218"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#4DA3FF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Cabin fuselage outline -->
  <g filter="url(#soft)">
    <path d="M100 8 C 146 8 168 34 170 74 L 170 150 C 170 168 158 178 140 178 L 60 178 C 42 178 30 168 30 150 L 30 74 C 32 34 54 8 100 8 Z"
          fill="url(#cabin)" stroke="#8E8E93" stroke-opacity="0.55" stroke-width="2"/>
  </g>
  <!-- glass sheen -->
  <path d="M100 8 C 146 8 168 34 170 74 L 170 116 L 30 116 L 30 74 C 32 34 54 8 100 8 Z"
        fill="url(#glass)" opacity="0.6"/>

  <!-- Seat template: centered at 0,0, seat ~26x34 -->
  <defs>
    <g id="seat">
      <rect x="-12" y="-15" width="24" height="34" rx="7" fill="#161922" stroke="#8E8E93" stroke-opacity="0.4" stroke-width="1.4"/>
      <rect x="-9" y="-12" width="18" height="9" rx="4.5" fill="#ffffff" opacity="0.08"/>
      <rect x="-7" y="3" width="14" height="12" rx="4" fill="#ffffff" opacity="0.10"/>
    </g>
    <g id="seatAccent">
      <rect x="-12" y="-15" width="24" height="34" rx="7" fill="#0d2036" stroke="url(#accent)" stroke-width="1.6" filter="url(#glow)"/>
      <rect x="-9" y="-12" width="18" height="9" rx="4.5" fill="url(#accent)" opacity="0.35"/>
      <rect x="-7" y="3" width="14" height="12" rx="4" fill="#0A84FF" opacity="0.55"/>
    </g>
  </defs>

  <!-- Left triple (aisle at x=100) -->
  <g>
    <use href="#seat" x="48" y="52"/>
    <use href="#seat" x="48" y="98"/>
    <use href="#seatAccent" x="48" y="144"/>
  </g>
  <!-- Right triple -->
  <g>
    <use href="#seat" x="118" y="52"/>
    <use href="#seatAccent" x="118" y="98"/>
    <use href="#seat" x="118" y="144"/>
  </g>

  <!-- Armrest ticks between seats -->
  <g stroke="#8E8E93" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round">
    <path d="M48 73 h0 M48 119 h0 M118 73 h0 M118 119 h0"/>
  </g>

  <!-- Aisle dashed guide -->
  <path d="M100 40 V 168" stroke="#0A84FF" stroke-opacity="0.30" stroke-width="1.4" stroke-dasharray="3 6" stroke-linecap="round"/>

  <!-- Nose direction tick -->
  <g stroke="#8E8E93" stroke-width="1.6" stroke-linecap="round">
    <path d="M88 26 L100 16 L112 26" fill="none" stroke-opacity="0.6"/>
  </g>

  <!-- Corner brackets -->
  <g stroke="#0A84FF" stroke-opacity="0.8" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M8 22 V10 H20"/>
    <path d="M192 22 V10 H180"/>
    <path d="M8 178 V190 H20"/>
    <path d="M192 178 V190 H180"/>
  </g>
</svg>