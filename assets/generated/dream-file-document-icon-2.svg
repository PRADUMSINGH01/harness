<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1C1E"/>
      <stop offset="0.55" stop-color="#121214"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="tabG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0A4FA0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- folder tab, right edge dissolving into shards -->
  <g filter="url(#soft)">
    <path d="M40 44 h58 l6 8 h6 l6 -8 h10 v14 H40 Z" fill="url(#tabG)" opacity="0.95"/>
    <g filter="url(#glow)">
      <rect x="130" y="46" width="6" height="6" fill="#0A84FF" opacity="0.9"/>
      <rect x="140" y="42" width="4" height="4" fill="#FFFFFF" opacity="0.8"/>
      <rect x="148" y="52" width="8" height="5" fill="#0A84FF" opacity="0.65"/>
      <rect x="158" y="44" width="4" height="4" fill="#5AB8FF" opacity="0.55"/>
      <rect x="164" y="56" width="6" height="6" fill="#FFFFFF" opacity="0.4"/>
      <rect x="156" y="34" width="5" height="5" fill="#0A84FF" opacity="0.5"/>
      <rect x="172" y="48" width="3" height="3" fill="#8E8E93" opacity="0.45"/>
      <rect x="178" y="60" width="4" height="3" fill="#5AB8FF" opacity="0.35"/>
    </g>
  </g>

  <!-- document sheet -->
  <g filter="url(#soft)">
    <path d="M40 56 h110 l20 20 v82 a10 10 0 0 1 -10 10 H50 a10 10 0 0 1 -10 -10 Z" fill="url(#sheet)" stroke="#3A3A3E" stroke-width="1.5"/>
    <path d="M150 56 l20 20 h-14 a6 6 0 0 1 -6 -6 Z" fill="#2A2A2E" stroke="#4A4A50" stroke-width="1"/>
    <path d="M40 56 h110 l20 20 v82 a10 10 0 0 1 -10 10 H50 a10 10 0 0 1 -10 -10 Z" fill="url(#glass)" stroke="none"/>
  </g>

  <!-- text lines -->
  <g>
    <rect x="58" y="92" width="80" height="5" rx="2.5" fill="#FFFFFF" opacity="0.55"/>
    <rect x="58" y="106" width="96" height="5" rx="2.5" fill="#8E8E93" opacity="0.6"/>
    <rect x="58" y="120" width="66" height="5" rx="2.5" fill="#8E8E93" opacity="0.45"/>
    <rect x="58" y="134" width="88" height="5" rx="2.5" fill="#8E8E93" opacity="0.35"/>
    <rect x="58" y="148" width="48" height="5" rx="2.5" fill="#0A84FF" opacity="0.7"/>
  </g>

  <!-- corner brackets + accent ticks -->
  <g stroke="#0A84FF" stroke-width="2" fill="none" opacity="0.85">
    <path d="M50 78 v-8 h8"/>
    <path d="M142 168 h8 v-8" opacity="0.5"/>
  </g>
  <g fill="#FFFFFF" opacity="0.35">
    <rect x="120" y="92" width="3" height="3"/>
    <rect x="128" y="120" width="2" height="2"/>
  </g>
</svg>