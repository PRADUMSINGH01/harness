<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#0A84FF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flowStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0A84FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- dark glass base -->
  <rect x="0" y="0" width="200" height="200" rx="24" fill="#0A0A0A"/>
  <rect x="0" y="0" width="200" height="200" rx="24" fill="url(#bgGlow)"/>
  <rect x="0.5" y="0.5" width="199" height="199" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- faint technical grid -->
  <g stroke="#8E8E93" stroke-opacity="0.07" stroke-width="0.5">
    <path d="M40 0V200M80 0V200M120 0V200M160 0V200"/>
    <path d="M0 40H200M0 80H200M0 120H200M0 160H200"/>
  </g>

  <!-- flowing bezier streams -->
  <g fill="none" stroke-linecap="round">
    <path d="M-5 140 C 45 130, 60 90, 100 100 S 165 70, 205 55" stroke="url(#flowStroke)" stroke-width="1.2" opacity="0.9"/>
    <path d="M-5 110 C 50 118, 75 60, 118 78 S 175 105, 205 95" stroke="url(#flowStroke)" stroke-width="1" opacity="0.7" transform="translate(0,0)"/>
    <path d="M-5 75 C 40 60, 85 120, 130 115 S 180 140, 205 150" stroke="url(#flowStroke)" stroke-width="0.9" opacity="0.6"/>
    <path d="M-5 165 C 55 160, 90 135, 135 140 S 185 120, 205 118" stroke="url(#flowStroke)" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- connection links -->
  <g stroke="#8E8E93" stroke-opacity="0.35" stroke-width="0.6">
    <line x1="100" y1="100" x2="58" y2="72"/>
    <line x1="100" y1="100" x2="142" y2="66"/>
    <line x1="100" y1="100" x2="146" y2="132"/>
    <line x1="100" y1="100" x2="56" y2="134"/>
    <line x1="58" y1="72" x2="142" y2="66"/>
    <line x1="56" y1="134" x2="146" y2="132"/>
    <line x1="58" y1="72" x2="30" y2="48"/>
    <line x1="142" y1="66" x2="172" y2="42"/>
    <line x1="146" y1="132" x2="176" y2="158"/>
    <line x1="56" y1="134" x2="26" y2="158"/>
  </g>

  <!-- outer particle nodes -->
  <g filter="url(#softGlow)">
    <circle cx="30" cy="48" r="2.4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="172" cy="42" r="2" fill="#0A84FF" opacity="0.9"/>
    <circle cx="176" cy="158" r="2.6" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="26" cy="158" r="1.8" fill="#0A84FF" opacity="0.85"/>
    <circle cx="18" cy="104" r="1.5" fill="#8E8E93" opacity="0.9"/>
    <circle cx="184" cy="92" r="1.7" fill="#8E8E93" opacity="0.9"/>
  </g>

  <!-- mid-tier nodes -->
  <g filter="url(#softGlow)">
    <circle cx="58" cy="72" r="4.5" fill="url(#nodeCore)"/>
    <circle cx="142" cy="66" r="4" fill="url(#nodeCore)"/>
    <circle cx="146" cy="132" r="5" fill="url(#nodeCore)"/>
    <circle cx="56" cy="134" r="3.6" fill="url(#nodeCore)"/>
    <circle cx="58" cy="72" r="1.6" fill="#FFFFFF"/>
    <circle cx="142" cy="66" r="1.4" fill="#FFFFFF"/>
    <circle cx="146" cy="132" r="1.8" fill="#FFFFFF"/>
    <circle cx="56" cy="134" r="1.3" fill="#FFFFFF"/>
  </g>

  <!-- central luminous hub -->
  <circle cx="100" cy="100" r="26" fill="#0A84FF" opacity="0.06"/>
  <circle cx="100" cy="100" r="14" fill="#0A84FF" opacity="0.1" filter="url(#glow)"/>
  <g filter="url(#glow)">
    <circle cx="100" cy="100" r="8" fill="url(#nodeCore)"/>
    <circle cx="100" cy="100" r="3.2" fill="#FFFFFF"/>
  </g>
  <circle cx="100" cy="100" r="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="0.6"/>
  <circle cx="100" cy="100" r="18" fill="none" stroke="#0A84FF" stroke-opacity="0.3" stroke-width="0.5" stroke-dasharray="2 4"/>

  <!-- corner brackets -->
  <g stroke="#8E8E93" stroke-opacity="0.5" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M10 22V12H20"/>
    <path d="M180 12H190V22"/>
    <path d="M190 178V188H180"/>
    <path d="M20 188H10V178"/>
  </g>

  <!-- drifting micro particles -->
  <g fill="#FFFFFF" filter="url(#softGlow)">
    <circle cx="76" cy="52" r="1" opacity="0.7"/>
    <circle cx="124" cy="88" r="0.9" opacity="0.6"/>
    <circle cx="88" cy="150" r="1.1" opacity="0.55"/>
    <circle cx="160" cy="108" r="0.9" opacity="0.5"/>
    <circle cx="42" cy="96" r="0.8" opacity="0.6"/>
    <circle cx="118" cy="158" r="0.9" opacity="0.45"/>
  </g>
  <g fill="#0A84FF" filter="url(#softGlow)">
    <circle cx="66" cy="112" r="1" opacity="0.75"/>
    <circle cx="134" cy="48" r="0.9" opacity="0.6"/>
    <circle cx="150" cy="96" r="1" opacity="0.65"/>
    <circle cx="70" cy="160" r="0.9" opacity="0.5"/>
  </g>
</svg>