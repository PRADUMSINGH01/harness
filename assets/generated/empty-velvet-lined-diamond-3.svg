<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3A40"/>
      <stop offset="0.5" stop-color="#1A1A1E"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232328"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="velvetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1C22"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <linearGradient id="recessGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06060A"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="sapphireGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- ambient glow -->
  <ellipse cx="100" cy="112" rx="78" ry="46" fill="url(#sapphireGlow)"/>

  <!-- floor shadow -->
  <ellipse cx="100" cy="168" rx="62" ry="9" fill="#000000" opacity="0.55"/>

  <!-- hinged lid, opened back -->
  <g filter="url(#dropShadow)">
    <rect x="38" y="26" width="124" height="34" rx="6" fill="url(#lidGrad)" stroke="#8E8E93" stroke-opacity="0.35" stroke-width="1"/>
    <!-- glass window hint on lid -->
    <rect x="52" y="32" width="96" height="22" rx="4" fill="url(#sheen)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.6"/>
    <path d="M58 46 L74 36" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M66 50 L86 37" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1" stroke-linecap="round"/>
    <!-- hinge -->
    <rect x="92" y="58" width="16" height="7" rx="2" fill="#3A3A40" stroke="#8E8E93" stroke-opacity="0.4" stroke-width="0.6"/>
    <!-- lid side face -->
    <rect x="38" y="60" width="124" height="6" rx="2" fill="#050505" stroke="#8E8E93" stroke-opacity="0.2" stroke-width="0.5"/>
  </g>

  <!-- box base -->
  <g filter="url(#dropShadow)">
    <rect x="34" y="64" width="132" height="60" rx="7" fill="url(#baseGrad)" stroke="#8E8E93" stroke-opacity="0.4" stroke-width="1"/>
    <!-- front edge -->
    <path d="M34 118 h132 v4 a7 7 0 0 1 -7 7 H41 a7 7 0 0 1 -7 -7 Z" fill="#050506"/>
    <!-- velvet interior -->
    <rect x="42" y="70" width="116" height="44" rx="4" fill="url(#velvetGrad)" stroke="#8E8E93" stroke-opacity="0.25" stroke-width="0.7"/>
    <!-- tufted velvet texture -->
    <g stroke="#8E8E93" stroke-opacity="0.16" stroke-width="0.6">
      <path d="M50 82 q6 -4 12 0 q6 4 12 0"/>
      <path d="M50 94 q6 -4 12 0 q6 4 12 0"/>
      <path d="M126 82 q6 -4 12 0 q6 4 12 0"/>
      <path d="M126 94 q6 -4 12 0 q6 4 12 0"/>
      <path d="M88 78 q6 -4 12 0"/>
      <path d="M88 104 q6 -4 12 0"/>
    </g>
    <!-- diamond-shaped recess (empty) -->
    <g>
      <path d="M100 76 L128 92 L100 108 L72 92 Z" fill="url(#recessGrad)" stroke="#0A84FF" stroke-opacity="0.55" stroke-width="1.2"/>
      <path d="M100 79 L124 92 L100 105 L76 92 Z" fill="none" stroke="#8E8E93" stroke-opacity="0.3" stroke-width="0.7"/>
      <!-- recess inner shadow highlights -->
      <path d="M100 76 L128 92 L100 92 Z" fill="#000000" opacity="0.4"/>
      <path d="M100 76 L72 92 L100 92 Z" fill="#FFFFFF" opacity="0.04"/>
      <!-- empty-slot glow rim -->
      <path d="M100 76 L128 92 L100 108 L72 92 Z" fill="none" stroke="#0A84FF" stroke-opacity="0.35" stroke-width="3" filter="url(#softGlow)"/>
    </g>
    <!-- glass sheen over interior -->
    <path d="M42 74 L158 70 L158 76 L42 82 Z" fill="url(#sheen)" opacity="0.5"/>
  </g>

  <!-- clasp -->
  <rect x="96" y="60" width="8" height="9" rx="1.5" fill="#8E8E93" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="0.5"/>
  <circle cx="100" cy="64.5" r="1.4" fill="#0A0A0A"/>

  <!-- corner brackets / technical accents -->
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round" fill="none">
    <path d="M22 58 v-12 h12"/>
    <path d="M178 58 v-12 h-12"/>
    <path d="M22 146 v10 h10"/>
    <path d="M178 146 v10 h-10"/>
  </g>
  <g fill="#8E8E93" opacity="0.6">
    <circle cx="18" cy="100" r="1"/>
    <circle cx="182" cy="100" r="1"/>
  </g>
</svg>