<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="62%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#0A84FF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brainFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#101722" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#8E8E93" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="streamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#0A84FF" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="brainClip">
      <path d="M100 26 C 64 24 40 46 38 74 C 30 84 28 100 34 112 C 30 126 36 142 50 150 C 54 166 70 176 88 172 C 96 180 108 180 116 172 C 134 176 150 166 152 150 C 166 142 172 126 166 112 C 172 100 170 84 162 74 C 160 46 136 24 100 26 Z"/>
    </clipPath>
  </defs>

  <!-- ambient backdrop -->
  <rect width="200" height="200" fill="#0A0A0A"/>
  <circle cx="100" cy="98" r="92" fill="url(#bgGlow)"/>

  <!-- grid ticks -->
  <g stroke="#8E8E93" stroke-opacity="0.18" stroke-width="0.6">
    <line x1="10" y1="8" x2="10" y2="14"/><line x1="190" y1="8" x2="190" y2="14"/>
    <line x1="10" y1="186" x2="10" y2="192"/><line x1="190" y1="186" x2="190" y2="192"/>
    <line x1="8" y1="10" x2="14" y2="10"/><line x1="186" y1="10" x2="192" y2="10"/>
    <line x1="8" y1="190" x2="14" y2="190"/><line x1="186" y1="190" x2="192" y2="190"/>
  </g>
  <g fill="#8E8E93" fill-opacity="0.35" font-family="ui-monospace, Menlo, monospace" font-size="4.5">
    <text x="18" y="13">NEURO-01</text>
    <text x="158" y="193" text-anchor="end">SYNAPSE.LINK</text>
  </g>

  <!-- brain body -->
  <path d="M100 26 C 64 24 40 46 38 74 C 30 84 28 100 34 112 C 30 126 36 142 50 150 C 54 166 70 176 88 172 C 96 180 108 180 116 172 C 134 176 150 166 152 150 C 166 142 172 126 166 112 C 172 100 170 84 162 74 C 160 46 136 24 100 26 Z"
        fill="url(#brainFill)" stroke="url(#strokeGrad)" stroke-width="1.6" filter="url(#glow)"/>

  <!-- halo echo -->
  <path d="M100 26 C 64 24 40 46 38 74 C 30 84 28 100 34 112 C 30 126 36 142 50 150 C 54 166 70 176 88 172 C 96 180 108 180 116 172 C 134 176 150 166 152 150 C 166 142 172 126 166 112 C 172 100 170 84 162 74 C 160 46 136 24 100 26 Z"
        fill="none" stroke="#0A84FF" stroke-opacity="0.35" stroke-width="4" filter="url(#softGlow)"/>

  <g clip-path="url(#brainClip)">
    <!-- central fissure -->
    <path d="M100 27 C 97 55 103 85 99 115 C 96 138 101 158 100 173" fill="none" stroke="#0A84FF" stroke-opacity="0.7" stroke-width="1.6" filter="url(#glow)"/>

    <!-- sulci traces -->
    <g fill="none" stroke="#8E8E93" stroke-opacity="0.5" stroke-width="1">
      <path d="M40 70 C 55 62 66 70 74 62 C 82 54 92 58 96 66"/>
      <path d="M34 96 C 50 92 58 104 70 100 C 80 97 88 104 97 100"/>
      <path d="M42 128 C 54 120 64 132 76 126 C 86 121 94 130 98 126"/>
      <path d="M52 152 C 62 146 72 156 84 150 C 92 146 98 152 100 154"/>
      <path d="M160 70 C 146 62 134 70 126 62 C 118 54 108 58 104 66"/>
      <path d="M166 96 C 150 92 142 104 130 100 C 120 97 112 104 103 100"/>
      <path d="M158 128 C 146 120 136 132 124 126 C 114 121 106 130 102 126"/>
      <path d="M148 152 C 138 146 128 156 116 150 C 108 146 102 152 100 154"/>
    </g>

    <!-- neural circuit lines -->
    <g fill="none" stroke="#0A84FF" stroke-opacity="0.55" stroke-width="0.9">
      <path d="M52 66 L 74 62 L 74 46"/>
      <path d="M44 104 L 70 100 L 82 118"/>
      <path d="M60 140 L 76 126 L 92 138"/>
      <path d="M148 66 L 126 62 L 126 46"/>
      <path d="M156 104 L 130 100 L 118 118"/>
      <path d="M140 140 L 124 126 L 108 138"/>
    </g>

    <!-- chemical flood streams -->
    <g fill="none" stroke="url(#streamGrad)" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)">
      <path d="M44 84 C 62 76 80 92 100 84 C 120 76 138 92 158 84"/>
      <path d="M46 116 C 64 108 82 124 100 116 C 118 108 136 124 156 116"/>
      <path d="M100 40 C 100 64 88 88 100 112 C 112 136 100 156 100 168"/>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="0.8" stroke-dasharray="2 5">
      <path d="M44 84 C 62 76 80 92 100 84 C 120 76 138 92 158 84"/>
      <path d="M46 116 C 64 108 82 124 100 116 C 118 108 136 124 156 116"/>
    </g>
  </g>

  <!-- neurotransmitter nodes -->
  <g filter="url(#glow)">
    <g fill="#0A84FF">
      <circle cx="74" cy="62" r="2.6"/><circle cx="70" cy="100" r="2.6"/>
      <circle cx="76" cy="126" r="2.6"/><circle cx="126" cy="62" r="2.6"/>
      <circle cx="130" cy="100" r="2.6"/><circle cx="124" cy="126" r="2.6"/>
      <circle cx="100" cy="84" r="2.8"/><circle cx="100" cy="116" r="2.8"/>
      <circle cx="52" cy="66" r="2"/><circle cx="148" cy="66" r="2"/>
      <circle cx="44" cy="104" r="2"/><circle cx="156" cy="104" r="2"/>
      <circle cx="60" cy="140" r="2"/><circle cx="140" cy="140" r="2"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="100" cy="62" r="1.8"/><circle cx="100" cy="140" r="1.8"/>
      <circle cx="82" cy="46" r="1.6"/><circle cx="118" cy="46" r="1.6"/>
    </g>
    <!-- node halos -->
    <g fill="none" stroke="#0A84FF" stroke-opacity="0.4" stroke-width="0.7">
      <circle cx="100" cy="84" r="5.4"/><circle cx="100" cy="116" r="5.4"/>
      <circle cx="74" cy="62" r="4.8"/><circle cx="126" cy="62" r="4.8"/>
      <circle cx="130" cy="100" r="4.8"/><circle cx="70" cy="100" r="4.8"/>
    </g>
  </g>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-opacity="0.5" stroke-width="1.2" fill="none">
    <path d="M16 30 V 20 H 26"/><path d="M184 30 V 20 H 174"/>
    <path d="M16 170 V 180 H 26"/><path d="M184 170 V 180 H 174"/>
  </g>
</svg>