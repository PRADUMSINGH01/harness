<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3A3E"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1C1F"/>
      <stop offset="1" stop-color="#0A0A0B"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2A2E"/>
      <stop offset="1" stop-color="#101013"/>
    </linearGradient>
    <linearGradient id="blueEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- corner brackets -->
  <g stroke="#8E8E93" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M12 24 V12 H24"/>
    <path d="M176 12 H188 V24"/>
    <path d="M188 176 V188 H176"/>
    <path d="M24 188 H12 V176"/>
  </g>

  <!-- alignment axis -->
  <g stroke="#0A84FF" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.5">
    <line x1="100" y1="14" x2="100" y2="186"/>
    <line x1="14" y1="100" x2="186" y2="100"/>
  </g>

  <!-- exploded cube faces: isometric -->
  <!-- top face (separated up) -->
  <g filter="url(#soft)">
    <path d="M100 30 L148 54 L100 78 L52 54 Z" fill="url(#faceTop)" stroke="url(#blueEdge)" stroke-width="1.2"/>
    <path d="M100 30 L148 54 L100 78 L52 54 Z" fill="none" stroke="#0A84FF" stroke-width="0.6" opacity="0.8" filter="url(#glow)"/>
  </g>

  <!-- left face (separated left-down) -->
  <g filter="url(#soft)">
    <path d="M40 66 L88 90 L88 146 L40 122 Z" fill="url(#faceLeft)" stroke="#8E8E93" stroke-width="1"/>
  </g>

  <!-- right face (separated right-down) -->
  <g filter="url(#soft)">
    <path d="M160 66 L112 90 L112 146 L160 122 Z" fill="url(#faceRight)" stroke="#8E8E93" stroke-width="1"/>
  </g>

  <!-- back/front connector panels -->
  <g opacity="0.9" filter="url(#soft)">
    <path d="M72 52 L128 80 L128 96 L72 68 Z" fill="#0A84FF" opacity="0.28" stroke="#0A84FF" stroke-width="0.8"/>
  </g>

  <!-- core cube (semi-transparent glass) -->
  <g>
    <path d="M100 62 L132 78 L132 122 L100 138 L68 122 L68 78 Z" fill="#FFFFFF" opacity="0.06" stroke="#FFFFFF" stroke-width="0.7" opacity="0.7"/>
    <path d="M68 78 L100 94 L132 78 M100 94 V138" fill="none" stroke="#8E8E93" stroke-width="0.7" opacity="0.7"/>
    <path d="M100 94 L100 138" stroke="#0A84FF" stroke-width="0.9" opacity="0.9" filter="url(#glow)"/>
  </g>

  <!-- bottom face (separated down) -->
  <g filter="url(#soft)">
    <path d="M100 148 L140 166 L100 184 L60 166 Z" fill="url(#faceTop)" stroke="url(#blueEdge)" stroke-width="1.2"/>
    <path d="M100 148 L140 166 L100 184 L60 166 Z" fill="none" stroke="#0A84FF" stroke-width="0.6" opacity="0.8" filter="url(#glow)"/>
  </g>

  <!-- spec ticks -->
  <g stroke="#8E8E93" stroke-width="1" opacity="0.7" font-family="monospace">
    <line x1="166" y1="94" x2="174" y2="94"/>
    <line x1="166" y1="94" x2="166" y2="122" opacity="0.4"/>
    <text x="176" y="110" fill="#8E8E93" font-size="6">42</text>
  </g>

  <!-- label -->
  <text x="100" y="196" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" letter-spacing="2" opacity="0.8">EXPLODED VIEW · PLASTIC CUBE</text>
</svg>