<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#8E8E93"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- dark glass card -->
  <g filter="url(#softShadow)">
    <rect x="8" y="8" width="184" height="184" rx="20" fill="#0A0A0A" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
  </g>
  <rect x="8" y="8" width="184" height="184" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="6"/>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M16 30 V20 Q16 16 20 16 H30"/>
    <path d="M170 16 H180 Q184 16 184 20 V30"/>
    <path d="M184 170 V180 Q184 184 180 184 H170"/>
    <path d="M30 184 H20 Q16 184 16 180 V170"/>
  </g>

  <!-- grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1">
    <path d="M30 50 H170 M30 82 H170 M30 114 H170 M30 146 H170"/>
    <path d="M56 44 V162 M84 44 V162 M112 44 V162 M140 44 V162"/>
  </g>
  <g fill="#8E8E93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">
    <text x="28" y="53" text-anchor="end" opacity="0.6">100</text>
    <text x="28" y="85" text-anchor="end" opacity="0.6">50</text>
    <text x="28" y="149" text-anchor="end" opacity="0.6">0</text>
  </g>

  <!-- area fill -->
  <path d="M36 62 L64 70 L92 88 L120 118 L148 138 L166 150 L166 160 L36 160 Z" fill="url(#areaGrad)"/>

  <!-- declining line -->
  <path d="M36 62 L64 70 L92 88 L120 118 L148 138 L166 150" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- node dots -->
  <g fill="#0A0A0A" stroke="#0A84FF" stroke-width="2">
    <circle cx="36" cy="62" r="3"/>
    <circle cx="64" cy="70" r="3"/>
    <circle cx="92" cy="88" r="3"/>
    <circle cx="120" cy="118" r="3"/>
    <circle cx="148" cy="138" r="3"/>
  </g>
  <circle cx="166" cy="150" r="4.5" fill="#0A84FF" filter="url(#glow)"/>
  <circle cx="166" cy="150" r="8" fill="none" stroke="#0A84FF" stroke-opacity="0.4"/>

  <!-- down arrow accent -->
  <g stroke="#F43F5E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <path d="M142 96 L162 116"/>
    <path d="M150 118 L162 116 L160 104"/>
  </g>

  <!-- axis baseline -->
  <path d="M30 162 H170" stroke="#8E8E93" stroke-opacity="0.4" stroke-width="1"/>
  <g stroke="#8E8E93" stroke-opacity="0.4" stroke-width="1">
    <path d="M36 162 V165 M64 162 V165 M92 162 V165 M120 162 V165 M148 162 V165 M166 162 V165"/>
  </g>

  <!-- label -->
  <text x="36" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF" opacity="0.85" letter-spacing="1">▼ DOWNTREND −72%</text>
</svg>