      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#0A0A0A" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
