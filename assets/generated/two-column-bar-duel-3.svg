<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7a5a0a"/>
      <stop offset="0.45" stop-color="#F5C33B"/>
      <stop offset="0.8" stop-color="#FFE9A3"/>
      <stop offset="1" stop-color="#FFF6DC"/>
    </linearGradient>
    <linearGradient id="grayBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2c2c30"/>
      <stop offset="1" stop-color="#8E8E93"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14171f" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD966" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD966" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="barShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="frameClip"><rect x="8" y="8" width="184" height="184" rx="14"/></clipPath>
  </defs>

  <!-- dark glass card -->
  <rect x="8" y="8" width="184" height="184" rx="14" fill="url(#glassCard)" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <rect x="8" y="8" width="184" height="184" rx="14" fill="none" stroke="#0A84FF" stroke-opacity="0.25" stroke-width="0.6"/>

  <g clip-path="url(#frameClip)">
    <!-- gold explosion glow behind tall bar -->
    <ellipse cx="146" cy="60" rx="60" ry="90" fill="url(#goldGlow)"/>

    <!-- grid ticks -->
    <g stroke="#FFFFFF" stroke-opacity="0.08">
      <line x1="26" y1="140" x2="174" y2="140"/>
      <line x1="26" y1="100" x2="174" y2="100"/>
      <line x1="26" y1="60" x2="174" y2="60"/>
      <line x1="26" y1="20" x2="174" y2="20"/>
    </g>
    <g stroke="#8E8E93" stroke-opacity="0.35" stroke-width="0.8">
      <line x1="26" y1="12" x2="26" y2="188"/>
    </g>

    <!-- tiny gray bar -->
    <g filter="url(#barShadow)">
      <rect x="40" y="164" width="26" height="14" rx="3" fill="url(#grayBar)"/>
    </g>
    <rect x="40" y="164" width="26" height="14" rx="3" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="0.5"/>

    <!-- towering gold bar exploding past frame edge -->
    <g filter="url(#barShadow)">
      <rect x="128" y="-14" width="36" height="192" rx="4" fill="url(#goldBar)"/>
    </g>
    <rect x="128" y="-14" width="36" height="192" rx="4" fill="none" stroke="#FFF3C4" stroke-opacity="0.5" stroke-width="0.6"/>
    <g filter="url(#softGlow)" opacity="0.85">
      <rect x="133" y="-14" width="7" height="192" rx="3.5" fill="#FFFFFF" opacity="0.35"/>
    </g>
    <!-- spark particles at burst point -->
    <g fill="#FFE9A3" filter="url(#softGlow)">
      <circle cx="112" cy="14" r="1.6"/>
      <circle cx="176" cy="6" r="1.4"/>
      <circle cx="120" cy="2" r="1.2"/>
      <circle cx="170" cy="30" r="1.1"/>
    </g>

    <!-- baseline -->
    <line x1="26" y1="178" x2="174" y2="178" stroke="#8E8E93" stroke-width="1" stroke-opacity="0.6"/>

    <!-- corner brackets -->
    <g stroke="#0A84FF" stroke-opacity="0.7" stroke-width="1.2" fill="none" stroke-linecap="round">
      <path d="M12 22 V14 Q12 12 14 12 H22"/>
      <path d="M178 12 H186 Q188 12 188 14 V22"/>
    </g>

    <!-- delta multiplier badge -->
    <g filter="url(#barShadow)">
      <rect x="72" y="40" width="48" height="18" rx="9" fill="#0A0A0A" stroke="#0A84FF" stroke-opacity="0.6"/>
      <text x="96" y="52.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">×240</text>
    </g>
    <!-- connector from gray bar to badge -->
    <path d="M66 168 Q92 150 92 58" fill="none" stroke="#8E8E93" stroke-opacity="0.4" stroke-width="0.8" stroke-dasharray="3 3"/>
    <path d="M128 100 Q110 90 100 62" fill="none" stroke="#F5C33B" stroke-opacity="0.5" stroke-width="0.8" stroke-dasharray="3 3"/>
  </g>
</svg>