<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#8E8E93"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- glass card -->
  <g filter="url(#soft)">
    <rect x="18" y="18" width="164" height="164" rx="36" fill="#0A0A0A" fill-opacity="0.75"/>
    <rect x="18" y="18" width="164" height="164" rx="36" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <rect x="26" y="24" width="148" height="70" rx="30" fill="#FFFFFF" fill-opacity="0.05"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M30 46 V34 a4 4 0 0 1 4-4 h12"/>
    <path d="M170 46 V34 a4 4 0 0 0-4-4 h-12"/>
    <path d="M30 154 v12 a4 4 0 0 0 4 4 h12"/>
    <path d="M170 154 v12 a4 4 0 0 1-4 4 h-12"/>
  </g>

  <!-- progress ring: 99% of ~2π*72=452.4 → dash 447.9 / 452.4 -->
  <g transform="translate(100,100)">
    <circle r="72" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="6"/>
    <circle r="72" fill="none" stroke="url(#blue)" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="447.9 452.4" transform="rotate(-90)" filter="url(#glow)"/>
  </g>

  <!-- central figure -->
  <text x="100" y="100" text-anchor="middle" dominant-baseline="central"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="52" font-weight="800" fill="url(#text)" letter-spacing="1">99%</text>
  <text x="100" y="126" text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="9" fill="#8E8E93" letter-spacing="3">COMPLETE</text>

  <!-- ticks -->
  <g stroke="#8E8E93" stroke-opacity="0.5" stroke-width="1.5">
    <line x1="100" y1="20" x2="100" y2="26"/>
    <line x1="100" y1="174" x2="100" y2="180"/>
    <line x1="20" y1="100" x2="26" y2="100"/>
    <line x1="174" y1="100" x2="180" y2="100"/>
  </g>

  <!-- accent dot -->
  <circle cx="163" cy="37" r="4" fill="#0A84FF" filter="url(#glow)"/>
</svg>