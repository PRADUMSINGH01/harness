<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#12141A"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#0A0A0A" opacity="0.35"/>
    </pattern>
    <pattern id="noise" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1.2" height="1.2" fill="#FFFFFF" opacity="0.55"/>
      <rect x="2.5" y="2.8" width="1" height="1" fill="#0A84FF" opacity="0.6"/>
      <rect x="4.4" y="1" width="1" height="1" fill="#8E8E93" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="200" height="200" fill="url(#bgGrad)"/>

  <!-- glass panel -->
  <rect x="24" y="30" width="152" height="140" rx="14" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-opacity="0.12"/>

  <!-- signal bars (glitch displaced) -->
  <g filter="url(#glow)">
    <rect x="40" y="58" width="120" height="6" fill="url(#blueGrad)"/>
    <rect x="46" y="52" width="46" height="6" fill="#8E8E93" opacity="0.7"/>
    <rect x="108" y="64" width="52" height="5" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- channel split core -->
  <g transform="translate(100 108)">
    <rect x="-42" y="-26" width="84" height="52" rx="6" fill="#0A0A0A" stroke="#8E8E93" stroke-opacity="0.35"/>
    <!-- R shifted -->
    <rect x="-36" y="-18" width="44" height="36" rx="3" fill="#F43F5E" opacity="0.45" transform="translate(-5 -3)"/>
    <!-- B shifted -->
    <rect x="-36" y="-18" width="44" height="36" rx="3" fill="#0A84FF" opacity="0.45" transform="translate(5 3)"/>
    <rect x="-36" y="-18" width="44" height="36" rx="3" fill="#FFFFFF" opacity="0.14"/>
    <rect x="-30" y="-12" width="20" height="10" fill="url(#noise)"/>
    <rect x="-6" y="2" width="28" height="8" fill="url(#noise)" opacity="0.8"/>
    <!-- slice displacement -->
    <rect x="-36" y="-4" width="84" height="7" fill="#0A84FF" opacity="0.55" transform="translate(8 0)"/>
    <rect x="-36" y="8" width="84" height="5" fill="#FFFFFF" opacity="0.5" transform="translate(-7 0)"/>
    <line x1="-44" y1="-26" x2="44" y2="-26" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.6"/>
    <line x1="-44" y1="26" x2="44" y2="26" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.6"/>
  </g>

  <!-- glitch tick band across middle -->
  <g opacity="0.85">
    <rect x="30" y="126" width="34" height="3" fill="#0A84FF" filter="url(#glow)"/>
    <rect x="72" y="128" width="18" height="2" fill="#FFFFFF" opacity="0.7"/>
    <rect x="98" y="126" width="26" height="3" fill="#8E8E93"/>
    <rect x="132" y="128" width="38" height="2" fill="#0A84FF" opacity="0.7" filter="url(#glow)"/>
  </g>

  <!-- scanline overlay on panel -->
  <rect x="24" y="30" width="152" height="140" rx="14" fill="url(#scan)"/>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M14 24 v-6 a4 4 0 0 1 4-4 h6"/>
    <path d="M186 24 v-6 a4 4 0 0 0 -4-4 h-6"/>
    <path d="M14 176 v6 a4 4 0 0 0 4 4 h6"/>
    <path d="M186 176 v6 a4 4 0 0 1 -4 4 h-6"/>
  </g>

  <!-- pixel noise specks -->
  <g fill="#FFFFFF">
    <rect x="34" y="44" width="2" height="2" opacity="0.7"/>
    <rect x="158" y="48" width="2" height="2" opacity="0.5"/>
    <rect x="150" y="150" width="3" height="2" fill="#0A84FF" opacity="0.8"/>
    <rect x="38" y="152" width="2" height="2" fill="#8E8E93" opacity="0.8"/>
    <rect x="62" y="46" width="2" height="2" fill="#0A84FF" opacity="0.9"/>
  </g>

  <!-- small status text -->
  <text x="100" y="161" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="7" letter-spacing="2.5" fill="#8E8E93">SIG//ERR_0x84</text>
</svg>