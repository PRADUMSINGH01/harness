<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="glassBg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#16181F"/>
      <stop offset="60%" stop-color="#0E1017"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="86"/>
    </clipPath>
  </defs>

  <!-- Dark glass badge -->
  <circle cx="100" cy="100" r="92" fill="#0A0A0A" opacity="0.9"/>
  <circle cx="100" cy="100" r="88" fill="url(#glassBg)"/>
  <g clip-path="url(#circleClip)">
    <circle cx="100" cy="100" r="86" fill="url(#sheen)"/>
  </g>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#8E8E93" stroke-opacity="0.35" stroke-width="1.2"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#0A84FF" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 6"/>

  <!-- Retro color ring (70s accent) -->
  <g clip-path="url(#circleClip)" opacity="0.5">
    <path d="M14 100 A86 86 0 0 1 100 14" fill="none" stroke="#0A84FF" stroke-width="3" stroke-opacity="0.6"/>
    <path d="M186 100 A86 86 0 0 1 100 186" fill="none" stroke="#8E8E93" stroke-width="3" stroke-opacity="0.5"/>
  </g>

  <!-- Student silhouette -->
  <g clip-path="url(#circleClip)">
    <!-- shoulders / sweater -->
    <path d="M52 172 C52 138 72 126 100 126 C128 126 148 138 148 172 L148 186 L52 186 Z" fill="#0A0A0A"/>
    <!-- collar sliver of shirt -->
    <path d="M100 126 L90 132 L100 146 L110 132 Z" fill="#FFFFFF" opacity="0.85"/>
    <!-- neck -->
    <rect x="90" y="108" width="20" height="24" rx="9" fill="#0A0A0A"/>
    <!-- 70s afro hair -->
    <g fill="url(#hair)">
      <path d="M100 30 C126 30 142 48 142 72 C142 80 138 84 134 84 C136 74 132 62 126 58 C128 68 126 74 122 78 C124 68 120 58 114 54 C116 62 114 70 110 74 C110 64 106 56 100 54 C94 56 90 64 90 74 C86 70 84 62 86 54 C80 58 76 68 78 78 C74 74 72 68 74 58 C68 62 64 74 66 84 C62 84 58 80 58 72 C58 48 74 30 100 30 Z"/>
      <circle cx="70" cy="52" r="9"/>
      <circle cx="86" cy="40" r="10"/>
      <circle cx="114" cy="40" r="10"/>
      <circle cx="130" cy="52" r="9"/>
      <circle cx="100" cy="36" r="11"/>
      <path d="M58 66 C58 84 62 88 66 88 L134 88 C138 88 142 84 142 66 C142 88 128 96 100 96 C72 96 58 88 58 66 Z"/>
    </g>
    <!-- face -->
    <path d="M74 78 C74 106 84 120 100 120 C116 120 126 106 126 78 C126 60 116 50 100 50 C84 50 74 60 74 78 Z" fill="#0A0A0A"/>
    <!-- vintage round glasses -->
    <g filter="url(#glow)">
      <circle cx="87" cy="84" r="11" fill="url(#lens)" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="113" cy="84" r="11" fill="url(#lens)" stroke="#FFFFFF" stroke-width="2.5"/>
      <path d="M98 84 L102 84" stroke="#FFFFFF" stroke-width="2.5"/>
      <path d="M76 82 L70 80" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M124 82 L130 80" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- smile -->
    <path d="M93 104 C96 108 104 108 107 104" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Corner technical brackets -->
  <g stroke="#8E8E93" stroke-opacity="0.55" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M24 34 L24 24 L34 24"/>
    <path d="M176 24 L166 24 M176 24 L176 34"/>
    <path d="M176 166 L176 176 L166 176"/>
    <path d="M24 166 L24 176 L34 176"/>
  </g>
</svg>