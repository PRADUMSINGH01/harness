<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="coinFace" cx="38%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="45%" stop-color="#F0C24B"/>
      <stop offset="80%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#7A5A08"/>
    </radialGradient>
    <linearGradient id="coinRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE9A0"/>
      <stop offset="50%" stop-color="#C9971E"/>
      <stop offset="100%" stop-color="#8A6A10"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F0C24B" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#0A84FF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- ambient glow behind coin -->
  <circle cx="62" cy="100" r="44" fill="#F0C24B" opacity="0.10" filter="url(#softGlow)"/>
  <!-- ambient glow behind particles -->
  <circle cx="150" cy="100" r="42" fill="#0A84FF" opacity="0.10" filter="url(#softGlow)"/>

  <!-- ===== GOLD COIN ===== -->
  <g filter="url(#glow)">
    <circle cx="62" cy="100" r="34" fill="url(#coinRim)"/>
    <circle cx="62" cy="100" r="29" fill="url(#coinFace)"/>
    <circle cx="62" cy="100" r="29" fill="none" stroke="#FFF3C4" stroke-width="0.7" opacity="0.6"/>
    <!-- embossed symbol -->
    <text x="62" y="109" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#7A5A08" opacity="0.85">◈</text>
    <!-- rim ticks -->
    <g stroke="#7A5A08" stroke-width="1" opacity="0.5">
      <line x1="62" y1="71" x2="62" y2="75"/>
      <line x1="62" y1="125" x2="62" y2="129"/>
      <line x1="33" y1="100" x2="37" y2="100"/>
      <line x1="87" y1="100" x2="91" y2="100"/>
    </g>
    <!-- glass highlight -->
    <path d="M45 84 Q56 72 74 78 Q62 84 54 96 Q48 92 45 84 Z" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- ===== DISINTEGRATION EDGE: coin fragments ===== -->
  <g fill="#F0C24B">
    <circle cx="99" cy="84" r="1.6" opacity="0.9"/>
    <circle cx="103" cy="96" r="1.2" opacity="0.8"/>
    <circle cx="100" cy="110" r="1.7" opacity="0.9"/>
    <circle cx="106" cy="122" r="1.1" opacity="0.7"/>
    <circle cx="97" cy="72" r="1.0" opacity="0.7"/>
    <circle cx="108" cy="133" r="0.9" opacity="0.6"/>
  </g>

  <!-- ===== TRANSITION STREAMS ===== -->
  <g stroke="url(#flow)" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M104 84 C126 74, 138 90, 168 82" stroke-width="1.6"/>
    <path d="M106 100 C130 100, 140 106, 170 100" stroke-width="1.6"/>
    <path d="M104 114 C126 122, 138 106, 168 118" stroke-width="1.6"/>
    <path d="M108 128 C128 136, 146 126, 162 132" stroke-width="1.1" opacity="0.6"/>
    <path d="M106 70 C128 60, 146 70, 162 66" stroke-width="1.1" opacity="0.6"/>
  </g>

  <!-- ===== BINARY PARTICLE FIELD ===== -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">
    <text x="118" y="62" font-size="11" fill="#0A84FF" opacity="0.95">1</text>
    <text x="134" y="54" font-size="9" fill="#8E8E93" opacity="0.8">0</text>
    <text x="152" y="64" font-size="11" fill="#FFFFFF" opacity="0.9">1</text>
    <text x="170" y="56" font-size="8" fill="#0A84FF" opacity="0.7">0</text>
    <text x="182" y="68" font-size="10" fill="#0A84FF" opacity="0.9">1</text>

    <text x="120" y="98" font-size="10" fill="#FFFFFF" opacity="0.95">0</text>
    <text x="136" y="92" font-size="11" fill="#0A84FF" opacity="0.9">1</text>
    <text x="152" y="102" font-size="9" fill="#8E8E93" opacity="0.8">0</text>
    <text x="168" y="94" font-size="11" fill="#FFFFFF" opacity="0.9">1</text>
    <text x="184" y="102" font-size="9" fill="#0A84FF" opacity="0.75">0</text>

    <text x="118" y="136" font-size="11" fill="#0A84FF" opacity="0.95">0</text>
    <text x="134" y="144" font-size="9" fill="#8E8E93" opacity="0.8">1</text>
    <text x="150" y="132" font-size="11" fill="#FFFFFF" opacity="0.9">0</text>
    <text x="168" y="142" font-size="10" fill="#0A84FF" opacity="0.85">1</text>
    <text x="182" y="130" font-size="8" fill="#8E8E93" opacity="0.7">0</text>

    <text x="130" y="158" font-size="9" fill="#0A84FF" opacity="0.6">1</text>
    <text x="156" y="156" font-size="8" fill="#FFFFFF" opacity="0.55">0</text>
    <text x="176" y="160" font-size="9" fill="#0A84FF" opacity="0.6">1</text>
    <text x="144" y="46" font-size="9" fill="#0A84FF" opacity="0.6">1</text>
  </g>

  <!-- faint digit particles (dots) -->
  <g fill="#0A84FF">
    <circle cx="126" cy="80" r="1.2" opacity="0.7"/>
    <circle cx="158" cy="78" r="1.0" opacity="0.6"/>
    <circle cx="146" cy="116" r="1.2" opacity="0.7"/>
    <circle cx="174" cy="118" r="1.0" opacity="0.6"/>
    <circle cx="140" cy="124" r="0.8" opacity="0.5"/>
  </g>

  <!-- corner brackets (dark-glass technical frame) -->
  <g stroke="#FFFFFF" stroke-width="1.4" fill="none" opacity="0.28" stroke-linecap="round">
    <path d="M8 20 V8 H20"/>
    <path d="M180 8 H192 V20"/>
    <path d="M192 180 V192 H180"/>
    <path d="M20 192 H8 V180"/>
  </g>
</svg>