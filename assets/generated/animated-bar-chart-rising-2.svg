<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16181D" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#5EB8FF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="winClip"><rect x="20" y="30" width="160" height="140" rx="10"/></clipPath>
  </defs>

  <!-- window shell -->
  <g filter="url(#softShadow)">
    <rect x="20" y="30" width="160" height="140" rx="10" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
    <rect x="20" y="30" width="160" height="140" rx="10" fill="none" stroke="#0A84FF" stroke-opacity="0.15" stroke-width="0.5"/>
  </g>

  <g clip-path="url(#winClip)">
    <!-- top chrome -->
    <rect x="20" y="30" width="160" height="22" fill="#FFFFFF" fill-opacity="0.04"/>
    <line x1="20" y1="52" x2="180" y2="52" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="33" cy="41" r="3" fill="#8E8E93"/>
    <circle cx="43" cy="41" r="3" fill="#8E8E93" fill-opacity="0.6"/>
    <circle cx="53" cy="41" r="3" fill="#0A84FF" fill-opacity="0.9"/>
    <text x="100" y="44.5" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="7" fill="#8E8E93" letter-spacing="1">chart.js</text>

    <!-- code lines hint -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="5.5" fill="#8E8E93" fill-opacity="0.7">
      <text x="30" y="63"><tspan fill="#0A84FF">const</tspan> data = [4, 7, 9, 6];</text>
      <text x="30" y="71">chart.render(data);</text>
    </g>
    <rect x="120" y="65.5" width="3.5" height="6" fill="#0A84FF">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- baseline axis -->
    <line x1="34" y1="154" x2="166" y2="154" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>

    <!-- grid ticks -->
    <g stroke="#FFFFFF" stroke-opacity="0.07">
      <line x1="34" y1="138" x2="166" y2="138"/>
      <line x1="34" y1="122" x2="166" y2="122"/>
      <line x1="34" y1="106" x2="166" y2="106"/>
    </g>

    <!-- bars: grow up from baseline, staggered loop -->
    <g>
      <rect x="42" width="20" rx="2.5" fill="url(#barGrad)" filter="url(#glow)">
        <animate attributeName="y" values="154;154;118;154" keyTimes="0;0.05;0.55;1" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="height" values="0;0;36;0" keyTimes="0;0.05;0.55;1" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="72" width="20" rx="2.5" fill="url(#barGrad2)" filter="url(#glow)">
        <animate attributeName="y" values="154;154;100;154" keyTimes="0;0.15;0.65;1" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="height" values="0;0;54;0" keyTimes="0;0.15;0.65;1" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="102" width="20" rx="2.5" fill="url(#barGrad)" filter="url(#glow)">
        <animate attributeName="y" values="154;154;86;154" keyTimes="0;0.25;0.75;1" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="height" values="0;0;68;0" keyTimes="0;0.25;0.75;1" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="132" width="20" rx="2.5" fill="url(#barGrad2)" filter="url(#glow)">
        <animate attributeName="y" values="154;154;106;154" keyTimes="0;0.35;0.85;1" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="height" values="0;0;48;0" keyTimes="0;0.35;0.85;1" dur="3.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- value ticks / crosshair detail -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="5" fill="#8E8E93" fill-opacity="0.6">
      <text x="31" y="140">2</text>
      <text x="31" y="124">4</text>
      <text x="31" y="108">6</text>
    </g>

    <!-- corner brackets -->
    <g stroke="#0A84FF" stroke-opacity="0.5" stroke-width="1.2" fill="none">
      <path d="M24 38 v-4 h4"/>
      <path d="M172 38 v-4 h-4"/>
      <path d="M24 162 v4 h4"/>
      <path d="M172 162 v4 h-4"/>
    </g>

    <!-- sheen -->
    <rect x="20" y="30" width="160" height="20" fill="#FFFFFF" opacity="0.03"/>
    <rect x="20" y="30" width="160" height="140" fill="url(#sheenGrad)"/>
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.04"/>
    </linearGradient>
  </g>
</svg>