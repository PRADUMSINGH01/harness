<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1C22" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="blueBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="grayBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E8E93"/>
      <stop offset="1" stop-color="#8E8E93" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Dark glass panel -->
  <g filter="url(#softShadow)">
    <rect x="8" y="8" width="184" height="184" rx="18" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
  </g>
  <rect x="8.5" y="8.5" width="183" height="183" rx="17.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <!-- Corner brackets -->
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M16 28 V18 Q16 16 18 16 H28"/>
    <path d="M172 16 H182 Q184 16 184 18 V28"/>
    <path d="M184 172 V182 Q184 184 182 184 H172"/>
    <path d="M28 184 H18 Q16 184 16 182 V172"/>
  </g>

  <!-- Baseline -->
  <line x1="34" y1="150" x2="166" y2="150" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>
  <g stroke="#8E8E93" stroke-width="1" stroke-opacity="0.5">
    <line x1="34" y1="150" x2="34" y2="153"/>
    <line x1="100" y1="150" x2="100" y2="153"/>
    <line x1="166" y1="150" x2="166" y2="153"/>
  </g>

  <!-- Bars dropping to near zero -->
  <g>
    <rect x="58" y="146" width="26" height="4" rx="2" fill="url(#blueBar)" filter="url(#glow)"/>
    <rect x="116" y="147" width="26" height="3" rx="1.5" fill="url(#grayBar)"/>
  </g>

  <!-- Falling level indicator ticks (ghost of former high levels) -->
  <g stroke="#0A84FF" stroke-opacity="0.18" stroke-dasharray="2 3">
    <line x1="58" y1="60" x2="84" y2="60"/>
  </g>
  <g stroke="#8E8E93" stroke-opacity="0.15" stroke-dasharray="2 3">
    <line x1="116" y1="72" x2="142" y2="72"/>
  </g>

  <!-- Downward drop arrows -->
  <g fill="#FFFFFF" fill-opacity="0.45" font-family="monospace" font-size="8">
    <text x="71" y="52" text-anchor="middle">▼</text>
    <text x="129" y="64" text-anchor="middle">▼</text>
  </g>

  <!-- Near-zero callouts -->
  <g font-family="monospace" font-size="7" fill="#8E8E93">
    <text x="71" y="141" text-anchor="middle" fill="#0A84FF">0.2</text>
    <text x="129" y="142" text-anchor="middle" fill="#8E8E93">0.1</text>
  </g>

  <!-- Labels -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <text x="71" y="164" font-size="8.5" fill="#0A84FF" letter-spacing="1">NOREPINEPHRINE</text>
    <text x="129" y="164" font-size="8.5" fill="#8E8E93" letter-spacing="1">ACETYLCHOLINE</text>
    <text x="100" y="180" font-size="6" fill="#FFFFFF" fill-opacity="0.35" letter-spacing="2">NEUROTRANSMITTER LEVEL — CRASH</text>
  </g>

  <!-- Top-right status dot -->
  <circle cx="176" cy="24" r="3" fill="#F43F5E" filter="url(#glow)"/>
</svg>