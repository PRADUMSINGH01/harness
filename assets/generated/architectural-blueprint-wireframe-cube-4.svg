<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161C"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0A84FF" flood-opacity="0.35"/>
    </filter>
    <pattern id="blueprintGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- dark glass backdrop -->
  <rect x="4" y="4" width="192" height="192" rx="28" fill="url(#glass)" stroke="#8E8E93" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="4" y="4" width="192" height="192" rx="28" fill="url(#blueprintGrid)"/>
  <rect x="40" y="20" width="120" height="90" rx="40" fill="url(#glow)"/>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M16 32V20a4 4 0 0 1 4-4h12"/>
    <path d="M168 16h12a4 4 0 0 1 4 4v12"/>
    <path d="M184 168v12a4 4 0 0 1-4 4h-12"/>
    <path d="M32 184H20a4 4 0 0 1-4-4v-12"/>
  </g>

  <!-- construction crosshair + ticks -->
  <g stroke="#8E8E93" stroke-opacity="0.45" stroke-width="1">
    <line x1="100" y1="24" x2="100" y2="176" stroke-dasharray="3 4"/>
    <line x1="24" y1="100" x2="176" y2="100" stroke-dasharray="3 4"/>
    <circle cx="100" cy="100" r="4" fill="none"/>
    <line x1="96" y1="16" x2="96" y2="20"/><line x1="104" y1="16" x2="104" y2="20"/>
    <line x1="96" y1="180" x2="96" y2="184"/><line x1="104" y1="180" x2="104" y2="184"/>
    <line x1="16" y1="96" x2="20" y2="96"/><line x1="16" y1="104" x2="20" y2="104"/>
    <line x1="180" y1="96" x2="184" y2="96"/><line x1="180" y1="104" x2="184" y2="104"/>
  </g>

  <!-- cube: isometric, center (100,100) -->
  <!-- vertices: T(100,42) L(52,71) R(148,71) M(100,100) BL(52,129) BR(148,129) B(100,158) -->
  <g filter="url(#drop)">
    <!-- faces -->
    <polygon points="100,42 148,71 100,100 52,71" fill="url(#faceTop)" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="52,71 100,100 100,158 52,129" fill="url(#faceLeft)" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="148,71 100,100 100,158 148,129" fill="url(#faceRight)" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- hidden (dashed) blueprint edges -->
  <g stroke="#8E8E93" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round" fill="none" opacity="0.8">
    <line x1="100" y1="42" x2="100" y2="158" opacity="0.35"/>
    <line x1="52" y1="129" x2="100" y2="100" opacity="0.5"/>
    <line x1="148" y1="129" x2="100" y2="100" opacity="0.5"/>
  </g>

  <!-- sapphire accent edges -->
  <g filter="url(#softGlow)">
    <line x1="100" y1="42" x2="52" y2="71" stroke="#0A84FF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="100" y1="42" x2="148" y2="71" stroke="#0A84FF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="52" y1="129" x2="52" y2="71" stroke="#0A84FF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="148" y1="129" x2="148" y2="71" stroke="#0A84FF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- vertex nodes -->
  <g fill="#0A0A0A" stroke="#0A84FF" stroke-width="1.8">
    <circle cx="100" cy="42" r="4.5"/>
    <circle cx="52" cy="71" r="3.5"/>
    <circle cx="148" cy="71" r="3.5"/>
    <circle cx="100" cy="100" r="3.5"/>
    <circle cx="52" cy="129" r="3.5"/>
    <circle cx="148" cy="129" r="3.5"/>
    <circle cx="100" cy="158" r="4.5"/>
  </g>
  <circle cx="100" cy="42" r="1.6" fill="#FFFFFF"/>
  <circle cx="100" cy="158" r="1.6" fill="#FFFFFF"/>

  <!-- dimension callout -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" fill="#8E8E93">
    <line x1="148" y1="129" x2="168" y2="140" stroke="#8E8E93" stroke-width="1" stroke-opacity="0.6"/>
    <text x="146" y="152" font-size="8" letter-spacing="1">A³</text>
  </g>

  <!-- bottom label -->
  <text x="100" y="176" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8" letter-spacing="3" fill="#FFFFFF" fill-opacity="0.55">CUBE · 01</text>
</svg>