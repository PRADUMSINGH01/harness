<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#C9CDD3"/>
      <stop offset="1" stop-color="#8E8E93"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1D24" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- dark glass card -->
  <rect x="10" y="10" width="180" height="180" rx="22" fill="url(#glass)" stroke="#2A2E38" stroke-width="1.5"/>
  <circle cx="100" cy="95" r="78" fill="url(#glow)"/>

  <!-- protractor: protractor semicircle -->
  <g>
    <path d="M 32 118 A 68 68 0 0 1 168 118 L 152 118 A 52 52 0 0 0 48 118 Z" fill="none" stroke="url(#metal)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 32 118 H 168" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"/>
    <!-- tick marks every 10 degrees -->
    <g stroke="#8E8E93" stroke-width="1.2" opacity="0.9">
      <line x1="100" y1="50" x2="100" y2="58"/>
      <line x1="66.4" y1="60.5" x2="70.4" y2="67.4"/>
      <line x1="133.6" y1="60.5" x2="129.6" y2="67.4"/>
      <line x1="48" y1="90" x2="56" y2="92.4"/>
      <line x1="152" y1="90" x2="144" y2="92.4"/>
      <line x1="44.2" y1="104" x2="52.2" y2="105"/>
      <line x1="155.8" y1="104" x2="147.8" y2="105"/>
    </g>
    <text x="100" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#0A84FF" opacity="0.95">90°</text>
    <text x="52" y="86" text-anchor="middle" font-family="monospace" font-size="7" fill="#8E8E93">0</text>
    <text x="148" y="86" text-anchor="middle" font-family="monospace" font-size="7" fill="#8E8E93">180</text>
  </g>

  <!-- compass -->
  <g stroke-linecap="round">
    <!-- pivot head -->
    <circle cx="100" cy="62" r="9" fill="url(#metal)" stroke="#0A0A0A" stroke-width="1"/>
    <circle cx="100" cy="62" r="3.5" fill="#0A0A0A" stroke="#8E8E93" stroke-width="1"/>
    <!-- legs -->
    <path d="M 96 68 L 78 142" stroke="url(#metal)" stroke-width="5.5" filter="url(#soft)" opacity="0.4"/>
    <path d="M 96 68 L 78 140" stroke="url(#metal)" stroke-width="5"/>
    <path d="M 104 68 L 122 128" stroke="url(#metal)" stroke-width="5"/>
    <!-- pencil leg tip -->
    <path d="M 120 126 L 124 140" stroke="#0A84FF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="124" cy="142" r="2.5" fill="#0A84FF"/>
    <!-- needle leg tip -->
    <path d="M 78 140 L 75 152" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="75" cy="154" r="2" fill="#FFFFFF"/>
    <!-- knurled handle -->
    <line x1="100" y1="46" x2="100" y2="53" stroke="url(#metal)" stroke-width="4"/>
    <circle cx="100" cy="42" r="4.5" fill="#8E8E93" stroke="#0A0A0A" stroke-width="1"/>
  </g>

  <!-- arc drawn by compass -->
  <path d="M 60 132 A 66 66 0 0 1 138 148" fill="none" stroke="#0A84FF" stroke-width="1.6" stroke-dasharray="4 3" opacity="0.8"/>

  <!-- corner brackets -->
  <g stroke="#8E8E93" stroke-width="1.4" opacity="0.7" fill="none">
    <path d="M 20 30 V 20 H 30"/>
    <path d="M 180 30 V 20 H 170"/>
    <path d="M 20 170 V 180 H 30"/>
    <path d="M 180 170 V 180 H 170"/>
  </g>

  <!-- engraving -->
  <text x="100" y="177" text-anchor="middle" font-family="monospace" font-size="8" fill="#8E8E93" letter-spacing="2">DRAFT · 1974</text>
</svg>