<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glassBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141416"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="barSlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3A3E"/>
      <stop offset="1" stop-color="#8E8E93"/>
    </linearGradient>
    <linearGradient id="barFast" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FB5FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="fiber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="glassClip"><rect x="4" y="4" width="192" height="192" rx="20"/></clipPath>
  </defs>

  <!-- Glass card -->
  <g clip-path="url(#glassClip)">
    <rect x="4" y="4" width="192" height="192" rx="20" fill="url(#glassBg)" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>
    <circle cx="190" cy="8" r="90" fill="#0A84FF" opacity="0.06"/>
  </g>

  <!-- Corner brackets -->
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M12 22 V12 H22"/><path d="M178 12 H188 V22"/>
    <path d="M188 178 V188 H178"/><path d="M22 188 H12 V178"/>
  </g>

  <!-- Gridlines -->
  <g stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1">
    <line x1="34" y1="150" x2="186" y2="150"/>
    <line x1="34" y1="118" x2="186" y2="118"/>
    <line x1="34" y1="86" x2="186" y2="86"/>
    <line x1="34" y1="54" x2="186" y2="54"/>
  </g>
  <!-- Baseline -->
  <line x1="34" y1="152" x2="186" y2="152" stroke="#8E8E93" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- Bars: plot area y=50..150, 20ms -> 100px -->
  <g filter="url(#softShadow)">
    <!-- 16ms -->
    <rect x="58" y="70" width="28" height="80" rx="5" fill="url(#barSlow)"/>
    <!-- 13ms -->
    <rect x="126" y="85" width="28" height="65" rx="5" fill="url(#barFast)" filter="url(#glow)"/>
  </g>
  <!-- bar sheen -->
  <rect x="58" y="70" width="28" height="80" rx="5" fill="#FFFFFF" opacity="0.06"/>
  <rect x="126" y="85" width="28" height="65" rx="5" fill="#FFFFFF" opacity="0.10"/>

  <!-- Fiber cable crossing -->
  <path d="M10 176 C 50 150, 80 172, 108 148 S 165 110, 194 122" fill="none" stroke="url(#fiber)" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="108" cy="148" r="2.6" fill="#FFFFFF" filter="url(#glow)"/>

  <!-- Value callouts -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    <!-- 16ms callout -->
    <rect x="49" y="48" width="46" height="18" rx="9" fill="#1C1C1E" stroke="#8E8E93" stroke-opacity="0.6" stroke-width="1"/>
    <text x="72" y="61" font-size="11" font-weight="700" fill="#FFFFFF">16ms</text>
    <path d="M72 66 L72 70" stroke="#8E8E93" stroke-width="1.4"/>
    <!-- 13ms callout -->
    <rect x="117" y="63" width="46" height="18" rx="9" fill="#0A84FF" fill-opacity="0.18" stroke="#0A84FF" stroke-width="1.2"/>
    <text x="140" y="76" font-size="11" font-weight="800" fill="#6FB5FF">13ms</text>
    <path d="M140 81 L140 85" stroke="#0A84FF" stroke-width="1.4"/>
  </g>

  <!-- Axis labels -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" fill="#8E8E93" font-size="8.5" letter-spacing="0.5">
    <text x="72" y="164">FIBER 1</text>
    <text x="140" y="164">FIBER 2</text>
  </g>
  <text x="100" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" letter-spacing="1.5">LATENCY</text>
  <text x="100" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" fill="#8E8E93" font-size="6.5" letter-spacing="2">NETWORK COMPARISON</text>

  <!-- delta tag -->
  <g>
    <rect x="158" y="132" width="30" height="13" rx="6.5" fill="#0A84FF" fill-opacity="0.2" stroke="#0A84FF" stroke-opacity="0.7" stroke-width="0.8"/>
    <text x="173" y="141.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" font-size="7.5" font-weight="700" fill="#6FB5FF">−19%</text>
  </g>
</svg>