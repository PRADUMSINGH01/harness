<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="barG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.25"/>
      <stop offset="0.6" stop-color="#0A84FF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#5EB8FF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- dark glass card -->
  <rect x="2" y="2" width="196" height="196" rx="16" fill="#0A0A0A"/>
  <rect x="2" y="2" width="196" height="196" rx="16" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.12"/>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-opacity="0.7" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M12 22 V12 H22"/><path d="M178 12 H188 V22"/>
    <path d="M188 178 V188 H178"/><path d="M22 188 H12 V178"/>
  </g>

  <!-- title -->
  <text x="100" y="24" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">MARKET CAP · 2T → 18T</text>

  <!-- grid -->
  <g stroke="#8E8E93" stroke-opacity="0.18" stroke-width="0.5">
    <line x1="26" y1="45" x2="174" y2="45"/>
    <line x1="26" y1="75" x2="174" y2="75"/>
    <line x1="26" y1="105" x2="174" y2="105"/>
    <line x1="26" y1="135" x2="174" y2="135"/>
  </g>
  <g fill="#8E8E93" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="5" text-anchor="end" opacity="0.7">
    <text x="24" y="47">18T</text>
    <text x="24" y="77">13T</text>
    <text x="24" y="107">8T</text>
    <text x="24" y="137">4T</text>
  </g>

  <!-- axis baseline -->
  <line x1="26" y1="168" x2="174" y2="168" stroke="#8E8E93" stroke-width="1" stroke-opacity="0.5"/>

  <!-- exponential bars: baseline 168, top range 45; heights exponential from 2T to 18T -->
  <g>
    <rect x="30"  y="158.8" width="13" height="9.2"  rx="2" fill="url(#barG)"/>
    <rect x="50"  y="147.8" width="13" height="20.2" rx="2" fill="url(#barG)"/>
    <rect x="70"  y="134.5" width="13" height="33.5" rx="2" fill="url(#barG)"/>
    <rect x="90"  y="118.3" width="13" height="49.7" rx="2" fill="url(#barG)"/>
    <rect x="110" y="98.5"  width="13" height="69.5" rx="2" fill="url(#barG)"/>
    <rect x="130" y="74.3"  width="13" height="93.7" rx="2" fill="url(#barG)"/>
    <rect x="150" y="45"    width="13" height="123"  rx="2" fill="url(#barG)" filter="url(#glow)"/>
  </g>

  <!-- bar top highlights -->
  <g fill="#FFFFFF" opacity="0.85">
    <rect x="30"  y="158.8" width="13" height="1.4" rx="0.7"/>
    <rect x="50"  y="147.8" width="13" height="1.4" rx="0.7"/>
    <rect x="70"  y="134.5" width="13" height="1.4" rx="0.7"/>
    <rect x="90"  y="118.3" width="13" height="1.4" rx="0.7"/>
    <rect x="110" y="98.5"  width="13" height="1.4" rx="0.7"/>
    <rect x="130" y="74.3"  width="13" height="1.4" rx="0.7"/>
    <rect x="150" y="45"    width="13" height="1.4" rx="0.7"/>
  </g>

  <!-- trend curve -->
  <path d="M36.5 158.8 C 60 152, 90 130, 116.5 98.5 S 160 60, 156.5 45" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- peak callout -->
  <g>
    <circle cx="156.5" cy="45" r="2.5" fill="#0A84FF" filter="url(#glow)"/>
    <text x="148" y="40" text-anchor="end" fill="#0A84FF" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="7" font-weight="700">$18T</text>
  </g>

  <!-- start label -->
  <text x="36.5" y="180" text-anchor="middle" fill="#8E8E93" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="5">$2T</text>
  <text x="156.5" y="180" text-anchor="middle" fill="#0A84FF" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="5" font-weight="700">18T</text>

  <!-- x ticks -->
  <g stroke="#8E8E93" stroke-opacity="0.4" stroke-width="0.5">
    <line x1="36.5" y1="168" x2="36.5" y2="171"/>
    <line x1="96.5" y1="168" x2="96.5" y2="171"/>
    <line x1="156.5" y1="168" x2="156.5" y2="171"/>
  </g>
</svg>