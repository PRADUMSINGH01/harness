<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="capGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="headClip">
      <path d="M74 178 C70 150 60 140 58 118 C56 96 60 70 78 54 C96 38 124 36 140 50 C154 62 158 84 152 100 C148 110 148 116 152 122 C156 128 154 134 146 136 L136 139 C134 148 134 158 136 168 C137 174 132 178 126 178 Z"/>
    </clipPath>
  </defs>

  <!-- ambient background -->
  <circle cx="100" cy="96" r="90" fill="url(#bgGlow)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#0A84FF" stroke-opacity="0.15" stroke-width="0.6"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#8E8E93" stroke-opacity="0.15" stroke-width="0.4" stroke-dasharray="1 5"/>

  <!-- faint EEG waveform behind head -->
  <path d="M8 70 H40 l4 -8 l6 16 l5 -22 l6 30 l5 -14 l4 4 H78" fill="none" stroke="#0A84FF" stroke-opacity="0.35" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M130 150 h20 l4 -6 l5 12 l4 -16 l5 20 l4 -10 h24" fill="none" stroke="#0A84FF" stroke-opacity="0.28" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- head silhouette (dark glass) -->
  <g>
    <path d="M74 178 C70 150 60 140 58 118 C56 96 60 70 78 54 C96 38 124 36 140 50 C154 62 158 84 152 100 C148 110 148 116 152 122 C156 128 154 134 146 136 L136 139 C134 148 134 158 136 168 C137 174 132 178 126 178 Z"
          fill="url(#skinGrad)" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.2"/>
    <!-- facial features, subtle -->
    <path d="M148 96 q4 2 1 7" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round"/>
    <path d="M141 84 a3.5 3.5 0 1 1 -1 5" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M138 112 q6 1 10 -2" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.2" stroke-linecap="round"/>
    <!-- neck shading -->
    <g clip-path="url(#headClip)">
      <rect x="70" y="60" width="26" height="120" fill="#0A0A0A" opacity="0.35"/>
    </g>
  </g>

  <!-- EEG cap -->
  <path d="M76 58 C90 42 122 38 138 52 C150 63 153 82 149 96 C135 104 92 106 74 96 C68 82 68 68 76 58 Z"
        fill="url(#capGrad)" stroke="#0A84FF" stroke-width="1.4" stroke-opacity="0.9"/>
  <!-- cap grid seams -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="0.7">
    <path d="M92 46 C90 62 90 82 92 100"/>
    <path d="M114 43 C112 60 112 82 114 102"/>
    <path d="M76 66 C96 74 130 74 148 66"/>
    <path d="M73 82 C96 90 130 88 150 80"/>
  </g>

  <!-- electrodes -->
  <g filter="url(#glow)">
    <g fill="#FFFFFF" stroke="#0A84FF" stroke-width="1">
      <circle cx="84" cy="60" r="3.4"/>
      <circle cx="104" cy="52" r="3.4"/>
      <circle cx="126" cy="54" r="3.4"/>
      <circle cx="142" cy="66" r="3.4"/>
      <circle cx="96" cy="78" r="3.4"/>
      <circle cx="118" cy="78" r="3.4"/>
      <circle cx="138" cy="88" r="3.4"/>
      <circle cx="80" cy="90" r="3.4"/>
      <circle cx="108" cy="96" r="3.4"/>
    </g>
  </g>
  <!-- electrode cores -->
  <g fill="#0A84FF">
    <circle cx="84" cy="60" r="1.3"/><circle cx="104" cy="52" r="1.3"/><circle cx="126" cy="54" r="1.3"/>
    <circle cx="142" cy="66" r="1.3"/><circle cx="96" cy="78" r="1.3"/><circle cx="118" cy="78" r="1.3"/>
    <circle cx="138" cy="88" r="1.3"/><circle cx="80" cy="90" r="1.3"/><circle cx="108" cy="96" r="1.3"/>
  </g>

  <!-- wires from electrodes to amplifier bundle -->
  <g fill="none" stroke="#0A84FF" stroke-width="0.9" stroke-opacity="0.75" stroke-linecap="round">
    <path d="M84 60 C70 62 56 96 48 150"/>
    <path d="M80 90 C66 100 56 122 50 152"/>
    <path d="M108 96 C96 116 80 138 56 154"/>
    <path d="M96 78 C82 92 66 124 52 151"/>
  </g>
  <g fill="none" stroke="#8E8E93" stroke-width="0.9" stroke-opacity="0.6" stroke-linecap="round">
    <path d="M104 52 C92 64 74 104 54 150"/>
    <path d="M126 54 C112 72 92 118 60 152"/>
    <path d="M138 88 C122 104 96 132 62 154"/>
    <path d="M118 78 C104 96 84 128 56 153"/>
  </g>
  <!-- junction bundle -->
  <rect x="44" y="146" width="14" height="26" rx="5" fill="#0A0A0A" stroke="#0A84FF" stroke-width="1.2"/>
  <rect x="47" y="150" width="8" height="4" rx="2" fill="#0A84FF" opacity="0.8"/>
  <path d="M51 172 v10" stroke="#8E8E93" stroke-width="1.4" stroke-linecap="round"/>

  <!-- glow bloom behind cap -->
  <ellipse cx="108" cy="74" rx="42" ry="26" fill="#0A84FF" opacity="0.12" filter="url(#softGlow)"/>

  <!-- HUD details -->
  <g stroke="#8E8E93" stroke-opacity="0.5" stroke-width="0.8" fill="none">
    <path d="M14 186 h12 M20 180 v12"/>
    <path d="M176 24 h10 M181 19 v10"/>
  </g>
  <circle cx="170" cy="160" r="8" fill="none" stroke="#0A84FF" stroke-opacity="0.5" stroke-width="0.8"/>
  <path d="M170 152 v4 M170 164 v4 M162 160 h4 M174 160 h4" stroke="#0A84FF" stroke-opacity="0.6" stroke-width="0.8"/>
  <text x="100" y="194" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="6" fill="#8E8E93" fill-opacity="0.8" text-anchor="middle" letter-spacing="2">EEG · 128CH · 512 Hz</text>
</svg>