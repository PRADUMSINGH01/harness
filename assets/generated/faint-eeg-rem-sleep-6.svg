<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1C1E" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="0.15" stop-color="#FFFFFF"/>
      <stop offset="0.85" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <mask id="edgeFade">
      <rect x="16" y="88" width="168" height="24" fill="url(#fade)"/>
    </mask>
    <filter id="glow" x="-30%" y="-120%" width="160%" height="340%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- dark glass panel -->
  <g>
    <rect x="10" y="78" width="180" height="44" rx="10" fill="url(#glass)" stroke="#8E8E93" stroke-opacity="0.22" stroke-width="0.6"/>
    <!-- faint grid ticks -->
    <g stroke="#8E8E93" stroke-opacity="0.18" stroke-width="0.5">
      <line x1="16" y1="89" x2="184" y2="89"/>
      <line x1="16" y1="111" x2="184" y2="111"/>
      <g>
        <line x1="40" y1="82" x2="40" y2="88"/><line x1="65" y1="82" x2="65" y2="88"/>
        <line x1="90" y1="82" x2="90" y2="88"/><line x1="115" y1="82" x2="115" y2="88"/>
        <line x1="140" y1="82" x2="140" y2="88"/><line x1="165" y1="82" x2="165" y2="88"/>
        <line x1="40" y1="112" x2="40" y2="118"/><line x1="65" y1="112" x2="65" y2="118"/>
        <line x1="90" y1="112" x2="90" y2="118"/><line x1="115" y1="112" x2="115" y2="118"/>
        <line x1="140" y1="112" x2="140" y2="118"/><line x1="165" y1="112" x2="165" y2="118"/>
      </g>
    </g>
  </g>

  <!-- blue halo behind REM burst -->
  <ellipse cx="100" cy="100" rx="42" ry="14" fill="url(#halo)"/>

  <!-- EEG REM waveform: low-amp base with sawtooth REM bursts -->
  <g mask="url(#edgeFade)" opacity="0.5">
    <!-- gray baseline trace -->
    <path d="M12 100 L22 100 L26 96 L30 104 L34 100 L44 100 L48 97 L52 103 L56 100 L66 100 L70 97 L74 103 L78 100 L88 100 L92 97 L96 103 L100 100 L110 100 L114 97 L118 103 L122 100 L132 100 L136 97 L140 103 L144 100 L154 100 L158 97 L162 103 L166 100 L176 100 L180 97 L184 103 L188 100"
          fill="none" stroke="#8E8E93" stroke-width="1" stroke-linejoin="round" opacity="0.45"/>
    <!-- REM sawtooth burst cluster A -->
    <path d="M58 100 L61 93 L64 99 L66 92 L69 98 L72 91 L75 97 L78 92 L81 100 L86 100"
          fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- REM burst cluster B (blue, strongest) -->
    <path d="M90 100 L93 92 L96 99 L98 90 L101 98 L104 89 L107 98 L110 91 L113 99 L116 93 L119 100 L124 100"
          fill="none" stroke="#0A84FF" stroke-width="1.4" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- REM burst cluster C -->
    <path d="M128 100 L131 93 L134 99 L136 91 L139 98 L142 92 L145 99 L148 93 L151 100 L156 100"
          fill="none" stroke="#FFFFFF" stroke-width="1.1" stroke-linejoin="round" opacity="0.85" filter="url(#glow)"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#8E8E93" stroke-opacity="0.5" stroke-width="1" fill="none" stroke-linecap="round">
    <path d="M14 84 L14 80 Q14 78 16 78 L20 78"/>
    <path d="M186 84 L186 80 Q186 78 184 78 L180 78"/>
    <path d="M14 116 L14 120 Q14 122 16 122 L20 122"/>
    <path d="M186 116 L186 120 Q186 122 184 122 L180 122"/>
  </g>

  <!-- micro label + status dot -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <circle cx="24" cy="133" r="1.8" fill="#0A84FF" opacity="0.9"/>
    <text x="30" y="135.5" font-size="5.5" fill="#8E8E93" letter-spacing="1.2">REM — 2.4 Hz</text>
  </g>
</svg>