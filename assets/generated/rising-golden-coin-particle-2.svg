<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="80%" r="90%">
      <stop offset="0%" stop-color="#0A0D14"/>
      <stop offset="100%" stop-color="#05060A"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="45%" stop-color="#FFC94A"/>
      <stop offset="100%" stop-color="#C98A12"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="100%" stop-color="#8E6410"/>
    </linearGradient>
    <linearGradient id="blueBeam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glowGold" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <g id="coin">
      <ellipse cx="0" cy="0" rx="7.5" ry="7.5" fill="url(#gold)" stroke="url(#goldEdge)" stroke-width="0.8"/>
      <ellipse cx="0" cy="0" rx="4.8" ry="4.8" fill="none" stroke="#FFF3C4" stroke-opacity="0.7" stroke-width="0.7"/>
      <path d="M -2.6 2.4 L 0 -3.4 L 2.6 2.4 M -1.6 0.8 L 1.6 0.8" stroke="#8E6410" stroke-width="1" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- dark glass card -->
  <rect x="14" y="14" width="172" height="172" rx="18" fill="url(#glassCard)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>
  <rect x="14" y="14" width="172" height="172" rx="18" fill="none" stroke="#0A84FF" stroke-opacity="0.25" stroke-width="0.6"/>

  <!-- corner brackets -->
  <g stroke="#8E8E93" stroke-width="1.2" opacity="0.7" fill="none">
    <path d="M 14 30 V 18 A 4 4 0 0 1 18 14 H 30"/>
    <path d="M 170 14 H 182 A 4 4 0 0 1 186 18 V 30"/>
    <path d="M 186 170 V 182 A 4 4 0 0 1 182 186 H 170"/>
    <path d="M 30 186 H 18 A 4 4 0 0 1 14 182 V 170"/>
  </g>

  <!-- blue beam base -->
  <path d="M 88 186 C 90 150 92 120 100 96 C 108 120 110 150 112 186 Z" fill="url(#blueBeam)"/>
  <ellipse cx="100" cy="182" rx="26" ry="7" fill="#0A84FF" opacity="0.35" filter="url(#softGlow)"/>
  <ellipse cx="100" cy="182" rx="14" ry="4" fill="#FFFFFF" opacity="0.3" filter="url(#softGlow)"/>

  <!-- spark stream (small particles widening upward) -->
  <g fill="#FFC94A" filter="url(#glowGold)">
    <circle cx="93" cy="172" r="1.4"/>
    <circle cx="106" cy="166" r="1.1"/>
    <circle cx="97" cy="156" r="1.6"/>
    <circle cx="108" cy="150" r="1"/>
    <circle cx="90" cy="142" r="1.2"/>
    <circle cx="104" cy="130" r="1.3"/>
    <circle cx="94" cy="118" r="1"/>
    <circle cx="110" cy="108" r="0.9"/>
    <circle cx="87" cy="100" r="1.1"/>
    <circle cx="101" cy="88" r="1"/>
    <circle cx="91" cy="76" r="0.9"/>
    <circle cx="107" cy="66" r="0.8"/>
    <circle cx="97" cy="54" r="0.9"/>
    <circle cx="103" cy="42" r="0.7"/>
    <circle cx="94" cy="32" r="0.7"/>
  </g>

  <!-- compounding coins: larger as they rise -->
  <g filter="url(#glowGold)">
    <use href="#coin" transform="translate(100,160) scale(0.75) rotate(-8)"/>
    <use href="#coin" transform="translate(96,132) scale(0.9) rotate(12)"/>
    <use href="#coin" transform="translate(106,104) scale(1.05) rotate(-14)"/>
    <use href="#coin" transform="translate(94,72) scale(1.2) rotate(9)"/>
    <use href="#coin" transform="translate(103,40) scale(1.4) rotate(-6)"/>
  </g>

  <!-- top coin glow halo -->
  <circle cx="103" cy="40" r="12" fill="#FFC94A" opacity="0.18" filter="url(#softGlow)"/>

  <!-- rising motion ticks -->
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round">
    <path d="M 84 118 h 4"/>
    <path d="M 116 96 h 4"/>
    <path d="M 82 70 h 4"/>
    <path d="M 118 50 h 3.5"/>
  </g>

  <!-- growth curve accent -->
  <path d="M 40 170 C 60 164 78 140 92 96 C 100 72 108 52 116 34" fill="none" stroke="#0A84FF" stroke-opacity="0.6" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/>
  <circle cx="116" cy="34" r="2.4" fill="#FFFFFF" filter="url(#glowGold)"/>

  <!-- subtle technical crosshairs -->
  <g stroke="#8E8E93" stroke-opacity="0.5" stroke-width="0.8">
    <path d="M 150 24 h 8 M 154 20 v 8"/>
    <path d="M 36 176 h 6 M 39 173 v 6"/>
  </g>
</svg>