<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141821" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="0.2" stop-color="#FFFFFF"/>
      <stop offset="0.8" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="spindleGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Glass card -->
  <rect x="8" y="28" width="184" height="144" rx="14" fill="url(#glass)" stroke="#8E8E93" stroke-opacity="0.28" stroke-width="1"/>

  <!-- Corner brackets -->
  <g stroke="#0A84FF" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M14 44 v-10 a6 6 0 0 1 6-6 h10"/>
    <path d="M186 44 v-10 a6 6 0 0 0 -6-6 h-10"/>
    <path d="M14 156 v10 a6 6 0 0 0 6 6 h10"/>
    <path d="M186 156 v10 a6 6 0 0 0 -6 6 h-10"/>
  </g>

  <!-- Header -->
  <text x="20" y="46" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#8E8E93" letter-spacing="2">EEG · REM SLEEP</text>
  <circle cx="176" cy="42.5" r="3.2" fill="#0A84FF" opacity="0.9"/>
  <circle cx="176" cy="42.5" r="6" fill="none" stroke="#0A84FF" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Baseline grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="0.6">
    <line x1="20" y1="78" x2="180" y2="78"/>
    <line x1="20" y1="100" x2="180" y2="100"/>
    <line x1="20" y1="122" x2="180" y2="122"/>
    <line x1="50" y1="66" x2="50" y2="134"/>
    <line x1="100" y1="66" x2="100" y2="134"/>
    <line x1="150" y1="66" x2="150" y2="134"/>
  </g>
  <line x1="20" y1="100" x2="180" y2="100" stroke="#8E8E93" stroke-opacity="0.35" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- Spindle glow envelopes -->
  <ellipse cx="60" cy="100" rx="24" ry="26" fill="url(#spindleGlow)"/>
  <ellipse cx="148" cy="100" rx="22" ry="24" fill="url(#spindleGlow)"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="6.5" fill="#0A84FF" text-anchor="middle" opacity="0.95">
    <text x="60" y="140">SPINDLE</text>
    <text x="148" y="140">SPINDLE</text>
  </g>
  <g stroke="#0A84FF" stroke-opacity="0.5" stroke-width="0.6">
    <line x1="60" y1="128" x2="60" y2="132"/>
    <line x1="148" y1="128" x2="148" y2="132"/>
  </g>

  <!-- EEG waveform: low-amp mixed freq with two spindle bursts -->
  <g filter="url(#glow)">
    <path fill="none" stroke="url(#wave)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"
      d="M20 100
         L24 97 L27 103 L30 99 L34 96 L38 103 L42 100 L46 97 L50 102 L54 99
         L57 97 L59 94 L61 99 L63 106 L65 100 L67 93 L69 98 L71 107 L73 101 L75 92 L77 97 L79 106 L81 99 L83 93 L85 100 L87 106 L89 98 L91 94 L93 101 L95 99
         L98 97 L102 103 L106 98 L110 101 L114 96 L118 103 L122 99 L126 97
         L129 95 L131 91 L133 98 L135 108 L137 100 L139 91 L141 97 L143 108 L145 100 L147 92 L149 98 L151 106 L153 99 L155 94 L157 100 L159 99
         L163 98 L167 102 L171 97 L175 100 L180 99"/>
  </g>

  <!-- REM marker ticks -->
  <g stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="0.8">
    <line x1="20" y1="158" x2="26" y2="158"/>
    <line x1="60" y1="158" x2="66" y2="158"/>
    <line x1="100" y1="158" x2="106" y2="158"/>
    <line x1="140" y1="158" x2="146" y2="158"/>
    <line x1="180" y1="158" x2="180" y2="162"/>
  </g>
  <text x="180" y="162" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="5.5" fill="#8E8E93" text-anchor="end" opacity="0.8">5s / div</text>
</svg>