<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="orbGrad" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.15"/>
    </radialGradient>
    <radialGradient id="ambientGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="dotGrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="0.8" fill="#8E8E93" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- ambient background glow -->
  <circle cx="100" cy="100" r="88" fill="url(#ambientGlow)"/>
  <rect x="30" y="30" width="140" height="140" fill="url(#dotGrid)" opacity="0.35"/>

  <!-- glass card -->
  <rect x="38" y="38" width="124" height="124" rx="18" fill="url(#glassFill)" stroke="url(#strokeGrad)" stroke-opacity="0.45" stroke-width="1"/>

  <!-- corner brackets -->
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M30 48 V34 a4 4 0 0 1 4 -4 H48" stroke="#0A84FF" opacity="0.9"/>
    <path d="M170 48 V34 a4 4 0 0 0 -4 -4 H152" stroke="#FFFFFF" opacity="0.6"/>
    <path d="M30 152 V166 a4 4 0 0 0 4 4 H48" stroke="#FFFFFF" opacity="0.6"/>
    <path d="M170 152 V166 a4 4 0 0 1 -4 4 H152" stroke="#0A84FF" opacity="0.9"/>
  </g>

  <!-- crosshair accents -->
  <g stroke="#8E8E93" stroke-width="0.8" opacity="0.6">
    <line x1="100" y1="26" x2="100" y2="34"/>
    <line x1="100" y1="166" x2="100" y2="174"/>
    <line x1="26" y1="100" x2="34" y2="100"/>
    <line x1="166" y1="100" x2="174" y2="100"/>
  </g>

  <!-- central orb -->
  <g filter="url(#glow)">
    <circle cx="100" cy="100" r="22" fill="url(#orbGrad)"/>
  </g>
  <circle cx="100" cy="100" r="30" fill="none" stroke="#0A84FF" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="100" cy="100" r="40" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="2 6" stroke-linecap="round"/>

  <!-- orbiting nodes -->
  <g>
    <circle cx="100" cy="60" r="3" fill="#FFFFFF" filter="url(#softGlow)"/>
    <circle cx="100" cy="60" r="1.8" fill="#FFFFFF"/>
    <circle cx="140" cy="100" r="2.4" fill="#0A84FF" filter="url(#softGlow)"/>
    <circle cx="140" cy="100" r="1.5" fill="#0A84FF"/>
    <circle cx="72" cy="128" r="2" fill="#8E8E93"/>
  </g>

  <!-- sparkline accents bottom -->
  <polyline points="52,142 66,136 78,140 92,130 106,134 120,126 134,132 148,124" fill="none" stroke="#0A84FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <circle cx="148" cy="124" r="2" fill="#0A84FF" filter="url(#softGlow)"/>

  <!-- side tick marks -->
  <g stroke="#8E8E93" stroke-width="1" opacity="0.5" stroke-linecap="round">
    <line x1="46" y1="72" x2="52" y2="72"/>
    <line x1="46" y1="100" x2="52" y2="100"/>
    <line x1="46" y1="128" x2="52" y2="128"/>
    <line x1="148" y1="72" x2="154" y2="72"/>
    <line x1="148" y1="128" x2="154" y2="128"/>
  </g>

  <!-- top micro label bar -->
  <g>
    <circle cx="52" cy="50" r="2" fill="#0A84FF"/>
    <circle cx="60" cy="50" r="2" fill="#8E8E93" opacity="0.7"/>
    <circle cx="68" cy="50" r="2" fill="#FFFFFF" opacity="0.5"/>
    <line x1="78" y1="50" x2="146" y2="50" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>