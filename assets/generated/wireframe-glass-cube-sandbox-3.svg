<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="breachGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#0A84FF" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rimGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tinyBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <!-- Deep dark glass backdrop -->
  <rect x="0" y="0" width="200" height="200" fill="#0A0A0A"/>
  <radialGradient id="bgVignette" cx="0.5" cy="0.45" r="0.7">
    <stop offset="0" stop-color="#10151d" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#0A0A0A" stop-opacity="1"/>
  </radialGradient>
  <rect x="0" y="0" width="200" height="200" fill="url(#bgVignette)"/>

  <!-- fine grid floor hints -->
  <g stroke="#8E8E93" stroke-opacity="0.08" stroke-width="0.5">
    <line x1="10" y1="178" x2="190" y2="178"/>
    <line x1="10" y1="186" x2="190" y2="186"/>
    <line x1="24" y1="178" x2="14" y2="186"/>
    <line x1="64" y1="178" x2="54" y2="186"/>
    <line x1="104" y1="178" x2="94" y2="186"/>
    <line x1="144" y1="178" x2="134" y2="186"/>
    <line x1="184" y1="178" x2="174" y2="186"/>
  </g>

  <!-- Cube geometry: isometric vertices -->
  <!-- T(100,20) R(170,55) B(100,90) L(30,55) ; bottoms: L2(30,135) R2(170,135) B2(100,170) -->

  <!-- ambient glass fill -->
  <g>
    <polygon points="100,20 170,55 100,90 30,55" fill="url(#faceTop)"/>
    <polygon points="30,55 100,90 100,170 30,135" fill="url(#faceLeft)"/>
    <polygon points="170,55 100,90 100,170 170,135" fill="url(#faceRight)"/>
  </g>

  <!-- refraction rim: soft blue glow layer behind edges -->
  <g stroke="#0A84FF" stroke-width="3.5" fill="none" stroke-opacity="0.45" filter="url(#tinyBlur)" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="100,20 170,55 100,90 30,55"/>
    <line x1="30" y1="55" x2="30" y2="135"/>
    <line x1="170" y1="55" x2="170" y2="135"/>
    <line x1="100" y1="90" x2="100" y2="170"/>
    <polygon points="30,135 170,135 100,170"/>
  </g>

  <!-- crisp white wireframe -->
  <g stroke="#FFFFFF" stroke-width="1.4" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.95">
    <polygon points="100,20 170,55 100,90 30,55"/>
    <line x1="30" y1="55" x2="30" y2="135"/>
    <line x1="170" y1="55" x2="170" y2="135"/>
    <line x1="100" y1="90" x2="100" y2="170"/>
    <polygon points="30,135 170,135 100,170"/>
  </g>

  <!-- secondary hairline wireframe (glass thickness / double-wall effect) -->
  <g stroke="#FFFFFF" stroke-width="0.5" fill="none" stroke-opacity="0.35">
    <polygon points="100,26 160,55 100,84 40,55"/>
    <line x1="40" y1="55" x2="40" y2="128"/>
    <line x1="160" y1="55" x2="160" y2="128"/>
    <line x1="100" y1="84" x2="100" y2="160"/>
    <polygon points="40,128 160,128 100,160"/>
  </g>

  <!-- corner ticks / micro detail -->
  <g stroke="#8E8E93" stroke-width="0.7" stroke-opacity="0.7">
    <line x1="94" y1="20" x2="106" y2="20"/>
    <line x1="100" y1="15" x2="100" y2="20"/>
    <line x1="24" y1="55" x2="30" y2="55"/>
    <line x1="30" y1="141" x2="30" y2="135"/>
    <line x1="176" y1="55" x2="170" y2="55"/>
    <line x1="170" y1="141" x2="170" y2="135"/>
    <line x1="100" y1="164" x2="100" y2="170"/>
  </g>

  <!-- BREACH POINT at right vertex (170,55) -->
  <g>
    <!-- wide halo -->
    <circle cx="170" cy="55" r="34" fill="url(#rimGlow)"/>
    <circle cx="170" cy="55" r="26" fill="url(#breachGlow)" opacity="0.85"/>
    <!-- pulse rings -->
    <circle cx="170" cy="55" r="10" fill="none" stroke="#0A84FF" stroke-width="1" stroke-opacity="0.8"/>
    <circle cx="170" cy="55" r="16" fill="none" stroke="#0A84FF" stroke-width="0.8" stroke-opacity="0.45"/>
    <circle cx="170" cy="55" r="22" fill="none" stroke="#0A84FF" stroke-width="0.6" stroke-opacity="0.25"/>
    <!-- fracture cracks radiating from breach -->
    <g stroke="#FFFFFF" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.9" filter="url(#softGlow)">
      <path d="M170,55 L182,42 L190,44"/>
      <path d="M170,55 L156,66 L146,64"/>
      <path d="M170,55 L163,39 L166,32"/>
      <path d="M170,55 L185,68"/>
      <path d="M170,55 L159,58 L150,72"/>
    </g>
    <!-- hot core -->
    <circle cx="170" cy="55" r="3.2" fill="#FFFFFF" filter="url(#softGlow)"/>
    <circle cx="170" cy="55" r="5.5" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.9"/>
  </g>

  <!-- specular highlight streak on top face -->
  <path d="M104,26 Q132,38 160,54" stroke="#FFFFFF" stroke-width="0.8" fill="none" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- corner brackets framing the sandbox -->
  <g stroke="#8E8E93" stroke-width="1" fill="none" stroke-opacity="0.55">
    <path d="M10,20 L10,10 L20,10"/>
    <path d="M190,20 L190,10 L180,10"/>
    <path d="M10,190 L10,180 L20,180"/>
    <path d="M190,190 L190,180 L180,180"/>
  </g>
</svg>