<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241c12"/>
      <stop offset="1" stop-color="#14100c"/>
    </linearGradient>
    <linearGradient id="infl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e63b2e"/>
      <stop offset="1" stop-color="#ff7a4d"/>
    </linearGradient>
    <linearGradient id="flat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2e8d5"/>
      <stop offset="1" stop-color="#fffdf5"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e8d5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f2e8d5" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="plotClip"><rect x="34" y="52" width="140" height="96"/></clipPath>
  </defs>

  <!-- glass card -->
  <rect x="4" y="4" width="192" height="192" rx="16" fill="url(#glass)" stroke="#f2e8d5" stroke-opacity="0.14" filter="url(#soft)"/>
  <rect x="4" y="4" width="192" height="60" rx="16" fill="#f2e8d5" opacity="0.04"/>

  <!-- header -->
  <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2" fill="#e63b2e">COSTCO FOOD COURT</text>
  <text x="16" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#f2e8d5">Hot Dog + Soda Combo</text>
  <g font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="7">
    <rect x="140" y="14" width="44" height="11" rx="5.5" fill="#e63b2e" fill-opacity="0.16" stroke="#e63b2e" stroke-opacity="0.5" stroke-width="0.6"/>
    <text x="162" y="22" text-anchor="middle" fill="#ff8a7a" letter-spacing="1">SINCE 1985</text>
  </g>

  <!-- plot frame -->
  <g stroke="#f2e8d5" stroke-opacity="0.08" stroke-width="0.7">
    <line x1="34" y1="60" x2="174" y2="60"/>
    <line x1="34" y1="84" x2="174" y2="84"/>
    <line x1="34" y1="108" x2="174" y2="108"/>
    <line x1="34" y1="132" x2="174" y2="132"/>
    <line x1="34" y1="148" x2="174" y2="148"/>
  </g>

  <!-- inflation area + line (rising under $1.50 line since ~1990s) -->
  <g clip-path="url(#plotClip)">
    <path d="M34,142 C64,138 84,128 104,114 C124,100 150,84 174,66 L174,148 L34,148 Z" fill="url(#fade)"/>
    <path d="M34,142 C64,138 84,128 104,114 C124,100 150,84 174,66" fill="none" stroke="url(#infl)" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- flat $1.50 line -->
  <line x1="34" y1="102" x2="174" y2="102" stroke="url(#flat)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="34" y1="102" x2="174" y2="102" stroke="#f2e8d5" stroke-width="1" stroke-dasharray="1 5" stroke-opacity="0.7"/>

  <!-- price badge -->
  <g filter="url(#soft)">
    <rect x="14" y="93" width="38" height="18" rx="9" fill="#e63b2e"/>
    <text x="33" y="105.5" text-anchor="middle" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="9.5" font-weight="700" fill="#fffdf5">$1.50</text>
  </g>
  <!-- endpoint dot -->
  <circle cx="174" cy="66" r="3.2" fill="#ff7a4d" filter="url(#glow)"/>

  <!-- legend -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="600">
    <line x1="96" y1="97" x2="112" y2="97" stroke="#f2e8d5" stroke-width="2.4" stroke-linecap="round"/>
    <text x="116" y="99.5" fill="#f2e8d5">Costco price</text>
    <line x1="96" y1="110" x2="112" y2="110" stroke="#e63b2e" stroke-width="2.4" stroke-linecap="round"/>
    <text x="116" y="112.5" fill="#ff8a7a">If priced w/ inflation</text>
  </g>

  <!-- callout: est. price today -->
  <text x="174" y="58" text-anchor="end" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="7.5" font-weight="700" fill="#ff7a4d">$4.50+</text>

  <!-- footer -->
  <line x1="16" y1="162" x2="184" y2="162" stroke="#f2e8d5" stroke-opacity="0.12" stroke-width="0.7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="600" fill="#f2e8d5" fill-opacity="0.85">
    <text x="16" y="176" font-size="9" font-weight="800" fill="#f2e8d5">0 price increases in 40 years</text>
    <text x="16" y="187" font-size="6.5" fill="#f2e8d5" fill-opacity="0.55">A loss leader guarantee — membership is the business.</text>
  </g>

  <!-- corner brackets -->
  <g stroke="#f2e8d5" stroke-opacity="0.35" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M10,18 V12 Q10,10 12,10 H18"/>
    <path d="M182,10 H188 Q190,10 190,12 V18"/>
    <path d="M190,182 V188 Q190,190 188,190 H182"/>
    <path d="M18,190 H12 Q10,190 10,188 V182"/>
  </g>
</svg>