<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1D24" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="seatA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EB8FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="200" height="200" rx="16" fill="url(#glass)" stroke="#2A2E37" stroke-width="1"/>

  <text x="100" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF" letter-spacing="2">SEAT MAP · A320</text>

  <!-- Fuselage -->
  <path d="M100 30 C 66 30, 56 46, 56 72 L56 176 C 56 190, 70 194, 100 194 C 130 194, 144 190, 144 176 L144 72 C 144 46, 134 30, 100 30 Z"
        fill="#101319" stroke="#3A3F4B" stroke-width="1.2"/>
  <path d="M100 34 C 72 34, 62 48, 62 74" fill="none" stroke="#0A84FF" stroke-width="0.8" opacity="0.5"/>

  <!-- nose crosshair -->
  <g stroke="#8E8E93" stroke-width="0.6" opacity="0.7">
    <line x1="100" y1="24" x2="100" y2="30"/>
    <line x1="94" y1="27" x2="106" y2="27"/>
  </g>

  <!-- Seat grid: 6 columns x 8 rows, seats ~9x11, aisle in middle -->
  <g id="seats">
    <!-- row template via generated rects -->
    <!-- rows y start 44, step 17.5 : 44,61.5,79,96.5,114,131.5,149,166.5 -->
    <!-- columns x: 66, 80, 94 (left block) | 106, 120, 134 (right block) -->
  </g>

  <g id="seatrows" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Generated seats -->
    <g fill="url(#seatA)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.5" filter="url(#glow)">
      <rect x="66" y="44" width="9" height="11" rx="3"/><rect x="80" y="44" width="9" height="11" rx="3"/><rect x="94" y="44" width="9" height="11" rx="3"/><rect x="106" y="44" width="9" height="11" rx="3"/><rect x="120" y="44" width="9" height="11" rx="3"/><rect x="134" y="44" width="9" height="11" rx="3"/>
      <rect x="66" y="61.5" width="9" height="11" rx="3"/><rect x="94" y="61.5" width="9" height="11" rx="3"/><rect x="120" y="61.5" width="9" height="11" rx="3"/><rect x="134" y="61.5" width="9" height="11" rx="3"/>
      <rect x="80" y="79" width="9" height="11" rx="3"/><rect x="106" y="79" width="9" height="11" rx="3"/><rect x="134" y="79" width="9" height="11" rx="3"/>
      <rect x="66" y="96.5" width="9" height="11" rx="3"/><rect x="80" y="96.5" width="9" height="11" rx="3"/><rect x="94" y="96.5" width="9" height="11" rx="3"/><rect x="120" y="96.5" width="9" height="11" rx="3"/>
      <rect x="66" y="114" width="9" height="11" rx="3"/><rect x="94" y="114" width="9" height="11" rx="3"/><rect x="106" y="114" width="9" height="11" rx="3"/><rect x="134" y="114" width="9" height="11" rx="3"/>
      <rect x="80" y="131.5" width="9" height="11" rx="3"/><rect x="120" y="131.5" width="9" height="11" rx="3"/><rect x="134" y="131.5" width="9" height="11" rx="3"/>
      <rect x="66" y="149" width="9" height="11" rx="3"/><rect x="106" y="149" width="9" height="11" rx="3"/><rect x="120" y="149" width="9" height="11" rx="3"/>
      <rect x="80" y="166.5" width="9" height="11" rx="3"/><rect x="94" y="166.5" width="9" height="11" rx="3"/><rect x="120" y="166.5" width="9" height="11" rx="3"/>
    </g>
    <g fill="#3A3F4B" stroke="#555B66" stroke-width="0.5">
      <rect x="94" y="61.5" width="9" height="11" rx="3"/><rect x="106" y="61.5" width="9" height="11" rx="3"/>
      <rect x="66" y="79" width="9" height="11" rx="3"/><rect x="94" y="79" width="9" height="11" rx="3"/><rect x="120" y="79" width="9" height="11" rx="3"/>
      <rect x="106" y="96.5" width="9" height="11" rx="3"/><rect x="134" y="96.5" width="9" height="11" rx="3"/>
      <rect x="80" y="114" width="9" height="11" rx="3"/><rect x="120" y="114" width="9" height="11" rx="3"/>
      <rect x="66" y="131.5" width="9" height="11" rx="3"/><rect x="94" y="131.5" width="9" height="11" rx="3"/><rect x="106" y="131.5" width="9" height="11" rx="3"/>
      <rect x="80" y="149" width="9" height="11" rx="3"/><rect x="94" y="149" width="9" height="11" rx="3"/><rect x="134" y="149" width="9" height="11" rx="3"/>
      <rect x="66" y="166.5" width="9" height="11" rx="3"/><rect x="106" y="166.5" width="9" height="11" rx="3"/><rect x="134" y="166.5" width="9" height="11" rx="3"/>
    </g>

    <!-- Row labels on aisle -->
    <g fill="#8E8E93" font-size="5.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="100" y="51">1</text><text x="100" y="68.5">2</text><text x="100" y="86">3</text><text x="100" y="103.5">4</text><text x="100" y="121">5</text><text x="100" y="138.5">6</text><text x="100" y="156">7</text><text x="100" y="173.5">8</text>
    </g>
  </g>

  <!-- Legend -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6">
    <rect x="62" y="184" width="7" height="4" rx="1.5" fill="url(#seatA)"/>
    <text x="72" y="189" fill="#8E8E93">FREE</text>
    <rect x="100" y="184" width="7" height="4" rx="1.5" fill="#3A3F4B"/>
    <text x="110" y="189" fill="#8E8E93">TAKEN</text>
  </g>
</svg>