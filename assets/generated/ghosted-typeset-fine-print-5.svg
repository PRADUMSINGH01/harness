<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0A0A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- dark glass column -->
  <rect x="40" y="14" width="120" height="172" rx="8" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="0.6"/>
  <line x1="40.5" y1="14" x2="72" y2="14" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="0.7"/>

  <!-- corner brackets -->
  <g stroke="#8E8E93" stroke-opacity="0.55" stroke-width="1" fill="none" stroke-linecap="round">
    <path d="M32 22 v-8 h8"/>
    <path d="M168 14 h8 v8"/>
    <path d="M176 178 v8 h-8"/>
    <path d="M40 186 h-8 v-8"/>
  </g>

  <!-- accent rule -->
  <rect x="50" y="26" width="2" height="24" rx="1" fill="url(#accent)" filter="url(#softGlow)"/>

  <!-- typographic column -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- small kicker -->
    <text x="60" y="32" font-size="5" fill="#8E8E93" letter-spacing="2" font-family="ui-monospace, 'SF Mono', Menlo, monospace">FRANKLIN · 1748</text>

    <!-- main quote, ghosted fine print -->
    <g fill="#FFFFFF" fill-opacity="0.85" font-size="9.5" font-weight="600">
      <text x="60" y="48">Remember</text>
      <text x="60" y="60">that time</text>
      <text x="60" y="72">is money.</text>
    </g>

    <!-- fine print body -->
    <g fill="#8E8E93" fill-opacity="0.75" font-size="4.2" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.2">
      <text x="50" y="92">— Advice to a Young Tradesman,</text>
      <text x="50" y="99">Written by an Old One. Time, he</text>
      <text x="50" y="106">argues, is the working capital of</text>
      <text x="50" y="113">life: idle hours are principal lost.</text>

      <text x="50" y="127" font-size="3.6" fill-opacity="0.45">LOREM IPSUM · SERIAL NO. 0005</text>
      <text x="50" y="134" font-size="3.6" fill-opacity="0.45">SET IN GHOSTED FINE PRINT</text>

      <g fill-opacity="0.5" font-size="3.4">
        <text x="50" y="150">IDLE HOURS ······ 000</text>
        <text x="50" y="157">WORKING CAPITAL ·· ∞</text>
        <text x="50" y="164">INTEREST ACCRUED ·· ↑</text>
      </g>
    </g>

    <!-- baseline hairline -->
    <line x1="50" y1="172" x2="150" y2="172" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="0.5"/>
  </g>
</svg>