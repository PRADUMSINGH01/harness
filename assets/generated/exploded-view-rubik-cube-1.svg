<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="glass" cx="35%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#16181F"/>
      <stop offset="55%" stop-color="#0E1016"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="faceWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9CDD4"/>
    </linearGradient>
    <linearGradient id="faceBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4DA3FF"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="faceGray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A9ADB4"/>
      <stop offset="100%" stop-color="#6E7278"/>
    </linearGradient>
    <linearGradient id="coreMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B9BDC4"/>
      <stop offset="100%" stop-color="#5A5E64"/>
    </linearGradient>
    <filter id="blueGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- dark glass card -->
  <rect x="0" y="0" width="200" height="200" rx="18" fill="url(#glass)"/>
  <rect x="0.75" y="0.75" width="198.5" height="198.5" rx="17.5" fill="none" stroke="#8E8E93" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- corner brackets -->
  <g stroke="#8E8E93" stroke-opacity="0.65" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M12 22 L12 12 L22 12"/>
    <path d="M178 12 L188 12 L188 22"/>
    <path d="M188 178 L188 188 L178 188"/>
    <path d="M22 188 L12 188 L12 178"/>
  </g>

  <!-- faint grid ticks -->
  <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1">
    <path d="M20 50 H180 M20 100 H180 M20 150 H180"/>
    <path d="M50 20 V180 M100 20 V180 M150 20 V180"/>
  </g>

  <!-- explode axis -->
  <g>
    <line x1="60" y1="120" x2="138" y2="74" stroke="#0A84FF" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="5 4" stroke-linecap="round"/>
    <circle cx="60" cy="120" r="3.4" fill="none" stroke="#0A84FF" stroke-opacity="0.8" stroke-width="1.2"/>
    <circle cx="60" cy="120" r="1.3" fill="#0A84FF"/>
    <circle cx="140" cy="72" r="34" fill="none" stroke="#0A84FF" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="2 4"/>
  </g>

  <!-- CORE SPIDER -->
  <g filter="url(#softShadow)">
    <!-- arms -->
    <g stroke="#8E8E93" stroke-width="7" stroke-linecap="round">
      <line x1="58" y1="121" x2="32" y2="108"/>
      <line x1="58" y1="121" x2="84" y2="108"/>
      <line x1="58" y1="121" x2="58" y2="149"/>
    </g>
    <g stroke="#6E7278" stroke-width="7" stroke-linecap="round" stroke-opacity="0.55" fill="none">
      <line x1="58" y1="121" x2="32" y2="108"/>
      <line x1="58" y1="121" x2="84" y2="108"/>
      <line x1="58" y1="121" x2="58" y2="149"/>
    </g>
    <!-- arm tip studs -->
    <g fill="#0A84FF" filter="url(#blueGlow)">
      <circle cx="32" cy="108" r="2.2"/>
      <circle cx="84" cy="108" r="2.2"/>
      <circle cx="58" cy="149" r="2.2"/>
    </g>
    <!-- core hub cube -->
    <g>
      <polygon points="48,115 58,120 58,132 48,127" fill="#5A5E64"/>
      <polygon points="68,115 58,120 58,132 68,127" fill="#6E7278"/>
      <polygon points="58,110 68,115 58,120 48,115" fill="url(#coreMetal)"/>
      <polygon points="58,110 68,115 58,120 48,115" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.8"/>
    </g>
  </g>

  <!-- CORNER CUBIE -->
  <g transform="translate(140,52)" filter="url(#softShadow)">
    <polygon points="-17,8.5 0,17 0,41 -17,32.5" fill="url(#faceGray)"/>
    <polygon points="17,8.5 0,17 0,41 17,32.5" fill="url(#faceBlue)"/>
    <polygon points="0,0 17,8.5 0,17 -17,8.5" fill="url(#faceWhite)"/>
    <!-- sticker inlays -->
    <polygon points="0,4.2 11,9.3 0,14.4 -11,9.3" fill="#FFFFFF" stroke="#0A0A0A" stroke-opacity="0.15" stroke-width="0.8"/>
    <polygon points="11,11.8 0,16.6 0,34 11,29.2" fill="#2E96FF" stroke="#0A0A0A" stroke-opacity="0.15" stroke-width="0.8"/>
    <polygon points="-11,11.8 0,16.6 0,34 -11,29.2" fill="#8E8E93" stroke="#0A0A0A" stroke-opacity="0.15" stroke-width="0.8"/>
    <!-- bevel highlight -->
    <path d="M0 0 L17 8.5 L17 32.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="0.9"/>
    <!-- crosshair marker -->
    <g stroke="#0A84FF" stroke-width="1" stroke-opacity="0.9">
      <line x1="-24" y1="20.5" x2="-20" y2="20.5"/>
      <line x1="20" y1="20.5" x2="24" y2="20.5"/>
    </g>
  </g>

  <!-- corner cubie glow ring -->
  <circle cx="140" cy="72" r="5" fill="none" stroke="#0A84FF" stroke-opacity="0.7" stroke-width="1.2" filter="url(#blueGlow)"/>

  <!-- label ticks -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="5.5" fill="#8E8E93" fill-opacity="0.9">
    <text x="150" y="104">CORNER</text>
    <text x="88" y="158">CORE · SPIDER</text>
    <text x="12" y="35" fill="#0A84FF" fill-opacity="0.85">EXPLODE AXIS ↗</text>
  </g>
  <g stroke="#8E8E93" stroke-opacity="0.5" stroke-width="0.8">
    <line x1="148" y1="100" x2="140" y2="94"/>
    <line x1="86" y1="154" x2="62" y2="146"/>
  </g>

  <!-- micro spec dots -->
  <g fill="#0A84FF" fill-opacity="0.7">
    <circle cx="26" cy="176" r="1.2"/><circle cx="31" cy="176" r="1.2"/><circle cx="36" cy="176" r="1.2"/>
  </g>
  <line x1="20" y1="182" x2="60" y2="182" stroke="#8E8E93" stroke-opacity="0.35" stroke-width="1"/>
</svg>