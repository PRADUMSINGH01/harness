<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1F26"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- glass card -->
  <g filter="url(#softshadow)">
    <rect x="30" y="30" width="140" height="140" rx="24" fill="url(#glass)" stroke="#8E8E93" stroke-opacity="0.25" stroke-width="1.5"/>
    <rect x="30" y="30" width="140" height="140" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="4"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M22 40 V32 A8 8 0 0 1 30 24 H38"/>
    <path d="M162 24 H170 A8 8 0 0 1 178 32 V40"/>
    <path d="M178 160 V168 A8 8 0 0 1 170 176 H162"/>
    <path d="M38 176 H30 A8 8 0 0 1 22 168 V160"/>
  </g>

  <!-- title bar ticks -->
  <g fill="#8E8E93" opacity="0.8">
    <circle cx="46" cy="48" r="3"/>
    <circle cx="58" cy="48" r="3"/>
    <circle cx="70" cy="48" r="3"/>
  </g>
  <line x1="42" y1="60" x2="158" y2="60" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- prompt chevron -->
  <path d="M62 82 L82 98 L62 114" fill="none" stroke="url(#blue)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- blinking underscore cursor -->
  <rect x="98" y="108" width="44" height="10" rx="5" fill="#FFFFFF" filter="url(#glow)">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <!-- faint ghost underscore -->
  <rect x="98" y="108" width="44" height="10" rx="5" fill="#FFFFFF" opacity="0.08"/>

  <!-- micro sparkline detail -->
  <polyline points="50,148 66,148 74,140 90,152 104,146 120,150 150,146" fill="none" stroke="#0A84FF" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="150" cy="146" r="2.5" fill="#38BDF8"/>
</svg>