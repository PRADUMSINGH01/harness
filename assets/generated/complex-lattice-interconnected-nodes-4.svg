<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#14161c"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="planeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="planeB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="url(#bg)"/>

  <!-- isometric grid helper: project (u,v) -> x=100+(u-v)*0.866, y=150-(u+v)*0.5 -->
  <g id="lattice" transform="translate(0,6)">
    <!-- Glass planes -->
    <g opacity="0.85">
      <path d="M48 116 L139 70 L186 94 L95 140 Z" fill="url(#planeB)" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="0.6"/>
      <path d="M39 140 L130 94 L177 118 L86 164 Z" fill="url(#planeA)" stroke="#0A84FF" stroke-opacity="0.45" stroke-width="0.6"/>
    </g>

    <!-- grid lines lower plane -->
    <g stroke="#0A84FF" stroke-opacity="0.30" stroke-width="0.55">
      <path d="M63.4 132.5 L154.4 86.5 M87.8 144.5 L178.8 98.5"/>
      <path d="M60.7 127.5 L108.7 103.5 M109.5 152.5 L157.5 128.5"/>
    </g>
    <!-- grid lines upper plane -->
    <g stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="0.5">
      <path d="M72.4 108.5 L163.4 62.5 M96.8 120.5 L187.8 74.5"/>
      <path d="M69.7 103.5 L117.7 79.5 M118.5 128.5 L166.5 104.5"/>
    </g>

    <!-- vertical links -->
    <g stroke="#8E8E93" stroke-opacity="0.55" stroke-width="0.8" stroke-dasharray="1.5 2.5">
      <path d="M48 116 L39 140 M95 140 L86 164 M139 70 L130 94 M186 94 L177 118"/>
      <path d="M83 93 L74 117 M130 93 L121 117 M107 81 L98 105 M154 81 L145 105"/>
    </g>

    <!-- lattice edges (lower, blue) -->
    <g stroke="#0A84FF" stroke-opacity="0.85" stroke-width="0.9" fill="none" filter="url(#glow)">
      <path d="M39 140 L86 164 L177 118 L130 94 Z"/>
      <path d="M63.4 132.5 L154.4 86.5 M87.8 144.5 L178.8 98.5 M60.7 127.5 L108.7 103.5 M109.5 152.5 L157.5 128.5"/>
      <path d="M60.7 127.5 L63.4 132.5 M87.8 144.5 L109.5 152.5"/>
    </g>

    <!-- lattice edges (upper, white/gray) -->
    <g stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="0.7" fill="none">
      <path d="M48 116 L139 70 L186 94 L95 140 Z"/>
      <path d="M72.4 108.5 L163.4 62.5 M96.8 120.5 L187.8 74.5 M69.7 103.5 L117.7 79.5 M118.5 128.5 L166.5 104.5"/>
    </g>

    <!-- glow halos -->
    <g fill="#0A84FF" opacity="0.35" filter="url(#softGlow)">
      <circle cx="39" cy="140" r="4"/><circle cx="86" cy="164" r="4"/><circle cx="177" cy="118" r="4"/><circle cx="130" cy="94" r="4"/>
    </g>

    <!-- nodes lower -->
    <g fill="#FFFFFF" stroke="#0A84FF" stroke-width="1.4" filter="url(#glow)">
      <circle cx="39" cy="140" r="2.6"/><circle cx="63.4" cy="132.5" r="2.2"/><circle cx="87.8" cy="144.5" r="2.2"/>
      <circle cx="86" cy="164" r="2.6"/><circle cx="109.5" cy="152.5" r="2.2"/><circle cx="130" cy="94" r="2.6"/>
      <circle cx="154.4" cy="86.5" r="2.2"/><circle cx="177" cy="118" r="2.6"/><circle cx="157.5" cy="128.5" r="2.2"/>
      <circle cx="108.7" cy="103.5" r="2.2"/><circle cx="178.8" cy="98.5" r="2.2"/><circle cx="60.7" cy="127.5" r="2.2"/>
    </g>

    <!-- nodes upper -->
    <g fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1.1" stroke-opacity="0.85">
      <circle cx="48" cy="116" r="2.4"/><circle cx="72.4" cy="108.5" r="1.9"/><circle cx="96.8" cy="120.5" r="1.9"/>
      <circle cx="95" cy="140" r="2.4"/><circle cx="118.5" cy="128.5" r="1.9"/><circle cx="139" cy="70" r="2.4"/>
      <circle cx="163.4" cy="62.5" r="1.9"/><circle cx="186" cy="94" r="2.4"/><circle cx="166.5" cy="104.5" r="1.9"/>
      <circle cx="117.7" cy="79.5" r="1.9"/><circle cx="187.8" cy="74.5" r="1.9"/><circle cx="69.7" cy="103.5" r="1.9"/>
    </g>

    <!-- hub accents -->
    <g fill="#0A84FF" filter="url(#glow)">
      <circle cx="86" cy="164" r="1.2"/><circle cx="177" cy="118" r="1.2"/><circle cx="39" cy="140" r="1.2"/>
    </g>
  </g>

  <!-- technical corner brackets -->
  <g stroke="#8E8E93" stroke-opacity="0.6" stroke-width="1" fill="none">
    <path d="M8 20 V10 H18 M182 10 H192 V20 M192 180 V190 H182 M18 190 H8 V180"/>
  </g>
  <g fill="#8E8E93" font-family="monospace" font-size="4" opacity="0.7">
    <text x="24" y="14">LATTICE-3D</text>
    <text x="152" y="192">NODE-48</text>
  </g>
</svg>