<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1710"/>
      <stop offset="1" stop-color="#14100c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#e63b2e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e63b2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e8d5"/>
      <stop offset="1" stop-color="#d9c9a8"/>
    </linearGradient>
    <linearGradient id="bun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e8d5"/>
      <stop offset="1" stop-color="#c9b48b"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e63b2e"/>
      <stop offset="1" stop-color="#b02318"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2e8d5" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#f2e8d5" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="24" fill="url(#bg)"/>
  <rect width="200" height="200" rx="24" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#f2e8d5" stroke-opacity="0.05" stroke-width="0.5">
    <path d="M25 0V200M50 0V200M75 0V200M100 0V200M125 0V200M150 0V200M175 0V200"/>
    <path d="M0 25H200M0 50H200M0 75H200M0 100H200M0 125H200M0 150H200M0 175H200"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#f2e8d5" stroke-opacity="0.35" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M10 22V12H20"/><path d="M178 12H188V22"/>
    <path d="M188 178V188H178"/><path d="M22 188H12V178"/>
  </g>

  <!-- glass card -->
  <rect x="18" y="24" width="164" height="152" rx="16" fill="url(#glass)" stroke="#f2e8d5" stroke-opacity="0.14" stroke-width="1"/>

  <!-- price badge ring -->
  <g transform="translate(58 58)">
    <circle r="26" fill="none" stroke="#e63b2e" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="3 4"/>
    <circle r="21" fill="#e63b2e" filter="url(#shadow)"/>
    <circle r="21" fill="none" stroke="#f2e8d5" stroke-opacity="0.4" stroke-width="1"/>
    <text y="2.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#f2e8d5">$1.50</text>
    <text y="10.5" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-weight="600" font-size="4.6" fill="#f2e8d5" fill-opacity="0.85" letter-spacing="0.6">SINCE 1985</text>
  </g>

  <!-- soda cup -->
  <g transform="translate(140 96)" filter="url(#shadow)">
    <path d="M-16 -18 L16 -18 L12 42 Q0 46 -12 42 Z" fill="url(#cup)"/>
    <path d="M-16 -18 L16 -18 L15.2 -10 L-15.2 -10 Z" fill="#f2e8d5" fill-opacity="0.9"/>
    <path d="M-11 44 L-6 58 Q0 61 6 58 L11 44 Q0 48 -11 44 Z" fill="#f2e8d5"/>
    <line x1="4" y1="-30" x2="-2" y2="-16" stroke="#f2e8d5" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-13 -12 L11 -12 L8 30" stroke="#f2e8d5" stroke-opacity="0.35" stroke-width="2" fill="none"/>
  </g>

  <!-- hot dog -->
  <g transform="translate(96 128) rotate(-8)" filter="url(#shadow)">
    <!-- bun -->
    <path d="M-52 0 Q-56 -14 -40 -16 L40 -16 Q58 -16 60 -2 Q62 12 44 14 L-42 14 Q-52 12 -52 0 Z" fill="url(#bun)"/>
    <g fill="#14100c" fill-opacity="0.14">
      <ellipse cx="-28" cy="-9" rx="3" ry="1.5"/><ellipse cx="-10" cy="-11" rx="3" ry="1.5"/>
      <ellipse cx="10" cy="-10" rx="3" ry="1.5"/><ellipse cx="28" cy="-8" rx="3" ry="1.5"/>
      <ellipse cx="-34" cy="7" rx="2.6" ry="1.2"/><ellipse cx="0" cy="9" rx="2.6" ry="1.2"/><ellipse cx="32" cy="7" rx="2.6" ry="1.2"/>
    </g>
    <!-- sausage -->
    <path d="M-56 -2 Q-60 -12 -46 -11 L42 -11 Q58 -12 58 -1 Q58 9 42 9 L-46 9 Q-60 10 -56 -2 Z" fill="#e63b2e"/>
    <path d="M-50 -7 Q0 -10 48 -6" stroke="#f2e8d5" stroke-opacity="0.25" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- mustard squiggle -->
    <path d="M-48 0 Q-42 -8 -36 0 Q-30 8 -24 0 Q-18 -8 -12 0 Q-6 8 0 0 Q6 -8 12 0 Q18 8 24 0 Q30 -8 36 0 Q42 8 48 -1"
          fill="none" stroke="#f2b722" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- steam / sparkle accents -->
  <g stroke="#f2e8d5" stroke-opacity="0.5" stroke-width="1.2" stroke-linecap="round" fill="none">
    <path d="M70 86 Q67 80 70 74 Q73 68 70 62" opacity="0.5"/>
    <path d="M84 90 Q81 84 84 78" opacity="0.35"/>
  </g>
  <g fill="#e63b2e">
    <circle cx="170" cy="52" r="1.8" opacity="0.8"/>
    <circle cx="32" cy="150" r="1.4" opacity="0.6"/>
    <circle cx="176" cy="140" r="1.2" opacity="0.5"/>
  </g>

  <!-- footer strip -->
  <text x="100" y="192" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="6.5" letter-spacing="3" fill="#f2e8d5" fill-opacity="0.55">PRICE LOCKED · VALUE WAR</text>
</svg>