<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16181D" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="numFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#E6F2FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="edgeSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="blueHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark glass card -->
  <g filter="url(#softShadow)">
    <rect x="14" y="14" width="172" height="172" rx="34" fill="url(#cardGlass)" stroke="url(#edgeSheen)" stroke-width="1.5"/>
  </g>
  <!-- Top glass highlight -->
  <path d="M48 14 H152 A34 34 0 0 1 186 48 V62 A160 160 0 0 0 14 62 V48 A34 34 0 0 1 48 14 Z" fill="#FFFFFF" opacity="0.05"/>

  <!-- Blue halo behind numeral -->
  <circle cx="100" cy="102" r="70" fill="url(#blueHalo)"/>

  <!-- Subtle technical grid ticks -->
  <g stroke="#8E8E93" stroke-width="1" opacity="0.35">
    <line x1="100" y1="24" x2="100" y2="32"/>
    <line x1="100" y1="168" x2="100" y2="176"/>
    <line x1="24" y1="100" x2="32" y2="100"/>
    <line x1="168" y1="100" x2="176" y2="100"/>
  </g>

  <!-- Corner brackets -->
  <g stroke="#0A84FF" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M30 46 V34 A4 4 0 0 1 34 30 H46"/>
    <path d="M154 30 H166 A4 4 0 0 1 170 34 V46"/>
    <path d="M170 154 V166 A4 4 0 0 1 166 170 H154"/>
    <path d="M46 170 H34 A4 4 0 0 1 30 166 V154"/>
  </g>

  <!-- Bold numeral 20 -->
  <text x="100" y="100" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
        font-size="96" font-weight="900" letter-spacing="-4"
        fill="url(#numFill)" filter="url(#glow)">20</text>

  <!-- Micro-label -->
  <text x="100" y="166" text-anchor="middle"
        font-family="SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" letter-spacing="4" fill="#8E8E93" opacity="0.9">INDEX · 20</text>
</svg>