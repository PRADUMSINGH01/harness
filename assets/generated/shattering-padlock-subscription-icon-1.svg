<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2A2E"/>
      <stop offset="0.45" stop-color="#161618"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="shackleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C7C7CC"/>
      <stop offset="0.5" stop-color="#8E8E93"/>
      <stop offset="1" stop-color="#5A5A5E"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bellGrad" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#6FBFFF"/>
      <stop offset="0.55" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0055CC"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dropShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- ambient glow -->
  <circle cx="100" cy="100" r="88" fill="url(#glowGrad)"/>

  <!-- keyhole light leak -->
  <ellipse cx="100" cy="122" rx="30" ry="24" fill="#0A84FF" opacity="0.18" filter="url(#softGlow)"/>

  <!-- shackle -->
  <g fill="none" stroke="url(#shackleGrad)" stroke-width="11" stroke-linecap="round">
    <path d="M72 92 V66 a28 28 0 0 1 56 0 V92"/>
  </g>
  <path d="M78 90 V66 a22 22 0 0 1 12 -19.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round"/>

  <!-- lock body: glass card -->
  <g filter="url(#dropShadow)">
    <rect x="52" y="84" width="96" height="84" rx="18" fill="url(#bodyGrad)" stroke="#3A3A3E" stroke-width="1.5"/>
    <rect x="52" y="84" width="96" height="84" rx="18" fill="url(#glassSheen)"/>
    <rect x="56.5" y="88.5" width="87" height="75" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
  </g>

  <!-- crack lines across body -->
  <g stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M100 88 L92 104 L102 114 L88 128 L96 140"/>
    <path d="M92 104 L74 110"/>
    <path d="M102 114 L124 108 L134 118"/>
    <path d="M88 128 L68 134"/>
    <path d="M134 118 L146 126"/>
    <path d="M96 140 L86 156"/>
    <path d="M96 140 L118 150"/>
  </g>
  <g stroke="#0A84FF" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.65" filter="url(#softGlow)">
    <path d="M100 88 L92 104 L102 114 L88 128 L96 140"/>
    <path d="M102 114 L124 108"/>
  </g>

  <!-- keyhole (fractured) -->
  <g fill="#0A84FF" filter="url(#softGlow)">
    <circle cx="100" cy="118" r="9"/>
    <path d="M100 124 L94 146 L106 146 Z" transform="rotate(8 100 135)"/>
  </g>
  <circle cx="97.5" cy="115" r="3" fill="#FFFFFF" opacity="0.5"/>

  <!-- shattered shards flying outward -->
  <g fill="#8E8E93" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.8">
    <path d="M46 96 L34 88 L44 82 Z" opacity="0.85"/>
    <path d="M40 126 L26 124 L34 114 Z" opacity="0.7"/>
    <path d="M52 158 L40 168 L54 170 Z" opacity="0.8"/>
    <path d="M96 172 L92 186 L104 182 Z" opacity="0.75"/>
    <path d="M148 158 L160 166 L148 172 Z" opacity="0.8"/>
    <path d="M158 122 L174 126 L164 134 Z" opacity="0.7"/>
    <path d="M152 92 L166 84 L158 76 Z" opacity="0.85"/>
  </g>
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="30" cy="102" r="1.6"/>
    <circle cx="176" cy="106" r="1.6"/>
    <circle cx="66" cy="180" r="1.4"/>
    <circle cx="138" cy="180" r="1.4"/>
    <circle cx="150" cy="64" r="1.5"/>
    <circle cx="52" cy="66" r="1.5"/>
  </g>
  <!-- small blue glass fragments -->
  <g fill="#0A84FF" opacity="0.85">
    <path d="M120 92 L128 86 L130 94 Z"/>
    <path d="M72 162 L80 168 L70 170 Z"/>
  </g>

  <!-- subscription badge -->
  <g filter="url(#dropShadow)">
    <circle cx="152" cy="58" r="24" fill="#0A0A0A" stroke="#0A84FF" stroke-width="2"/>
    <circle cx="152" cy="58" r="19" fill="url(#glassSheen)" opacity="0.4"/>
  </g>
  <!-- bell -->
  <g fill="url(#bellGrad)" filter="url(#softGlow)">
    <path d="M152 45 c5.5 0 8 4 8.2 9 c0.2 5 2 7 3.3 8.5 c0.7 0.8 0.2 2.2 -1 2.2 h-21 c-1.2 0 -1.7 -1.4 -1 -2.2 c1.3 -1.5 3.1 -3.5 3.3 -8.5 c0.2 -5 2.7 -9 8.2 -9 Z"/>
    <path d="M148.5 67 a3.5 3.5 0 0 0 7 0 Z"/>
  </g>
  <path d="M152 46 c3.5 0 5.5 2.4 6 5.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.4" stroke-linecap="round"/>

  <!-- technical corner brackets -->
  <g stroke="#8E8E93" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M14 30 V16 H28"/>
    <path d="M172 16 H186 V30"/>
    <path d="M186 170 V184 H172"/>
    <path d="M28 184 H14 V170"/>
  </g>
</svg>