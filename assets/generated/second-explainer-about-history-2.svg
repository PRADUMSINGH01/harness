<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1a2030" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0A0A0A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="glassTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="faceBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AB6FF"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="faceBlueDim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f95f0"/>
      <stop offset="100%" stop-color="#0663bd"/>
    </linearGradient>
    <linearGradient id="faceGray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9ccd2"/>
      <stop offset="100%" stop-color="#8E8E93"/>
    </linearGradient>
    <linearGradient id="faceDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3d44"/>
      <stop offset="100%" stop-color="#1c1e24"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="badgeClip">
      <circle cx="100" cy="100" r="86"/>
    </clipPath>
  </defs>

  <!-- Badge base -->
  <circle cx="100" cy="100" r="97" fill="#0A0A0A"/>
  <circle cx="100" cy="100" r="97" fill="url(#bgGlow)"/>
  <circle cx="100" cy="100" r="97" fill="none" stroke="#8E8E93" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="0.75"/>
  <circle cx="100" cy="100" r="86" fill="#10131a" fill-opacity="0.55"/>

  <!-- glass highlight sweep -->
  <g clip-path="url(#badgeClip)">
    <ellipse cx="72" cy="46" rx="78" ry="34" fill="url(#glassTop)" transform="rotate(-14 72 46)"/>
  </g>

  <!-- Isometric 3x3 Rubik's Cube -->
  <g filter="url(#softShadow)">
    <!-- top face -->
    <g transform="translate(100,72)">
      <polygon points="0,-30 44,-4 0,22 -44,-4" fill="none"/>
      <!-- grid: top face cells -->
      <!-- row math: x-axis (44,-4), y-axis (44,26 reversed) — cells via parallelogram paths -->
      <path d="M0,-30 L14.67,-21.33 L0,-12.67 L-14.67,-21.33 Z" fill="url(#faceGray)"/>
      <path d="M14.67,-21.33 L29.33,-12.67 L14.67,-4 L0,-12.67 Z" fill="url(#faceBlue)"/>
      <path d="M29.33,-12.67 L44,-4 L29.33,4.67 L14.67,-4 Z" fill="url(#faceDark)"/>
      <path d="M-14.67,-21.33 L0,-12.67 L-14.67,-4 L-29.33,-12.67 Z" fill="url(#faceBlueDim)"/>
      <path d="M0,-12.67 L14.67,-4 L0,4.67 L-14.67,-4 Z" fill="url(#faceDark)"/>
      <path d="M14.67,-4 L29.33,4.67 L14.67,13.33 L0,4.67 Z" fill="url(#faceGray)"/>
      <path d="M-29.33,-12.67 L-14.67,-4 L-29.33,4.67 L-44,-4 Z" fill="url(#faceDark)"/>
      <path d="M-14.67,-4 L0,4.67 L-14.67,13.33 L-29.33,4.67 Z" fill="url(#faceGray)"/>
      <path d="M0,4.67 L14.67,13.33 L0,22 L-14.67,13.33 Z" fill="url(#faceBlue)"/>
      <path d="M0,-30 L44,-4 L0,22 L-44,-4 Z" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
    </g>
    <!-- left face -->
    <g transform="translate(100,72)">
      <path d="M-44,-4 L0,22 L0,78 L-44,52 Z" fill="url(#faceBlueDim)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="0.75"/>
      <!-- cell separators -->
      <path d="M-29.33,4.67 L14.67,30.67 M-14.67,13.33 L29.33,39.33 M-44,22 L-44,52 M-29.33,30.67 L-29.33,60.67 M-14.67,39.33 L-14.67,69.33" stroke="#0A0A0A" stroke-opacity="0.55" stroke-width="1.4" fill="none"/>
      <path d="M-44,13.33 L0,39.33 M-44,30.67 L0,56.67" stroke="#0A0A0A" stroke-opacity="0.55" stroke-width="1.4" fill="none"/>
    </g>
    <!-- right face -->
    <g transform="translate(100,72)">
      <path d="M44,-4 L0,22 L0,78 L44,52 Z" fill="url(#faceDark)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="0.75"/>
      <path d="M29.33,4.67 L-14.67,30.67 M14.67,13.33 L-29.33,39.33 M44,22 L44,52 M29.33,30.67 L29.33,60.67 M14.67,39.33 L14.67,69.33" stroke="#0A0A0A" stroke-opacity="0.55" stroke-width="1.4" fill="none"/>
      <path d="M44,13.33 L0,39.33 M44,30.67 L0,56.67" stroke="#0A0A0A" stroke-opacity="0.55" stroke-width="1.4" fill="none"/>
      <!-- one glowing blue sticker on right face for accent -->
      <path d="M29.33,30.67 L14.67,39.33 L14.67,69.33 L29.33,60.67 Z" fill="url(#faceBlue)" stroke="#0A0A0A" stroke-opacity="0.4" stroke-width="1.2"/>
    </g>
  </g>

  <!-- glow accent ring under cube -->
  <ellipse cx="100" cy="152" rx="46" ry="8" fill="#0A84FF" opacity="0.18" filter="url(#glow)"/>

  <!-- technical micro details -->
  <g stroke="#8E8E93" stroke-opacity="0.5" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M28,24 L36,24 M28,24 L28,32"/>
    <path d="M172,24 L164,24 M172,24 L172,32"/>
    <path d="M28,176 L36,176 M28,176 L28,168"/>
    <path d="M172,176 L164,176 M172,176 L172,168"/>
  </g>
  <g fill="#8E8E93" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="6" letter-spacing="2">
    <text x="100" y="184" text-anchor="middle" opacity="0.65">EST. 1974</text>
  </g>
  <circle cx="100" cy="26" r="2" fill="#0A84FF" opacity="0.9"/>
</svg>