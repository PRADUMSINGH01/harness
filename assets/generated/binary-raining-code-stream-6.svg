<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glassBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101318"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="fadeWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fadeBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="fadeGray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E8E93" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#8E8E93" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="200" height="200" rx="14" fill="url(#glassBg)"/>
  <rect x="0.5" y="0.5" width="199" height="199" rx="13.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <rect x="0" y="0" width="200" height="200" rx="14" fill="url(#glow)"/>

  <!-- Column 1: white -->
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="url(#fadeWhite)" letter-spacing="0">
    <text x="20" y="14">1</text><text x="20" y="27">0</text><text x="20" y="40">1</text><text x="20" y="53">1</text>
    <text x="20" y="66">0</text><text x="20" y="79">1</text><text x="20" y="92">0</text><text x="20" y="105">1</text>
    <text x="20" y="118">0</text><text x="20" y="131">1</text><text x="20" y="144">0</text><text x="20" y="157">1</text>
    <text x="20" y="170">0</text><text x="20" y="183">1</text><text x="20" y="196">0</text>
  </g>

  <!-- Column 2: blue -->
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="url(#fadeBlue)" y="0">
    <text x="40" y="8">0</text><text x="40" y="21">1</text><text x="40" y="34">0</text><text x="40" y="47">0</text>
    <text x="40" y="60">1</text><text x="40" y="73">0</text><text x="40" y="86">1</text><text x="40" y="99">1</text>
    <text x="40" y="112">0</text><text x="40" y="125">1</text><text x="40" y="138">0</text><text x="40" y="151">1</text>
    <text x="40" y="164">0</text><text x="40" y="177">1</text><text x="40" y="190">0</text>
  </g>

  <!-- Column 3: gray -->
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="url(#fadeGray)">
    <text x="60" y="20">1</text><text x="60" y="33">0</text><text x="60" y="46">1</text><text x="60" y="59">0</text>
    <text x="60" y="72">0</text><text x="60" y="85">1</text><text x="60" y="98">0</text><text x="60" y="111">1</text>
    <text x="60" y="124">1</text><text x="60" y="137">0</text><text x="60" y="150">1</text><text x="60" y="163">0</text>
    <text x="60" y="176">1</text><text x="60" y="189">0</text>
  </g>

  <!-- Column 4: white -->
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="url(#fadeWhite)">
    <text x="80" y="6">1</text><text x="80" y="19">0</text><text x="80" y="32">1</text><text x="80" y="45">1</text>
    <text x="80" y="58">0</text><text x="80" y="71">0</text><text x="80" y="84">1</text><text x="80" y="97">0</text>
    <text x="80" y="110">1</text><text x="80" y="123">0</text><text x="80" y="136">1</text><text x="80" y="149">1</text>
    <text x="80" y="162">0</text><text x="80" y="175">1</text><text x="80" y="188">0</text>
  </g>

  <!-- Column 5: blue -->
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="url(#fadeBlue)">
    <text x="100" y="16">0</text><text x="100" y="29">1</text><text x="100" y="42">1</text><text x="100" y="55">0</text>
    <text x="100" y="68">1</text><text x="100" y="81">0</text><text x="100" y="94">0</text><text x="100" y="107">1</text>
    <text x="100" y="120">0</text><text x="100" y="133">1</text><text x="100" y="146">0</text><text x="100" y="159">1</text>
    <text x="100" y="172">1</text><text x="100" y="185">0</text>
  </g>

  <!-- Column 6: white -->
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="url(#fadeWhite)">
    <text x="120" y="10">1</text><text x="120" y="23">0</text><text x="120" y="36">0</text><text x="120" y="49">1</text>
    <text x="120" y="62">1</text><text x="120" y="75">0</text><text x="120" y="88">1</text><text x="120" y="101">0</text>
    <text x="120" y="114">0</text><text x="120" y="127">1</text><text x="120" y="140">1</text><text x="120" y="153">0</text>
    <text x="120" y="166">1</text><text x="120" y="179">0</text><text x="120" y="192">1</text>
  </g>

  <!-- Column 7: gray -->
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="url(#fadeGray)">
    <text x="140" y="24">0</text><text x="140" y="37">1</text><text x="140" y="50">0</text><text x="140" y="63">1</text>
    <text x="140" y="76">1</text><text x="140" y="89">0</text><text x="140" y="102">1</text><text x="140" y="115">0</text>
    <text x="140" y="128">0</text><text x="140" y="141">1</text><text x="140" y="154">0</text><text x="140" y="167">1</text>
    <text x="140" y="180">1</text><text x="140" y="193">0</text>
  </g>

  <!-- Column 8: blue -->
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="url(#fadeBlue)">
    <text x="160" y="12">1</text><text x="160" y="25">0</text><text x="160" y="38">1</text><text x="160" y="51">0</text>
    <text x="160" y="64">0</text><text x="160" y="77">1</text><text x="160" y="90">1</text><text x="160" y="103">0</text>
    <text x="160" y="116">1</text><text x="160" y="129">0</text><text x="160" y="142">1</text><text x="160" y="155">0</text>
    <text x="160" y="168">0</text><text x="160" y="181">1</text><text x="160" y="194">1</text>
  </g>

  <!-- Column 9: white -->
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" text-anchor="middle" fill="url(#fadeWhite)">
    <text x="180" y="18">0</text><text x="180" y="31">1</text><text x="180" y="44">1</text><text x="180" y="57">0</text>
    <text x="180" y="70">1</text><text x="180" y="83">1</text><text x="180" y="96">0</text><text x="180" y="109">1</text>
    <text x="180" y="122">0</text><text x="180" y="135">0</text><text x="180" y="148">1</text><text x="180" y="161">0</text>
    <text x="180" y="174">1</text><text x="180" y="187">1</text>
  </g>

  <!-- Leading glowing heads -->
  <g filter="url(#softGlow)">
    <text x="40" y="199" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">0</text>
    <text x="100" y="198" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#0A84FF">1</text>
    <text x="160" y="199" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
    <text x="20" y="199" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#0A84FF">0</text>
    <text x="120" y="199" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
    <text x="180" y="199" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#0A84FF">1</text>
  </g>

  <!-- Technical corner brackets -->
  <g stroke="#8E8E93" stroke-opacity="0.55" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M6 16 V8 a2 2 0 0 1 2-2 H16"/>
    <path d="M184 6 H192 a2 2 0 0 1 2 2 V16"/>
    <path d="M194 184 V192 a2 2 0 0 1-2 2 H184"/>
    <path d="M16 194 H8 a2 2 0 0 1-2-2 V184"/>
  </g>

  <!-- Subtle coordinate ticks -->
  <g stroke="#8E8E93" stroke-opacity="0.25" stroke-width="0.8">
    <path d="M14 100 h3 M183 100 h3"/>
    <path d="M100 14 v3 M100 183 v3"/>
  </g>
</svg>