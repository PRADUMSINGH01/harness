<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1F26" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0A0A0A" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="link" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- dark glass card -->
  <rect x="4" y="4" width="192" height="192" rx="14" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <rect x="4" y="4" width="192" height="192" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="3"/>

  <!-- corner brackets -->
  <g stroke="#0A84FF" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M10 20 V12 H20"/><path d="M180 12 H190 V20"/>
    <path d="M190 180 V188 H180"/><path d="M20 188 H10 V180"/>
  </g>

  <!-- header -->
  <text x="100" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" letter-spacing="2.5" fill="#8E8E93">COMPLEXITY TREE — COLLAPSING</text>
  <line x1="24" y1="30" x2="176" y2="30" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- glow behind root -->
  <circle cx="100" cy="52" r="22" fill="url(#glow)"/>

  <!-- links: level1 -->
  <g stroke="url(#link)" stroke-width="1.3" fill="none" filter="url(#soft)">
    <path d="M100 58 C100 70 55 72 55 84"/>
    <path d="M100 58 C100 70 145 72 145 84"/>
  </g>
  <!-- collapsing branch links (dashed ghosts) -->
  <g stroke="#8E8E93" stroke-width="1" stroke-dasharray="3 3" fill="none" opacity="0.5">
    <path d="M55 90 C55 102 35 104 35 116"/>
    <path d="M55 90 C55 102 75 104 75 116"/>
    <path d="M145 90 C145 102 125 104 125 116"/>
    <path d="M145 90 C145 102 165 104 165 116"/>
  </g>

  <!-- collapsed leaf remnants (fading) -->
  <g opacity="0.35">
    <circle cx="35" cy="120" r="6" fill="none" stroke="#8E8E93" stroke-dasharray="2 2"/>
    <circle cx="75" cy="120" r="6" fill="none" stroke="#8E8E93" stroke-dasharray="2 2"/>
    <circle cx="125" cy="120" r="6" fill="none" stroke="#8E8E93" stroke-dasharray="2 2"/>
    <circle cx="165" cy="120" r="6" fill="none" stroke="#8E8E93" stroke-dasharray="2 2"/>
  </g>

  <!-- nodes -->
  <g filter="url(#soft)">
    <rect x="88" y="46" width="24" height="12" rx="6" fill="#0A84FF"/>
    <rect x="42" y="82" width="26" height="12" rx="6" fill="#1C1F26" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <rect x="132" y="82" width="26" height="12" rx="6" fill="#1C1F26" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <rect x="52" y="136" width="24" height="12" rx="6" fill="#1C1F26" stroke="#0A84FF" stroke-opacity="0.8"/>
    <rect x="124" y="136" width="24" height="12" rx="6" fill="#1C1F26" stroke="#0A84FF" stroke-opacity="0.8"/>
  </g>

  <!-- node labels -->
  <g font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="6.5" text-anchor="middle">
    <text x="100" y="54.5" fill="#FFFFFF" font-weight="bold">O(1)</text>
    <text x="55" y="90.5" fill="#8E8E93">O(n)</text>
    <text x="145" y="90.5" fill="#8E8E93">O(n)</text>
    <text x="64" y="144.5" fill="#0A84FF">log</text>
    <text x="136" y="144.5" fill="#0A84FF">log</text>
  </g>

  <!-- collapse indicator arrows -->
  <g stroke="#0A84FF" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M64 122 L64 130 M61.5 127.5 L64 130 L66.5 127.5"/>
    <path d="M136 122 L136 130 M133.5 127.5 L136 130 L138.5 127.5"/>
  </g>

  <!-- bottom annotation bar -->
  <g font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="6" fill="#8E8E93">
    <text x="24" y="170">depth: 2/4</text>
    <text x="176" y="170" text-anchor="end" fill="#0A84FF">n → log n</text>
  </g>
  <line x1="24" y1="176" x2="176" y2="176" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <!-- progress ticks -->
  <g stroke="#0A84FF" stroke-width="1.5">
    <line x1="60" y1="184" x2="60" y2="188"/>
    <line x1="80" y1="184" x2="80" y2="188"/>
  </g>
  <g stroke="#8E8E93" stroke-width="1" stroke-opacity="0.5">
    <line x1="100" y1="184" x2="100" y2="188"/>
    <line x1="120" y1="184" x2="120" y2="188"/>
    <line x1="140" y1="184" x2="140" y2="188"/>
  </g>
</svg>