<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2740" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0d1424" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38f5d0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38f5d0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#38f5d0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanZone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38f5d0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38f5d0" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3aa0ff"/>
      <stop offset="1" stop-color="#38f5d0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- soft ambient glow behind card -->
  <ellipse cx="120" cy="124" rx="86" ry="66" fill="#38f5d0" opacity="0.06"/>

  <!-- glassmorphic card -->
  <g transform="rotate(-6 120 124)">
    <rect x="42" y="66" width="156" height="112" rx="14" fill="url(#cardBody)" stroke="#4fd8ff" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="42" y="66" width="156" height="112" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

    <!-- scan zone -->
    <rect x="56" y="82" width="128" height="56" rx="8" fill="url(#scanZone)"/>
    <rect x="56" y="82" width="128" height="56" rx="8" fill="none" stroke="#38f5d0" stroke-opacity="0.4" stroke-width="1"/>

    <!-- scan beam -->
    <g filter="url(#glow)">
      <rect x="56" y="107" width="128" height="3" rx="1.5" fill="url(#beam)"/>
      <rect x="56" y="106" width="128" height="5" rx="2.5" fill="#38f5d0" opacity="0.25"/>
    </g>

    <!-- corner brackets of scan zone -->
    <g stroke="#38f5d0" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#glow)">
      <path d="M56 94 L56 84 Q56 82 58 82 L68 82"/>
      <path d="M172 94 L172 84 Q172 82 170 82 L160 82"/>
      <path d="M56 126 L56 136 Q56 138 58 138 L68 138"/>
      <path d="M172 126 L172 136 Q172 138 170 138 L160 138"/>
    </g>

    <!-- barcode/content lines in scan zone -->
    <g stroke="#7fe8ff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round">
      <path d="M70 96 L70 122"/>
      <path d="M78 96 L78 116"/>
      <path d="M88 96 L88 122"/>
      <path d="M100 96 L100 112"/>
      <path d="M112 96 L112 122"/>
      <path d="M124 96 L124 118"/>
      <path d="M136 96 L136 122"/>
      <path d="M150 96 L150 112"/>
      <path d="M162 96 L162 120"/>
    </g>

    <!-- progress bar -->
    <rect x="56" y="152" width="128" height="7" rx="3.5" fill="#ffffff" opacity="0.08"/>
    <rect x="56" y="152" width="86" height="7" rx="3.5" fill="url(#progress)" filter="url(#glow)"/>

    <!-- status dot + text bar -->
    <circle cx="64" cy="168" r="3.5" fill="#38f5d0" filter="url(#glow)"/>
    <rect x="74" y="165.5" width="52" height="5" rx="2.5" fill="#ffffff" opacity="0.25"/>
    <rect x="134" y="165.5" width="30" height="5" rx="2.5" fill="#ffffff" opacity="0.15"/>

    <!-- outer frame corner ticks -->
    <g stroke="#3aa0ff" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
      <path d="M32 76 L32 62 Q32 58 36 58 L50 58"/>
      <path d="M208 76 L208 62 Q208 58 204 58 L190 58"/>
      <path d="M32 168 L32 182 Q32 186 36 186 L50 186"/>
      <path d="M208 168 L208 182 Q208 186 204 186 L190 186"/>
    </g>
  </g>
</svg>