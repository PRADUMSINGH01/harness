<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- hand drawn curved arrow: white outline underlay -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)">
    <path d="M 42 148 C 58 92, 106 66, 138 62" stroke-width="14" opacity="1"/>
    <path d="M 118 40 L 156 52 L 140 88 L 128 70 Z" stroke-width="10" fill="#FFFFFF"/>
  </g>
  <!-- black marker core -->
  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 44 144 C 60 94, 104 70, 134 65" stroke-width="7" stroke-dasharray="1 0"/>
    <path d="M 120 44 L 152 54 L 138 84 L 128 68 Z" stroke-width="5" fill="#000000"/>
  </g>
  <!-- subtle sketchy inner highlight -->
  <path d="M 50 138 C 64 98, 102 76, 128 70" fill="none" stroke="#1E1E1E" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
  <!-- small sketch ticks -->
  <g stroke="#1E1E1E" stroke-width="1.4" stroke-linecap="round" opacity="0.5">
    <path d="M 34 152 l -4 5"/>
    <path d="M 40 156 l -2 6"/>
  </g>
</svg>