<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0D14" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#101625" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="trackG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Outer reticle -->
  <g opacity="0.55">
    <circle cx="120" cy="120" r="112" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="4 10"/>
    <circle cx="120" cy="120" r="106" fill="none" stroke="#8B5CF6" stroke-width="0.6" opacity="0.6"/>
    <g stroke="#38BDF8" stroke-width="1.4">
      <path d="M120 4 v10 M120 226 v10 M4 120 h10 M226 120 h10"/>
      <path d="M38 38 l7 7 M202 38 l-7 7 M38 202 l7 -7 M202 202 l-7 -7" stroke="#10B981"/>
    </g>
  </g>

  <!-- Pinout connectors -->
  <g filter="url(#glow)">
    <g fill="#10B981">
      <rect x="76" y="26" width="5" height="18" rx="2"/><rect x="88" y="26" width="5" height="18" rx="2"/><rect x="100" y="26" width="5" height="18" rx="2"/>
      <rect x="135" y="26" width="5" height="18" rx="2"/><rect x="147" y="26" width="5" height="18" rx="2"/><rect x="159" y="26" width="5" height="18" rx="2"/>
      <rect x="76" y="196" width="5" height="18" rx="2"/><rect x="88" y="196" width="5" height="18" rx="2"/><rect x="100" y="196" width="5" height="18" rx="2"/>
      <rect x="135" y="196" width="5" height="18" rx="2"/><rect x="147" y="196" width="5" height="18" rx="2"/><rect x="159" y="196" width="5" height="18" rx="2"/>
    </g>
    <g fill="#38BDF8">
      <rect x="26" y="76" width="18" height="5" rx="2"/><rect x="26" y="88" width="18" height="5" rx="2"/><rect x="26" y="100" width="18" height="5" rx="2"/>
      <rect x="26" y="135" width="18" height="5" rx="2"/><rect x="26" y="147" width="18" height="5" rx="2"/><rect x="26" y="159" width="18" height="5" rx="2"/>
      <rect x="196" y="76" width="18" height="5" rx="2"/><rect x="196" y="88" width="18" height="5" rx="2"/><rect x="196" y="100" width="18" height="5" rx="2"/>
      <rect x="196" y="135" width="18" height="5" rx="2"/><rect x="196" y="147" width="18" height="5" rx="2"/><rect x="196" y="159" width="18" height="5" rx="2"/>
    </g>
  </g>

  <!-- Chip body -->
  <rect x="50" y="50" width="140" height="140" rx="10" fill="url(#chipBody)" stroke="#38BDF8" stroke-width="1.2" filter="url(#glow)"/>
  <rect x="58" y="58" width="124" height="124" rx="7" fill="none" stroke="#8B5CF6" stroke-width="0.6" opacity="0.7"/>
  <g stroke="#FFFFFF" stroke-width="1.2" opacity="0.85">
    <path d="M50 62 v-12 h12 M190 50 h-12 M190 178 v12 h-12 M50 178 v12 h12" fill="none"/>
  </g>

  <!-- Neon circuit tracks -->
  <g fill="none" stroke="url(#trackG)" stroke-width="1.6" filter="url(#glow)" stroke-linecap="round">
    <path d="M60 70 h24 l10 10 v14"/>
    <path d="M60 96 h18 l14 14"/>
    <path d="M60 150 h28 l12 -12"/>
    <path d="M70 180 v-20 l16 -16"/>
    <path d="M180 70 h-24 l-10 10 v14"/>
    <path d="M180 96 h-18 l-14 14"/>
    <path d="M180 150 h-28 l-12 -12"/>
    <path d="M170 180 v-20 l-16 -16"/>
    <path d="M96 60 v20 l10 10" stroke="#10B981"/>
    <path d="M144 60 v20 l-10 10"/>
    <path d="M96 180 v-20 l10 -10" stroke="#8B5CF6"/>
    <path d="M144 180 v-20 l-10 -10"/>
  </g>
  <g fill="#FFFFFF" filter="url(#glow)">
    <circle cx="94" cy="94" r="1.8"/><circle cx="92" cy="110" r="1.8"/><circle cx="100" cy="138" r="1.8"/>
    <circle cx="146" cy="94" r="1.8"/><circle cx="148" cy="110" r="1.8"/><circle cx="140" cy="138" r="1.8"/>
    <circle cx="86" cy="164" r="1.6"/><circle cx="154" cy="164" r="1.6"/>
  </g>

  <!-- Core assembly -->
  <g>
    <circle cx="120" cy="120" r="46" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="2 6" opacity="0.8"/>
    <circle cx="120" cy="120" r="36" fill="none" stroke="#8B5CF6" stroke-width="0.9" opacity="0.85"/>
    <circle cx="120" cy="120" r="26" fill="url(#coreGlow)" opacity="0.35"/>
    <circle cx="120" cy="120" r="16" fill="url(#coreGlow)"/>
    <circle cx="120" cy="120" r="16" fill="none" stroke="#FFFFFF" stroke-width="1" filter="url(#glow)"/>
    <circle cx="120" cy="120" r="24" fill="#38BDF8" opacity="0.28" filter="url(#softGlow)"/>
    <g stroke="#FFFFFF" stroke-width="0.8" opacity="0.9">
      <path d="M120 96 v10 M120 134 v10 M96 120 h10 M134 120 h10"/>
    </g>
  </g>

  <!-- Data sparkline accents -->
  <g fill="none" stroke="#10B981" stroke-width="1" opacity="0.8" filter="url(#glow)">
    <path d="M64 202 l8 -5 6 3 8 -7 6 4 8 -3"/>
    <path d="M176 38 l-8 5 -6 -3 -8 7 -6 -4 -8 3"/>
  </g>
</svg>