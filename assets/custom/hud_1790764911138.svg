<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#10B981"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="hexGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="shieldClip">
      <path d="M100 16 L162 42 V104 C162 138 134 160 100 176 C66 160 38 138 38 104 V42 Z"/>
    </clipPath>
    <pattern id="hexes" width="18" height="15.6" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="url(#hexGrad)" stroke-width="1" opacity="0.7">
        <path d="M4.5 0 L13.5 5.2 L13.5 15.6 M-4.5 15.6 L4.5 10.4 L4.5 0 M4.5 15.6 L13.5 20.8"/>
        <path d="M13.5 -5.2 L22.5 0 L22.5 10.4 M13.5 10.4 L22.5 15.6"/>
      </g>
    </pattern>
  </defs>

  <!-- outer orbit rings -->
  <g fill="none" filter="url(#glow)">
    <circle cx="100" cy="100" r="92" stroke="#8B5CF6" stroke-width="0.8" stroke-dasharray="3 9" opacity="0.55"/>
    <path d="M100 8 A92 92 0 0 1 192 100" stroke="#38BDF8" stroke-width="1.6" opacity="0.9"/>
    <path d="M100 192 A92 92 0 0 1 8 100" stroke="#10B981" stroke-width="1.6" opacity="0.9"/>
  </g>
  <g fill="#38BDF8" filter="url(#glow)">
    <circle cx="192" cy="100" r="2.4"/>
    <circle cx="100" cy="8" r="2.4" fill="#10B981"/>
    <circle cx="8" cy="100" r="2.4" fill="#8B5CF6"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#38BDF8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M14 34 V14 H34"/>
    <path d="M166 14 H186 V34"/>
    <path d="M186 166 V186 H166"/>
    <path d="M34 186 H14 V166"/>
  </g>

  <!-- shield body -->
  <g>
    <path d="M100 16 L162 42 V104 C162 138 134 160 100 176 C66 160 38 138 38 104 V42 Z" fill="url(#shieldFill)"/>
    <path d="M100 16 L162 42 V104 C162 138 134 160 100 176 C66 160 38 138 38 104 V42 Z" fill="url(#hexes)" clip-path="url(#shieldClip)" opacity="0.9"/>
    <!-- hex pattern clip: pattern fill already inside path; also add explicit brighter hex highlights -->
    <g clip-path="url(#shieldClip)" fill="none" stroke="#10B981" stroke-width="1.4" filter="url(#glow)" opacity="0.9">
      <path d="M100 46 L118 56.5 V77.5 L100 88 L82 77.5 V56.5 Z"/>
      <path d="M136 66 L154 76.5 V97.5 L136 108 L118 97.5 V76.5 Z"/>
      <path d="M64 66 L82 76.5 V97.5 L64 108 L46 97.5 V76.5 Z"/>
      <path d="M118 106 L136 116.5 V137.5 L118 148 L100 137.5 V116.5 Z" stroke="#38BDF8"/>
      <path d="M82 106 L100 116.5 V137.5 L82 148 L64 137.5 V116.5 Z" stroke="#38BDF8"/>
    </g>
    <!-- inner core glow -->
    <ellipse cx="100" cy="86" rx="52" ry="60" fill="url(#coreGlow)" filter="url(#softGlow)"/>
    <!-- rim -->
    <path d="M100 16 L162 42 V104 C162 138 134 160 100 176 C66 160 38 138 38 104 V42 Z" fill="none" stroke="url(#rimGrad)" stroke-width="2.6" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M100 16 L162 42 V104 C162 138 134 160 100 176 C66 160 38 138 38 104 V42 Z" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- central emblem -->
  <g filter="url(#glow)">
    <path d="M100 78 L116 87 V105 L100 114 L84 105 V87 Z" fill="#0A0D14" fill-opacity="0.55" stroke="#FFFFFF" stroke-width="1.4"/>
    <path d="M92 96 L98 102 L109 89" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- tech details -->
  <g stroke="#8B5CF6" stroke-width="1" opacity="0.8" stroke-linecap="round">
    <path d="M100 176 V188"/>
    <path d="M88 188 H112"/>
  </g>
  <g fill="#38BDF8" opacity="0.85">
    <rect x="30" y="48" width="6" height="2"/>
    <rect x="164" y="48" width="6" height="2"/>
    <rect x="30" y="100" width="6" height="2" fill="#10B981"/>
    <rect x="164" y="100" width="6" height="2" fill="#10B981"/>
  </g>
  <text x="100" y="197" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" letter-spacing="3" fill="#10B981" opacity="0.9">SHIELD 0x2F</text>
</svg>