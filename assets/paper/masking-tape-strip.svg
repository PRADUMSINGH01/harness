<svg xmlns="http://www.w3.org/2000/svg" width="500" height="140" viewBox="0 0 500 140">
  <defs>
    <!-- Tape fiber noise -->
    <filter id="tape-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08 0.08" numOctaves="3" result="noise" seed="74" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.86  0 0 0 0 0.75  0 0 0 0.35 0" in="noise" result="grain" />
      <feBlend mode="multiply" in="SourceGraphic" in2="grain" />
    </filter>

    <!-- Subtle contact tape shadow -->
    <filter id="tape-shadow" x="-5%" y="-15%" width="110%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#15120C" flood-opacity="0.22" />
    </filter>

    <!-- Washi tape path with jagged torn ends on left and right -->
    <path id="tape-path" d="M 22,25 
      L 478,22 
      L 485,32 476,44 488,56 475,68 486,80 477,92 488,104 476,115
      L 24,118
      L 15,108 25,95 14,83 26,71 16,59 25,47 15,36 Z" />
  </defs>

  <g filter="url(#tape-shadow)">
    <!-- Main translucent tape body -->
    <use href="#tape-path" fill="rgba(244, 239, 222, 0.82)" />
    <!-- Adhesive wrinkles and inner grain -->
    <use href="#tape-path" fill="rgba(235, 228, 206, 0.5)" filter="url(#tape-texture)" />
    <!-- Subtle longitudinal highlight reflection along tape center -->
    <path d="M 28,68 L 472,66" stroke="rgba(255, 255, 255, 0.35)" stroke-width="8" stroke-linecap="round" />
    <!-- Diagonal subtle wrinkle lines across tape -->
    <path d="M 80,26 L 105,116 M 220,24 L 245,117 M 360,23 L 385,117" stroke="rgba(255, 255, 255, 0.22)" stroke-width="2" />
    <path d="M 83,26 L 108,116 M 223,24 L 248,117 M 363,23 L 388,117" stroke="rgba(40, 30, 20, 0.08)" stroke-width="1.5" />
  </g>
</svg>
