<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <!-- Crumpled paper relief filter -->
    <filter id="crumpled-relief" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.0045" numOctaves="4" result="largeFolds" seed="19" />
      <feTurbulence type="fractalNoise" baseFrequency="0.025 0.025" numOctaves="3" result="microCreases" seed="83" />
      <feDisplacementMap in="largeFolds" in2="microCreases" scale="45" xChannelSelector="R" yChannelSelector="G" result="creaseMap" />
      <feDiffuseLighting in="creaseMap" lighting-color="#FFFDF9" surfaceScale="4.5" result="lightRelief">
        <feDistantLight azimuth="45" elevation="50" />
      </feDiffuseLighting>
      <feComponentTransfer in="lightRelief" result="adjustedTone">
        <feFuncR type="linear" slope="0.94" intercept="0.06" />
        <feFuncG type="linear" slope="0.93" intercept="0.06" />
        <feFuncB type="linear" slope="0.90" intercept="0.07" />
      </feComponentTransfer>
    </filter>
  </defs>
  <!-- Base paper layer -->
  <rect width="100%" height="100%" fill="#EFECE4" />
  <!-- Relief and folds -->
  <rect width="100%" height="100%" filter="url(#crumpled-relief)" opacity="0.92" />
  <!-- Subtle vignetting for depth -->
  <radialGradient id="paper-vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0" />
    <stop offset="100%" stop-color="#2A241C" stop-opacity="0.18" />
  </radialGradient>
  <rect width="100%" height="100%" fill="url(#paper-vignette)" />
</svg>
