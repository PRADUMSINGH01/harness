<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Grainy noise gradient">
<defs><linearGradient id="cx-bac-grainy-gradient-g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" style="stop-color:var(--accent-2,#7B61FF);stop-opacity:1"/><stop offset="0.55" style="stop-color:var(--accent,#FF5A36);stop-opacity:1"/><stop offset="1" style="stop-color:var(--highlight,#FFE14D);stop-opacity:1"/></linearGradient><filter id="cx-bac-grainy-gradient-n" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.35 0"/></filter></defs>
<rect width="1920" height="1080" style="fill:url(#cx-bac-grainy-gradient-g)"/>
<rect width="1920" height="1080" style="filter:url(#cx-bac-grainy-gradient-n);mix-blend-mode:overlay"/>
</svg>
