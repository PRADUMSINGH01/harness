<text id="plan" x="56" y="104" text-anchor="start" style="font-family:var(--font,Inter,system-ui,sans-serif);font-size:38px;font-weight:700;fill:var(--accent,#FF5A36)">Pro</text>
<text id="price" x="56" y="210" text-anchor="start" style="font-family:var(--font,Inter,system-ui,sans-serif);font-size:96px;font-weight:800;fill:var(--ink,#F5F3EE)">$29</text>
<text id="period" x="236" y="210" text-anchor="start" style="font-family:var(--font,Inter,system-ui,sans-serif);font-size:30px;font-weight:500;fill:var(--muted,#8B8F98)">/ month</text>
<path id="check-1" class="draw" pathLength="1" d="M60 310 l12 12 l24 -26" style="fill:none;stroke:var(--accent-3,#18C29C);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1.05;stroke-dashoffset:0"/><text id="feature-1" x="116" y="322" text-anchor="start" style="font-family:var(--font,Inter,system-ui,sans-serif);font-size:32px;font-weight:500;fill:var(--ink,#F5F3EE)">Unlimited projects</text>
