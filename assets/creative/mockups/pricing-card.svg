<path id="check-3" class="draw" pathLength="1" d="M60 462 l12 12 l24 -26" style="fill:none;stroke:var(--accent-3,#18C29C);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1.05;stroke-dashoffset:0"/><text id="feature-3" x="116" y="474" text-anchor="start" style="font-family:var(--font,Inter,system-ui,sans-serif);font-size:32px;font-weight:500;fill:var(--ink,#F5F3EE)">Brand kits</text>
