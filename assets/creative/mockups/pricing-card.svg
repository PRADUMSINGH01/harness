<rect id="cta" x="56" y="660" width="508" height="92" rx="46" style="fill:var(--accent,#FF5A36)"/><text id="cta-label" x="310" y="718" text-anchor="middle" style="font-family:var(--font,Inter,system-ui,sans-serif);font-size:32px;font-weight:700;fill:#fff">Choose Pro</text>
